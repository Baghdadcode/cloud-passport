>Option D: Almost full access except IAM<\/li>\n<\/ul>\n<p><strong>Alternative<\/strong>: Create custom policy:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"iam:ChangePassword\",\n        \"iam:GetAccountPasswordPolicy\"\n      ],\n      \"Resource\": \"arn:aws:iam::*:user/${aws:username}\"\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> AWS Managed Policies, Self-Service Password Management<\/p>","fixed":false},{"id":"iam-7","c":"iam","q":"<p>An organization has multiple AWS accounts. They want to centrally manage permissions across all accounts. What is the BEST solution?<\/p>","o":["Create identical IAM policies in each account","Use AWS Organizations with Service Control Policies (SCPs)","Use IAM roles in each account","Share IAM users across accounts"],"a":[1],"x":"<ul>\n<li>Service Control Policies (SCPs) set permission boundaries for entire AWS accounts<\/li>\n<li>Applied at organization, OU, or account level<\/li>\n<li>Centrally managed from master/management account<\/li>\n<li>Maximum permissions available, individual IAM policies still needed<\/li>\n<li>Option A: Not centralized, difficult to maintain<\/li>\n<li>Option C: Roles help with cross-account access but don't centrally manage permissions<\/li>\n<li>Option D: IAM users cannot be shared across accounts<\/li>\n<\/ul>\n<p><strong>SCP Example<\/strong> (Deny all regions except us-east-1):\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Deny\",\n      \"Action\": \"*\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"StringNotEquals\": {\n          \"aws:RequestedRegion\": \"us-east-1\"\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> AWS Organizations, Service Control Policies<\/p>","fixed":false},{"id":"iam-8","c":"iam","q":"<p>A company uses SAML 2.0 to allow employees to access AWS using their corporate Active Directory credentials. What type of access is this?<\/p>","o":["IAM user access","Root account access","Federated access","Programmatic access"],"a":[2],"x":"<ul>\n<li>Federation allows users to access AWS using existing corporate credentials<\/li>\n<li>SAML 2.0 is a standard for identity federation<\/li>\n<li>Users authenticate with corporate IdP (like Active Directory)<\/li>\n<li>IdP provides temporary AWS credentials via IAM role assumption<\/li>\n<li>No need to create IAM users for each employee<\/li>\n<li><strong>Types of Federation<\/strong>: SAML 2.0, OpenID Connect, Custom Identity Broker<\/li>\n<\/ul>\n<p><strong>Federation Flow<\/strong>:\n1. User authenticates with corporate IdP\n2. IdP generates SAML assertion\n3. User presents assertion to AWS STS\n4. STS returns temporary credentials\n5. User accesses AWS with temp credentials<\/p>\n<p><strong>References:<\/strong> Identity Federation, SAML 2.0, AWS STS<\/p>","fixed":false},{"id":"iam-9","c":"iam","q":"<p>Which statement about IAM policies is correct?<\/p>","o":["Identity-based policies are attached to resources","Resource-based policies are attached to IAM identities","Identity-based policies define permissions for users, groups, and roles","Resource-based policies cannot specify principals from other accounts"],"a":[2],"x":"<ul>\n<li><strong>Identity-based policies<\/strong>: Attached to users, groups, roles (who can do what)<\/li>\n<li><strong>Resource-based policies<\/strong>: Attached to resources like S3, SQS (who can access this resource)<\/li>\n<li>Option A: Incorrect, identity-based policies attach to identities<\/li>\n<li>Option B: Incorrect, resource-based policies attach to resources<\/li>\n<li>Option D: Incorrect, resource-based policies CAN specify cross-account principals<\/li>\n<\/ul>\n<p><strong>Examples<\/strong>:\n- Identity-based: IAM user policy, role policy\n- Resource-based: S3 bucket policy, KMS key policy, Lambda function policy<\/p>\n<p><strong>References:<\/strong> IAM Policy Types, Identity vs Resource-based Policies<\/p>","fixed":false},{"id":"iam-10","c":"iam","q":"<p>A Lambda function needs to access DynamoDB tables. What is the correct way to grant permissions?<\/p>","o":["Create an IAM user for the Lambda function","Create an IAM execution role for the Lambda function","Add permissions directly to the Lambda function","Use resource-based policy on DynamoDB"],"a":[1],"x":"<ul>\n<li>Lambda execution role defines what the function can access<\/li>\n<li>Role is assumed by Lambda service when function executes<\/li>\n<li>Attach policies to role (e.g., AmazonDynamoDBFullAccess or custom policy)<\/li>\n<li>Option A: Lambda functions cannot use IAM users<\/li>\n<li>Option C: No such mechanism, must use IAM roles<\/li>\n<li>Option D: DynamoDB doesn't have resource-based policies like S3<\/li>\n<\/ul>\n<p><strong>Lambda Execution Role Policy Example<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"dynamodb:PutItem\",\n        \"dynamodb:GetItem\",\n        \"dynamodb:Query\"\n      ],\n      \"Resource\": \"arn:aws:dynamodb:us-east-1:123456789012:table/MyTable\"\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> Lambda Execution Roles, Service Roles<\/p>","fixed":false},{"id":"iam-11","c":"iam","q":"<p>What does the following IAM policy condition do?<\/p>\n<p><code>json\n\"Condition\": {\n  \"IpAddress\": {\n    \"aws:SourceIp\": \"203.0.113.0/24\"\n  }\n}<\/code><\/p>","o":["Allows access only from the specified IP range","Denies access from the specified IP range","Logs access from the specified IP range","Routes traffic through the specified IP range"],"a":[0],"x":"<ul>\n<li>Condition restricts policy effectiveness to requests from specified IP range<\/li>\n<li>When used with \"Effect\": \"Allow\", grants access only from those IPs<\/li>\n<li>When used with \"Effect\": \"Deny\", denies access from those IPs<\/li>\n<li>Does not log or route traffic<\/li>\n<li><strong>Use Case<\/strong>: Restrict access to corporate network IPs<\/li>\n<\/ul>\n<p><strong>Complete Policy Example<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:*\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"IpAddress\": {\n          \"aws:SourceIp\": \"203.0.113.0/24\"\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> IAM Policy Conditions, IP-based Access Control<\/p>","fixed":false},{"id":"iam-12","c":"iam","q":"<p>A company wants to ensure that IAM users cannot create EC2 instances larger than t3.medium. How can this be enforced?<\/p>","o":["Use IAM policy with condition checking instance type","Use AWS Config rules","Use AWS Budgets","Use EC2 instance limits"],"a":[0],"x":"<ul>\n<li>IAM policy conditions can restrict EC2 instance types<\/li>\n<li>Condition key: <code>ec2:InstanceType<\/code><\/li>\n<\/ul>\n<p><strong>Policy Example<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"ec2:RunInstances\",\n      \"Resource\": \"arn:aws:ec2:*:*:instance/*\",\n      \"Condition\": {\n        \"StringEquals\": {\n          \"ec2:InstanceType\": [\"t3.micro\", \"t3.small\", \"t3.medium\"]\n        }\n      }\n    },\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"ec2:RunInstances\",\n      \"Resource\": [\n        \"arn:aws:ec2:*:*:subnet/*\",\n        \"arn:aws:ec2:*:*:network-interface/*\",\n        \"arn:aws:ec2:*:*:volume/*\",\n        \"arn:aws:ec2:*:*:key-pair/*\",\n        \"arn:aws:ec2:*:*:security-group/*\",\n        \"arn:aws:ec2:*::image/*\"\n      ]\n    }\n  ]\n}<\/code><\/p>\n<ul>\n<li>Option B: Config rules detect compliance, don't prevent actions<\/li>\n<li>Option C: Budgets monitor costs, don't restrict actions<\/li>\n<li>Option D: Service limits are for account-wide quotas, not policy-based restrictions<\/li>\n<\/ul>\n<p><strong>References:<\/strong> IAM Policy Conditions, EC2 Instance Type Restrictions<\/p>","fixed":false},{"id":"iam-13","c":"iam","q":"<p>What is the maximum number of IAM groups a user can belong to?<\/p>","o":["5","10","20","Unlimited"],"a":[1],"x":"<ul>\n<li>An IAM user can be a member of up to 10 groups<\/li>\n<li>This is an AWS service limit/quota<\/li>\n<li>Groups simplify permission management<\/li>\n<li>If more complex permissions needed, use multiple policies or roles<\/li>\n<\/ul>\n<p><strong>IAM Limits (Key ones for exam)<\/strong>:\n- Users per account: 5,000 (default)\n- Groups per account: 300\n- Groups per user: 10\n- Managed policies per user/group/role: 10\n- Inline policy size: 2,048 characters for users, 10,240 for roles<\/p>\n<p><strong>References:<\/strong> IAM Quotas and Limits<\/p>","fixed":false},{"id":"iam-14","c":"iam","q":"<p>A developer accidentally committed AWS access keys to a public GitHub repository. What should be done IMMEDIATELY?<\/p>","o":["Change the password of the IAM user","Delete the GitHub repository","Deactivate and delete the exposed access keys","Enable MFA on the account"],"a":[2],"x":"<ul>\n<li>Exposed credentials must be deactivated/deleted immediately<\/li>\n<li>Prevents unauthorized access using compromised keys<\/li>\n<li>Steps: Deactivate keys → Create new keys → Delete old keys → Review CloudTrail<\/li>\n<li>Option A: Passwords are separate from access keys<\/li>\n<li>Option B: Deleting repo doesn't help if already cloned/indexed<\/li>\n<li>Option D: MFA doesn't protect already-exposed keys<\/li>\n<\/ul>\n<p><strong>Incident Response Steps<\/strong>:\n1. Deactivate compromised keys immediately\n2. Review CloudTrail for unauthorized activity\n3. Create new access keys\n4. Delete compromised keys\n5. Scan code repositories\n6. Implement secrets management (AWS Secrets Manager, Parameter Store)<\/p>\n<p><strong>References:<\/strong> AWS Security Best Practices, Incident Response<\/p>","fixed":false},{"id":"iam-15","c":"iam","q":"<p>Which IAM entity can have both trust policy and permissions policy?<\/p>","o":["IAM User","IAM Group","IAM Role","IAM Policy"],"a":[2],"x":"<ul>\n<li><strong>IAM Roles<\/strong> have two types of policies:<\/li>\n<li><strong>Trust Policy<\/strong>: Defines who can assume the role (principal)<\/li>\n<li><strong>Permissions Policy<\/strong>: Defines what the role can do (actions)<\/li>\n<li>Users and Groups don't have trust policies<\/li>\n<li>Policies are documents, not entities with other policies<\/li>\n<\/ul>\n<p><strong>Trust Policy Example<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": {\n        \"Service\": \"ec2.amazonaws.com\"\n      },\n      \"Action\": \"sts:AssumeRole\"\n    }\n  ]\n}<\/code><\/p>\n<p><strong>Permissions Policy Example<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:GetObject\",\n      \"Resource\": \"arn:aws:s3:::my-bucket/*\"\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> IAM Roles, Trust Policies, Role Assumption<\/p>","fixed":false},{"id":"iam-16","c":"iam","q":"<p>A company needs to provide third-party vendors access to specific S3 buckets without creating IAM users. What is the BEST approach?<\/p>","o":["Share root account credentials","Create cross-account IAM roles with external ID","Make S3 buckets public","Use S3 pre-signed URLs"],"a":[1],"x":"<ul>\n<li>Cross-account roles allow external accounts to access resources<\/li>\n<li>External ID adds security layer preventing confused deputy problem<\/li>\n<li>Vendor assumes role from their AWS account<\/li>\n<li>No need to manage IAM users<\/li>\n<\/ul>\n<p><strong>Setup<\/strong>:\n1. Create IAM role in your account\n2. Trust policy allows vendor's AWS account\n3. Include External ID for security\n4. Vendor assumes role using STS AssumeRole<\/p>\n<p><strong>Trust Policy with External ID<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": {\n        \"AWS\": \"arn:aws:iam::VENDOR-ACCOUNT-ID:root\"\n      },\n      \"Action\": \"sts:AssumeRole\",\n      \"Condition\": {\n        \"StringEquals\": {\n          \"sts:ExternalId\": \"unique-external-id-123\"\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> Cross-Account Access, External ID, Confused Deputy Problem<\/p>","fixed":false},{"id":"iam-17","c":"iam","q":"<p>What is the default effect when no IAM policy explicitly allows or denies an action?<\/p>","o":["Allow","Deny","Prompt for approval","Log the action"],"a":[1],"x":"<ul>\n<li>IAM uses <strong>implicit deny<\/strong> by default<\/li>\n<li>All actions denied unless explicitly allowed<\/li>\n<li><strong>Evaluation Logic<\/strong>: Explicit Deny → Allow → Implicit Deny<\/li>\n<li>Cannot override explicit Deny with Allow<\/li>\n<li>Must have explicit Allow to perform action<\/li>\n<\/ul>\n<p><strong>Policy Evaluation Flow<\/strong>:\n1. Deny evaluation: If any policy has explicit Deny → DENY\n2. Organizations SCPs: Applied as permission boundary\n3. Resource-based policies: Evaluated\n4. Identity-based policies: If any has Allow → ALLOW\n5. IAM permissions boundaries: Applied as filter\n6. Session policies: Applied for assumed roles\n7. Default: DENY (if no explicit Allow)<\/p>\n<p><strong>References:<\/strong> IAM Policy Evaluation Logic<\/p>","fixed":false},{"id":"iam-18","c":"iam","q":"<p>A company wants to grant temporary access to S3 objects for unauthenticated users for 1 hour. What should be used?<\/p>","o":["IAM user credentials","S3 pre-signed URLs","S3 bucket policy","IAM role"],"a":[1],"x":"<ul>\n<li>Pre-signed URLs grant time-limited access to S3 objects<\/li>\n<li>No AWS credentials needed by end user<\/li>\n<li>URL contains authentication information<\/li>\n<li>Expires after specified duration<\/li>\n<\/ul>\n<p><strong>Generate Pre-signed URL (AWS CLI)<\/strong>:\n<code>bash\naws s3 presign s3://my-bucket/object.pdf --expires-in 3600<\/code><\/p>\n<p><strong>Use Cases<\/strong>:\n- Temporary download links\n- Upload forms for unauthenticated users\n- Sharing private content without making public\n- Time-limited access to resources<\/p>\n<ul>\n<li>Option A: Requires creating users, not for temporary/anonymous<\/li>\n<li>Option C: Bucket policies are not time-limited<\/li>\n<li>Option D: Roles require authentication<\/li>\n<\/ul>\n<p><strong>References:<\/strong> S3 Pre-signed URLs, Temporary Access<\/p>","fixed":false},{"id":"iam-19","c":"iam","q":"<p>What is the purpose of IAM permissions boundaries?<\/p>","o":["To set maximum permissions an IAM entity can have","To grant additional permissions beyond policies","To replace IAM policies","To encrypt IAM credentials"],"a":[0],"x":"<ul>\n<li>Permissions boundaries set maximum permissions limit<\/li>\n<li>Cannot grant more permissions than boundary allows<\/li>\n<li>Even if identity policy allows, boundary can restrict<\/li>\n<li><strong>Use Case<\/strong>: Delegate permission management safely<\/li>\n<\/ul>\n<p><strong>Example Scenario<\/strong>:\n- Set permissions boundary on developers\n- Developers can create IAM roles for Lambda\n- But those roles cannot exceed boundary permissions\n- Prevents privilege escalation<\/p>\n<p><strong>Effective Permissions<\/strong> = Identity Policy ∩ Permissions Boundary<\/p>\n<p><code>json\n// Permissions Boundary\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"s3:*\",\n        \"ec2:*\",\n        \"lambda:*\"\n      ],\n      \"Resource\": \"*\"\n    }\n  ]\n}<\/code><\/p>\n<p>Even if identity policy allows IAM actions, boundary prevents it.<\/p>\n<p><strong>References:<\/strong> IAM Permissions Boundaries, Delegated Administration<\/p>","fixed":false},{"id":"iam-20","c":"iam","q":"<p>Which of the following actions require MFA for the root account according to AWS best practices? (Choose TWO)<\/p>","o":["Logging into AWS Console","Changing account settings","Launching EC2 instances","Deleting S3 buckets","Viewing billing information"],"a":[0,1],"x":"<ul>\n<li>AWS best practices: Enable MFA on root account immediately<\/li>\n<li>Root account should be protected with MFA<\/li>\n<li>MFA required for sensitive operations<\/li>\n<li>Some actions like changing account settings require root + MFA<\/li>\n<\/ul>\n<p><strong>Root Account Best Practices<\/strong>:\n1. ✅ Enable MFA on root account\n2. ✅ Don't use root for everyday tasks\n3. ✅ Delete root access keys (use IAM users instead)\n4. ✅ Create IAM users for administrative tasks\n5. ✅ Use root only for tasks requiring root\n6. ✅ Secure root credentials (password manager)<\/p>\n<p><strong>Tasks Requiring Root Account<\/strong>:\n- Change account settings\n- Close AWS account\n- Change AWS Support plan\n- Restore IAM user permissions\n- Register as seller in Reserved Instance Marketplace\n- Configure S3 bucket for MFA Delete\n- Sign up for GovCloud<\/p>\n<p><strong>References:<\/strong> Root Account Best Practices, MFA, AWS Account Security<\/p>","fixed":false},{"id":"compute-1","c":"compute","q":"<p>A company needs to run a batch processing job that can tolerate interruptions and must minimize costs. Which EC2 pricing model should be used?<\/p>","o":["On-Demand Instances","Reserved Instances","Spot Instances","Dedicated Hosts"],"a":[2],"x":"<ul>\n<li>Spot Instances offer up to 90% discount compared to On-Demand<\/li>\n<li>Can be interrupted with 2-minute warning when AWS needs capacity<\/li>\n<li>Perfect for fault-tolerant, flexible workloads<\/li>\n<li><strong>Ideal Use Cases<\/strong>: Batch jobs, data analysis, image processing, CI/CD<\/li>\n<li>Option A: On-Demand is most expensive<\/li>\n<li>Option B: Reserved requires 1-3 year commitment<\/li>\n<li>Option D: Dedicated Hosts are most expensive, for compliance<\/li>\n<\/ul>\n<p><strong>Key Points<\/strong>:\n- Spot = Cheapest, can be interrupted\n- Best for: Stateless, fault-tolerant, flexible workloads<\/p>\n<p><strong>References:<\/strong> EC2 Pricing Models, Spot Instances<\/p>","fixed":false},{"id":"compute-2","c":"compute","q":"<p>An application experiences predictable traffic spikes every Monday at 9 AM. What is the MOST cost-effective Auto Scaling approach?<\/p>","o":["Target Tracking Scaling","Simple Scaling","Step Scaling","Scheduled Scaling"],"a":[3],"x":"<ul>\n<li>Scheduled Scaling scales based on predefined schedule<\/li>\n<li>Perfect for predictable traffic patterns<\/li>\n<li>Scales before traffic spike occurs (proactive)<\/li>\n<li>Most cost-effective for known patterns<\/li>\n<\/ul>\n<p><strong>Schedule Example<\/strong>:\n<code>bash\naws autoscaling put-scheduled-update-group-action \\\n  --auto-scaling-group-name my-asg \\\n  --scheduled-action-name monday-morning-scale \\\n  --recurrence \"0 8 * * MON\" \\\n  --desired-capacity 10<\/code><\/p>\n<ul>\n<li>Option A: Target Tracking is reactive, scales after metric changes<\/li>\n<li>Option B/C: Step/Simple scaling are reactive<\/li>\n<li><strong>Scheduled = Proactive, Target/Step/Simple = Reactive<\/strong><\/li>\n<\/ul>\n<p><strong>References:<\/strong> Auto Scaling Policies, Scheduled Scaling<\/p>","fixed":false},{"id":"compute-3","c":"compute","q":"<p>A web application requires high availability across multiple Availability Zones with automatic distribution of traffic. Which load balancer should be used for HTTP/HTTPS traffic with advanced routing?<\/p>","o":["Classic Load Balancer","Application Load Balancer","Network Load Balancer","Gateway Load Balancer"],"a":[1],"x":"<ul>\n<li><strong>Application Load Balancer (ALB)<\/strong> operates at Layer 7 (HTTP/HTTPS)<\/li>\n<li>Advanced routing: path-based, host-based, header-based<\/li>\n<li>WebSocket and HTTP/2 support<\/li>\n<li>Perfect for modern web applications<\/li>\n<\/ul>\n<p><strong>ALB Features<\/strong>:\n- Path-based routing: <code>/api/*<\/code> → API servers, <code>/images/*<\/code> → image servers\n- Host-based routing: <code>api.example.com<\/code> vs <code>www.example.com<\/code>\n- Query string/header routing\n- Fixed response, redirects\n- AWS WAF integration\n- Authentication (OIDC, Cognito)<\/p>\n<p><strong>Load Balancer Comparison<\/strong>:\n- <strong>CLB<\/strong>: Legacy, Layer 4/7, basic\n- <strong>ALB<\/strong>: Layer 7, HTTP/HTTPS, advanced routing\n- <strong>NLB<\/strong>: Layer 4, TCP/UDP, ultra-high performance, static IP\n- <strong>GLB<\/strong>: Layer 3, third-party virtual appliances<\/p>\n<p><strong>References:<\/strong> Application Load Balancer, ELB Types<\/p>","fixed":false},{"id":"compute-4","c":"compute","q":"<p>A microservices application needs a load balancer that can handle millions of requests per second with ultra-low latency and static IP addresses. Which load balancer should be used?<\/p>","o":["Application Load Balancer","Network Load Balancer","Classic Load Balancer","CloudFront"],"a":[1],"x":"<ul>\n<li><strong>Network Load Balancer (NLB)<\/strong> operates at Layer 4 (TCP/UDP/TLS)<\/li>\n<li>Handles millions of requests per second<\/li>\n<li>Ultra-low latency (microseconds)<\/li>\n<li>Static IP addresses (one per AZ)<\/li>\n<li>Preserves source IP address<\/li>\n<\/ul>\n<p><strong>NLB Use Cases<\/strong>:\n- Extreme performance requirements\n- Static/Elastic IP needed (whitelist in firewalls)\n- TCP/UDP traffic\n- PrivateLink endpoints\n- Game servers, IoT, real-time applications<\/p>\n<p><strong>NLB vs ALB<\/strong>:\n- <strong>NLB<\/strong>: Layer 4, faster, static IP, TCP/UDP\n- <strong>ALB<\/strong>: Layer 7, advanced routing, HTTP/HTTPS<\/p>\n<p><strong>References:<\/strong> Network Load Balancer, Layer 4 vs Layer 7<\/p>","fixed":false},{"id":"compute-5","c":"compute","q":"<p>A company wants to run code in response to events without managing servers. The code should execute only when triggered and scale automatically. Which service should be used?<\/p>","o":["Amazon EC2 with Auto Scaling","AWS Lambda","Amazon ECS","AWS Elastic Beanstalk"],"a":[1],"x":"<ul>\n<li><strong>AWS Lambda<\/strong> is serverless compute service<\/li>\n<li>Event-driven execution<\/li>\n<li>Automatic scaling (1 to 1000s of concurrent executions)<\/li>\n<li>Pay only for compute time (per millisecond)<\/li>\n<li>No server management<\/li>\n<\/ul>\n<p><strong>Lambda Characteristics<\/strong>:\n- <strong>Max execution time<\/strong>: 15 minutes\n- <strong>Memory<\/strong>: 128 MB to 10,240 MB\n- <strong>Deployment package<\/strong>: 50 MB (zipped), 250 MB (unzipped)\n- <strong>Concurrent executions<\/strong>: 1000 (default, can increase)\n- <strong>Billing<\/strong>: Per request + compute time (GB-seconds)<\/p>\n<p><strong>Lambda Triggers<\/strong>:\n- API Gateway (REST APIs)\n- S3 events\n- DynamoDB Streams\n- EventBridge (scheduled/event-based)\n- SNS, SQS\n- Kinesis<\/p>\n<p><strong>References:<\/strong> AWS Lambda, Serverless Computing<\/p>","fixed":false},{"id":"compute-6","c":"compute","q":"<p>An application running on EC2 instances experiences variable traffic and needs to maintain 50% average CPU utilization. What Auto Scaling policy should be configured?<\/p>","o":["Simple Scaling","Step Scaling","Target Tracking Scaling","Predictive Scaling"],"a":[2],"x":"<ul>\n<li><strong>Target Tracking Scaling<\/strong> automatically adjusts capacity to maintain target metric<\/li>\n<li>Specify target value (e.g., 50% CPU), Auto Scaling does the rest<\/li>\n<li>Easiest to configure and manage<\/li>\n<li>Creates and manages CloudWatch alarms automatically<\/li>\n<\/ul>\n<p><strong>Configuration Example<\/strong>:\n<code>json\n{\n  \"TargetValue\": 50.0,\n  \"PredefinedMetricSpecification\": {\n    \"PredefinedMetricType\": \"ASGAverageCPUUtilization\"\n  }\n}<\/code><\/p>\n<p><strong>Predefined Metrics<\/strong>:\n- <code>ASGAverageCPUUtilization<\/code>\n- <code>ASGAverageNetworkIn<\/code>\n- <code>ASGAverageNetworkOut<\/code>\n- <code>ALBRequestCountPerTarget<\/code><\/p>\n<p><strong>Scaling Policy Types<\/strong>:\n- <strong>Target Tracking<\/strong>: Maintain specific metric value (EASIEST)\n- <strong>Step<\/strong>: Add/remove capacity based on CloudWatch alarm thresholds\n- <strong>Simple<\/strong>: Single scaling adjustment (legacy)\n- <strong>Predictive<\/strong>: ML-based forecasting<\/p>\n<p><strong>References:<\/strong> Target Tracking Scaling, Auto Scaling Policies<\/p>","fixed":false},{"id":"compute-7","c":"compute","q":"<p>A company needs to run Docker containers without managing EC2 instances. Which service should be used?<\/p>","o":["Amazon ECS with EC2 launch type","Amazon ECS with Fargate launch type","Amazon EKS","AWS Elastic Beanstalk"],"a":[1],"x":"<ul>\n<li><strong>AWS Fargate<\/strong> is serverless container platform<\/li>\n<li>No EC2 instance management required<\/li>\n<li>Pay for vCPU and memory resources used<\/li>\n<li>Works with both ECS and EKS<\/li>\n<\/ul>\n<p><strong>Container Service Options<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Description<\/th>\n<th>Management<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ECS + EC2<\/strong><\/td>\n<td>Container orchestration on EC2<\/td>\n<td>Manage instances<\/td>\n<\/tr>\n<tr>\n<td><strong>ECS + Fargate<\/strong><\/td>\n<td>Serverless containers<\/td>\n<td>No instance management<\/td>\n<\/tr>\n<tr>\n<td><strong>EKS + EC2<\/strong><\/td>\n<td>Kubernetes on EC2<\/td>\n<td>Manage instances + K8s<\/td>\n<\/tr>\n<tr>\n<td><strong>EKS + Fargate<\/strong><\/td>\n<td>Serverless Kubernetes<\/td>\n<td>No instance management<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Fargate Benefits<\/strong>:\n- No instance provisioning/scaling\n- No patching/securing instances\n- Pay per task\n- Simpler operations<\/p>\n<p><strong>When to use Fargate vs EC2<\/strong>:\n- <strong>Fargate<\/strong>: Simplicity, less operational overhead\n- <strong>EC2<\/strong>: Need specific instance types, GPU, cost optimization for sustained workloads<\/p>\n<p><strong>References:<\/strong> AWS Fargate, Amazon ECS<\/p>","fixed":false},{"id":"compute-8","c":"compute","q":"<p>An EC2 instance needs low-latency, high-throughput connectivity to other instances in the same cluster. Which placement group should be used?<\/p>","o":["Cluster Placement Group","Spread Placement Group","Partition Placement Group","No placement group needed"],"a":[0],"x":"<ul>\n<li><strong>Cluster Placement Group<\/strong> places instances close together in single AZ<\/li>\n<li>Low-latency network (10 Gbps between instances)<\/li>\n<li>High throughput, enhanced networking<\/li>\n<li>All instances in same rack/physical proximity<\/li>\n<\/ul>\n<p><strong>Placement Group Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Purpose<\/th>\n<th>AZ<\/th>\n<th>Max Instances<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cluster<\/strong><\/td>\n<td>Low latency, high throughput<\/td>\n<td>Single AZ<\/td>\n<td>Limited by instance type<\/td>\n<\/tr>\n<tr>\n<td><strong>Spread<\/strong><\/td>\n<td>Reduce correlated failures<\/td>\n<td>Multi-AZ<\/td>\n<td>7 per AZ<\/td>\n<\/tr>\n<tr>\n<td><strong>Partition<\/strong><\/td>\n<td>Large distributed workloads<\/td>\n<td>Multi-AZ<\/td>\n<td>7 partitions per AZ<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Use Cases<\/strong>:\n- <strong>Cluster<\/strong>: HPC, big data, low-latency apps\n- <strong>Spread<\/strong>: Critical applications (each instance separate rack)\n- <strong>Partition<\/strong>: Hadoop, Cassandra, Kafka (partition = rack)<\/p>\n<p><strong>Limitations<\/strong>:\n- Cluster: Single AZ only\n- Spread: Max 7 instances per AZ\n- Not all instance types supported<\/p>\n<p><strong>References:<\/strong> EC2 Placement Groups<\/p>","fixed":false},{"id":"compute-9","c":"compute","q":"<p>A company wants to deploy a web application with automatic scaling, load balancing, and health monitoring without managing infrastructure. Which service should be used?<\/p>","o":["AWS Lambda","Amazon EC2 with Auto Scaling","AWS Elastic Beanstalk","Amazon Lightsail"],"a":[2],"x":"<ul>\n<li><strong>AWS Elastic Beanstalk<\/strong> is PaaS (Platform as a Service)<\/li>\n<li>Upload code, Beanstalk handles deployment<\/li>\n<li>Automatic provisioning: EC2, ALB, Auto Scaling, RDS, monitoring<\/li>\n<li>Multiple platforms: Java, .NET, PHP, Node.js, Python, Ruby, Go, Docker<\/li>\n<\/ul>\n<p><strong>Elastic Beanstalk Features<\/strong>:\n- Automatic capacity provisioning\n- Load balancing\n- Auto Scaling\n- Health monitoring\n- Platform updates\n- Still have full control over resources (not completely abstracted)<\/p>\n<p><strong>Deployment Options<\/strong>:\n- <strong>All at once<\/strong>: Fastest, downtime\n- <strong>Rolling<\/strong>: Partial batches, reduced capacity\n- <strong>Rolling with additional batch<\/strong>: Maintains full capacity\n- <strong>Immutable<\/strong>: New instances, safest\n- <strong>Blue/Green<\/strong>: Manual via swap URLs<\/p>\n<p><strong>Beanstalk vs Others<\/strong>:\n- <strong>Lambda<\/strong>: Functions, not full applications\n- <strong>EC2 + Auto Scaling<\/strong>: More manual configuration\n- <strong>Lightsail<\/strong>: Simpler, less scalable<\/p>\n<p><strong>References:<\/strong> AWS Elastic Beanstalk, PaaS<\/p>","fixed":false},{"id":"compute-10","c":"compute","q":"<p>An application requires guaranteed capacity reservation for EC2 instances in a specific Availability Zone without long-term commitment. Which option should be used?<\/p>","o":["Reserved Instances","Savings Plans","On-Demand Capacity Reservations","Spot Instances"],"a":[2],"x":"<ul>\n<li><strong>On-Demand Capacity Reservations<\/strong> reserve capacity in specific AZ<\/li>\n<li>No long-term commitment (can cancel anytime)<\/li>\n<li>Charged at On-Demand rates whether used or not<\/li>\n<li>Ensures capacity availability when needed<\/li>\n<\/ul>\n<p><strong>Capacity Options Comparison<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Commitment<\/th>\n<th>Discount<\/th>\n<th>Capacity Guarantee<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>On-Demand<\/strong><\/td>\n<td>None<\/td>\n<td>None<\/td>\n<td>No guarantee<\/td>\n<\/tr>\n<tr>\n<td><strong>Reserved<\/strong><\/td>\n<td>1-3 years<\/td>\n<td>Up to 72%<\/td>\n<td>Yes (regional or zonal)<\/td>\n<\/tr>\n<tr>\n<td><strong>Savings Plans<\/strong><\/td>\n<td>1-3 years<\/td>\n<td>Up to 66%<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Capacity Reservations<\/strong><\/td>\n<td>None<\/td>\n<td>None<\/td>\n<td>Yes (zonal)<\/td>\n<\/tr>\n<tr>\n<td><strong>Spot<\/strong><\/td>\n<td>None<\/td>\n<td>Up to 90%<\/td>\n<td>No (can be interrupted)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Use Case<\/strong>:\n- Disaster recovery (reserve capacity but don't always run)\n- Business-critical events (Black Friday)\n- Regulatory/compliance requirements<\/p>\n<p><strong>Cost Optimization<\/strong>: Combine Capacity Reservation with Savings Plan<\/p>\n<p><strong>References:<\/strong> On-Demand Capacity Reservations<\/p>","fixed":false},{"id":"compute-11","c":"compute","q":"<p>A Lambda function is timing out after 3 seconds when processing large files. What should be changed?<\/p>","o":["Increase Lambda memory allocation","Increase Lambda timeout setting","Use Lambda layers","Switch to EC2"],"a":[1],"x":"<ul>\n<li>Lambda default timeout is 3 seconds<\/li>\n<li>Can be increased up to 15 minutes (900 seconds)<\/li>\n<li>Timeout configuration is separate from memory<\/li>\n<\/ul>\n<p><strong>Lambda Configuration<\/strong>:\n- <strong>Memory<\/strong>: 128 MB to 10,240 MB (10 GB)\n- <strong>Timeout<\/strong>: 1 second to 900 seconds (15 minutes)\n- <strong>CPU scales with memory<\/strong> (1,792 MB = 1 vCPU)\n- <strong>Ephemeral storage (/tmp)<\/strong>: 512 MB to 10,240 MB<\/p>\n<p><strong>Performance Tuning<\/strong>:\n1. Increase timeout for long-running tasks\n2. Increase memory if CPU-bound (CPU scales with memory)\n3. Optimize code\n4. Use async patterns for very long tasks<\/p>\n<p><strong>When Lambda is NOT suitable<\/strong>:\n- Tasks &gt; 15 minutes\n- Need GPU\n- Stateful applications\n- Real-time latency requirements (cold starts)<\/p>\n<p><strong>References:<\/strong> Lambda Configuration, Lambda Limits<\/p>","fixed":false},{"id":"compute-12","c":"compute","q":"<p>A company wants to run EC2 instances with dedicated physical servers for compliance requirements. Which option should be used?<\/p>","o":["Dedicated Instances","Dedicated Hosts","Reserved Instances","Spot Instances"],"a":[1],"x":"<ul>\n<li><strong>Dedicated Hosts<\/strong>: Physical server dedicated to your use<\/li>\n<li>Visibility into sockets, cores, host ID<\/li>\n<li>Support for BYOL (Bring Your Own License) - Windows Server, SQL Server<\/li>\n<li>Meet compliance requirements<\/li>\n<li>Most expensive option<\/li>\n<\/ul>\n<p><strong>Dedicated Instances vs Dedicated Hosts<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Dedicated Instances<\/th>\n<th>Dedicated Hosts<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Isolation<\/strong><\/td>\n<td>Instance-level<\/td>\n<td>Physical server<\/td>\n<\/tr>\n<tr>\n<td><strong>Visibility<\/strong><\/td>\n<td>No hardware visibility<\/td>\n<td>Socket/core visibility<\/td>\n<\/tr>\n<tr>\n<td><strong>BYOL<\/strong><\/td>\n<td>Not supported<\/td>\n<td>Supported<\/td>\n<\/tr>\n<tr>\n<td><strong>Placement<\/strong><\/td>\n<td>Automatic<\/td>\n<td>Control placement<\/td>\n<\/tr>\n<tr>\n<td><strong>Billing<\/strong><\/td>\n<td>Per instance<\/td>\n<td>Per host<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>Compliance (soft requirement)<\/td>\n<td>BYOL, compliance (strict)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Use Cases for Dedicated Hosts<\/strong>:\n- Server-bound software licenses\n- Regulatory compliance\n- Track physical host usage<\/p>\n<p><strong>References:<\/strong> Dedicated Hosts, Dedicated Instances, BYOL<\/p>","fixed":false},{"id":"compute-13","c":"compute","q":"<p>An Auto Scaling group has 10 instances. An administrator manually terminates 3 instances. What happens next?<\/p>","o":["Auto Scaling terminates 3 more instances","Auto Scaling launches 3 new instances","Auto Scaling does nothing","Auto Scaling sends an alert"],"a":[1],"x":"<ul>\n<li>Auto Scaling maintains desired capacity<\/li>\n<li>If instances are terminated (manually or automatically), ASG replaces them<\/li>\n<li>Ensures desired count is maintained<\/li>\n<\/ul>\n<p><strong>Auto Scaling Group Configuration<\/strong>:\n- <strong>Minimum<\/strong>: Minimum number of instances\n- <strong>Desired<\/strong>: Target number of instances\n- <strong>Maximum<\/strong>: Maximum number of instances<\/p>\n<p><strong>Scaling Activities<\/strong>:\n- Scale out: Launch instances (desired &lt; current)\n- Scale in: Terminate instances (desired &gt; current)\n- Replace unhealthy: Terminate and replace\n- Rebalance across AZs<\/p>\n<p><strong>Instance Protection<\/strong>:\n- Can enable scale-in protection on specific instances\n- Prevents Auto Scaling from terminating protected instances\n- Manual termination still works<\/p>\n<p><strong>References:<\/strong> Auto Scaling Groups, Desired Capacity<\/p>","fixed":false},{"id":"compute-14","c":"compute","q":"<p>A batch processing application uses Lambda functions but needs to coordinate multiple steps with error handling and retries. Which service should be used?<\/p>","o":["Amazon SQS","Amazon SNS","AWS Step Functions","Amazon EventBridge"],"a":[2],"x":"<ul>\n<li><strong>AWS Step Functions<\/strong> orchestrates serverless workflows<\/li>\n<li>Coordinate multiple Lambda functions<\/li>\n<li>Built-in error handling, retries, parallel execution<\/li>\n<li>Visual workflow designer<\/li>\n<\/ul>\n<p><strong>Step Functions Features<\/strong>:\n- <strong>State machine<\/strong>: Define workflow as states\n- <strong>Error handling<\/strong>: Catch errors, retry logic\n- <strong>Parallel execution<\/strong>: Run steps concurrently\n- <strong>Wait states<\/strong>: Delays between steps\n- <strong>Choice states<\/strong>: Conditional logic\n- <strong>Map states<\/strong>: Iterate over arrays<\/p>\n<p><strong>Workflow Types<\/strong>:\n- <strong>Standard<\/strong>: Long-running (up to 1 year), exactly-once execution\n- <strong>Express<\/strong>: Short-lived (5 min), at-least-once, high-rate<\/p>\n<p><strong>Use Cases<\/strong>:\n- ETL pipelines\n- Order processing\n- Video processing\n- Machine learning workflows<\/p>\n<p><strong>Step Functions vs Alternatives<\/strong>:\n- <strong>SQS<\/strong>: Message queue, no orchestration\n- <strong>SNS<\/strong>: Pub/sub messaging, no orchestration\n- <strong>EventBridge<\/strong>: Event routing, simpler workflows<\/p>\n<p><strong>References:<\/strong> AWS Step Functions, Serverless Orchestration<\/p>","fixed":false},{"id":"compute-15","c":"compute","q":"<p>An application needs consistent performance with baseline CPU and ability to burst above baseline when needed. Which EC2 instance type should be used?<\/p>","o":["M5 (General Purpose)","C5 (Compute Optimized)","T3 (Burstable Performance)","R5 (Memory Optimized)"],"a":[2],"x":"<ul>\n<li><strong>T3/T4g instances<\/strong> are burstable performance instances<\/li>\n<li>Baseline CPU performance with credit system<\/li>\n<li>Accumulate CPU credits when below baseline<\/li>\n<li>Burst above baseline using credits<\/li>\n<li>Cost-effective for variable workloads<\/li>\n<\/ul>\n<p><strong>T3 CPU Credits<\/strong>:\n- Baseline performance depends on instance size\n- Earn credits when CPU &lt; baseline\n- Spend credits when CPU &gt; baseline\n- <strong>Unlimited mode<\/strong>: Can burst beyond credits (additional charges)<\/p>\n<p><strong>T3 Instance Types<\/strong>:\n- t3.nano: 5% baseline\n- t3.micro: 10% baseline\n- t3.small: 20% baseline\n- t3.medium: 20% baseline\n- t3.large: 30% baseline<\/p>\n<p><strong>Use Cases<\/strong>:\n- Web servers, dev/test\n- Small databases\n- Code repositories\n- Microservices<\/p>\n<p><strong>When NOT to use T3<\/strong>:\n- Sustained high CPU usage\n- Predictable high performance needs\n- Use C5/M5 for sustained performance<\/p>\n<p><strong>References:<\/strong> T3 Instances, Burstable Performance, CPU Credits<\/p>","fixed":false},{"id":"compute-16","c":"compute","q":"<p>A company wants to deploy containerized applications using Kubernetes without managing the control plane. Which service should be used?<\/p>","o":["Amazon ECS","Amazon EKS","AWS Fargate","AWS Elastic Beanstalk"],"a":[1],"x":"<ul>\n<li><strong>Amazon EKS<\/strong> (Elastic Kubernetes Service) is managed Kubernetes<\/li>\n<li>AWS manages Kubernetes control plane<\/li>\n<li>Compatible with standard Kubernetes tools (kubectl, Helm)<\/li>\n<li>Multi-AZ control plane for high availability<\/li>\n<\/ul>\n<p><strong>EKS Features<\/strong>:\n- Managed K8s control plane (etcd, API server)\n- Automatic upgrades and patches\n- Integrate with AWS services (IAM, VPC, ALB, CloudWatch)\n- CNCF certified (standard Kubernetes)<\/p>\n<p><strong>EKS Worker Nodes Options<\/strong>:\n- <strong>Self-managed nodes<\/strong>: You manage EC2 instances\n- <strong>Managed node groups<\/strong>: AWS manages EC2 lifecycle\n- <strong>Fargate<\/strong>: Serverless, no node management<\/p>\n<p><strong>ECS vs EKS<\/strong>:\n- <strong>ECS<\/strong>: AWS-proprietary, simpler, tight AWS integration\n- <strong>EKS<\/strong>: Standard Kubernetes, portable, more complex, existing K8s expertise<\/p>\n<p><strong>When to use EKS<\/strong>:\n- Existing Kubernetes workloads\n- Kubernetes expertise in team\n- Multi-cloud/hybrid requirements\n- Standard Kubernetes tools needed<\/p>\n<p><strong>References:<\/strong> Amazon EKS, Kubernetes on AWS<\/p>","fixed":false},{"id":"compute-17","c":"compute","q":"<p>An Auto Scaling group needs to ensure that newly launched instances are ready to serve traffic before receiving requests. What should be configured?<\/p>","o":["EC2 Status Checks","ELB Health Checks","Auto Scaling Health Check Grace Period","CloudWatch Alarms"],"a":[2],"x":"<ul>\n<li><strong>Health Check Grace Period<\/strong> gives instances time to boot and pass checks<\/li>\n<li>Prevents premature termination during initialization<\/li>\n<li>Default: 300 seconds (5 minutes)<\/li>\n<li>Should be longer than application startup time<\/li>\n<\/ul>\n<p><strong>Auto Scaling Health Checks<\/strong>:\n- <strong>EC2 health check<\/strong>: Instance running (default)\n- <strong>ELB health check<\/strong>: Instance passes load balancer health checks\n- Grace period applies to both types<\/p>\n<p><strong>Recommended Configuration<\/strong>:\n1. Set grace period &gt; application startup time\n2. Enable ELB health checks\n3. Configure ELB health check with appropriate interval/threshold<\/p>\n<p><strong>Example<\/strong>:\n<code>bash\naws autoscaling create-auto-scaling-group \\\n  --auto-scaling-group-name my-asg \\\n  --health-check-type ELB \\\n  --health-check-grace-period 600  # 10 minutes<\/code><\/p>\n<p><strong>References:<\/strong> Auto Scaling Health Checks, Grace Period<\/p>","fixed":false},{"id":"compute-18","c":"compute","q":"<p>A company wants to migrate lift-and-shift Windows applications to AWS without refactoring. Which compute option is MOST appropriate?<\/p>","o":["AWS Lambda","Amazon ECS","Amazon EC2","AWS Fargate"],"a":[2],"x":"<ul>\n<li><strong>Amazon EC2<\/strong> for lift-and-shift migrations<\/li>\n<li>Run Windows Server, install applications as-is<\/li>\n<li>Minimal refactoring required<\/li>\n<li>Full control over OS and configuration<\/li>\n<\/ul>\n<p><strong>Migration Strategies (6 R's)<\/strong>:\n1. <strong>Rehost (Lift-and-Shift)<\/strong>: Move as-is to EC2\n2. <strong>Replatform (Lift-Tinker-Shift)<\/strong>: Minor optimizations\n3. <strong>Repurchase<\/strong>: Move to SaaS\n4. <strong>Refactor/Re-architect<\/strong>: Redesign for cloud-native\n5. <strong>Retire<\/strong>: Decommission\n6. <strong>Retain<\/strong>: Keep on-premises<\/p>\n<p><strong>Lift-and-Shift Approach<\/strong>:\n- Quick migration\n- Minimal risk\n- Can optimize later\n- Use AWS Application Migration Service (MGN)<\/p>\n<p><strong>Other Options Not Suitable<\/strong>:\n- Lambda: Requires code changes, event-driven\n- ECS/Fargate: Requires containerization\n- EC2 is best for \"as-is\" Windows applications<\/p>\n<p><strong>References:<\/strong> Migration Strategies, EC2 for Windows<\/p>","fixed":false},{"id":"compute-19","c":"compute","q":"<p>An application running on Lambda is invoked by S3 events. During peak times, thousands of files are uploaded simultaneously. How should Lambda handle this?<\/p>","o":["Increase Lambda memory","Enable Lambda reserved concurrency","Lambda automatically scales concurrently","Use Step Functions"],"a":[2],"x":"<ul>\n<li>Lambda automatically scales to handle concurrent invocations<\/li>\n<li>Each S3 event triggers separate Lambda invocation<\/li>\n<li>Default account concurrency: 1000 (can request increase)<\/li>\n<li>No configuration needed for basic scaling<\/li>\n<\/ul>\n<p><strong>Lambda Concurrency Types<\/strong>:\n- <strong>Account concurrency<\/strong>: Total concurrent executions across all functions (1000 default)\n- <strong>Reserved concurrency<\/strong>: Dedicated concurrency for specific function\n- <strong>Provisioned concurrency<\/strong>: Pre-initialized instances (reduce cold starts)<\/p>\n<p><strong>When to use Reserved Concurrency<\/strong>:\n- Limit function concurrency (prevent overwhelming downstream)\n- Guarantee concurrency for critical functions\n- Prevent one function from consuming all account concurrency<\/p>\n<p><strong>Example Scenario<\/strong>:\n- 1000 files uploaded to S3\n- Lambda invoked 1000 times concurrently (within account limits)\n- If account limit is 1000, all execute immediately\n- If limit exceeded, some invocations throttled (429 error)<\/p>\n<p><strong>References:<\/strong> Lambda Concurrency, Automatic Scaling<\/p>","fixed":false},{"id":"compute-20","c":"compute","q":"<p>A web application needs to maintain session state. The application runs on multiple EC2 instances behind an Application Load Balancer. How should session state be managed?<\/p>","o":["Store session data on EC2 instance local storage","Enable sticky sessions on ALB","Store session data in Amazon ElastiCache or DynamoDB","Use NLB instead of ALB"],"a":[2],"x":"<ul>\n<li><strong>External session storage<\/strong> (ElastiCache/DynamoDB) is best practice<\/li>\n<li>Sessions accessible from any instance<\/li>\n<li>Survives instance failures<\/li>\n<li>True stateless architecture<\/li>\n<\/ul>\n<p><strong>Session Management Options<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Pros<\/th>\n<th>Cons<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ElastiCache/DynamoDB<\/strong><\/td>\n<td>Stateless, scalable, resilient<\/td>\n<td>Additional service<\/td>\n<\/tr>\n<tr>\n<td><strong>Sticky Sessions<\/strong><\/td>\n<td>Simple<\/td>\n<td>Uneven load, not resilient<\/td>\n<\/tr>\n<tr>\n<td><strong>Local Storage<\/strong><\/td>\n<td>Fast<\/td>\n<td>Lost on instance failure<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why ElastiCache/DynamoDB is Better<\/strong>:\n- ✅ Any instance can serve any request\n- ✅ Auto Scaling works properly\n- ✅ Instance failure doesn't lose sessions\n- ✅ Better load distribution<\/p>\n<p><strong>Sticky Sessions Issues<\/strong>:\n- Uneven instance utilization\n- New instances get no traffic initially\n- Instance failure = lost sessions\n- Use only if refactoring is not possible<\/p>\n<p><strong>References:<\/strong> Stateless Architecture, Session Management, ElastiCache<\/p>","fixed":false},{"id":"compute-21","c":"compute","q":"<p>A company needs to run AWS services in its own data center to meet strict data residency requirements, while maintaining a consistent hybrid cloud experience. Which AWS service should they use?<\/p>","o":["AWS Outposts","Amazon EC2 Dedicated Hosts","AWS Snowball Edge","AWS Direct Connect"],"a":[0],"x":"<ul>\n<li>AWS Outposts brings native AWS services, infrastructure, and operating models to on-premises data centers<\/li>\n<li>Provides a consistent hybrid experience<\/li>\n<li>Supports EC2, EBS, RDS, ECS, EKS, S3, and more<\/li>\n<li>Dedicated Hosts are for compliance, not hybrid cloud<\/li>\n<li>Snowball Edge is for edge computing and data transfer, not full AWS services<\/li>\n<li>Direct Connect is for network connectivity, not running AWS services on-premises<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Outposts, Hybrid Cloud<\/p>","fixed":false},{"id":"compute-22","c":"compute","q":"<p>A research organization needs to run large-scale, high-throughput batch jobs on AWS with automatic job scheduling and resource provisioning. Which service should they use?<\/p>","o":["AWS Batch","Amazon EC2 Auto Scaling","AWS Lambda","Amazon EMR"],"a":[0],"x":"<ul>\n<li>AWS Batch is a fully managed batch computing service<\/li>\n<li>Automatically provisions compute resources and schedules jobs<\/li>\n<li>Supports Docker containers and EC2/Spot/Fargate<\/li>\n<li>EC2 Auto Scaling is for scaling instances, not job scheduling<\/li>\n<li>Lambda is for short-lived, event-driven compute<\/li>\n<li>EMR is for big data processing, not general batch jobs<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Batch, Batch Computing<\/p>","fixed":false},{"id":"compute-23","c":"compute","q":"<p>A development team wants to share and deploy serverless applications published by AWS and third parties. Which AWS service should they use?<\/p>","o":["AWS Serverless Application Repository","AWS Marketplace","AWS Lambda Layers","AWS CloudFormation StackSets"],"a":[0],"x":"<ul>\n<li>AWS Serverless Application Repository is a managed repository for serverless apps<\/li>\n<li>Allows sharing and deployment of Lambda-based applications<\/li>\n<li>Marketplace is for commercial software, not serverless apps<\/li>\n<li>Lambda Layers are for code sharing, not full applications<\/li>\n<li>CloudFormation StackSets is for multi-account deployments<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Serverless Application Repository, Serverless Deployment<\/p>","fixed":false},{"id":"compute-24","c":"compute","q":"<p>A company wants to run VMware workloads on AWS with seamless integration and management using familiar VMware tools. Which solution should they use?<\/p>","o":["VMware Cloud on AWS","AWS Outposts","Amazon EC2 Dedicated Hosts","AWS Snowball Edge"],"a":[0],"x":"<ul>\n<li>VMware Cloud on AWS integrates VMware vSphere, NSX, and vSAN with AWS infrastructure<\/li>\n<li>Enables seamless migration and hybrid operations<\/li>\n<li>Managed by both AWS and VMware<\/li>\n<li>Outposts is for running AWS services on-premises<\/li>\n<li>Dedicated Hosts are for compliance<\/li>\n<li>Snowball Edge is for edge computing<\/li>\n<\/ul>\n<p><strong>References:<\/strong> VMware Cloud on AWS, Hybrid VMware<\/p>","fixed":false},{"id":"compute-25","c":"compute","q":"<p>A global enterprise needs to deploy AWS compute and storage services at the edge of mobile networks to deliver ultra-low latency applications. Which AWS service should they use?<\/p>","o":["AWS Wavelength","AWS Outposts","Amazon CloudFront","AWS Direct Connect"],"a":[0],"x":"<ul>\n<li>AWS Wavelength brings AWS services to the edge of 5G networks<\/li>\n<li>Enables ultra-low latency applications for mobile and edge devices<\/li>\n<li>Outposts is for on-premises data centers<\/li>\n<li>CloudFront is a CDN, not edge compute<\/li>\n<li>Direct Connect is for network connectivity<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Wavelength, Edge Computing<\/p>","fixed":false},{"id":"compute-26","c":"compute","q":"<p>A company wants to run Amazon ECS and EKS workloads on its own infrastructure outside AWS, managed from the AWS Console. Which services should they use?<\/p>","o":["Amazon ECS Anywhere and Amazon EKS Anywhere","AWS Outposts","AWS Fargate","Amazon EC2 Dedicated Hosts"],"a":[0],"x":"<ul>\n<li>ECS Anywhere and EKS Anywhere extend container orchestration to on-premises infrastructure<\/li>\n<li>Managed from AWS Console<\/li>\n<li>Outposts is for running AWS infrastructure on-premises<\/li>\n<li>Fargate is for serverless containers in AWS<\/li>\n<li>Dedicated Hosts are for compliance<\/li>\n<\/ul>\n<p><strong>References:<\/strong> ECS Anywhere, EKS Anywhere, Hybrid Containers<\/p>","fixed":false},{"id":"compute-27","c":"compute","q":"<p>A team needs a managed, scalable Apache Cassandra-compatible database for their application. Which AWS service should they use?<\/p>","o":["Amazon Keyspaces","Amazon DynamoDB","Amazon RDS for PostgreSQL","Amazon Aurora"],"a":[0],"x":"<ul>\n<li>Amazon Keyspaces is a managed Cassandra-compatible database<\/li>\n<li>Supports Cassandra Query Language (CQL)<\/li>\n<li>DynamoDB is NoSQL but not Cassandra-compatible<\/li>\n<li>RDS and Aurora are relational databases<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon Keyspaces, Managed Cassandra<\/p>","fixed":false},{"id":"compute-28","c":"compute","q":"<p>A financial institution needs a fully managed, immutable, cryptographically verifiable ledger database. Which AWS service should they use?<\/p>","o":["Amazon QLDB","Amazon Aurora","Amazon RDS","Amazon DynamoDB"],"a":[0],"x":"<ul>\n<li>Amazon QLDB (Quantum Ledger Database) is a fully managed ledger database<\/li>\n<li>Provides immutable, cryptographically verifiable transaction log<\/li>\n<li>Aurora, RDS, and DynamoDB are not ledger databases<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon QLDB, Ledger Database<\/p>","fixed":false},{"id":"storage-1","c":"storage","q":"<p>A company needs to store frequently accessed data with the lowest latency and highest throughput. Cost is not the primary concern. Which S3 storage class should be used?<\/p>","o":["S3 Standard","S3 Intelligent-Tiering","S3 Standard-IA","S3 One Zone-IA"],"a":[0],"x":"<ul>\n<li><strong>S3 Standard<\/strong> provides:<\/li>\n<li>Millisecond latency<\/li>\n<li>High throughput<\/li>\n<li>99.99% availability<\/li>\n<li>11 9's durability<\/li>\n<li>Designed for frequently accessed data<\/li>\n<\/ul>\n<p><strong>S3 Storage Classes Comparison<\/strong>:\n- <strong>Standard<\/strong>: Frequent access, highest cost\n- <strong>Intelligent-Tiering<\/strong>: Unknown/changing patterns, automatic tiering\n- <strong>Standard-IA<\/strong>: Infrequent access, lower cost, retrieval fees\n- <strong>One Zone-IA<\/strong>: Infrequent, single AZ, lowest IA cost\n- <strong>Glacier<\/strong>: Archive, minutes to hours retrieval\n- <strong>Glacier Deep Archive<\/strong>: Long-term archive, 12+ hours retrieval<\/p>\n<p><strong>References:<\/strong> S3 Storage Classes, S3 Standard<\/p>","fixed":false},{"id":"storage-2","c":"storage","q":"<p>A company stores infrequently accessed data in S3 Standard-IA. They need to access this data immediately when required. What is the retrieval time?<\/p>","o":["12 hours","3-5 hours","1-5 minutes","Milliseconds (immediate)"],"a":[3],"x":"<ul>\n<li><strong>S3 Standard-IA<\/strong> provides immediate access (milliseconds)<\/li>\n<li>\"IA\" means Infrequent Access, not slow access<\/li>\n<li>Lower storage cost than Standard<\/li>\n<li>Retrieval fees apply per GB<\/li>\n<li>Minimum storage duration: 30 days<\/li>\n<li>Minimum object size: 128 KB<\/li>\n<\/ul>\n<p><strong>S3 Retrieval Times<\/strong>:\n- <strong>Standard/Standard-IA/One Zone-IA<\/strong>: Milliseconds\n- <strong>Intelligent-Tiering<\/strong>: Milliseconds\n- <strong>Glacier Instant Retrieval<\/strong>: Milliseconds\n- <strong>Glacier Flexible Retrieval<\/strong>: \n  - Expedited: 1-5 minutes\n  - Standard: 3-5 hours\n  - Bulk: 5-12 hours\n- <strong>Glacier Deep Archive<\/strong>:\n  - Standard: 12 hours\n  - Bulk: 48 hours<\/p>\n<p><strong>References:<\/strong> S3 Standard-IA, S3 Retrieval Times<\/p>","fixed":false},{"id":"storage-3","c":"storage","q":"<p>A company needs to store compliance data that must be retained for 7 years and accessed once or twice per year. Cost optimization is critical. Which storage solution is MOST cost-effective?<\/p>","o":["S3 Standard","S3 Glacier Flexible Retrieval","S3 Glacier Deep Archive","S3 Intelligent-Tiering"],"a":[2],"x":"<ul>\n<li><strong>S3 Glacier Deep Archive<\/strong> is cheapest S3 storage class<\/li>\n<li>Designed for long-term retention (7-10+ years)<\/li>\n<li>Retrieval time: 12-48 hours (acceptable for rare access)<\/li>\n<li>Lowest cost per GB<\/li>\n<li>Perfect for compliance, regulatory archives<\/li>\n<\/ul>\n<p><strong>Cost Comparison (approximate)<\/strong>:\n- <strong>Deep Archive<\/strong>: $0.00099/GB/month (cheapest)\n- <strong>Glacier Flexible<\/strong>: $0.0036/GB/month\n- <strong>Standard-IA<\/strong>: $0.0125/GB/month\n- <strong>Standard<\/strong>: $0.023/GB/month<\/p>\n<p><strong>When to Use<\/strong>:\n- <strong>Deep Archive<\/strong>: Rarely accessed, 7+ years retention\n- <strong>Glacier Flexible<\/strong>: Occasionally accessed archives\n- <strong>Standard-IA<\/strong>: Monthly access\n- <strong>Standard<\/strong>: Frequent access<\/p>\n<p><strong>References:<\/strong> S3 Glacier Deep Archive, Archive Storage<\/p>","fixed":false},{"id":"storage-4","c":"storage","q":"<p>A web application serves static content (images, CSS, JS) to global users. The content is stored in S3. What is the BEST way to improve performance and reduce latency?<\/p>","o":["Enable S3 Transfer Acceleration","Use CloudFront with S3 as origin","Enable S3 Cross-Region Replication","Use S3 Standard storage class"],"a":[1],"x":"<ul>\n<li><strong>CloudFront<\/strong> is AWS's CDN (Content Delivery Network)<\/li>\n<li>Caches content at 400+ edge locations globally<\/li>\n<li>Reduces latency for users worldwide<\/li>\n<li>Reduces load on origin S3 bucket<\/li>\n<\/ul>\n<p><strong>CloudFront Benefits<\/strong>:\n- Low latency (content served from nearest edge)\n- High transfer speeds\n- DDoS protection (AWS Shield)\n- SSL/TLS support\n- Reduced S3 data transfer costs<\/p>\n<p><strong>Other Options<\/strong>:\n- <strong>Transfer Acceleration<\/strong>: Speeds up uploads to S3, not downloads\n- <strong>Cross-Region Replication<\/strong>: Multi-region redundancy, not CDN\n- <strong>Storage class<\/strong>: Doesn't affect delivery performance<\/p>\n<p><strong>References:<\/strong> Amazon CloudFront, S3 with CloudFront<\/p>","fixed":false},{"id":"storage-5","c":"storage","q":"<p>A company needs block storage for an EC2 instance running a database that requires consistent high IOPS. Which storage option should be used?<\/p>","o":["Instance Store","EBS General Purpose SSD (gp3)","EBS Provisioned IOPS SSD (io2)","Amazon EFS"],"a":[2],"x":"<ul>\n<li><strong>EBS Provisioned IOPS SSD (io2/io2 Block Express)<\/strong> for high-performance databases<\/li>\n<li>Consistent IOPS performance<\/li>\n<li>Up to 64,000 IOPS per volume (io2)<\/li>\n<li>Up to 256,000 IOPS (io2 Block Express)<\/li>\n<li>99.999% durability<\/li>\n<\/ul>\n<p><strong>EBS Volume Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Use Case<\/th>\n<th>IOPS<\/th>\n<th>Throughput<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>gp3<\/strong><\/td>\n<td>General purpose<\/td>\n<td>16,000<\/td>\n<td>1,000 MB/s<\/td>\n<\/tr>\n<tr>\n<td><strong>io2<\/strong><\/td>\n<td>High-performance databases<\/td>\n<td>64,000<\/td>\n<td>1,000 MB/s<\/td>\n<\/tr>\n<tr>\n<td><strong>io2 Block Express<\/strong><\/td>\n<td>Largest databases<\/td>\n<td>256,000<\/td>\n<td>4,000 MB/s<\/td>\n<\/tr>\n<tr>\n<td><strong>st1<\/strong><\/td>\n<td>Big data, data warehouses<\/td>\n<td>500<\/td>\n<td>500 MB/s<\/td>\n<\/tr>\n<tr>\n<td><strong>sc1<\/strong><\/td>\n<td>Cold storage<\/td>\n<td>250<\/td>\n<td>250 MB/s<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>When to Use<\/strong>:\n- <strong>io2<\/strong>: Databases needing high, consistent IOPS\n- <strong>gp3<\/strong>: Most workloads, cost-effective\n- <strong>st1<\/strong>: Throughput-intensive, sequential\n- <strong>Instance Store<\/strong>: Temporary, highest performance<\/p>\n<p><strong>References:<\/strong> EBS Volume Types, Provisioned IOPS<\/p>","fixed":false},{"id":"storage-6","c":"storage","q":"<p>An application requires shared file storage accessible from multiple EC2 instances across multiple Availability Zones using NFS protocol. Which service should be used?<\/p>","o":["Amazon EBS","Amazon S3","Amazon EFS","Instance Store"],"a":[2],"x":"<ul>\n<li><strong>Amazon EFS<\/strong> (Elastic File System) provides:<\/li>\n<li>Shared NFS file system<\/li>\n<li>Multi-AZ access<\/li>\n<li>Automatic scaling<\/li>\n<li>Linux-compatible (NFS v4)<\/li>\n<li>Concurrent access from 1000s of instances<\/li>\n<\/ul>\n<p><strong>Storage Service Comparison<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Protocol<\/th>\n<th>Multi-Instance<\/th>\n<th>Multi-AZ<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>EBS<\/strong><\/td>\n<td>Block<\/td>\n<td>No (single instance)<\/td>\n<td>No<\/td>\n<td>Databases, boot volumes<\/td>\n<\/tr>\n<tr>\n<td><strong>EFS<\/strong><\/td>\n<td>NFS<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Shared file storage<\/td>\n<\/tr>\n<tr>\n<td><strong>FSx for Windows<\/strong><\/td>\n<td>SMB<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Windows file shares<\/td>\n<\/tr>\n<tr>\n<td><strong>S3<\/strong><\/td>\n<td>HTTP/S<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Object storage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>EFS Performance Modes<\/strong>:\n- <strong>General Purpose<\/strong>: Low latency, most workloads\n- <strong>Max I/O<\/strong>: Higher latency, massive parallel access<\/p>\n<p><strong>EFS Throughput Modes<\/strong>:\n- <strong>Bursting<\/strong>: Throughput scales with size\n- <strong>Provisioned<\/strong>: Set throughput independent of size<\/p>\n<p><strong>References:<\/strong> Amazon EFS, Shared File Storage<\/p>","fixed":false},{"id":"storage-7","c":"storage","q":"<p>A company wants to automatically move S3 objects to cheaper storage classes based on access patterns. They don't want to manage this manually. What should they use?<\/p>","o":["S3 Lifecycle Policies","S3 Intelligent-Tiering","Manual scripts","AWS Lambda functions"],"a":[1],"x":"<ul>\n<li><strong>S3 Intelligent-Tiering<\/strong> automatically moves objects between tiers<\/li>\n<li>Monitors access patterns<\/li>\n<li>No retrieval fees (unlike IA classes)<\/li>\n<li>Small monthly monitoring fee per object<\/li>\n<\/ul>\n<p><strong>Intelligent-Tiering Access Tiers<\/strong>:\n1. <strong>Frequent Access<\/strong>: Default, accessed frequently\n2. <strong>Infrequent Access<\/strong>: 30 days no access\n3. <strong>Archive Instant Access<\/strong>: 90 days no access\n4. <strong>Archive Access<\/strong> (optional): 90-270 days no access\n5. <strong>Deep Archive Access<\/strong> (optional): 180-730 days no access<\/p>\n<p><strong>Intelligent-Tiering vs Lifecycle<\/strong>:\n- <strong>Intelligent-Tiering<\/strong>: Automatic based on access, no retrieval fees\n- <strong>Lifecycle<\/strong>: Rule-based transitions, set schedule<\/p>\n<p><strong>When to Use<\/strong>:\n- <strong>Intelligent-Tiering<\/strong>: Unknown or changing access patterns\n- <strong>Lifecycle<\/strong>: Known patterns (e.g., move to Glacier after 90 days)<\/p>\n<p><strong>References:<\/strong> S3 Intelligent-Tiering, Automatic Cost Optimization<\/p>","fixed":false},{"id":"storage-8","c":"storage","q":"<p>A company needs to ensure S3 objects are encrypted at rest. They want AWS to manage the encryption keys. Which encryption method should be used?<\/p>","o":["SSE-C (Customer-Provided Keys)","SSE-S3 (S3-Managed Keys)","SSE-KMS (KMS-Managed Keys)","Client-Side Encryption"],"a":[1],"x":"<ul>\n<li><strong>SSE-S3<\/strong> uses S3-managed encryption keys<\/li>\n<li>AWS handles all key management<\/li>\n<li>AES-256 encryption<\/li>\n<li>No additional cost<\/li>\n<li>Simplest encryption option<\/li>\n<\/ul>\n<p><strong>S3 Encryption Options<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Key Management<\/th>\n<th>Cost<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SSE-S3<\/strong><\/td>\n<td>AWS manages<\/td>\n<td>Free<\/td>\n<td>Simple encryption<\/td>\n<\/tr>\n<tr>\n<td><strong>SSE-KMS<\/strong><\/td>\n<td>AWS KMS<\/td>\n<td>KMS API costs<\/td>\n<td>Audit trail, key rotation<\/td>\n<\/tr>\n<tr>\n<td><strong>SSE-C<\/strong><\/td>\n<td>Customer provides<\/td>\n<td>Free<\/td>\n<td>Customer controls keys<\/td>\n<\/tr>\n<tr>\n<td><strong>Client-Side<\/strong><\/td>\n<td>Customer<\/td>\n<td>Free<\/td>\n<td>Encrypt before upload<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>SSE-KMS Benefits<\/strong> (when needed):\n- Audit trail (CloudTrail)\n- Key rotation\n- Granular permissions\n- Envelope encryption<\/p>\n<p><strong>For exam<\/strong>: If question says \"AWS manages keys, simplest\", choose SSE-S3<\/p>\n<p><strong>References:<\/strong> S3 Encryption, SSE-S3, SSE-KMS<\/p>","fixed":false},{"id":"storage-9","c":"storage","q":"<p>A company needs to replicate S3 objects from us-east-1 to eu-west-1 for disaster recovery. What feature should be enabled?<\/p>","o":["S3 Versioning","S3 Cross-Region Replication (CRR)","S3 Same-Region Replication (SRR)","S3 Transfer Acceleration"],"a":[1],"x":"<ul>\n<li><strong>S3 Cross-Region Replication (CRR)<\/strong> replicates objects across regions<\/li>\n<li>Automatic, asynchronous replication<\/li>\n<li>Requires versioning enabled on both buckets<\/li>\n<li>Use cases: Compliance, disaster recovery, latency reduction<\/li>\n<\/ul>\n<p><strong>CRR Requirements<\/strong>:\n1. Versioning enabled on source and destination\n2. Appropriate IAM permissions\n3. Different AWS regions<\/p>\n<p><strong>CRR vs SRR<\/strong>:\n- <strong>CRR<\/strong>: Different regions, disaster recovery, compliance\n- <strong>SRR<\/strong>: Same region, log aggregation, replication between accounts<\/p>\n<p><strong>Replication Options<\/strong>:\n- <strong>Replication Time Control (RTC)<\/strong>: 99.99% replicated within 15 minutes\n- <strong>Delete marker replication<\/strong>: Optional\n- <strong>Existing object replication<\/strong>: Manual batch operation<\/p>\n<p><strong>References:<\/strong> S3 Cross-Region Replication, Disaster Recovery<\/p>","fixed":false},{"id":"storage-10","c":"storage","q":"<p>An application generates temporary data that needs high-performance storage. The data can be lost if the instance stops. Which storage should be used?<\/p>","o":["EBS General Purpose SSD","EBS Provisioned IOPS SSD","Instance Store","Amazon EFS"],"a":[2],"x":"<ul>\n<li><strong>Instance Store<\/strong> provides:<\/li>\n<li>Ephemeral storage (temporary)<\/li>\n<li>Physically attached to host<\/li>\n<li>Highest IOPS performance<\/li>\n<li>No additional cost<\/li>\n<li>Data lost on instance stop/termination<\/li>\n<\/ul>\n<p><strong>Instance Store Characteristics<\/strong>:\n- <strong>Performance<\/strong>: Millions of IOPS possible\n- <strong>Persistence<\/strong>: Data lost on stop/terminate\n- <strong>Size<\/strong>: Varies by instance type\n- <strong>Use cases<\/strong>: Cache, buffers, temporary data, scratch data<\/p>\n<p><strong>Instance Store vs EBS<\/strong>:\n- <strong>Instance Store<\/strong>: Temporary, highest performance, free\n- <strong>EBS<\/strong>: Persistent, network-attached, survives stop/start<\/p>\n<p><strong>Exam Tip<\/strong>: Look for keywords:\n- \"Temporary\", \"can be lost\", \"cache\" → Instance Store\n- \"Persistent\", \"database\", \"survives restart\" → EBS<\/p>\n<p><strong>References:<\/strong> EC2 Instance Store, Ephemeral Storage<\/p>","fixed":false},{"id":"storage-11","c":"storage","q":"<p>A company wants to ensure deleted S3 objects can be recovered for 30 days. What should be enabled?<\/p>","o":["S3 Lifecycle Policies","S3 Versioning","S3 Object Lock","MFA Delete"],"a":[1],"x":"<ul>\n<li><strong>S3 Versioning<\/strong> preserves all versions of objects<\/li>\n<li>Deleted objects become delete markers (recoverable)<\/li>\n<li>Previous versions retained<\/li>\n<li>Protection against accidental deletion<\/li>\n<\/ul>\n<p><strong>S3 Versioning Features<\/strong>:\n- Stores all versions (including deleted)\n- Recover from accidental deletes\n- Recover from application failures\n- Can suspend (not disable completely)\n- Each version counted for storage costs<\/p>\n<p><strong>Related Features<\/strong>:\n- <strong>MFA Delete<\/strong>: Requires MFA to delete versions or suspend versioning\n- <strong>Object Lock<\/strong>: WORM (Write Once Read Many), compliance\n- <strong>Lifecycle<\/strong>: Transition or delete versions after time period<\/p>\n<p><strong>Best Practice<\/strong>: Enable versioning + lifecycle to delete old versions<\/p>\n<p><strong>References:<\/strong> S3 Versioning, Data Protection<\/p>","fixed":false},{"id":"storage-12","c":"storage","q":"<p>A Windows application running on EC2 needs shared file storage accessible via SMB protocol. Which service should be used?<\/p>","o":["Amazon EFS","Amazon FSx for Windows File Server","Amazon EBS","Amazon S3"],"a":[1],"x":"<ul>\n<li><strong>Amazon FSx for Windows File Server<\/strong>:<\/li>\n<li>Native Windows file system<\/li>\n<li>SMB protocol support<\/li>\n<li>Active Directory integration<\/li>\n<li>Windows NTFS features<\/li>\n<li>Multi-AZ deployment<\/li>\n<\/ul>\n<p><strong>FSx Family<\/strong>:\n- <strong>FSx for Windows<\/strong>: Windows workloads, SMB, AD\n- <strong>FSx for Lustre<\/strong>: HPC, ML, high-performance\n- <strong>FSx for NetApp ONTAP<\/strong>: Enterprise NAS, multi-protocol\n- <strong>FSx for OpenZFS<\/strong>: Linux workloads, snapshots<\/p>\n<p><strong>File Storage Options<\/strong>:\n- <strong>Windows apps<\/strong>: FSx for Windows (SMB)\n- <strong>Linux apps<\/strong>: EFS (NFS)\n- <strong>HPC/ML<\/strong>: FSx for Lustre\n- <strong>Block storage<\/strong>: EBS<\/p>\n<p><strong>References:<\/strong> Amazon FSx for Windows, SMB File Shares<\/p>","fixed":false},{"id":"storage-13","c":"storage","q":"<p>A company needs to store petabytes of data for machine learning training with the fastest possible throughput. Which storage service is MOST appropriate?<\/p>","o":["Amazon S3","Amazon EFS","Amazon FSx for Lustre","Amazon EBS"],"a":[2],"x":"<ul>\n<li><strong>FSx for Lustre<\/strong> designed for:<\/li>\n<li>High-performance computing (HPC)<\/li>\n<li>Machine learning<\/li>\n<li>Media processing<\/li>\n<li>Sub-millisecond latencies<\/li>\n<li>Hundreds of GB/s throughput<\/li>\n<li>Millions of IOPS<\/li>\n<\/ul>\n<p><strong>FSx for Lustre Features<\/strong>:\n- Integrates with S3 (lazy loading)\n- POSIX-compliant file system\n- Scratch and persistent deployment types\n- Scales to petabytes<\/p>\n<p><strong>Deployment Types<\/strong>:\n- <strong>Scratch<\/strong>: Temporary, highest performance, no replication\n- <strong>Persistent<\/strong>: Long-term, replication, automatic failover<\/p>\n<p><strong>ML/HPC Storage<\/strong>:\n- <strong>Training<\/strong>: FSx for Lustre (from S3)\n- <strong>Inference<\/strong>: EFS or S3\n- <strong>Dataset storage<\/strong>: S3\n- <strong>Processing<\/strong>: FSx for Lustre<\/p>\n<p><strong>References:<\/strong> Amazon FSx for Lustre, HPC Storage<\/p>","fixed":false},{"id":"storage-14","c":"storage","q":"<p>A company wants to move infrequently accessed EBS snapshots to cheaper storage automatically. What feature should be used?<\/p>","o":["S3 Lifecycle Policies","EBS Snapshot Archive","EBS Cold HDD volumes","Amazon Glacier"],"a":[1],"x":"<ul>\n<li><strong>EBS Snapshot Archive<\/strong> tier:<\/li>\n<li>75% cheaper than standard snapshots<\/li>\n<li>For snapshots stored 90+ days<\/li>\n<li>Restore time: 24-72 hours<\/li>\n<li>Minimum 90-day storage<\/li>\n<\/ul>\n<p><strong>EBS Snapshot Management<\/strong>:\n- <strong>Standard<\/strong>: Fast restore (minutes), higher cost\n- <strong>Archive<\/strong>: Cheaper, slower restore (24-72 hrs)\n- Automatic archival with lifecycle policies<\/p>\n<p><strong>EBS Snapshot Features<\/strong>:\n- Incremental backups (only changed blocks)\n- Stored in S3 (managed by AWS)\n- Cross-region copy available\n- Fast Snapshot Restore (FSR) for instant recovery<\/p>\n<p><strong>Use Cases<\/strong>:\n- <strong>Standard<\/strong>: Frequent restores, DR\n- <strong>Archive<\/strong>: Compliance, long-term retention<\/p>\n<p><strong>References:<\/strong> EBS Snapshots, Snapshot Archive<\/p>","fixed":false},{"id":"storage-15","c":"storage","q":"<p>An application writes data to S3 frequently. The company wants to be notified immediately when objects are created. What should be configured?<\/p>","o":["S3 Event Notifications","CloudWatch Logs","AWS Config","CloudTrail"],"a":[0],"x":"<ul>\n<li><strong>S3 Event Notifications<\/strong> trigger on bucket events<\/li>\n<li>Near real-time notifications<\/li>\n<li>Destinations: SNS, SQS, Lambda<\/li>\n<\/ul>\n<p><strong>S3 Events<\/strong>:\n- Object created (PUT, POST, COPY, CompleteMultipartUpload)\n- Object deleted\n- Object restored from Glacier\n- Replication events\n- Lifecycle transitions<\/p>\n<p><strong>Event Notification Setup<\/strong>:\n<code>json\n{\n  \"Event\": \"s3:ObjectCreated:*\",\n  \"Queue\": \"arn:aws:sqs:us-east-1:123456789012:MyQueue\"\n}<\/code><\/p>\n<p><strong>Common Patterns<\/strong>:\n- <strong>S3 → Lambda<\/strong>: Process uploaded files\n- <strong>S3 → SQS<\/strong>: Queue processing\n- <strong>S3 → SNS<\/strong>: Multi-subscriber notifications<\/p>\n<p><strong>Alternative<\/strong>: EventBridge (more advanced filtering)<\/p>\n<p><strong>References:<\/strong> S3 Event Notifications, Event-Driven Architecture<\/p>","fixed":false},{"id":"storage-16","c":"storage","q":"<p>A company needs to ensure S3 objects are never deleted or overwritten for regulatory compliance. Which feature should be used?<\/p>","o":["S3 Versioning","S3 Object Lock","MFA Delete","S3 Lifecycle Policies"],"a":[1],"x":"<ul>\n<li><strong>S3 Object Lock<\/strong> provides WORM (Write Once Read Many)<\/li>\n<li>Prevents deletion/overwrite for specified retention period<\/li>\n<li>Compliance and governance modes<\/li>\n<\/ul>\n<p><strong>Object Lock Modes<\/strong>:\n- <strong>Compliance<\/strong>: Can't be overwritten/deleted by anyone (even root)\n- <strong>Governance<\/strong>: Users with special permissions can override\n- <strong>Legal Hold<\/strong>: Indefinite protection, manually removed<\/p>\n<p><strong>Object Lock vs Versioning<\/strong>:\n- <strong>Versioning<\/strong>: Protects but versions can be deleted\n- <strong>Object Lock<\/strong>: Enforces retention, truly immutable<\/p>\n<p><strong>Requirements<\/strong>:\n- Versioning must be enabled\n- Set at bucket creation\n- Retention period or legal hold<\/p>\n<p><strong>Use Cases<\/strong>:\n- Financial records\n- Healthcare data (HIPAA)\n- Legal documents\n- Regulatory compliance<\/p>\n<p><strong>References:<\/strong> S3 Object Lock, WORM Compliance<\/p>","fixed":false},{"id":"storage-17","c":"storage","q":"<p>An application needs to upload large files (100 GB+) to S3 with optimal performance. What should be used?<\/p>","o":["Single PUT operation","S3 Multipart Upload","S3 Transfer Acceleration","AWS DataSync"],"a":[1],"x":"<ul>\n<li><strong>S3 Multipart Upload<\/strong>:<\/li>\n<li>Upload large objects in parts<\/li>\n<li>Parts uploaded in parallel (better throughput)<\/li>\n<li>Can pause/resume<\/li>\n<li>Recommended for files &gt; 100 MB<\/li>\n<li>Required for files &gt; 5 GB<\/li>\n<\/ul>\n<p><strong>Multipart Upload Benefits<\/strong>:\n- Improved throughput (parallel uploads)\n- Quick recovery from network issues\n- Pause and resume uploads\n- Upload before knowing final size<\/p>\n<p><strong>Best Practices<\/strong>:\n- Use for files &gt; 100 MB\n- Required for files &gt; 5 GB\n- Upload parts in parallel\n- Configure lifecycle to abort incomplete uploads<\/p>\n<p><strong>Transfer Acceleration<\/strong>:\n- Different feature (uses CloudFront edge locations)\n- Speeds up uploads via edge locations\n- Can combine with Multipart Upload<\/p>\n<p><strong>References:<\/strong> S3 Multipart Upload, Large File Uploads<\/p>","fixed":false},{"id":"storage-18","c":"storage","q":"<p>A company wants to access S3 from EC2 instances without using internet gateway or NAT. What should be configured?<\/p>","o":["VPN Connection","AWS Direct Connect","VPC Endpoint for S3 (Gateway Endpoint)","VPC Peering"],"a":[2],"x":"<ul>\n<li><strong>VPC Endpoint for S3<\/strong> (Gateway Endpoint):<\/li>\n<li>Private connection from VPC to S3<\/li>\n<li>No internet required<\/li>\n<li>No data transfer charges<\/li>\n<li>Traffic stays within AWS network<\/li>\n<\/ul>\n<p><strong>VPC Endpoint Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Services<\/th>\n<th>Cost<\/th>\n<th>Implementation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Gateway<\/strong><\/td>\n<td>S3, DynamoDB<\/td>\n<td>Free<\/td>\n<td>Route table entry<\/td>\n<\/tr>\n<tr>\n<td><strong>Interface<\/strong><\/td>\n<td>Most AWS services<\/td>\n<td>Hourly + data<\/td>\n<td>ENI in subnet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>S3 Endpoint Benefits<\/strong>:\n- Enhanced security (no internet exposure)\n- Better performance\n- No NAT Gateway costs\n- Control access via endpoint policies<\/p>\n<p><strong>Configuration<\/strong>:\n1. Create Gateway Endpoint for S3\n2. Select VPC and route tables\n3. Configure endpoint policy (optional)\n4. S3 traffic automatically routed<\/p>\n<p><strong>References:<\/strong> VPC Endpoints, S3 Gateway Endpoint, Private Connectivity<\/p>","fixed":false},{"id":"storage-19","c":"storage","q":"<p>A database backup is stored in S3. The company wants to ensure the backup can be restored quickly if needed. What feature should be enabled?<\/p>","o":["S3 Transfer Acceleration","S3 Versioning","S3 Cross-Region Replication","Enable S3 Retrieval directly"],"a":[1],"x":"<ul>\n<li><strong>S3 Versioning<\/strong> for backup protection:<\/li>\n<li>Immediate access to all versions<\/li>\n<li>Protect against accidental deletion/overwrite<\/li>\n<li>Quick recovery (millisecond retrieval)<\/li>\n<li>Keep multiple backup versions<\/li>\n<\/ul>\n<p><strong>Backup Best Practices<\/strong>:\n1. Enable versioning\n2. Use lifecycle policies to transition old versions\n3. Enable Cross-Region Replication for DR\n4. Tag backup objects\n5. Test restore procedures<\/p>\n<p><strong>Additional Protection<\/strong>:\n- <strong>CRR<\/strong>: Geographic redundancy\n- <strong>Object Lock<\/strong>: Immutable backups\n- <strong>MFA Delete<\/strong>: Prevent accidental deletion<\/p>\n<p><strong>Storage Class<\/strong>: Use Standard or Standard-IA for quick restore<\/p>\n<p><strong>References:<\/strong> S3 for Backups, Versioning, Backup Strategies<\/p>","fixed":false},{"id":"storage-20","c":"storage","q":"<p>A company has data in S3 Standard storage. Objects accessed within 30 days should remain in Standard, but older objects should move to S3 Glacier. How can this be automated?<\/p>","o":["S3 Intelligent-Tiering","S3 Lifecycle Policies","AWS Lambda function","Manual migration"],"a":[1],"x":"<ul>\n<li><strong>S3 Lifecycle Policies<\/strong> automate transitions and expiration<\/li>\n<li>Rule-based transitions between storage classes<\/li>\n<li>Can filter by prefix or tags<\/li>\n<li>No code required<\/li>\n<\/ul>\n<p><strong>Lifecycle Policy Example<\/strong>:\n<code>json\n{\n  \"Rules\": [\n    {\n      \"Id\": \"MoveToGlacier\",\n      \"Status\": \"Enabled\",\n      \"Transitions\": [\n        {\n          \"Days\": 30,\n          \"StorageClass\": \"GLACIER\"\n        }\n      ]\n    }\n  ]\n}<\/code><\/p>\n<p><strong>Lifecycle Actions<\/strong>:\n- <strong>Transition<\/strong>: Move to different storage class\n- <strong>Expiration<\/strong>: Delete objects\n- <strong>NoncurrentVersionTransition<\/strong>: Transition previous versions\n- <strong>NoncurrentVersionExpiration<\/strong>: Delete previous versions\n- <strong>AbortIncompleteMultipartUpload<\/strong>: Clean up incomplete uploads<\/p>\n<p><strong>Transition Rules<\/strong>:\n- Standard → Standard-IA (30 days min)\n- Standard → Glacier (0 days min)\n- Can't transition backwards (Glacier → Standard)<\/p>\n<p><strong>References:<\/strong> S3 Lifecycle Policies, Storage Class Transitions<\/p>","fixed":false},{"id":"db-1","c":"db","q":"<p>A company needs a relational database with automatic scaling, high availability across multiple AZs, and automatic failover. They want minimal database administration. Which service should be used?<\/p>","o":["Amazon RDS MySQL","Amazon Aurora","Amazon DynamoDB","Amazon Redshift"],"a":[1],"x":"<ul>\n<li><strong>Amazon Aurora<\/strong> provides:<\/li>\n<li>MySQL/PostgreSQL compatibility<\/li>\n<li>5x performance of MySQL, 3x of PostgreSQL<\/li>\n<li>Automatic scaling (storage up to 128 TB)<\/li>\n<li>Multi-AZ by design (6 copies across 3 AZs)<\/li>\n<li>Automatic failover (&lt; 30 seconds)<\/li>\n<li>Serverless option available<\/li>\n<\/ul>\n<p><strong>Aurora vs RDS<\/strong>:\n- <strong>Aurora<\/strong>: Better performance, auto-scaling storage, faster replication\n- <strong>RDS<\/strong>: Standard MySQL/PostgreSQL, simpler<\/p>\n<p><strong>Aurora Features<\/strong>:\n- Up to 15 read replicas\n- Continuous backup to S3\n- Point-in-time recovery\n- Backtrack (rewind database)<\/p>\n<p><strong>References:<\/strong> Amazon Aurora, RDS vs Aurora<\/p>","fixed":false},{"id":"db-2","c":"db","q":"<p>An application requires sub-millisecond latency for read/write operations with automatic scaling to handle millions of requests per second. Which database should be used?<\/p>","o":["Amazon RDS","Amazon DynamoDB","Amazon Aurora","Amazon DocumentDB"],"a":[1],"x":"<ul>\n<li><strong>Amazon DynamoDB<\/strong> is fully managed NoSQL database<\/li>\n<li>Single-digit millisecond latency<\/li>\n<li>Scales to 10+ trillion requests/day<\/li>\n<li>Automatic scaling<\/li>\n<li>Multi-AZ replication built-in<\/li>\n<li>Serverless opt
