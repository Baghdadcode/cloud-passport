<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Design tokens: from the Studiepass app (src/theme.ts, DESIGN.md). */
:root{
  --primary:#5A1424;--primary-dark:#2F0911;--primary-soft:#F1E4E1;--cover-hi:#7A1E33;
  --gold:#D9B45C;--gold-soft:#F0DCA6;--accent:#C99A2E;
  --bg:#EEF1E5;--surface:#F7F8F1;--paper2:#E2E8D7;--border:rgba(27,33,49,.16);
  --text:#1B2131;--muted:#4A5263;--faint:#7C8494;
  --success:#17734F;--success-soft:#E1F0E6;--danger:#BF2F2A;--danger-soft:#F8E3E0;
  --warning:#8A5300;--warning-soft:#FFF2D6;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,Consolas,monospace;
  --shadow:0 3px 12px rgba(47,9,17,.08);--lifted:0 1px 0 rgba(27,33,49,.16),0 14px 30px rgba(47,9,17,.18);
  --gutter:18px;--tabh:64px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100vh;background-image:repeating-linear-gradient(45deg,rgba(23,115,79,.025) 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,rgba(36,73,166,.025) 0 2px,transparent 2px 9px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#app{max-width:640px;margin:0 auto;padding-bottom:calc(var(--tabh) + 24px + env(safe-area-inset-bottom))}
.wrap{padding:0 var(--gutter)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.kicker{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--primary)}
.eyebrow{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:1.76px;text-transform:uppercase;color:var(--danger)}
.mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.page-head{padding:calc(22px + env(safe-area-inset-top)) var(--gutter) 6px}
.page-head h1{font-size:38px;font-weight:800;line-height:1.05;margin-top:6px}
.page-head p{color:var(--muted);margin:8px 0 0}
.section{margin:26px var(--gutter) 10px;display:flex;justify-content:space-between;align-items:baseline}
.section h2{font-size:20px;font-weight:700}

/* Cover */
.cover{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,var(--cover-hi) 0%,var(--primary) 45%,var(--primary-dark) 100%);color:var(--gold-soft);padding:calc(20px + env(safe-area-inset-top)) var(--gutter) 64px;border-radius:0 0 22px 22px}
.cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 1px,transparent 1px 6px);pointer-events:none}
.cover .kicker{color:var(--gold)}
.cover h1{font-size:38px;font-weight:800;color:var(--gold-soft);margin-top:8px;line-height:1}
.cover p{margin:8px 0 0;color:rgba(240,220,166,.8)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;position:relative;z-index:1}
.chip{border:1px solid rgba(217,180,92,.45);border-radius:12px;padding:10px 10px 9px}
.chip b{display:block;font-family:var(--display);font-size:22px;color:var(--gold-soft);line-height:1.1}
.chip span{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.chip .bar{height:3px;background:rgba(217,180,92,.25);border-radius:3px;margin-top:6px;overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--gold)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.next{margin:-44px var(--gutter) 0;position:relative;z-index:2;box-shadow:var(--lifted);border-radius:18px;padding:18px}
.next h2{font-size:25px;font-weight:800;margin:6px 0 4px}
.next p{color:var(--muted);margin:0 0 14px}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:12px;font-weight:700;font-size:16px;width:100%;transition:transform .08s,background .15s}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-dark)}
.btn.ink{background:var(--text);color:#fff}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{color:var(--primary);min-height:44px}
.btn.danger{background:var(--danger);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}

/* Visa pages */
.visas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 var(--gutter)}
.visa{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:150px}
.visa .top{display:flex;justify-content:space-between}
.visa .top span{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--faint)}
.visa h3{font-size:16px;font-weight:700;line-height:1.15}
.visa .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.bar3{height:3px;background:var(--paper2);border-radius:3px;overflow:hidden}
.bar3 i{display:block;height:100%}
.stamp{width:58px;height:58px;align-self:flex-start}
.stamp.empty{border:1.5px dashed var(--border);border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:8px;color:var(--faint);text-align:center;letter-spacing:.5px;line-height:1.2}

/* Tickets */
.ticket{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 6px 12px rgba(47,9,17,.12);overflow:hidden;margin:0 var(--gutter) 12px;text-align:left;width:calc(100% - 2*var(--gutter));position:relative}
.ticket .body{flex:1;padding:14px 14px 12px 18px;border-left:6px solid var(--tc)}
.ticket .kicker{color:var(--tc)}
.ticket h3{font-size:19px;font-weight:800;margin:4px 0 2px}
.ticket p{margin:0;color:var(--muted);font-size:14px}
.ticket .fields{display:flex;gap:16px;border-top:1.5px dashed var(--border);margin-top:10px;padding-top:8px}
.ticket .fields div{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.8px}
.ticket .fields b{display:block;font-size:13px;color:var(--text);letter-spacing:0}
.ticket .stub{width:76px;background:var(--tc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-left:2px dashed rgba(255,255,255,.5)}
.ticket .stub b{font-family:var(--display);font-size:28px;line-height:1}
.ticket .stub span{font-family:var(--mono);font-size:10px;letter-spacing:1px;margin-top:4px}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--primary);border-top:1px solid var(--primary-dark);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(240,220,166,.55);font-size:11px;font-weight:600;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--gold-soft);transform:translateY(-1px)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--gold);color:var(--primary-dark);font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}

/* Quiz */
.qhead{position:sticky;top:0;z-index:10;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) var(--gutter) 10px;border-bottom:1px solid var(--border)}
.qhead .line{display:flex;align-items:center;gap:12px}
.close{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;flex:none}
.qhead .mid{flex:1}
.timer{font-family:var(--mono);font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.timer.low{color:var(--warning);background:var(--warning-soft)}
.slots{display:flex;gap:3px;margin-top:10px}
.slots i{flex:1;height:4px;border-radius:2px;background:var(--paper2)}
.slots i.ok{background:var(--success)} .slots i.no{background:var(--danger)} .slots i.cur{background:var(--text)} .slots i.done{background:var(--muted)}
.qbody{padding:18px var(--gutter) 24px;position:relative}
.qtext{font-size:18px;line-height:1.5}
.qtext p{margin:0 0 10px}
.pick{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:var(--warning-soft);color:var(--warning);padding:3px 8px;border-radius:6px;margin-bottom:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;min-height:60px;padding:12px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);transition:border-color .15s,background .15s,opacity .15s}
.opt .l{flex:none;width:34px;height:34px;border-radius:9px;background:var(--paper2);display:grid;place-items:center;font-family:var(--mono);font-weight:700}
.opt .t{padding-top:5px}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .l{background:var(--primary);color:#fff}
.opt.right{border-color:var(--success);background:var(--success-soft)}
.opt.right .l{background:var(--success);color:#fff}
.opt.wrong{border-color:var(--danger);background:var(--danger-soft);animation:shake .35s}
.opt.wrong .l{background:var(--danger);color:#fff}
.opt.dim{opacity:.5}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.verdict{position:absolute;top:8px;right:var(--gutter);transform:rotate(-12deg);font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:2px;padding:6px 10px;border:3px double currentColor;border-radius:8px;animation:slam .25s ease-out;background:rgba(247,248,241,.7)}
.verdict.ok{color:var(--success);border-radius:50px}
.verdict.no{color:var(--danger)}
@keyframes slam{from{transform:rotate(-12deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.expl{margin-top:18px;border-left:4px solid var(--success);background:var(--surface);border-radius:0 14px 14px 0;padding:12px 14px;font-size:15px}
.expl.bad{border-color:var(--danger)}
.expl h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase}
.expl ul{padding-left:20px;margin:6px 0} .expl p{margin:6px 0}
.expl table,.lesson table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;margin:8px 0}
.expl td,.expl th,.lesson td,.lesson th{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top}
.lesson th,.expl th{background:var(--paper2)}
.foot{position:sticky;bottom:0;padding:12px var(--gutter) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:10px}
.flag.on{background:var(--warning-soft);color:var(--warning)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.grid button{height:42px;border-radius:9px;background:var(--surface);border:1px solid var(--border);font-family:var(--mono);font-size:13px;position:relative}
.grid button.ans{background:var(--text);color:#fff}
.grid button.flg::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.grid button.ok{background:var(--success);color:#fff} .grid button.no{background:var(--danger);color:#fff}

/* Results & stats */
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.ring{display:block;margin:0 auto}
.stat-rows{display:flex;flex-direction:column;gap:12px}
.srow .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.srow .top b{font-family:var(--mono);font-size:12px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px;padding:4px 8px;border-radius:6px}
.pill.ok{background:var(--success-soft);color:var(--success)} .pill.no{background:var(--danger-soft);color:var(--danger)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.list .it:last-child{border:0}
.mrz{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--muted);background:var(--paper2);padding:10px 12px;border-radius:10px;word-break:break-all;line-height:1.6;margin-top:14px}
.lesson{font-size:15px}
.lesson h2{font-size:20px;margin:22px 0 6px} .lesson h3{font-size:17px;margin:16px 0 4px}
.lesson ul{padding-left:20px} .lesson code{font-family:var(--mono);font-size:13px;background:var(--paper2);padding:1px 4px;border-radius:4px}
.lesson pre{white-space:pre-wrap;background:var(--paper2);padding:10px;border-radius:10px;font-size:12px}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.boxes div{background:var(--paper2);border-radius:10px;padding:8px 2px}
.boxes b{display:block;font-family:var(--display);font-size:20px}
.boxes span{font-family:var(--mono);font-size:9px;color:var(--faint)}
.modal{position:fixed;inset:0;background:rgba(27,33,49,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px var(--gutter) calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.note{font-size:13px;color:var(--muted)}
a{color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 20px);transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px}
@media (min-width:560px){.visas{grid-template-columns:1fr 1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>window.BANK={"chapters":[{"id":"fund","title":"AWS Fundamentals","color":"#2449A6","count":27,"lesson":"<h2>AWS Global Infrastructure<\/h2>\n<ul>\n<li><strong>Regions<\/strong>: Geographic areas, 30+ worldwide, data stays unless you move it<\/li>\n<li><strong>AZs<\/strong>: 2-6 per region, physically separated, connected by low-latency links<\/li>\n<li><strong>Edge Locations<\/strong>: 400+ for CloudFront/Route 53, content caching<\/li>\n<li><strong>Choose Region by<\/strong>: Compliance, latency, pricing, service availability<\/li>\n<\/ul>\n<h2>Management Tools<\/h2>\n<ul>\n<li><strong>Console<\/strong>: Web-based GUI<\/li>\n<li><strong>CLI<\/strong>: Command-line access, uses access keys<\/li>\n<li><strong>CloudShell<\/strong>: Browser-based shell, free<\/li>\n<li><strong>SDK<\/strong>: Programmatic access (Python/Java/Node.js)<\/li>\n<li><strong>CloudFormation<\/strong>: Infrastructure as Code (IaC)<\/li>\n<\/ul>\n<h2>Well-Architected Framework (6 Pillars)<\/h2>\n<ol>\n<li><strong>Operational Excellence<\/strong>: Run, monitor, improve systems<\/li>\n<li><strong>Security<\/strong>: Protect data, encryption, least privilege<\/li>\n<li><strong>Reliability<\/strong>: Recover from failures, auto-scaling<\/li>\n<li><strong>Performance Efficiency<\/strong>: Right resources for workload<\/li>\n<li><strong>Cost Optimization<\/strong>: Avoid unnecessary costs<\/li>\n<li><strong>Sustainability<\/strong>: Minimize environmental impact<\/li>\n<\/ol>\n<h2>Shared Responsibility Model<\/h2>\n<ul>\n<li><strong>AWS Responsible FOR the Cloud<\/strong>: Physical security, hardware, network<\/li>\n<li><strong>YOU Responsible IN the Cloud<\/strong>: Data, IAM, encryption, OS patches, firewall<\/li>\n<\/ul>\n<h2>AWS Account Management<\/h2>\n<ul>\n<li><strong>Root User<\/strong>: Email + password, enable MFA, don't use daily<\/li>\n<li><strong>Organizations<\/strong>: Centralized billing, consolidated billing, SCPs<\/li>\n<li><strong>Control Tower<\/strong>: Multi-account governance, guardrails<\/li>\n<li><strong>Service Control Policies (SCPs)<\/strong>: Restrict what accounts can do<\/li>\n<li><strong>RAM (Resource Access Manager)<\/strong>: Share resources across accounts<\/li>\n<\/ul>\n<h3>AWS Organizations - Key Points<\/h3>\n<ul>\n<li><strong>Management Account<\/strong>: Pays bills, not affected by SCPs, full control<\/li>\n<li><strong>Member Accounts<\/strong>: Subject to SCPs, inherit from OU/Org<\/li>\n<li><strong>OUs<\/strong>: Organizational Units, up to 5 levels deep<\/li>\n<li><strong>Consolidated Billing<\/strong>: Volume discounts, single payment, RI sharing<\/li>\n<\/ul>\n<h3>SCPs (Service Control Policies) - EXAM CRITICAL<\/h3>\n<ul>\n<li>❌ <strong>DON'T<\/strong> grant permissions (only restrict)<\/li>\n<li>❌ <strong>DON'T<\/strong> affect management account<\/li>\n<li>✅ <strong>DO<\/strong> set maximum permissions<\/li>\n<li>✅ <strong>DO<\/strong> override IAM in member accounts<\/li>\n<li>✅ <strong>Formula<\/strong>: Effective = IAM AND SCP<\/li>\n<\/ul>\n<p><strong>Common Uses:<\/strong>\n- Restrict regions: Deny actions outside allowed regions\n- Require encryption: Deny unencrypted EBS/S3\n- Protect logs: Deny CloudTrail deletion\n- Prevent org exit: Deny LeaveOrganization<\/p>\n<h3>Control Tower<\/h3>\n<ul>\n<li><strong>What<\/strong>: Automated multi-account setup on top of Organizations<\/li>\n<li><strong>Landing Zone<\/strong>: Well-architected baseline<\/li>\n<li><strong>Account Factory<\/strong>: Auto-create accounts<\/li>\n<li><strong>Guardrails<\/strong>: Mandatory (always on) + Optional (your choice)<\/li>\n<li><strong>Dashboard<\/strong>: Compliance visibility<\/li>\n<li><strong>Use When<\/strong>: Quick setup, less experience, want best practices<\/li>\n<\/ul>\n<h3>AWS RAM (Resource Access Manager)<\/h3>\n<ul>\n<li><strong>Share<\/strong>: VPC subnets, Transit Gateway, Route 53 rules, Aurora<\/li>\n<li><strong>Most Common<\/strong>: Share VPC subnets across accounts<\/li>\n<li><strong>Benefit<\/strong>: Centralized networking, no VPC duplication<\/li>\n<li><strong>Free<\/strong>: No charge for using RAM<\/li>\n<\/ul>\n<h2>Service Categories (Must Know)<\/h2>\n<ul>\n<li><strong>Compute<\/strong>: EC2, Lambda, ECS, EKS, Fargate, Beanstalk<\/li>\n<li><strong>Storage<\/strong>: S3, EBS, EFS, Storage Gateway<\/li>\n<li><strong>Database<\/strong>: RDS, DynamoDB, Aurora, ElastiCache, Redshift<\/li>\n<li><strong>Networking<\/strong>: VPC, Route 53, CloudFront, Direct Connect<\/li>\n<li><strong>Security<\/strong>: IAM, KMS, WAF, Shield, GuardDuty<\/li>\n<li><strong>Integration<\/strong>: SQS, SNS, EventBridge, Step Functions<\/li>\n<li><strong>Analytics<\/strong>: Athena, Kinesis, EMR, Glue, QuickSight<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>Region<\/strong> = multiple AZs (min 2)<\/li>\n<li><strong>AZ<\/strong> = one or more data centers<\/li>\n<li><strong>Edge Location<\/strong> = CloudFront caching<\/li>\n<li><strong>Free Tier<\/strong>: 12 months for most services<\/li>\n<li><strong>Support Plans<\/strong>: Basic (free), Developer ($29), Business ($100), Enterprise ($15K)<\/li>\n<li><strong>Billing<\/strong>: Use Cost Explorer, Budgets, Cost Allocation Tags<\/li>\n<\/ul>"},{"id":"iam","title":"IAM","color":"#BF2F2A","count":20,"lesson":"<h2>IAM Basics<\/h2>\n<ul>\n<li><strong>Free service<\/strong>, global (not regional)<\/li>\n<li><strong>Authentication<\/strong>: WHO (users, roles)<\/li>\n<li><strong>Authorization<\/strong>: WHAT (policies)<\/li>\n<li><strong>No default access<\/strong>: Explicit DENY by default<\/li>\n<\/ul>\n<h2>IAM Entities<\/h2>\n<h3>Users<\/h3>\n<ul>\n<li>Permanent named operator (person or app)<\/li>\n<li>Max <strong>5,000 users<\/strong> per account<\/li>\n<li>Can belong to <strong>max 10 groups<\/strong><\/li>\n<li>Access: Console password + Access Keys (CLI/SDK)<\/li>\n<\/ul>\n<h3>Groups<\/h3>\n<ul>\n<li>Collection of users<\/li>\n<li><strong>CANNOT nest groups<\/strong><\/li>\n<li>Attach policies to groups<\/li>\n<li>Users inherit group policies<\/li>\n<\/ul>\n<h3>Roles<\/h3>\n<ul>\n<li><strong>Temporary credentials<\/strong> for services/users<\/li>\n<li>No long-term credentials (no password/access keys)<\/li>\n<li><strong>AssumeRole<\/strong> to use<\/li>\n<li>Use cases: EC2 accessing S3, cross-account access<\/li>\n<\/ul>\n<h2>IAM Policies<\/h2>\n<h3>Policy Structure (JSON)<\/h3>\n<p><code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow/Deny\",\n    \"Action\": \"s3:GetObject\",\n    \"Resource\": \"arn:aws:s3:::bucket/*\",\n    \"Condition\": {}\n  }]\n}<\/code><\/p>\n<h3>Policy Types<\/h3>\n<ol>\n<li><strong>AWS Managed<\/strong>: Created/maintained by AWS, can't edit<\/li>\n<li><strong>Customer Managed<\/strong>: You create, full control, reusable<\/li>\n<li><strong>Inline<\/strong>: Direct to user/group/role, 1:1 relationship, deleted with entity<\/li>\n<\/ol>\n<h3>Policy Evaluation<\/h3>\n<ul>\n<li><strong>Explicit DENY<\/strong> always wins<\/li>\n<li><strong>Default<\/strong>: Implicit deny<\/li>\n<li>Order: Explicit Deny &gt; Explicit Allow &gt; Implicit Deny<\/li>\n<\/ul>\n<h2>Security Best Practices<\/h2>\n<ul>\n<li>✅ Enable <strong>MFA<\/strong> on root account<\/li>\n<li>✅ <strong>Never use root<\/strong> for daily tasks<\/li>\n<li>✅ Create <strong>individual IAM users<\/strong> (not shared)<\/li>\n<li>✅ Use <strong>groups<\/strong> to assign permissions<\/li>\n<li>✅ <strong>Least privilege<\/strong> principle<\/li>\n<li>✅ <strong>Rotate credentials<\/strong> regularly<\/li>\n<li>✅ Use <strong>roles<\/strong> for EC2 instances (not access keys)<\/li>\n<li>✅ Enable <strong>CloudTrail<\/strong> for audit logging<\/li>\n<\/ul>\n<h2>MFA Options<\/h2>\n<ul>\n<li><strong>Virtual MFA<\/strong>: Google Authenticator, Authy<\/li>\n<li><strong>U2F Security Key<\/strong>: YubiKey<\/li>\n<li><strong>Hardware Key Fob<\/strong>: Gemalto<\/li>\n<li><strong>Hardware Key Fob for GovCloud<\/strong>: SurePassID<\/li>\n<\/ul>\n<h2>Identity Federation<\/h2>\n<ul>\n<li><strong>SAML 2.0<\/strong>: Corporate login (AD, ADFS)<\/li>\n<li><strong>Web Identity<\/strong>: Google, Facebook, Amazon<\/li>\n<li><strong>Cognito<\/strong>: Mobile/web apps, social/enterprise identity<\/li>\n<li><strong>SSO<\/strong>: Centralized access to multiple accounts<\/li>\n<\/ul>\n<h2>IAM Credentials Report<\/h2>\n<ul>\n<li>Lists all users and credential status<\/li>\n<li><strong>Account-level<\/strong> report<\/li>\n<li>Use for <strong>compliance auditing<\/strong><\/li>\n<\/ul>\n<h2>IAM Access Advisor<\/h2>\n<ul>\n<li>Shows service permissions granted and last accessed<\/li>\n<li><strong>User-level<\/strong> data<\/li>\n<li>Use for <strong>least privilege<\/strong> implementation<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>Root user<\/strong>: Lock it, enable MFA, don't use<\/li>\n<li><strong>Roles &gt; Access Keys<\/strong>: Always use roles for EC2<\/li>\n<li><strong>Policy size limit<\/strong>: 2 KB (inline), 6 KB (managed)<\/li>\n<li><strong>Max policies per user/group/role<\/strong>: 10 managed policies<\/li>\n<li><strong>Password policy<\/strong>: Enforce complexity, rotation<\/li>\n<li><strong>Access Keys<\/strong>: Max 2 per user<\/li>\n<li><strong>Cross-account<\/strong>: Use roles, not resource-based policies (except S3, SNS, SQS)<\/li>\n<li><strong>Permission boundary<\/strong>: Max permissions user can have<\/li>\n<li><strong>SCP &gt; IAM Policy<\/strong>: SCPs restrict even admin access<\/li>\n<\/ul>"},{"id":"compute","title":"Compute","color":"#17734F","count":28,"lesson":"<h2>EC2 Instance Types (CRAMFGPDI)<\/h2>\n<ul>\n<li><strong>C<\/strong>: Compute optimized (CPU-intensive)<\/li>\n<li><strong>R<\/strong>: RAM optimized (memory databases, big data)<\/li>\n<li><strong>A<\/strong>: ARM-based (cost-effective)<\/li>\n<li><strong>M<\/strong>: Medium/General purpose (balanced)<\/li>\n<li><strong>T<\/strong>: Burstable (credits for CPU bursts)<\/li>\n<li><strong>F<\/strong>: FPGA (hardware acceleration)<\/li>\n<li><strong>G<\/strong>: GPU (graphics, ML)<\/li>\n<li><strong>P<\/strong>: GPU (parallel processing, ML)<\/li>\n<li><strong>D<\/strong>: Dense storage (data warehousing)<\/li>\n<li><strong>I<\/strong>: I/O optimized (NoSQL, databases)<\/li>\n<\/ul>\n<h2>EC2 Pricing<\/h2>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Discount<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>On-Demand<\/td>\n<td>0%<\/td>\n<td>Short, unpredictable<\/td>\n<\/tr>\n<tr>\n<td>Reserved (1-3 yr)<\/td>\n<td>Up to 72%<\/td>\n<td>Steady state<\/td>\n<\/tr>\n<tr>\n<td>Savings Plans<\/td>\n<td>Up to 66%<\/td>\n<td>Flexible commitment<\/td>\n<\/tr>\n<tr>\n<td>Spot<\/td>\n<td>Up to 90%<\/td>\n<td>Fault-tolerant, flexible<\/td>\n<\/tr>\n<tr>\n<td>Dedicated Host<\/td>\n<td>0%<\/td>\n<td>Compliance, BYOL<\/td>\n<\/tr>\n<tr>\n<td>Dedicated Instance<\/td>\n<td>0%<\/td>\n<td>Hardware isolation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>EC2 Storage<\/h2>\n<ul>\n<li><strong>Instance Store<\/strong>: Ephemeral, lost on stop/termination, high IOPS<\/li>\n<li><strong>EBS<\/strong>: Network attached, persistent, AZ-locked<\/li>\n<li><strong>EFS<\/strong>: Network file system, multi-AZ, Linux only<\/li>\n<\/ul>\n<h2>Placement Groups<\/h2>\n<ul>\n<li><strong>Cluster<\/strong>: Same AZ, low latency (10 Gbps), HPC<\/li>\n<li><strong>Spread<\/strong>: Max 7/AZ, critical apps, different hardware<\/li>\n<li><strong>Partition<\/strong>: Divide instances into partitions, Hadoop/Kafka<\/li>\n<\/ul>\n<h2>Auto Scaling<\/h2>\n<ul>\n<li><strong>Target Tracking<\/strong>: Maintain metric (e.g., CPU 50%)<\/li>\n<li><strong>Step Scaling<\/strong>: Add/remove based on CloudWatch alarms<\/li>\n<li><strong>Scheduled<\/strong>: Predictable patterns<\/li>\n<li><strong>Cooldown<\/strong>: 300 sec default (wait before next scaling)<\/li>\n<li><strong>Health Checks<\/strong>: EC2 (default) or ELB (better)<\/li>\n<\/ul>\n<h2>Load Balancers<\/h2>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Layer<\/th>\n<th>Use Case<\/th>\n<th>Features<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ALB<\/td>\n<td>7 (HTTP/HTTPS)<\/td>\n<td>Web apps<\/td>\n<td>Path/host routing, WebSocket<\/td>\n<\/tr>\n<tr>\n<td>NLB<\/td>\n<td>4 (TCP/UDP)<\/td>\n<td>High performance<\/td>\n<td>Million req/sec, static IP<\/td>\n<\/tr>\n<tr>\n<td>GLB<\/td>\n<td>3 (IP)<\/td>\n<td>Firewall/IDS<\/td>\n<td>GENEVE protocol<\/td>\n<\/tr>\n<tr>\n<td>CLB<\/td>\n<td>4 &amp; 7<\/td>\n<td>Legacy<\/td>\n<td>Deprecated<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Load Balancer Features<\/h3>\n<ul>\n<li><strong>Cross-Zone<\/strong>: Distribute evenly across all AZs (ALB: always on, NLB: off by default)<\/li>\n<li><strong>Sticky Sessions<\/strong>: Same instance for session (ALB: target group, NLB: source IP)<\/li>\n<li><strong>Connection Draining<\/strong>: Wait for in-flight requests (1-3600 sec)<\/li>\n<\/ul>\n<h2>Lambda<\/h2>\n<ul>\n<li><strong>Max execution time<\/strong>: 15 minutes<\/li>\n<li><strong>Max memory<\/strong>: 10 GB<\/li>\n<li><strong>Max deployment package<\/strong>: 50 MB (zipped), 250 MB (unzipped)<\/li>\n<li><strong>Environment variables<\/strong>: 4 KB max<\/li>\n<li><strong>Concurrency<\/strong>: 1,000 default (can increase)<\/li>\n<li><strong>Pricing<\/strong>: Requests + Duration (GB-seconds)<\/li>\n<li><strong>Free tier<\/strong>: 1M requests + 400K GB-sec/month<\/li>\n<\/ul>\n<h3>Lambda Best Practices<\/h3>\n<ul>\n<li>Reuse execution context (global variables)<\/li>\n<li>Use environment variables for config<\/li>\n<li>Use /tmp for temporary files (512 MB - 10 GB)<\/li>\n<li>Use layers for dependencies<\/li>\n<li>Enable X-Ray for tracing<\/li>\n<\/ul>\n<h2>ECS (Elastic Container Service)<\/h2>\n<ul>\n<li><strong>Launch Types<\/strong>: EC2 (manage instances) vs Fargate (serverless)<\/li>\n<li><strong>Task Definition<\/strong>: Blueprint (Docker image, CPU, memory)<\/li>\n<li><strong>Service<\/strong>: Run and maintain tasks<\/li>\n<li><strong>Cluster<\/strong>: Logical grouping<\/li>\n<li><strong>Use IAM Roles<\/strong>: Task role (app permissions) + Execution role (ECS agent)<\/li>\n<\/ul>\n<h2>EKS (Elastic Kubernetes Service)<\/h2>\n<ul>\n<li>Managed Kubernetes<\/li>\n<li><strong>Control plane<\/strong>: AWS manages<\/li>\n<li><strong>Worker nodes<\/strong>: EC2 or Fargate<\/li>\n<li><strong>Use cases<\/strong>: Complex orchestration, hybrid cloud<\/li>\n<\/ul>\n<h2>Elastic Beanstalk<\/h2>\n<ul>\n<li><strong>PaaS<\/strong>: Upload code, Beanstalk handles deployment<\/li>\n<li><strong>Free<\/strong>: Pay only for underlying resources<\/li>\n<li><strong>Supports<\/strong>: Java, .NET, PHP, Node.js, Python, Ruby, Go, Docker<\/li>\n<li><strong>Components<\/strong>: Application → Version → Environment<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>EC2<\/strong>: Use roles, not access keys<\/li>\n<li><strong>Spot<\/strong>: Can be terminated with 2-min notice<\/li>\n<li><strong>Reserved<\/strong>: 1 or 3 years, can sell unused<\/li>\n<li><strong>Auto Scaling<\/strong>: Combines with ELB for high availability<\/li>\n<li><strong>ALB<\/strong>: Layer 7, path-based routing<\/li>\n<li><strong>NLB<\/strong>: Layer 4, static IP, high performance<\/li>\n<li><strong>Lambda<\/strong>: Serverless, 15 min max<\/li>\n<li><strong>ECS Fargate<\/strong>: Serverless containers<\/li>\n<li><strong>User Data<\/strong>: Bootstrap script (runs once at launch)<\/li>\n<li><strong>AMI<\/strong>: Region-specific, must copy for other regions<\/li>\n<\/ul>"},{"id":"storage","title":"Storage","color":"#66399B","count":20,"lesson":"<h2>S3 Storage Classes<\/h2>\n<table>\n<thead>\n<tr>\n<th>Class<\/th>\n<th>Use Case<\/th>\n<th>Retrieval<\/th>\n<th>Min Storage<\/th>\n<th>Availability<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Standard<\/td>\n<td>Frequent access<\/td>\n<td>Instant<\/td>\n<td>None<\/td>\n<td>99.99%<\/td>\n<\/tr>\n<tr>\n<td>Intelligent-Tiering<\/td>\n<td>Unknown pattern<\/td>\n<td>Instant<\/td>\n<td>None<\/td>\n<td>99.9%<\/td>\n<\/tr>\n<tr>\n<td>Standard-IA<\/td>\n<td>Infrequent<\/td>\n<td>Instant<\/td>\n<td>30 days<\/td>\n<td>99.9%<\/td>\n<\/tr>\n<tr>\n<td>One Zone-IA<\/td>\n<td>Non-critical<\/td>\n<td>Instant<\/td>\n<td>30 days<\/td>\n<td>99.5%<\/td>\n<\/tr>\n<tr>\n<td>Glacier Instant<\/td>\n<td>Archive + instant<\/td>\n<td>Instant<\/td>\n<td>90 days<\/td>\n<td>99.9%<\/td>\n<\/tr>\n<tr>\n<td>Glacier Flexible<\/td>\n<td>Archive<\/td>\n<td>1-5 min to 12 hr<\/td>\n<td>90 days<\/td>\n<td>99.99%<\/td>\n<\/tr>\n<tr>\n<td>Glacier Deep Archive<\/td>\n<td>Long-term<\/td>\n<td>12-48 hours<\/td>\n<td>180 days<\/td>\n<td>99.99%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Mnemonic: S-I-S-O-G³<\/strong> (Standard, Intelligent, Standard-IA, One Zone, 3 Glaciers)<\/p>\n<h2>S3 Key Features<\/h2>\n<h3>Versioning<\/h3>\n<ul>\n<li>Keep multiple versions of objects<\/li>\n<li>Protects from accidental deletes<\/li>\n<li>Once enabled, can only <strong>suspend<\/strong> (not disable)<\/li>\n<li>Delete marker on delete (can restore)<\/li>\n<\/ul>\n<h3>Encryption<\/h3>\n<ul>\n<li><strong>SSE-S3<\/strong>: AWS managed keys (AES-256)<\/li>\n<li><strong>SSE-KMS<\/strong>: AWS KMS managed keys (audit trail)<\/li>\n<li><strong>SSE-C<\/strong>: Customer provided keys<\/li>\n<li><strong>Client-Side<\/strong>: Encrypt before upload<\/li>\n<\/ul>\n<h3>Replication<\/h3>\n<ul>\n<li><strong>CRR<\/strong>: Cross-Region (compliance, latency)<\/li>\n<li><strong>SRR<\/strong>: Same-Region (log aggregation, test/prod sync)<\/li>\n<li>Requires versioning enabled<\/li>\n<li>Only new objects replicated (existing objects need batch job)<\/li>\n<\/ul>\n<h3>Lifecycle Policies<\/h3>\n<ul>\n<li>Transition actions (move to cheaper class)<\/li>\n<li>Expiration actions (delete after X days)<\/li>\n<li>Apply to prefixes or tags<\/li>\n<\/ul>\n<h3>S3 Performance<\/h3>\n<ul>\n<li><strong>3,500 PUT/COPY/POST/DELETE<\/strong> per second per prefix<\/li>\n<li><strong>5,500 GET/HEAD<\/strong> per second per prefix<\/li>\n<li><strong>Multipart upload<\/strong>: Required &gt;5GB, recommended &gt;100MB<\/li>\n<li><strong>S3 Transfer Acceleration<\/strong>: CloudFront edge locations for upload<\/li>\n<li><strong>Byte-Range Fetches<\/strong>: Parallel downloads<\/li>\n<\/ul>\n<h2>EBS (Elastic Block Store)<\/h2>\n<h3>EBS Volume Types<\/h3>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>IOPS<\/th>\n<th>Throughput<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>gp3<\/td>\n<td>16K<\/td>\n<td>1000 MB/s<\/td>\n<td>General, cost-effective<\/td>\n<\/tr>\n<tr>\n<td>gp2<\/td>\n<td>16K<\/td>\n<td>250 MB/s<\/td>\n<td>General, burst<\/td>\n<\/tr>\n<tr>\n<td>io2/io1<\/td>\n<td>64K/256K<\/td>\n<td>4000 MB/s<\/td>\n<td>High performance DB<\/td>\n<\/tr>\n<tr>\n<td>st1<\/td>\n<td>500<\/td>\n<td>500 MB/s<\/td>\n<td>Big data, logs<\/td>\n<\/tr>\n<tr>\n<td>sc1<\/td>\n<td>250<\/td>\n<td>250 MB/s<\/td>\n<td>Cold storage<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>SSD (gp, io)<\/strong>: Small random I/O, databases<br />\n<strong>HDD (st, sc)<\/strong>: Large sequential I/O, big data<\/p>\n<h3>EBS Features<\/h3>\n<ul>\n<li><strong>AZ-locked<\/strong>: Must be in same AZ as EC2<\/li>\n<li><strong>Snapshots<\/strong>: Stored in S3, incremental, cross-region copy<\/li>\n<li><strong>Encryption<\/strong>: Uses KMS, transparent, snapshot encrypted too<\/li>\n<li><strong>Multi-Attach<\/strong>: io1/io2 only, max 16 instances (cluster)<\/li>\n<\/ul>\n<h2>EFS (Elastic File System)<\/h2>\n<ul>\n<li><strong>Network file system<\/strong> (NFS v4.1)<\/li>\n<li><strong>Multi-AZ<\/strong>, can mount to multiple EC2<\/li>\n<li><strong>Linux only<\/strong> (not Windows)<\/li>\n<li><strong>10x cost<\/strong> of gp2 EBS<\/li>\n<li><strong>Auto-scaling<\/strong>, pay per use<\/li>\n<li><strong>Performance modes<\/strong>: General Purpose, Max I/O<\/li>\n<li><strong>Throughput modes<\/strong>: Bursting, Provisioned, Elastic<\/li>\n<li><strong>Storage classes<\/strong>: Standard, IA (lifecycle policy)<\/li>\n<\/ul>\n<h2>Storage Gateway<\/h2>\n<ul>\n<li><strong>Hybrid cloud<\/strong> storage<\/li>\n<li><strong>Types<\/strong>:<\/li>\n<li><strong>File Gateway<\/strong>: S3 via NFS/SMB<\/li>\n<li><strong>Volume Gateway<\/strong>: iSCSI, cached or stored<\/li>\n<li><strong>Tape Gateway<\/strong>: Virtual tapes to S3/Glacier<\/li>\n<\/ul>\n<h2>Snow Family<\/h2>\n<ul>\n<li><strong>Snowcone<\/strong>: 8 TB, edge computing<\/li>\n<li><strong>Snowball Edge<\/strong>: 80 TB storage + compute<\/li>\n<li><strong>Snowmobile<\/strong>: 100 PB, truck<\/li>\n<li><strong>Use case<\/strong>: TB/PB data transfer, limited bandwidth<\/li>\n<\/ul>\n<h2>FSx<\/h2>\n<ul>\n<li><strong>FSx for Windows<\/strong>: Windows file server, SMB, AD integration<\/li>\n<li><strong>FSx for Lustre<\/strong>: High-performance computing, ML, 100+ GB/s<\/li>\n<li><strong>FSx for NetApp ONTAP<\/strong>: NFS, SMB, iSCSI<\/li>\n<li><strong>FSx for OpenZFS<\/strong>: NFS, up to 1M IOPS<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>S3<\/strong>: Object storage, unlimited, 5 TB max object<\/li>\n<li><strong>S3 Standard<\/strong>: 99.99% availability, 11 nines durability<\/li>\n<li><strong>Glacier<\/strong>: Minutes to hours retrieval<\/li>\n<li><strong>EBS<\/strong>: Block storage, AZ-locked, persistent<\/li>\n<li><strong>Instance Store<\/strong>: Ephemeral, lost on stop<\/li>\n<li><strong>EFS<\/strong>: Multi-AZ file system, Linux only<\/li>\n<li><strong>Lifecycle<\/strong>: Automate transitions between storage classes<\/li>\n<li><strong>Versioning<\/strong>: Protects from deletes, cannot disable once enabled<\/li>\n<li><strong>MFA Delete<\/strong>: Extra protection for versioned buckets<\/li>\n<li><strong>S3 encryption in transit<\/strong>: HTTPS (SSL/TLS)<\/li>\n<li><strong>Presigned URL<\/strong>: Temporary access (default 3600 sec)<\/li>\n<\/ul>"},{"id":"db","title":"Databases","color":"#0F6F7A","count":22,"lesson":"<h2>RDS (Relational Database Service)<\/h2>\n<h3>Supported Engines<\/h3>\n<ul>\n<li>PostgreSQL, MySQL, MariaDB, Oracle, SQL Server, <strong>Aurora<\/strong><\/li>\n<\/ul>\n<h3>Key Features<\/h3>\n<ul>\n<li><strong>Automated backups<\/strong>: 1-35 days (default 7), PITR<\/li>\n<li><strong>Manual snapshots<\/strong>: Retained forever<\/li>\n<li><strong>Multi-AZ<\/strong>: Synchronous replication, <strong>disaster recovery<\/strong> (not read scaling)<\/li>\n<li><strong>Read Replicas<\/strong>: Asynchronous, <strong>read scaling<\/strong>, max <strong>15<\/strong><\/li>\n<li><strong>Storage Auto Scaling<\/strong>: Auto-increase when low<\/li>\n<\/ul>\n<h3>Multi-AZ vs Read Replicas<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Multi-AZ<\/th>\n<th>Read Replica<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Purpose<\/td>\n<td>High availability<\/td>\n<td>Read scaling<\/td>\n<\/tr>\n<tr>\n<td>Replication<\/td>\n<td>Synchronous<\/td>\n<td>Asynchronous<\/td>\n<\/tr>\n<tr>\n<td>Failover<\/td>\n<td>Automatic<\/td>\n<td>Manual promotion<\/td>\n<\/tr>\n<tr>\n<td>Same Region<\/td>\n<td>Yes<\/td>\n<td>Can be cross-region<\/td>\n<\/tr>\n<tr>\n<td>Endpoint<\/td>\n<td>Single DNS<\/td>\n<td>Separate DNS<\/td>\n<\/tr>\n<tr>\n<td>Standby Readable<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>RDS Backups<\/h3>\n<ul>\n<li><strong>Automated<\/strong>: Daily full + transaction logs every 5 min<\/li>\n<li><strong>Deleted with instance<\/strong> (can retain)<\/li>\n<li><strong>Manual snapshots<\/strong>: User-triggered, kept forever<\/li>\n<\/ul>\n<h2>Aurora<\/h2>\n<h3>Aurora Features<\/h3>\n<ul>\n<li><strong>AWS proprietary<\/strong> (MySQL/PostgreSQL compatible)<\/li>\n<li><strong>5x MySQL, 3x PostgreSQL<\/strong> performance<\/li>\n<li><strong>Storage<\/strong>: 10 GB → 128 TB (auto-grows in 10 GB increments)<\/li>\n<li><strong>6 copies<\/strong> across 3 AZs (4/6 write quorum, 3/6 read quorum)<\/li>\n<li><strong>Self-healing<\/strong> (peer-to-peer replication)<\/li>\n<li><strong>Auto-failover<\/strong> &lt;30 seconds<\/li>\n<li><strong>15 read replicas<\/strong> (MySQL has max 5)<\/li>\n<\/ul>\n<h3>Aurora Endpoints<\/h3>\n<ul>\n<li><strong>Writer Endpoint<\/strong>: Points to master (read/write)<\/li>\n<li><strong>Reader Endpoint<\/strong>: Load balancing across read replicas<\/li>\n<li><strong>Custom Endpoint<\/strong>: Subset of instances<\/li>\n<\/ul>\n<h3>Aurora Serverless<\/h3>\n<ul>\n<li><strong>Auto-scaling<\/strong> based on load<\/li>\n<li><strong>Pay per second<\/strong> used<\/li>\n<li><strong>Use case<\/strong>: Infrequent, unpredictable workloads<\/li>\n<\/ul>\n<h3>Aurora Global Database<\/h3>\n<ul>\n<li><strong>1 primary region<\/strong> (read/write)<\/li>\n<li><strong>Up to 10 secondary regions<\/strong> (read-only) <em>(2025: was 5)<\/em><\/li>\n<li><strong>&lt;1 second<\/strong> replication lag<\/li>\n<li><strong>RTO &lt;1 minute<\/strong> for disaster recovery<\/li>\n<\/ul>\n<h2>DynamoDB<\/h2>\n<h3>DynamoDB Basics<\/h3>\n<ul>\n<li><strong>NoSQL<\/strong> key-value and document database<\/li>\n<li><strong>Single-digit millisecond<\/strong> latency<\/li>\n<li><strong>Serverless<\/strong>, fully managed<\/li>\n<li><strong>Max item size<\/strong>: 400 KB<\/li>\n<li><strong>Auto-scaling<\/strong> capacity<\/li>\n<\/ul>\n<h3>Primary Keys<\/h3>\n<ul>\n<li><strong>Partition Key<\/strong>: Hash, unique identifier<\/li>\n<li><strong>Partition Key + Sort Key<\/strong>: Composite, flexible queries<\/li>\n<\/ul>\n<h3>Read/Write Capacity<\/h3>\n<ul>\n<li><strong>Provisioned<\/strong>: Set RCU/WCU (cheaper, predictable)<\/li>\n<li><strong>On-Demand<\/strong>: Pay per request (unpredictable workload)<\/li>\n<li><strong>1 WCU<\/strong> = 1 KB/sec write<\/li>\n<li><strong>1 RCU<\/strong> = 4 KB/sec strongly consistent (or 8 KB/sec eventually consistent)<\/li>\n<\/ul>\n<h3>DynamoDB Features<\/h3>\n<ul>\n<li><strong>Global Tables<\/strong>: Multi-region, multi-active, &lt;1 sec replication<\/li>\n<li><strong>DynamoDB Streams<\/strong>: Ordered stream of item changes (24 hr retention)<\/li>\n<li><strong>TTL<\/strong>: Auto-delete expired items<\/li>\n<li><strong>DAX<\/strong>: In-memory cache, microsecond latency<\/li>\n<li><strong>Backup<\/strong>: On-demand or PITR (35 days)<\/li>\n<\/ul>\n<h3>DynamoDB Indexes<\/h3>\n<ul>\n<li><strong>Local Secondary Index (LSI)<\/strong>: Same partition key, different sort key, <strong>max 5<\/strong>, <strong>must create with table<\/strong><\/li>\n<li><strong>Global Secondary Index (GSI)<\/strong>: Different partition/sort key, <strong>max 20<\/strong>, can create anytime<\/li>\n<\/ul>\n<h2>ElastiCache<\/h2>\n<h3>ElastiCache Engines<\/h3>\n<ul>\n<li><strong>Redis<\/strong>: Persistence, backup/restore, multi-AZ, read replicas, pub/sub<\/li>\n<li><strong>Memcached<\/strong>: Simple, multi-threaded, no persistence<\/li>\n<\/ul>\n<h3>Caching Strategies<\/h3>\n<ul>\n<li><strong>Lazy Loading<\/strong>: Cache on read miss (stale data possible)<\/li>\n<li><strong>Write-Through<\/strong>: Write to cache when DB updated (no stale data)<\/li>\n<li><strong>TTL<\/strong>: Add expiration to cache items<\/li>\n<\/ul>\n<h3>Redis vs Memcached<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Redis<\/th>\n<th>Memcached<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Persistence<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>Backup<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>Multi-AZ<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>Read Replicas<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>Pub/Sub<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>Multi-threaded<\/td>\n<td>❌<\/td>\n<td>✅<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Redshift<\/h2>\n<ul>\n<li><strong>Data warehouse<\/strong> (OLAP, analytics)<\/li>\n<li><strong>Columnar<\/strong> storage, parallel query execution<\/li>\n<li><strong>Petabyte-scale<\/strong><\/li>\n<li><strong>Not for OLTP<\/strong> (use RDS/Aurora)<\/li>\n<li><strong>Redshift Spectrum<\/strong>: Query S3 directly<\/li>\n<\/ul>\n<h2>DocumentDB<\/h2>\n<ul>\n<li><strong>MongoDB compatible<\/strong><\/li>\n<li>Fully managed, HA<\/li>\n<li>Replicates 6 copies across 3 AZs<\/li>\n<\/ul>\n<h2>Neptune<\/h2>\n<ul>\n<li><strong>Graph database<\/strong><\/li>\n<li>Social networks, fraud detection<\/li>\n<li>Knowledge graphs<\/li>\n<\/ul>\n<h2>QLDB (Quantum Ledger Database)<\/h2>\n<ul>\n<li><strong>Immutable<\/strong> ledger<\/li>\n<li>Cryptographically verifiable<\/li>\n<li>Financial transactions, supply chain<\/li>\n<\/ul>\n<h2>Timestream<\/h2>\n<ul>\n<li><strong>Time-series<\/strong> database<\/li>\n<li>IoT, operational metrics<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>Multi-AZ<\/strong>: Disaster recovery, not read scaling<\/li>\n<li><strong>Read Replicas<\/strong>: Read scaling, can be cross-region<\/li>\n<li><strong>Aurora<\/strong>: Best performance, AWS proprietary<\/li>\n<li><strong>DynamoDB<\/strong>: NoSQL, single-digit ms latency<\/li>\n<li><strong>ElastiCache<\/strong>: Sub-millisecond latency<\/li>\n<li><strong>Redis<\/strong>: Advanced features, persistence<\/li>\n<li><strong>Memcached<\/strong>: Simple, multi-threaded<\/li>\n<li><strong>Redshift<\/strong>: Data warehouse, analytics<\/li>\n<li><strong>Encryption at rest<\/strong>: Available for all databases<\/li>\n<li><strong>Automated backups<\/strong>: RDS 1-35 days<\/li>\n<\/ul>"},{"id":"net","title":"Networking","color":"#2449A6","count":20,"lesson":"<h2>VPC Basics<\/h2>\n<ul>\n<li><strong>Regional<\/strong> resource (spans all AZs)<\/li>\n<li><strong>Max 5 VPCs<\/strong> per region (soft limit)<\/li>\n<li><strong>CIDR range<\/strong>: /16 to /28<\/li>\n<li><strong>AWS reserves 5 IPs<\/strong> per subnet (first 4 + last 1)<\/li>\n<\/ul>\n<h3>Private IP Ranges<\/h3>\n<ul>\n<li><code>10.0.0.0/8<\/code> → 10.0.0.0 to 10.255.255.255<\/li>\n<li><code>172.16.0.0/12<\/code> → 172.16.0.0 to 172.31.255.255<\/li>\n<li><code>192.168.0.0/16<\/code> → 192.168.0.0 to 192.168.255.255<\/li>\n<\/ul>\n<h2>VPC Components<\/h2>\n<h3>Subnets<\/h3>\n<ul>\n<li><strong>AZ-specific<\/strong> (one subnet = one AZ)<\/li>\n<li><strong>Public<\/strong>: Has route to Internet Gateway<\/li>\n<li><strong>Private<\/strong>: No route to internet<\/li>\n<li><strong>Reserved IPs<\/strong>: .0 (network), .1 (router), .2 (DNS), .3 (future), .255 (broadcast)<\/li>\n<\/ul>\n<h3>Internet Gateway (IGW)<\/h3>\n<ul>\n<li><strong>One per VPC<\/strong><\/li>\n<li>Enables internet access for public subnets<\/li>\n<li>Horizontally scaled, HA<\/li>\n<\/ul>\n<h3>NAT Gateway<\/h3>\n<ul>\n<li><strong>AZ-specific<\/strong> (deploy one per AZ for HA)<\/li>\n<li>Allows <strong>private<\/strong> subnets to access internet (outbound only)<\/li>\n<li><strong>Managed<\/strong> by AWS<\/li>\n<li><strong>NAT Instance<\/strong>: EC2-based, cheaper, you manage<\/li>\n<\/ul>\n<h3>Route Tables<\/h3>\n<ul>\n<li>Controls routing for subnets<\/li>\n<li><strong>Main route table<\/strong>: Default for VPC<\/li>\n<li><strong>Custom route tables<\/strong>: Explicit associations<\/li>\n<li><strong>Most specific route wins<\/strong><\/li>\n<\/ul>\n<h2>Security<\/h2>\n<h3>Security Groups (SG)<\/h3>\n<ul>\n<li><strong>Stateful<\/strong>: Return traffic auto-allowed<\/li>\n<li><strong>Allow rules only<\/strong> (no deny)<\/li>\n<li><strong>Instance level<\/strong><\/li>\n<li>Default: All outbound allowed, all inbound denied<\/li>\n<li>Can reference other SGs<\/li>\n<\/ul>\n<h3>Network ACL (NACL)<\/h3>\n<ul>\n<li><strong>Stateless<\/strong>: Must allow both directions<\/li>\n<li><strong>Allow AND deny rules<\/strong><\/li>\n<li><strong>Subnet level<\/strong><\/li>\n<li>Rules numbered, evaluated in order (lowest first)<\/li>\n<li>Default NACL: Allow all in/out<\/li>\n<li>Custom NACL: Deny all in/out<\/li>\n<\/ul>\n<h3>SG vs NACL<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Security Group<\/th>\n<th>NACL<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Level<\/td>\n<td>Instance<\/td>\n<td>Subnet<\/td>\n<\/tr>\n<tr>\n<td>State<\/td>\n<td>Stateful<\/td>\n<td>Stateless<\/td>\n<\/tr>\n<tr>\n<td>Rules<\/td>\n<td>Allow only<\/td>\n<td>Allow + Deny<\/td>\n<\/tr>\n<tr>\n<td>Order<\/td>\n<td>All evaluated<\/td>\n<td>Number order<\/td>\n<\/tr>\n<tr>\n<td>Applies<\/td>\n<td>Explicit association<\/td>\n<td>All in subnet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>VPC Connectivity<\/h2>\n<h3>VPC Peering<\/h3>\n<ul>\n<li><strong>Connect 2 VPCs<\/strong> (same or cross-region)<\/li>\n<li><strong>Not transitive<\/strong> (A-B, B-C ≠ A-C)<\/li>\n<li><strong>No overlapping CIDR<\/strong><\/li>\n<li>Update route tables<\/li>\n<\/ul>\n<h3>VPC Endpoints<\/h3>\n<ul>\n<li><strong>Private connection<\/strong> to AWS services (no IGW/NAT)<\/li>\n<li><strong>Gateway Endpoint<\/strong>: S3, DynamoDB (free, route table)<\/li>\n<li><strong>Interface Endpoint<\/strong>: Everything else (PrivateLink, ENI, $)<\/li>\n<\/ul>\n<h3>Transit Gateway<\/h3>\n<ul>\n<li><strong>Hub-and-spoke<\/strong> network topology<\/li>\n<li>Connect thousands of VPCs<\/li>\n<li><strong>Transitive<\/strong> routing<\/li>\n<li>Works with Direct Connect, VPN<\/li>\n<\/ul>\n<h3>VPN<\/h3>\n<ul>\n<li><strong>Site-to-Site VPN<\/strong>: On-premises to AWS<\/li>\n<li><strong>Virtual Private Gateway<\/strong>: VPN endpoint on AWS side<\/li>\n<li><strong>Customer Gateway<\/strong>: VPN device on customer side<\/li>\n<li><strong>Encrypted<\/strong> traffic over internet<\/li>\n<\/ul>\n<h3>Direct Connect<\/h3>\n<ul>\n<li><strong>Dedicated private connection<\/strong> (not internet)<\/li>\n<li>Consistent network, reduced costs<\/li>\n<li>1 Gbps or 10 Gbps<\/li>\n<li>Setup takes <strong>weeks/months<\/strong><\/li>\n<\/ul>\n<h2>Route 53<\/h2>\n<h3>Routing Policies<\/h3>\n<ol>\n<li><strong>Simple<\/strong>: Single resource, no health checks<\/li>\n<li><strong>Weighted<\/strong>: % traffic to different resources (A/B testing)<\/li>\n<li><strong>Latency<\/strong>: Lowest latency region<\/li>\n<li><strong>Failover<\/strong>: Primary/secondary (DR)<\/li>\n<li><strong>Geolocation<\/strong>: Based on user location<\/li>\n<li><strong>Geoproximity<\/strong>: Based on resource location (bias)<\/li>\n<li><strong>Multi-value<\/strong>: Up to 8 healthy records (simple with health checks)<\/li>\n<\/ol>\n<h3>Health Checks<\/h3>\n<ul>\n<li>Monitor endpoints (HTTP, HTTPS, TCP)<\/li>\n<li><strong>Interval<\/strong>: 30 sec (standard) or 10 sec (fast)<\/li>\n<li><strong>Threshold<\/strong>: Default 3 consecutive checks<\/li>\n<li>Can monitor <strong>CloudWatch alarms<\/strong><\/li>\n<\/ul>\n<h3>Record Types<\/h3>\n<ul>\n<li><strong>A<\/strong>: IPv4 address<\/li>\n<li><strong>AAAA<\/strong>: IPv6 address<\/li>\n<li><strong>CNAME<\/strong>: Alias to another domain (not root)<\/li>\n<li><strong>Alias<\/strong>: AWS resource (can use for root domain)<\/li>\n<\/ul>\n<h2>CloudFront<\/h2>\n<ul>\n<li><strong>CDN<\/strong> (Content Delivery Network)<\/li>\n<li><strong>400+ edge locations<\/strong><\/li>\n<li>Cache content closer to users<\/li>\n<li><strong>Origins<\/strong>: S3, ALB, EC2, custom HTTP<\/li>\n<li><strong>TTL<\/strong>: Default 24 hours<\/li>\n<li><strong>Geo-restriction<\/strong>: Whitelist/blacklist countries<\/li>\n<li><strong>Signed URLs/Cookies<\/strong>: Restrict access<\/li>\n<li><strong>OAI (Origin Access Identity)<\/strong>: S3 bucket access only via CloudFront<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>VPC<\/strong>: Regional, max 5 per region<\/li>\n<li><strong>Subnet<\/strong>: AZ-specific, 5 IPs reserved<\/li>\n<li><strong>IGW<\/strong>: One per VPC, public internet access<\/li>\n<li><strong>NAT Gateway<\/strong>: Private to internet (outbound)<\/li>\n<li><strong>Security Group<\/strong>: Stateful, allow only<\/li>\n<li><strong>NACL<\/strong>: Stateless, allow + deny, subnet level<\/li>\n<li><strong>VPC Peering<\/strong>: Not transitive<\/li>\n<li><strong>Transit Gateway<\/strong>: Transitive, hub-and-spoke<\/li>\n<li><strong>VPN<\/strong>: Encrypted over internet<\/li>\n<li><strong>Direct Connect<\/strong>: Dedicated private link<\/li>\n<li><strong>Route 53<\/strong>: DNS, 7 routing policies<\/li>\n<li><strong>CloudFront<\/strong>: CDN, 400+ edge locations<\/li>\n<li><strong>Endpoint<\/strong>: Private connection to AWS services<\/li>\n<\/ul>"},{"id":"sec","title":"Security","color":"#5A1424","count":25,"lesson":"<h2>KMS (Key Management Service)<\/h2>\n<h3>KMS Basics<\/h3>\n<ul>\n<li><strong>Managed encryption<\/strong> service<\/li>\n<li><strong>Regional<\/strong> service<\/li>\n<li><strong>FIPS 140-3 Level 3<\/strong> validated (upgraded from Level 2 in 2023)<\/li>\n<li>Audit with CloudTrail<\/li>\n<li><strong>$1/month<\/strong> per customer managed key<\/li>\n<\/ul>\n<h3>Key Types<\/h3>\n<ul>\n<li><strong>Symmetric (AES-256)<\/strong>: Single key, never see key, most common<\/li>\n<li><strong>Asymmetric (RSA/ECC)<\/strong>: Public/private key pair, download public key<\/li>\n<\/ul>\n<h3>KMS Keys<\/h3>\n<ul>\n<li><strong>AWS Managed<\/strong>: Free, auto-rotate yearly, <code>aws/service-name<\/code><\/li>\n<li><strong>Customer Managed<\/strong>: $1/month, optional auto-rotate, full control<\/li>\n<li><strong>AWS Owned<\/strong>: Free, used by AWS services, no visibility<\/li>\n<\/ul>\n<h3>KMS Operations<\/h3>\n<ul>\n<li><strong>Encrypt<\/strong>: &lt;4 KB data<\/li>\n<li><strong>Decrypt<\/strong>: Decrypt ciphertext<\/li>\n<li><strong>GenerateDataKey<\/strong>: For envelope encryption (&gt;4 KB)<\/li>\n<li><strong>Key Policies<\/strong>: Control access (must exist, default allows root)<\/li>\n<\/ul>\n<h3>Envelope Encryption<\/h3>\n<ol>\n<li>KMS generates Data Encryption Key (DEK)<\/li>\n<li>Encrypt data with DEK<\/li>\n<li>Encrypt DEK with KMS key<\/li>\n<li>Store encrypted data + encrypted DEK<\/li>\n<\/ol>\n<h2>Secrets Manager<\/h2>\n<ul>\n<li>Store <strong>secrets<\/strong> (passwords, API keys)<\/li>\n<li><strong>Auto-rotation<\/strong> (Lambda function)<\/li>\n<li>Integration with RDS (auto-rotate DB passwords)<\/li>\n<li><strong>$0.40/secret/month + $0.05/10K API calls<\/strong><\/li>\n<\/ul>\n<h3>Secrets Manager vs Parameter Store<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Secrets Manager<\/th>\n<th>Parameter Store<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Auto-rotation<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>RDS integration<\/td>\n<td>✅<\/td>\n<td>❌<\/td>\n<\/tr>\n<tr>\n<td>Cost<\/td>\n<td>$0.40/secret<\/td>\n<td>Free (standard)<\/td>\n<\/tr>\n<tr>\n<td>Max size<\/td>\n<td>65 KB<\/td>\n<td>4 KB (standard), 8 KB (advanced)<\/td>\n<\/tr>\n<tr>\n<td>Use case<\/td>\n<td>Secrets with rotation<\/td>\n<td>Config, parameters<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Parameter Store<\/h2>\n<ul>\n<li>Store <strong>configuration<\/strong> and secrets<\/li>\n<li><strong>Free<\/strong> (standard tier)<\/li>\n<li><strong>Hierarchical<\/strong> structure<\/li>\n<li><strong>Integration<\/strong> with CloudFormation, Lambda<\/li>\n<li><strong>SecureString<\/strong>: Encrypted with KMS<\/li>\n<\/ul>\n<h2>CloudHSM<\/h2>\n<ul>\n<li><strong>FIPS 140-3 Level 3<\/strong> (same level as KMS now — key difference is single-tenancy)<\/li>\n<li><strong>Dedicated hardware<\/strong> (not multi-tenant)<\/li>\n<li><strong>You manage keys<\/strong> (AWS manages hardware)<\/li>\n<li><strong>Single-tenant<\/strong>, deployed in VPC<\/li>\n<li><strong>Use case<\/strong>: Regulatory compliance requiring Level 3<\/li>\n<\/ul>\n<h2>Certificate Manager (ACM)<\/h2>\n<ul>\n<li>Provision, manage, deploy <strong>SSL/TLS certificates<\/strong><\/li>\n<li><strong>Free<\/strong> for AWS services<\/li>\n<li><strong>Auto-renewal<\/strong><\/li>\n<li>Works with: ALB, NLB, CloudFront, API Gateway<\/li>\n<li><strong>Cannot export<\/strong> public certificates (private certificates can)<\/li>\n<\/ul>\n<h2>WAF (Web Application Firewall)<\/h2>\n<ul>\n<li>Protect against <strong>web exploits<\/strong> (Layer 7)<\/li>\n<li><strong>Rules<\/strong>: IP addresses, HTTP headers, body, URI strings<\/li>\n<li><strong>Rate-based rules<\/strong>: DDoS protection<\/li>\n<li><strong>Deploy on<\/strong>: ALB, API Gateway, CloudFront, AppSync<\/li>\n<li><strong>Web ACL<\/strong>: Collection of rules<\/li>\n<\/ul>\n<h3>WAF Rule Types<\/h3>\n<ul>\n<li><strong>IP Set<\/strong>: Block/allow IPs<\/li>\n<li><strong>Geo Match<\/strong>: Block countries<\/li>\n<li><strong>Size Constraint<\/strong>: Request size<\/li>\n<li><strong>SQL Injection<\/strong>: Detect SQL injection<\/li>\n<li><strong>XSS<\/strong>: Cross-site scripting<\/li>\n<li><strong>Rate-based<\/strong>: Limit requests (e.g., 2000/5 min)<\/li>\n<\/ul>\n<h2>Shield<\/h2>\n<ul>\n<li><strong>DDoS protection<\/strong><\/li>\n<li><strong>Shield Standard<\/strong>: Free, automatic, network/transport layer<\/li>\n<li><strong>Shield Advanced<\/strong>: $3K/month, enhanced protection, DDoS response team, cost protection<\/li>\n<\/ul>\n<h2>GuardDuty<\/h2>\n<ul>\n<li><strong>Threat detection<\/strong> using ML<\/li>\n<li>Analyzes: CloudTrail, VPC Flow Logs, DNS logs<\/li>\n<li><strong>Findings<\/strong>: Unusual API calls, compromised instances, reconnaissance<\/li>\n<li><strong>30-day free trial<\/strong><\/li>\n<li>Can trigger Lambda/SNS for automated response<\/li>\n<\/ul>\n<h2>Inspector<\/h2>\n<ul>\n<li><strong>Automated security assessment<\/strong><\/li>\n<li><strong>EC2<\/strong>: Network + host assessments (agent required)<\/li>\n<li><strong>ECR<\/strong>: Container image scanning<\/li>\n<li><strong>Lambda<\/strong>: Code and dependencies<\/li>\n<li>Findings with severity, remediation<\/li>\n<\/ul>\n<h2>Macie<\/h2>\n<ul>\n<li><strong>Data security<\/strong> service using ML<\/li>\n<li>Discover and protect <strong>sensitive data<\/strong> in S3 (PII, credentials)<\/li>\n<li><strong>Findings<\/strong>: Sensitive data detected<\/li>\n<li>Integration with EventBridge for automation<\/li>\n<\/ul>\n<h2>Config<\/h2>\n<ul>\n<li><strong>Audit and compliance<\/strong> of AWS resources<\/li>\n<li>Record <strong>configuration changes<\/strong> over time<\/li>\n<li><strong>Rules<\/strong>: Evaluate compliance (AWS managed or custom)<\/li>\n<li><strong>Remediation<\/strong>: Auto-fix non-compliant resources (SSM Automation)<\/li>\n<li><strong>Not free<\/strong>: Pay per config item + rule evaluation<\/li>\n<\/ul>\n<h2>CloudTrail<\/h2>\n<ul>\n<li><strong>API audit logging<\/strong><\/li>\n<li><strong>Who, what, when, where<\/strong> (user, action, time, IP)<\/li>\n<li><strong>90 days<\/strong> in Event History (free)<\/li>\n<li><strong>Long-term<\/strong>: Send to S3 or CloudWatch Logs<\/li>\n<li><strong>Management events<\/strong>: Free (control plane)<\/li>\n<li><strong>Data events<\/strong>: Paid (data plane, e.g., S3 GetObject)<\/li>\n<li><strong>Insights<\/strong>: Detect unusual activity<\/li>\n<\/ul>\n<h3>CloudTrail vs CloudWatch vs Config<\/h3>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CloudTrail<\/td>\n<td>WHO did WHAT (API calls)<\/td>\n<\/tr>\n<tr>\n<td>CloudWatch<\/td>\n<td>Performance metrics, logs<\/td>\n<\/tr>\n<tr>\n<td>Config<\/td>\n<td>Resource configuration changes, compliance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Detective<\/h2>\n<ul>\n<li><strong>Security investigation<\/strong> using ML<\/li>\n<li>Analyze and visualize security data<\/li>\n<li>Root cause analysis<\/li>\n<li>Uses: VPC Flow Logs, CloudTrail, GuardDuty<\/li>\n<\/ul>\n<h2>Security Hub<\/h2>\n<ul>\n<li><strong>Central security dashboard<\/strong><\/li>\n<li>Aggregates findings from GuardDuty, Inspector, Macie, etc.<\/li>\n<li><strong>Compliance checks<\/strong>: CIS, PCI-DSS<\/li>\n<li>Automated remediation with EventBridge<\/li>\n<\/ul>\n<h2>Firewall Manager<\/h2>\n<ul>\n<li><strong>Centrally manage firewall rules<\/strong> across accounts<\/li>\n<li>Works with: WAF, Shield Advanced, Security Groups, Network Firewall<\/li>\n<li>Requires <strong>AWS Organizations<\/strong><\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>KMS<\/strong>: Regional, $1/month, &lt;4 KB encryption<\/li>\n<li><strong>Envelope Encryption<\/strong>: For &gt;4 KB data<\/li>\n<li><strong>CloudHSM<\/strong>: Level 3, dedicated hardware, single-tenant<\/li>\n<li><strong>Secrets Manager<\/strong>: Auto-rotation, $0.40/secret<\/li>\n<li><strong>Parameter Store<\/strong>: Free config storage<\/li>\n<li><strong>ACM<\/strong>: Free SSL/TLS certificates<\/li>\n<li><strong>WAF<\/strong>: Layer 7 protection, rate-based rules<\/li>\n<li><strong>Shield Standard<\/strong>: Free DDoS protection<\/li>\n<li><strong>Shield Advanced<\/strong>: $3K/month, enhanced protection<\/li>\n<li><strong>GuardDuty<\/strong>: Threat detection using ML<\/li>\n<li><strong>Inspector<\/strong>: Security assessment (EC2, ECR, Lambda)<\/li>\n<li><strong>Macie<\/strong>: Find PII/sensitive data in S3<\/li>\n<li><strong>Config<\/strong>: Compliance auditing, remediation<\/li>\n<li><strong>CloudTrail<\/strong>: API logging, 90 days free<\/li>\n<li><strong>Security Hub<\/strong>: Central security dashboard<\/li>\n<\/ul>"},{"id":"integ","title":"App Integration","color":"#17734F","count":16,"lesson":"<h2>SQS (Simple Queue Service)<\/h2>\n<h3>SQS Basics<\/h3>\n<ul>\n<li><strong>Message queue<\/strong> for decoupling<\/li>\n<li><strong>Unlimited<\/strong> throughput and messages<\/li>\n<li><strong>Retention<\/strong>: 1 min to 14 days (default 4 days)<\/li>\n<li><strong>Low latency<\/strong>: &lt;10 ms<\/li>\n<li><strong>Max message size<\/strong>: 256 KB<\/li>\n<\/ul>\n<h3>Queue Types<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Standard<\/th>\n<th>FIFO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Throughput<\/td>\n<td>Unlimited<\/td>\n<td>300 msg/s (3K with batch)<\/td>\n<\/tr>\n<tr>\n<td>Ordering<\/td>\n<td>Best-effort<\/td>\n<td>Strict order<\/td>\n<\/tr>\n<tr>\n<td>Delivery<\/td>\n<td>At-least-once<\/td>\n<td>Exactly-once<\/td>\n<\/tr>\n<tr>\n<td>Name<\/td>\n<td>Any<\/td>\n<td>Must end in <code>.fifo<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>SQS Features<\/h3>\n<ul>\n<li><strong>Visibility Timeout<\/strong>: 30 sec default (max 12 hr), message invisible after receive<\/li>\n<li><strong>Long Polling<\/strong>: Wait for messages (1-20 sec), reduce API calls<\/li>\n<li><strong>DLQ (Dead Letter Queue)<\/strong>: Send failed messages after max receives<\/li>\n<li><strong>Message Delay<\/strong>: 0-15 min (delay queue or per message)<\/li>\n<\/ul>\n<h2>SNS (Simple Notification Service)<\/h2>\n<h3>SNS Basics<\/h3>\n<ul>\n<li><strong>Pub/Sub<\/strong> messaging<\/li>\n<li><strong>1 topic<\/strong> → <strong>many subscribers<\/strong><\/li>\n<li><strong>Push-based<\/strong> (not pull)<\/li>\n<li><strong>100K topics<\/strong> per account<\/li>\n<\/ul>\n<h3>SNS Subscribers<\/h3>\n<ul>\n<li>SQS, Lambda, HTTP/HTTPS, Email, SMS, Mobile push<\/li>\n<li><strong>Kinesis Data Firehose<\/strong><\/li>\n<\/ul>\n<h3>SNS Features<\/h3>\n<ul>\n<li><strong>Fan-out<\/strong>: SNS → multiple SQS queues<\/li>\n<li><strong>Message filtering<\/strong>: Subscribers filter by attributes<\/li>\n<li><strong>Message attributes<\/strong>: Metadata (not part of body)<\/li>\n<li><strong>FIFO Topics<\/strong>: Order + deduplication (with SQS FIFO)<\/li>\n<\/ul>\n<h2>SNS + SQS Fan-out Pattern<\/h2>\n<p><code>Application → SNS Topic → [SQS Queue 1, SQS Queue 2, Lambda]<\/code>\n- <strong>Use case<\/strong>: Same message to multiple services\n- <strong>Benefits<\/strong>: Decoupling, parallel processing<\/p>\n<h2>EventBridge (CloudWatch Events)<\/h2>\n<h3>EventBridge Basics<\/h3>\n<ul>\n<li><strong>Serverless event bus<\/strong><\/li>\n<li>React to events from AWS services<\/li>\n<li><strong>Schedule<\/strong>: Cron or rate expressions<\/li>\n<li><strong>Event patterns<\/strong>: Match specific events<\/li>\n<\/ul>\n<h3>EventBridge Components<\/h3>\n<ul>\n<li><strong>Event Bus<\/strong>: Default (AWS services), partner, custom<\/li>\n<li><strong>Rules<\/strong>: Match events and route to targets<\/li>\n<li><strong>Targets<\/strong>: Lambda, SQS, SNS, Step Functions, Kinesis, etc. (20+ services)<\/li>\n<\/ul>\n<h3>EventBridge vs CloudWatch Events<\/h3>\n<ul>\n<li>EventBridge = CloudWatch Events (enhanced)<\/li>\n<li>EventBridge adds: Schema registry, partner integrations, custom buses<\/li>\n<\/ul>\n<h2>Step Functions<\/h2>\n<h3>Step Functions Basics<\/h3>\n<ul>\n<li><strong>Orchestrate workflows<\/strong> (state machines)<\/li>\n<li><strong>Visual workflow<\/strong><\/li>\n<li><strong>Serverless<\/strong><\/li>\n<li>Coordinate: Lambda, ECS, Fargate, SNS, SQS, DynamoDB, etc.<\/li>\n<\/ul>\n<h3>Workflow Types<\/h3>\n<ul>\n<li><strong>Standard<\/strong>: Max 1 year, exactly-once, audit trail<\/li>\n<li><strong>Express<\/strong>: Max 5 min, at-least-once, high-volume (IoT, streaming)<\/li>\n<\/ul>\n<h3>State Types<\/h3>\n<ul>\n<li><strong>Task<\/strong>: Do work (Lambda, activity)<\/li>\n<li><strong>Choice<\/strong>: Conditional logic<\/li>\n<li><strong>Parallel<\/strong>: Execute branches in parallel<\/li>\n<li><strong>Wait<\/strong>: Delay<\/li>\n<li><strong>Succeed/Fail<\/strong>: Terminal states<\/li>\n<li><strong>Pass<\/strong>: Pass input to output<\/li>\n<li><strong>Map<\/strong>: Iterate over items<\/li>\n<\/ul>\n<h2>SWF (Simple Workflow Service)<\/h2>\n<ul>\n<li><strong>Legacy<\/strong> (use Step Functions instead)<\/li>\n<li>Human-involved workflows<\/li>\n<li><strong>Activity workers<\/strong> and <strong>deciders<\/strong><\/li>\n<\/ul>\n<h2>AppSync<\/h2>\n<ul>\n<li><strong>Managed GraphQL<\/strong> API<\/li>\n<li>Real-time and offline data sync<\/li>\n<li><strong>Data sources<\/strong>: DynamoDB, Lambda, HTTP, RDS<\/li>\n<li><strong>Use case<\/strong>: Mobile/web apps needing real-time<\/li>\n<\/ul>\n<h2>AppFlow<\/h2>\n<ul>\n<li><strong>SaaS integration<\/strong> (no code)<\/li>\n<li>Transfer data: Salesforce, SAP, Slack → S3, Redshift<\/li>\n<li><strong>Bidirectional<\/strong>, scheduled or event-driven<\/li>\n<\/ul>\n<h2>MQ (Amazon MQ)<\/h2>\n<ul>\n<li><strong>Managed message broker<\/strong><\/li>\n<li><strong>RabbitMQ, ActiveMQ<\/strong><\/li>\n<li><strong>Use case<\/strong>: Migrate existing apps (lift-and-shift)<\/li>\n<li>If building new, use SQS/SNS instead<\/li>\n<\/ul>\n<h2>Kinesis (Data Streaming)<\/h2>\n<h3>Kinesis Data Streams<\/h3>\n<ul>\n<li><strong>Real-time<\/strong> data streaming<\/li>\n<li><strong>Shards<\/strong>: 1 MB/s or 1K records/s write, 2 MB/s read<\/li>\n<li><strong>Retention<\/strong>: 1-365 days<\/li>\n<li><strong>Consumers<\/strong>: Lambda, Kinesis Data Analytics, EC2<\/li>\n<\/ul>\n<h3>Kinesis Data Firehose<\/h3>\n<ul>\n<li><strong>Load streaming data<\/strong> to destinations<\/li>\n<li><strong>Near real-time<\/strong> (60 sec buffer)<\/li>\n<li><strong>Destinations<\/strong>: S3, Redshift, OpenSearch, Splunk, HTTP<\/li>\n<li><strong>Auto-scaling<\/strong>, no shards to manage<\/li>\n<li><strong>Transformations<\/strong>: Lambda<\/li>\n<\/ul>\n<h3>Kinesis Data Analytics<\/h3>\n<ul>\n<li><strong>SQL queries<\/strong> on streaming data<\/li>\n<li>Real-time analytics<\/li>\n<li><strong>Input<\/strong>: Kinesis Data Streams, Firehose<\/li>\n<li><strong>Output<\/strong>: S3, Redshift, OpenSearch, Streams<\/li>\n<\/ul>\n<h3>Kinesis vs SQS<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Kinesis<\/th>\n<th>SQS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Use case<\/td>\n<td>Real-time streaming<\/td>\n<td>Message queue<\/td>\n<\/tr>\n<tr>\n<td>Retention<\/td>\n<td>1-365 days<\/td>\n<td>1-14 days<\/td>\n<\/tr>\n<tr>\n<td>Consumers<\/td>\n<td>Multiple (same data)<\/td>\n<td>One per message<\/td>\n<\/tr>\n<tr>\n<td>Ordering<\/td>\n<td>Per shard<\/td>\n<td>FIFO queue<\/td>\n<\/tr>\n<tr>\n<td>Throughput<\/td>\n<td>Shard-based<\/td>\n<td>Unlimited<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>SQS<\/strong>: Decouple, queue, 256 KB max<\/li>\n<li><strong>SQS Standard<\/strong>: Unlimited throughput, at-least-once, best-effort order<\/li>\n<li><strong>SQS FIFO<\/strong>: 300 msg/s, exactly-once, strict order, name ends <code>.fifo<\/code><\/li>\n<li><strong>SNS<\/strong>: Pub/Sub, push, fan-out<\/li>\n<li><strong>SNS + SQS<\/strong>: Fan-out pattern (1 message → many queues)<\/li>\n<li><strong>EventBridge<\/strong>: Event-driven, schedule, 20+ targets<\/li>\n<li><strong>Step Functions<\/strong>: Orchestrate workflows, visual, serverless<\/li>\n<li><strong>Kinesis Streams<\/strong>: Real-time streaming, shards, multiple consumers<\/li>\n<li><strong>Kinesis Firehose<\/strong>: Load to S3/Redshift, near real-time, no shards<\/li>\n<li><strong>MQ<\/strong>: Managed RabbitMQ/ActiveMQ (legacy migrations)<\/li>\n<li><strong>AppSync<\/strong>: GraphQL API, real-time, offline sync<\/li>\n<\/ul>"},{"id":"mon","title":"Monitoring","color":"#BF2F2A","count":20,"lesson":"<h2>CloudWatch<\/h2>\n<h3>CloudWatch Metrics<\/h3>\n<ul>\n<li><strong>AWS services<\/strong>: Automatic (CPU, network, disk, status)<\/li>\n<li><strong>Default<\/strong>: 5-min intervals<\/li>\n<li><strong>Detailed monitoring<\/strong>: 1-min intervals (extra cost)<\/li>\n<li><strong>Custom metrics<\/strong>: PutMetricData API, 1-sec intervals possible<\/li>\n<li><strong>EC2 memory<\/strong>: NOT default (need CloudWatch agent)<\/li>\n<\/ul>\n<h3>CloudWatch Alarms<\/h3>\n<ul>\n<li><strong>States<\/strong>: OK, ALARM, INSUFFICIENT_DATA<\/li>\n<li><strong>Period<\/strong>: 10 sec to 1 day<\/li>\n<li><strong>Actions<\/strong>: SNS, Auto Scaling, EC2 action (stop/terminate/reboot)<\/li>\n<li><strong>Composite alarms<\/strong>: AND/OR multiple alarms<\/li>\n<\/ul>\n<h3>CloudWatch Logs<\/h3>\n<ul>\n<li><strong>Log groups<\/strong>: Collection of log streams<\/li>\n<li><strong>Log streams<\/strong>: Sequence of log events<\/li>\n<li><strong>Retention<\/strong>: 1 day to 10 years (never expire)<\/li>\n<li><strong>Subscription filters<\/strong>: Stream to Lambda, Kinesis, Firehose<\/li>\n<li><strong>Metric filters<\/strong>: Extract metrics from logs<\/li>\n<li><strong>CloudWatch Logs Insights<\/strong>: Query language for logs<\/li>\n<\/ul>\n<h3>CloudWatch Agent<\/h3>\n<ul>\n<li><strong>Collect logs and metrics<\/strong> from EC2/on-premises<\/li>\n<li><strong>Metrics<\/strong>: Memory, disk, processes, netstat<\/li>\n<li><strong>Logs<\/strong>: Application logs, system logs<\/li>\n<li><strong>Unified agent<\/strong>: Logs + metrics<\/li>\n<\/ul>\n<h3>CloudWatch Dashboards<\/h3>\n<ul>\n<li><strong>Visualize metrics<\/strong><\/li>\n<li><strong>Global<\/strong> (cross-region)<\/li>\n<li><strong>3 dashboards free<\/strong> (up to 50 metrics)<\/li>\n<li><strong>Auto-refresh<\/strong>: 1 min to 15 min<\/li>\n<\/ul>\n<h3>EventBridge (CloudWatch Events)<\/h3>\n<ul>\n<li><strong>React to events<\/strong> from AWS services<\/li>\n<li><strong>Schedule<\/strong>: Cron/rate expressions<\/li>\n<li><strong>Event pattern<\/strong>: Match specific events<\/li>\n<li><strong>Targets<\/strong>: Lambda, SQS, SNS, Step Functions, etc.<\/li>\n<\/ul>\n<h2>CloudTrail<\/h2>\n<ul>\n<li><strong>API call logging<\/strong> (governance, compliance, audit)<\/li>\n<li><strong>Who, what, when, where<\/strong>: User, action, time, IP<\/li>\n<li><strong>Event History<\/strong>: 90 days free<\/li>\n<li><strong>Trails<\/strong>: Long-term storage to S3<\/li>\n<li><strong>Management events<\/strong>: Control plane (free for trail)<\/li>\n<li><strong>Data events<\/strong>: Data plane (S3 GetObject, Lambda invoke) - paid<\/li>\n<li><strong>Insights<\/strong>: Detect unusual API activity (ML)<\/li>\n<\/ul>\n<h3>CloudTrail Use Cases<\/h3>\n<ul>\n<li>Security analysis, resource change tracking, compliance<\/li>\n<li>Troubleshooting, forensic investigation<\/li>\n<\/ul>\n<h2>AWS Config<\/h2>\n<ul>\n<li><strong>Audit resource configurations<\/strong><\/li>\n<li><strong>Record changes<\/strong> over time<\/li>\n<li><strong>Compliance<\/strong>: Evaluate against rules<\/li>\n<li><strong>Remediation<\/strong>: Auto-fix non-compliant (SSM Automation)<\/li>\n<li><strong>Not free<\/strong>: Pay per config item + rule evaluation<\/li>\n<\/ul>\n<h3>Config Components<\/h3>\n<ul>\n<li><strong>Configuration items<\/strong>: Resource configuration snapshot<\/li>\n<li><strong>Configuration history<\/strong>: Changes over time<\/li>\n<li><strong>Configuration recorder<\/strong>: Records changes<\/li>\n<li><strong>Config rules<\/strong>: Compliance evaluation (AWS managed or custom)<\/li>\n<li><strong>Conformance packs<\/strong>: Collection of rules + remediation<\/li>\n<\/ul>\n<h3>Config Use Cases<\/h3>\n<ul>\n<li>Compliance auditing, security analysis<\/li>\n<li>Change management, troubleshooting<\/li>\n<li>Example rules: S3 bucket versioning, encrypted EBS, required tags<\/li>\n<\/ul>\n<h2>CloudWatch vs CloudTrail vs Config<\/h2>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>What it monitors<\/th>\n<th>Use case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CloudWatch<\/td>\n<td>Performance metrics, logs<\/td>\n<td>Performance, alarms<\/td>\n<\/tr>\n<tr>\n<td>CloudTrail<\/td>\n<td>API calls (who did what)<\/td>\n<td>Security, audit<\/td>\n<\/tr>\n<tr>\n<td>Config<\/td>\n<td>Resource config changes<\/td>\n<td>Compliance, governance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>X-Ray<\/h2>\n<ul>\n<li><strong>Distributed tracing<\/strong><\/li>\n<li><strong>Trace requests<\/strong> across microservices<\/li>\n<li><strong>Service map<\/strong>: Visual representation<\/li>\n<li><strong>Segments<\/strong>: Work done by single component<\/li>\n<li><strong>Subsegments<\/strong>: Granular timing<\/li>\n<li><strong>Annotations<\/strong>: Indexed for filtering<\/li>\n<li><strong>Metadata<\/strong>: Not indexed<\/li>\n<li><strong>Sampling<\/strong>: Reduce cost (trace % of requests)<\/li>\n<\/ul>\n<h3>X-Ray Use Cases<\/h3>\n<ul>\n<li>Identify performance bottlenecks<\/li>\n<li>Understand dependencies<\/li>\n<li>Find errors and exceptions<\/li>\n<li>Pinpoint issues in microservices<\/li>\n<\/ul>\n<h2>Trusted Advisor<\/h2>\n<ul>\n<li><strong>Best practice recommendations<\/strong><\/li>\n<li><strong>5 categories<\/strong>: Cost optimization, performance, security, fault tolerance, service limits<\/li>\n<li><strong>Free<\/strong>: 7 core checks (Basic/Developer support)<\/li>\n<li><strong>Paid<\/strong>: All checks (Business/Enterprise support)<\/li>\n<\/ul>\n<h3>Core Checks (Free)<\/h3>\n<ul>\n<li>S3 bucket permissions<\/li>\n<li>Security groups (unrestricted ports)<\/li>\n<li>IAM use<\/li>\n<li>MFA on root<\/li>\n<li>EBS public snapshots<\/li>\n<li>RDS public snapshots<\/li>\n<li>Service limits<\/li>\n<\/ul>\n<h3>All Checks (Paid)<\/h3>\n<ul>\n<li>Full access to all recommendations<\/li>\n<li>CloudWatch integration<\/li>\n<li>Programmatic access via API<\/li>\n<\/ul>\n<h2>Systems Manager (SSM)<\/h2>\n<h3>SSM Key Features<\/h3>\n<ul>\n<li><strong>Manage EC2 and on-premises<\/strong> servers<\/li>\n<li><strong>Free<\/strong> (pay for underlying resources)<\/li>\n<li><strong>SSM Agent<\/strong>: Must be installed (pre-installed on Amazon Linux 2, Ubuntu)<\/li>\n<\/ul>\n<h3>SSM Components<\/h3>\n<p><strong>Session Manager<\/strong>\n- <strong>Secure shell access<\/strong> without SSH/bastion host\n- No inbound ports, no SSH keys\n- Audit with CloudTrail\n- Log sessions to S3 or CloudWatch<\/p>\n<p><strong>Run Command<\/strong>\n- Execute commands on multiple instances\n- Rate control, error threshold\n- Integration with IAM, CloudTrail\n- No SSH required<\/p>\n<p><strong>Patch Manager<\/strong>\n- Automate OS patching\n- Patch baselines, maintenance windows\n- Compliance reporting<\/p>\n<p><strong>Parameter Store<\/strong>\n- <strong>Secure storage<\/strong> for config/secrets\n- <strong>Free<\/strong> (standard tier)\n- <strong>Hierarchical<\/strong> structure (<code>/app/prod/db-password<\/code>)\n- <strong>Integration<\/strong>: CloudFormation, Lambda, ECS\n- <strong>SecureString<\/strong>: KMS encryption<\/p>\n<p><strong>Automation<\/strong>\n- Automate common maintenance tasks\n- Predefined runbooks\n- Integration with Lambda, EventBridge<\/p>\n<p><strong>Inventory<\/strong>\n- Collect metadata from instances\n- OS, applications, configurations\n- Query with Resource Data Sync<\/p>\n<p><strong>State Manager<\/strong>\n- Maintain desired state configuration\n- Apply configurations automatically<\/p>\n<h2>Personal Health Dashboard<\/h2>\n<ul>\n<li><strong>Alerts and guidance<\/strong> for AWS events<\/li>\n<li><strong>Proactive notifications<\/strong> for scheduled activities<\/li>\n<li><strong>Personalized<\/strong> view (not general AWS status)<\/li>\n<\/ul>\n<h2>Service Health Dashboard<\/h2>\n<ul>\n<li><strong>Public AWS service status<\/strong><\/li>\n<li><strong>General<\/strong> (not account-specific)<\/li>\n<li>Historical data<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>CloudWatch<\/strong>: Metrics, alarms, logs, dashboards<\/li>\n<li><strong>CloudWatch Agent<\/strong>: Memory metrics for EC2<\/li>\n<li><strong>CloudTrail<\/strong>: API logging, 90 days free<\/li>\n<li><strong>Config<\/strong>: Resource configuration, compliance<\/li>\n<li><strong>X-Ray<\/strong>: Distributed tracing, microservices<\/li>\n<li><strong>Trusted Advisor<\/strong>: Best practices, 7 free checks<\/li>\n<li><strong>SSM Session Manager<\/strong>: SSH without SSH/bastion<\/li>\n<li><strong>SSM Parameter Store<\/strong>: Free config storage<\/li>\n<li><strong>SSM Run Command<\/strong>: Execute on multiple instances<\/li>\n<li><strong>Personal Health Dashboard<\/strong>: Account-specific alerts<\/li>\n<li><strong>Detailed Monitoring<\/strong>: 1-min intervals (extra cost)<\/li>\n<li><strong>CloudWatch Logs retention<\/strong>: 1 day to 10 years<\/li>\n<\/ul>"},{"id":"mig","title":"Migration & Transfer","color":"#66399B","count":20,"lesson":"<ul>\n<li><strong>Transfer Family<\/strong>: SFTP/FTPS/FTP to S3/EFS<\/li>\n<li><strong>DR<\/strong>: Backup &amp; Restore (cheapest) → Multi-Site (fastest)<\/li>\n<li><strong>AWS Backup<\/strong>: Centralized, cross-service backup<\/li>\n<li><strong>Migration Hub<\/strong>: Centralized tracking (not migration)<\/li>\n<li><strong>MGN<\/strong>: Replaces SMS, continuous replication<\/li>\n<li><strong>Snowmobile<\/strong>: 10+ PB data transfer<\/li>\n<li><strong>Snow<\/strong>: &gt;10 TB data, limited bandwidth<\/li>\n<li><strong>DMS<\/strong>: Keep source operational, use SCT for heterogeneous<\/li>\n<li><strong>DataSync<\/strong>: Automated, scheduled, 10x faster<\/li>\n<li><strong>6 R's<\/strong>: Rehost (fastest), Refactor (most benefits)<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>RPO (Recovery Point Objective)<\/strong>: Acceptable data loss<\/li>\n<li><strong>RTO (Recovery Time Objective)<\/strong>: Time to recover<\/li>\n<\/ul>\n<h3>RTO vs RPO<\/h3>\n<ol start=\"4\">\n<li><strong>Multi-Site/Hot-Site<\/strong>: Full production, instant failover (real-time)<\/li>\n<li><strong>Warm Standby<\/strong>: Scaled-down version running (minutes)<\/li>\n<li><strong>Pilot Light<\/strong>: Core services running, scale up when needed (10s of minutes)<\/li>\n<li><strong>Backup &amp; Restore<\/strong>: Cheapest, slowest (hours/days)<\/li>\n<\/ol>\n<h3>DR Strategies (Cost → Recovery Time)<\/h3>\n<h2>Disaster Recovery Strategies<\/h2>\n<ul>\n<li><strong>Snapshots<\/strong>: Service-specific, manual/automated<\/li>\n<li><strong>Backup<\/strong>: Centralized, policy-based, cross-service<\/li>\n<\/ul>\n<h3>Backup vs Snapshots<\/h3>\n<ul>\n<li><strong>PITR<\/strong> (Point-in-Time Recovery)<\/li>\n<li><strong>Cross-region/account<\/strong> backup<\/li>\n<li><strong>Backup vaults<\/strong>: Organize backups<\/li>\n<li><strong>Backup plans<\/strong>: Schedules, retention, lifecycle<\/li>\n<li><strong>Supported<\/strong>: EC2, EBS, RDS, Aurora, DynamoDB, EFS, FSx, Storage Gateway<\/li>\n<li><strong>Centralized backup<\/strong> across AWS services<\/li>\n<\/ul>\n<h2>AWS Backup<\/h2>\n<ul>\n<li><strong>Supports<\/strong>: Physical, virtual, cloud servers<\/li>\n<li><strong>Minimal downtime<\/strong>, cutover window<\/li>\n<li><strong>Continuous replication<\/strong><\/li>\n<li><strong>Lift-and-shift<\/strong> (rehost)<\/li>\n<li><strong>Replaces SMS<\/strong><\/li>\n<\/ul>\n<h2>Application Migration Service (MGN)<\/h2>\n<ul>\n<li>Automate, schedule, track VM migrations<\/li>\n<li
