\n<p><strong>Lambda Proxy Integration<\/strong> (recommended):\n```python\ndef lambda_handler(event, context):\n    # event contains full request details\n    path = event['path']  # /users/123\n    method = event['httpMethod']  # GET\n    headers = event['headers']\n    query_params = event['queryStringParameters']\n    body = json.loads(event['body']) if event['body'] else {}<\/p>\n<pre><code># Process request\nif path == '/users' and method == 'GET':\n    users = get_all_users()\n    return {\n        'statusCode': 200,\n        'headers': {'Content-Type': 'application/json'},\n        'body': json.dumps(users)\n    }\n<\/code><\/pre>\n<p>```<\/p>\n<p><strong>API Gateway Features<\/strong>:<\/p>\n<p><strong>1. Request Validation<\/strong>:\n- Validate request parameters\n- Validate request body against JSON schema\n- Reject invalid requests before invoking Lambda<\/p>\n<p><strong>2. Request/Response Transformation<\/strong>:\n- Transform request data\n- Map response from Lambda\n- Change content types<\/p>\n<p><strong>3. Throttling<\/strong>:\n- Rate limiting (requests per second)\n- Burst capacity\n- Per-client throttling (API keys)<\/p>\n<p><strong>4. Caching<\/strong>:\n- Cache responses at API Gateway\n- Reduce Lambda invocations\n- Configurable TTL<\/p>\n<p><strong>5. CORS Support<\/strong>:\n- Enable cross-origin requests\n- Configure allowed origins, headers, methods<\/p>\n<p><strong>6. Authentication/Authorization<\/strong>:\n- AWS IAM\n- Cognito User Pools\n- Lambda Authorizers\n- API Keys<\/p>\n<p><strong>API Gateway Stages<\/strong>:\n<code>API: UserService\n├─ dev (Stage)\n│  └─ https://api.example.com/dev/users\n├─ test (Stage)\n│  └─ https://api.example.com/test/users\n└─ prod (Stage)\n   └─ https://api.example.com/prod/users<\/code><\/p>\n<p><strong>Stage Variables<\/strong> (environment-specific):\n```json\n{\n  \"stageVariables\": {\n    \"lambdaAlias\": \"prod\",\n    \"dbEndpoint\": \"prod-db.example.com\"\n  }\n}<\/p>\n<p>// Use in integration\n{\n  \"uri\": \"arn:aws:lambda:...:function:MyFunction:${stageVariables.lambdaAlias}\"\n}\n```<\/p>\n<p><strong>API Gateway Deployment<\/strong>:\n```bash<\/p>\n<h1>Deploy to stage<\/h1>\n<p>aws apigateway create-deployment \\\n  --rest-api-id abc123 \\\n  --stage-name prod \\\n  --stage-description 'Production deployment' \\\n  --description 'Release v1.2.3'\n```<\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use Lambda proxy integration for simplicity\n2. Enable request validation\n3. Use stages for environments (dev/test/prod)\n4. Enable caching for read-heavy APIs\n5. Implement authentication/authorization\n6. Enable CloudWatch logging\n7. Use custom domain names\n8. Implement rate limiting\n9. Version your APIs\n10. Monitor with X-Ray<\/p>\n<p><strong>API Gateway Pricing<\/strong>:\n- REST API: $3.50 per million requests\n- HTTP API: $1.00 per million requests (cheaper)\n- WebSocket API: $1.00 per million messages\n- Data transfer out<\/p>\n<p><strong>HTTP API vs REST API<\/strong>:\n- <strong>HTTP API<\/strong>: Simpler, cheaper, faster\n- <strong>REST API<\/strong>: More features (request validation, caching, API keys)<\/p>\n<p><strong>References:<\/strong> API Gateway, Lambda Integration, REST API Routing<\/p>","fixed":false},{"id":"integ-41","c":"integ","q":"<p>A SaaS company needs to automate the transfer of customer data from Salesforce to Amazon S3 for analytics. The solution must be fully managed and require minimal code. Which AWS service should be used?<\/p>","o":["Amazon AppFlow","AWS Glue","Amazon Kinesis Data Firehose","AWS DataSync"],"a":[0],"x":"<ul>\n<li>Amazon AppFlow is a fully managed integration service<\/li>\n<li>Automates data transfer between SaaS apps (e.g., Salesforce) and AWS<\/li>\n<li>No code required, supports scheduling and transformation<\/li>\n<li>Glue is for ETL, not direct SaaS integration<\/li>\n<li>Firehose is for streaming, not SaaS connectors<\/li>\n<li>DataSync is for file transfers, not SaaS data<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon AppFlow, SaaS Integration<\/p>","fixed":false},{"id":"integ-42","c":"integ","q":"<p>A development team is building a GraphQL API for a mobile app and wants to minimize backend management. Which AWS service should they use?<\/p>","o":["AWS AppSync","Amazon API Gateway","AWS Lambda","Amazon Cognito"],"a":[0],"x":"<ul>\n<li>AWS AppSync is a managed GraphQL API service<\/li>\n<li>Handles real-time data sync, subscriptions, and offline access<\/li>\n<li>API Gateway is for REST/HTTP APIs<\/li>\n<li>Lambda is compute, not API management<\/li>\n<li>Cognito is for authentication, not APIs<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS AppSync, GraphQL APIs<\/p>","fixed":false},{"id":"integ-43","c":"integ","q":"<p>A company needs to deploy containerized workloads to on-premises servers and manage them using AWS services. Which solution should they use?<\/p>","o":["Amazon ECS Anywhere","Amazon EKS Anywhere","AWS Outposts","AWS Fargate"],"a":[0],"x":"<ul>\n<li>ECS Anywhere extends ECS to on-premises servers<\/li>\n<li>Centralized management from AWS Console<\/li>\n<li>EKS Anywhere is for Kubernetes, not ECS<\/li>\n<li>Outposts is for running AWS infrastructure on-premises<\/li>\n<li>Fargate is serverless containers in AWS only<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon ECS Anywhere, Hybrid Deployments<\/p>","fixed":false},{"id":"integ-44","c":"integ","q":"<p>A mobile development team wants to test their app on a wide range of real devices in the cloud. Which AWS service should they use?<\/p>","o":["AWS Device Farm","AWS Amplify","Amazon Pinpoint","Amazon API Gateway"],"a":[0],"x":"<ul>\n<li>AWS Device Farm provides cloud-based testing on real mobile devices<\/li>\n<li>Supports Android and iOS<\/li>\n<li>Automates testing and provides detailed reports<\/li>\n<li>Amplify is for app development and hosting<\/li>\n<li>Pinpoint is for user engagement, not testing<\/li>\n<li>API Gateway is for APIs, not device testing<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Device Farm, Mobile Testing<\/p>","fixed":false},{"id":"integ-45","c":"integ","q":"<p>A marketing team wants to send targeted push notifications, emails, and SMS messages to users based on their behavior in a mobile app. Which AWS service should be used?<\/p>","o":["Amazon Pinpoint","Amazon SNS","AWS Amplify","Amazon SQS"],"a":[0],"x":"<ul>\n<li>Amazon Pinpoint is a multi-channel marketing and analytics service<\/li>\n<li>Supports push, email, SMS, and in-app messaging<\/li>\n<li>Provides segmentation, analytics, and campaign management<\/li>\n<li>SNS is for basic notifications, not targeted campaigns<\/li>\n<li>Amplify is for app development, not marketing<\/li>\n<li>SQS is for queuing, not messaging users<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon Pinpoint, User Engagement<\/p>","fixed":false},{"id":"integ-46","c":"integ","q":"<p>A company needs to integrate its on-premises Apache Kafka workloads with AWS analytics and storage services. Which AWS service provides a fully managed, highly available Kafka environment?<\/p>","o":["Amazon MSK","Amazon Kinesis Data Streams","Amazon SQS","AWS Glue Streaming"],"a":[0],"x":"<ul>\n<li>Amazon MSK (Managed Streaming for Apache Kafka) provides a fully managed Kafka service<\/li>\n<li>Handles provisioning, patching, and scaling<\/li>\n<li>Integrates with Kinesis, Lambda, S3, Redshift<\/li>\n<li>Kinesis is a separate streaming service, not Kafka-compatible<\/li>\n<li>SQS is for message queuing, not streaming<\/li>\n<li>Glue Streaming is for ETL, not Kafka management<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon MSK, Streaming Data<\/p>","fixed":false},{"id":"mon-1","c":"mon","q":"<p>A company wants to monitor the memory utilization of its EC2 instances and trigger an alarm when memory usage exceeds 80%. Which combination of actions should the solutions architect take?<\/p>","o":["Enable detailed monitoring on EC2 instances and create a CloudWatch alarm on the default memory metric","Install the CloudWatch Agent on EC2 instances, configure it to send memory metrics, and create a CloudWatch alarm","Use AWS Systems Manager Session Manager to view memory metrics and manually create alerts","Enable CloudTrail logging and use CloudWatch Logs Insights to query memory usage"],"a":[1],"x":"<ul>\n<li>EC2 instances do NOT send memory metrics by default<\/li>\n<li>The CloudWatch Agent must be installed to collect memory metrics<\/li>\n<li>Once the agent sends metrics to CloudWatch, you can create alarms<\/li>\n<li>Option A is incorrect because memory is not a default metric<\/li>\n<li>Option C doesn't provide automated alerting<\/li>\n<li>Option D is for auditing API calls, not performance metrics<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudWatch Agent, EC2 Monitoring, Custom Metrics<\/p>","fixed":false},{"id":"mon-2","c":"mon","q":"<p>A security team needs to identify which IAM user terminated a critical EC2 instance last week. Which AWS service should they use?<\/p>","o":["Amazon CloudWatch Logs","AWS Config","AWS CloudTrail","AWS Systems Manager"],"a":[2],"x":"<ul>\n<li>CloudTrail records API calls including WHO made them<\/li>\n<li>It tracks management events like TerminateInstances<\/li>\n<li>CloudTrail logs include user identity, timestamp, and action<\/li>\n<li>Option A (CloudWatch Logs) monitors application logs, not API calls<\/li>\n<li>Option B (Config) tracks resource configuration, not who made changes<\/li>\n<li>Option D (Systems Manager) is for operational management<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudTrail, API Call Auditing, Governance<\/p>","fixed":false},{"id":"mon-3","c":"mon","q":"<p>A company needs to ensure all S3 buckets have versioning enabled and receive automatic notifications when this requirement is violated. Which AWS service should be used?<\/p>","o":["AWS CloudTrail with CloudWatch Logs","Amazon CloudWatch with custom metrics","AWS Config with AWS Managed Rules","AWS Systems Manager State Manager"],"a":[2],"x":"<ul>\n<li>AWS Config evaluates resource configurations against rules<\/li>\n<li>Managed rule <code>s3-bucket-versioning-enabled<\/code> checks versioning<\/li>\n<li>Config can send SNS notifications when non-compliant<\/li>\n<li>CloudTrail tracks who made changes but doesn't evaluate compliance<\/li>\n<li>CloudWatch monitors performance metrics, not configuration compliance<\/li>\n<li>Systems Manager State Manager is for EC2 instance configuration<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Config, Config Rules, Compliance Auditing<\/p>","fixed":false},{"id":"mon-4","c":"mon","q":"<p>A solutions architect needs to access EC2 instances for troubleshooting without opening port 22 or managing SSH keys. Which AWS service provides this capability?<\/p>","o":["AWS CloudShell","AWS Systems Manager Session Manager","Amazon EC2 Instance Connect","AWS Direct Connect"],"a":[1],"x":"<ul>\n<li>Session Manager provides secure shell access without SSH keys or open ports<\/li>\n<li>Uses IAM permissions for access control<\/li>\n<li>Session logs can be sent to S3 or CloudWatch Logs<\/li>\n<li>EC2 Instance Connect still requires port 22 to be open<\/li>\n<li>CloudShell is for running AWS CLI commands, not accessing instances<\/li>\n<li>Direct Connect is for network connectivity<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Systems Manager Session Manager, Secure Access<\/p>","fixed":false},{"id":"mon-5","c":"mon","q":"<p>A company wants to automatically patch all EC2 instances in their fleet during a scheduled maintenance window. Which AWS service should they use?<\/p>","o":["AWS CloudFormation with custom scripts","AWS Systems Manager Patch Manager","Amazon EventBridge with Lambda","AWS Config with remediation actions"],"a":[1],"x":"<ul>\n<li>Patch Manager automates OS and application patching<\/li>\n<li>Maintenance windows define when to patch<\/li>\n<li>Patch baselines specify which patches to install<\/li>\n<li>CloudFormation is for infrastructure as code, not patching<\/li>\n<li>EventBridge could trigger patching but isn't purpose-built<\/li>\n<li>Config evaluates compliance but doesn't patch<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Systems Manager Patch Manager, Maintenance Windows<\/p>","fixed":false},{"id":"mon-6","c":"mon","q":"<p>An application writes log data to CloudWatch Logs. The operations team needs to be alerted when the word \"ERROR\" appears more than 10 times in 5 minutes. How should this be configured?<\/p>","o":["Use CloudWatch Logs Insights to query for errors and manually check","Create a metric filter to count \"ERROR\" occurrences, then create an alarm on that metric","Export logs to S3 and use Athena to query for errors","Use CloudTrail to track error events and create SNS notifications"],"a":[1],"x":"<ul>\n<li>Metric filters extract metrics from log data<\/li>\n<li>Filter pattern can count occurrences of \"ERROR\"<\/li>\n<li>CloudWatch alarm can trigger on the custom metric<\/li>\n<li>This provides automated, real-time alerting<\/li>\n<li>Option A requires manual intervention<\/li>\n<li>Option C adds unnecessary complexity and isn't real-time<\/li>\n<li>CloudTrail is for API calls, not application logs<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudWatch Logs, Metric Filters, CloudWatch Alarms<\/p>","fixed":false},{"id":"mon-7","c":"mon","q":"<p>A company needs to track all configuration changes to security groups across multiple AWS accounts and regions. What is the MOST efficient solution?<\/p>","o":["Enable CloudTrail in each account and region","Create Lambda functions to monitor security group changes","Use AWS Config with a Config Aggregator","Use CloudWatch Events in each region"],"a":[2],"x":"<ul>\n<li>AWS Config records resource configuration changes<\/li>\n<li>Config Aggregator provides centralized view across accounts and regions<\/li>\n<li>Tracks configuration history and relationships<\/li>\n<li>CloudTrail tracks who made changes but doesn't aggregate configurations<\/li>\n<li>Lambda would require custom development and maintenance<\/li>\n<li>CloudWatch Events could detect changes but doesn't provide historical tracking<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Config, Config Aggregator, Multi-Account Management<\/p>","fixed":false},{"id":"mon-8","c":"mon","q":"<p>A solutions architect needs to run a script on all EC2 instances fleet-wide without SSH access. The script should install security updates. Which service provides this capability?<\/p>","o":["AWS Systems Manager Run Command","AWS Lambda with EC2 API","Amazon CloudWatch Events","AWS Config Remediation"],"a":[0],"x":"<ul>\n<li>Run Command executes commands on managed instances remotely<\/li>\n<li>No SSH required, uses IAM permissions<\/li>\n<li>Provides rate control and error handling<\/li>\n<li>Command history recorded in CloudTrail<\/li>\n<li>Lambda could invoke Run Command but isn't the direct solution<\/li>\n<li>CloudWatch Events can trigger Run Command but isn't the execution service<\/li>\n<li>Config Remediation uses SSM Automation Documents<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Systems Manager Run Command, Fleet Management<\/p>","fixed":false},{"id":"mon-9","c":"mon","q":"<p>An organization wants to detect unusual API activity, such as a sudden spike in EC2 instance creation. Which CloudTrail feature should be enabled?<\/p>","o":["CloudTrail Data Events","CloudTrail Management Events","CloudTrail Insights Events","CloudTrail Multi-Region Trails"],"a":[2],"x":"<ul>\n<li>CloudTrail Insights uses machine learning to detect unusual activity<\/li>\n<li>Identifies anomalies like spikes in resource provisioning or IAM actions<\/li>\n<li>Management Events track API calls but don't detect anomalies<\/li>\n<li>Data Events track high-volume operations (S3 objects, Lambda invocations)<\/li>\n<li>Multi-Region Trails collect logs but don't analyze patterns<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudTrail Insights, Anomaly Detection<\/p>","fixed":false},{"id":"mon-10","c":"mon","q":"<p>A company needs to store CloudWatch Logs for 10 years to meet compliance requirements. What is the MOST cost-effective approach?<\/p>","o":["Keep logs in CloudWatch Logs with 10-year retention","Export logs to S3, then transition to S3 Glacier Deep Archive","Export logs to S3, then use S3 Intelligent-Tiering","Stream logs to Kinesis Data Firehose and store in Redshift"],"a":[1],"x":"<ul>\n<li>CloudWatch Logs retention is expensive for long-term storage<\/li>\n<li>Export to S3 for cost-effective long-term storage<\/li>\n<li>S3 Glacier Deep Archive is cheapest for archival ($0.00099 per GB/month)<\/li>\n<li>S3 Intelligent-Tiering is more expensive than Glacier Deep Archive<\/li>\n<li>Redshift is for analytics, not cost-effective archival<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudWatch Logs Export, S3 Glacier Deep Archive, Cost Optimization<\/p>","fixed":false},{"id":"mon-11","c":"mon","q":"<p>A development team needs to query application logs to troubleshoot issues. The logs are stored in CloudWatch Logs. Which feature should they use for ad-hoc log analysis?<\/p>","o":["CloudWatch Metrics","CloudWatch Logs Insights","CloudWatch Dashboards","CloudWatch Alarms"],"a":[1],"x":"<ul>\n<li>CloudWatch Logs Insights provides interactive log analytics<\/li>\n<li>Purpose-built query language for searching and analyzing logs<\/li>\n<li>Can find errors, count events, calculate percentiles<\/li>\n<li>Metrics are for numerical performance data<\/li>\n<li>Dashboards visualize but don't query<\/li>\n<li>Alarms trigger on thresholds<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudWatch Logs Insights, Log Analytics<\/p>","fixed":false},{"id":"mon-12","c":"mon","q":"<p>A company wants to automatically remediate non-compliant resources. For example, when an S3 bucket is created without encryption, it should be automatically encrypted. Which solution accomplishes this?<\/p>","o":["AWS Config Rules with automatic remediation using SSM Automation Documents","CloudWatch Events with Lambda functions","AWS CloudTrail with SNS notifications","Systems Manager State Manager"],"a":[0],"x":"<ul>\n<li>Config Rules evaluate compliance<\/li>\n<li>Automatic remediation uses SSM Automation Documents<\/li>\n<li>Can trigger remediation when resources become non-compliant<\/li>\n<li>CloudWatch Events could work but Config is purpose-built for compliance<\/li>\n<li>CloudTrail only tracks changes, doesn't remediate<\/li>\n<li>State Manager maintains EC2 configuration, not S3<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Config, Auto Remediation, SSM Automation<\/p>","fixed":false},{"id":"mon-13","c":"mon","q":"<p>A solutions architect needs to store sensitive configuration data like database passwords that can be accessed by EC2 instances and Lambda functions. The solution must support encryption and version history. Which service should be used?<\/p>","o":["AWS Secrets Manager","AWS Systems Manager Parameter Store","Amazon S3 with versioning","AWS Config"],"a":[1],"x":"<ul>\n<li>Parameter Store securely stores configuration data and secrets<\/li>\n<li>Supports encryption with KMS<\/li>\n<li>Maintains version history<\/li>\n<li>Integrates with EC2, Lambda, CloudFormation<\/li>\n<li>Secrets Manager is also valid but more expensive (includes auto-rotation)<\/li>\n<li>For exam context, Parameter Store is part of Systems Manager<\/li>\n<li>S3 isn't designed for configuration management<\/li>\n<li>Config is for compliance tracking<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Systems Manager Parameter Store, Secrets Management<\/p>","fixed":false},{"id":"mon-14","c":"mon","q":"<p>A company has a multi-region application and needs to create a unified dashboard showing CloudWatch metrics from all regions. Is this possible?<\/p>","o":["No, CloudWatch dashboards are region-specific only","Yes, CloudWatch dashboards support cross-region metrics","Yes, but only with CloudWatch Logs, not metrics","Yes, but requires CloudWatch Events to aggregate data"],"a":[1],"x":"<ul>\n<li>CloudWatch dashboards support cross-region and cross-account views<\/li>\n<li>Can add graphs from multiple regions to single dashboard<\/li>\n<li>Global view of distributed applications<\/li>\n<li>No additional aggregation service required<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudWatch Dashboards, Cross-Region Monitoring<\/p>","fixed":false},{"id":"mon-15","c":"mon","q":"<p>An operations team needs to collect metadata about all EC2 instances including installed applications, OS details, and network configuration. Which Systems Manager feature should they use?<\/p>","o":["Systems Manager Session Manager","Systems Manager Inventory","Systems Manager Patch Manager","Systems Manager Run Command"],"a":[1],"x":"<ul>\n<li>Systems Manager Inventory collects metadata from managed instances<\/li>\n<li>Gathers information about OS, applications, network config<\/li>\n<li>Can query and visualize with Inventory dashboard<\/li>\n<li>Session Manager is for shell access<\/li>\n<li>Patch Manager is for patching<\/li>\n<li>Run Command executes commands<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Systems Manager Inventory, Metadata Collection<\/p>","fixed":false},{"id":"mon-16","c":"mon","q":"<p>A company needs to ensure CloudTrail logs haven't been tampered with for compliance audits. Which feature should be enabled?<\/p>","o":["CloudTrail Multi-Region Trails","CloudTrail Log File Integrity Validation","CloudTrail Insights","CloudTrail Data Events"],"a":[1],"x":"<ul>\n<li>Log File Integrity Validation uses digital signatures<\/li>\n<li>Ensures logs haven't been modified after delivery<\/li>\n<li>Required for compliance and forensic investigations<\/li>\n<li>Multi-Region Trails enable logging across regions<\/li>\n<li>Insights detect unusual activity<\/li>\n<li>Data Events track resource operations<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudTrail, Log Integrity, Compliance<\/p>","fixed":false},{"id":"mon-17","c":"mon","q":"<p>A solutions architect needs to process CloudWatch Logs in real-time and send filtered data to an analytics application. Which solution should be used?<\/p>","o":["Export logs to S3 and use Athena","Use CloudWatch Logs Subscriptions with Kinesis Data Streams","Use CloudWatch Logs Insights with scheduled queries","Export logs to S3 and use Lambda"],"a":[1],"x":"<ul>\n<li>CloudWatch Logs Subscriptions enable real-time processing<\/li>\n<li>Can send to Kinesis Data Streams for real-time analytics<\/li>\n<li>Also supports Kinesis Data Firehose and Lambda<\/li>\n<li>S3 export is not real-time (batch process)<\/li>\n<li>Logs Insights is for ad-hoc queries, not streaming<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudWatch Logs Subscriptions, Real-Time Processing<\/p>","fixed":false},{"id":"mon-18","c":"mon","q":"<p>A company wants to track when a specific IAM policy was attached to a role and view the complete configuration history. Which service provides this capability?<\/p>","o":["AWS CloudTrail only","AWS Config only","Both CloudTrail and Config","IAM Access Analyzer"],"a":[2],"x":"<ul>\n<li>CloudTrail shows WHO attached the policy and WHEN (API call details)<\/li>\n<li>Config shows configuration history and timeline of changes<\/li>\n<li>Both services complement each other for complete visibility<\/li>\n<li>CloudTrail: \"Who did what, when\"<\/li>\n<li>Config: \"What does it look like now and over time\"<\/li>\n<li>IAM Access Analyzer analyzes resource policies for external access<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudTrail vs Config, Configuration History<\/p>","fixed":false},{"id":"mon-19","c":"mon","q":"<p>An application needs to maintain a desired state on EC2 instances, ensuring specific software is always installed and running. Which Systems Manager feature should be used?<\/p>","o":["Systems Manager Run Command","Systems Manager State Manager","Systems Manager Automation","Systems Manager Patch Manager"],"a":[1],"x":"<ul>\n<li>State Manager maintains desired state configuration<\/li>\n<li>Creates associations between documents and instances<\/li>\n<li>Continuously enforces configuration<\/li>\n<li>Run Command executes one-time commands<\/li>\n<li>Automation runs workflows<\/li>\n<li>Patch Manager handles patching<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Systems Manager State Manager, Configuration Management<\/p>","fixed":false},{"id":"mon-20","c":"mon","q":"<p>A company needs to query 5 years of CloudTrail logs to investigate security incidents. What is the MOST efficient solution?<\/p>","o":["Download all logs from S3 and use local tools","Use Amazon Athena to query CloudTrail logs in S3","Use CloudTrail Lake to query logs with SQL","Import logs into Elasticsearch"],"a":[2],"x":"<ul>\n<li>CloudTrail Lake is purpose-built for querying CloudTrail logs<\/li>\n<li>Uses SQL to query events<\/li>\n<li>Can retain events for up to 7 years<\/li>\n<li>Aggregates logs from multiple accounts/regions<\/li>\n<li>Athena could work but CloudTrail Lake is optimized for this use case<\/li>\n<li>Option A is inefficient and not scalable<\/li>\n<li>Elasticsearch adds unnecessary complexity<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudTrail Lake, Log Query and Analysis<\/p>","fixed":false},{"id":"mig-1","c":"mig","q":"<p>A company wants to migrate a large on-premises application to AWS quickly with minimal changes. The application runs on virtual machines and must be operational within 2 weeks. Which migration strategy should be used?<\/p>","o":["Refactor the application to use Lambda and DynamoDB","Rehost (Lift and Shift) using AWS Application Migration Service","Repurchase by moving to a SaaS solution","Replatform by migrating to containers on ECS"],"a":[1],"x":"<ul>\n<li>Rehost (Lift and Shift) is the fastest migration strategy<\/li>\n<li>AWS Application Migration Service (MGN) automates server migration<\/li>\n<li>Moves VMs to EC2 with minimal changes<\/li>\n<li>Meets the 2-week deadline requirement<\/li>\n<li>Option A (Refactor) takes months of development<\/li>\n<li>Option C (Repurchase) requires finding and adopting new software<\/li>\n<li>Option D (Replatform) requires containerization effort<\/li>\n<\/ul>\n<p><strong>References:<\/strong> 6 R's of Migration, AWS Application Migration Service<\/p>","fixed":false},{"id":"mig-2","c":"mig","q":"<p>A solutions architect needs to migrate 50 TB of data from an on-premises NFS server to Amazon S3. The company has a 100 Mbps internet connection. Which service is MOST appropriate?<\/p>","o":["AWS DataSync","AWS Snowball","AWS Direct Connect","AWS Transfer Family"],"a":[1],"x":"<ul>\n<li>50 TB over 100 Mbps would take approximately 46 days<\/li>\n<li>Snowball is designed for large data transfers with limited bandwidth<\/li>\n<li>Can transfer 50-80 TB per device in about a week<\/li>\n<li>DataSync works over network but would be too slow<\/li>\n<li>Direct Connect is for ongoing connectivity, not one-time migration<\/li>\n<li>Transfer Family is for SFTP/FTPS access to S3<\/li>\n<\/ul>\n<p><strong>Calculation:<\/strong> 50 TB = 400,000 Gb ÷ 100 Mbps = 4,000,000 seconds ≈ 46 days<\/p>\n<p><strong>References:<\/strong> AWS Snowball, Data Transfer Services<\/p>","fixed":false},{"id":"mig-3","c":"mig","q":"<p>A company wants to migrate an Oracle database to Amazon Aurora PostgreSQL. The database schemas and stored procedures need to be converted. Which combination of services should be used?<\/p>","o":["AWS DMS only","AWS Schema Conversion Tool (SCT) only","AWS SCT to convert schema, then AWS DMS to migrate data","AWS DataSync to transfer the database"],"a":[2],"x":"<ul>\n<li>This is a heterogeneous migration (different database engines)<\/li>\n<li>SCT converts schemas, stored procedures, and functions<\/li>\n<li>DMS migrates the actual data with minimal downtime<\/li>\n<li>DMS alone doesn't convert schemas for heterogeneous migrations<\/li>\n<li>SCT alone doesn't migrate data<\/li>\n<li>DataSync is for file systems, not databases<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DMS, Schema Conversion Tool, Heterogeneous Migration<\/p>","fixed":false},{"id":"mig-4","c":"mig","q":"<p>A company needs to continuously replicate data from an on-premises MySQL database to Amazon RDS for MySQL for analytics purposes. The source database must remain operational. Which AWS service should be used?<\/p>","o":["AWS DataSync","AWS Database Migration Service (DMS) with CDC","AWS Snowball Edge","Amazon S3 Transfer Acceleration"],"a":[1],"x":"<ul>\n<li>DMS supports continuous data replication using Change Data Capture (CDC)<\/li>\n<li>Source database remains operational during migration<\/li>\n<li>Homogeneous migration (MySQL to MySQL)<\/li>\n<li>Keeps source and target in sync<\/li>\n<li>DataSync is for file systems, not databases<\/li>\n<li>Snowball is for one-time transfers<\/li>\n<li>S3 Transfer Acceleration is for S3 uploads<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DMS, Change Data Capture, Database Replication<\/p>","fixed":false},{"id":"mig-5","c":"mig","q":"<p>A solutions architect needs to transfer data between Amazon EFS in us-east-1 and Amazon S3 in us-west-2 on a daily basis. Which service provides automated, scheduled transfers?<\/p>","o":["AWS DataSync","AWS Snow Family","AWS Transfer Family","Amazon S3 Cross-Region Replication"],"a":[0],"x":"<ul>\n<li>DataSync supports transfers between AWS storage services<\/li>\n<li>Can schedule tasks (hourly, daily, weekly)<\/li>\n<li>Supports EFS to S3 transfers<\/li>\n<li>Automated and managed service<\/li>\n<li>Snow Family is for physical device transfers<\/li>\n<li>Transfer Family is for SFTP/FTPS access<\/li>\n<li>S3 CRR is for S3-to-S3 only<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DataSync, Scheduled Data Transfer<\/p>","fixed":false},{"id":"mig-6","c":"mig","q":"<p>A company is migrating a legacy application to AWS but wants to minimize changes. The application uses a specific OS version and custom drivers that aren't compatible with cloud-native services. Which migration strategy is MOST appropriate?<\/p>","o":["Refactor to serverless architecture","Replatform to managed services","Rehost (Lift and Shift) to EC2","Repurchase a SaaS solution"],"a":[2],"x":"<ul>\n<li>Rehost (Lift and Shift) moves application as-is<\/li>\n<li>EC2 supports custom OS and drivers<\/li>\n<li>Minimal changes required<\/li>\n<li>Fast migration path<\/li>\n<li>Refactor requires re-architecting<\/li>\n<li>Replatform may not support custom requirements<\/li>\n<li>Repurchase requires finding compatible SaaS<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Migration Strategies, Rehost Pattern<\/p>","fixed":false},{"id":"mig-7","c":"mig","q":"<p>An organization wants to track the progress of migrating 200 applications across multiple AWS accounts and regions. Which service provides centralized visibility?<\/p>","o":["AWS CloudWatch","AWS Migration Hub","AWS Systems Manager","AWS Config"],"a":[1],"x":"<ul>\n<li>Migration Hub provides centralized tracking of migrations<\/li>\n<li>Aggregates progress from multiple migration tools<\/li>\n<li>Supports multi-account and multi-region tracking<\/li>\n<li>Integrates with DMS, Application Migration Service, etc.<\/li>\n<li>CloudWatch monitors resources, not migrations<\/li>\n<li>Systems Manager manages infrastructure<\/li>\n<li>Config tracks configuration compliance<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Migration Hub, Migration Tracking<\/p>","fixed":false},{"id":"mig-8","c":"mig","q":"<p>A company needs to migrate data from an on-premises HDFS cluster to Amazon S3. The data must be encrypted in transit. Which service should be used?<\/p>","o":["AWS Snowball","AWS DataSync","AWS Direct Connect","AWS Storage Gateway"],"a":[1],"x":"<ul>\n<li>DataSync supports HDFS as a source<\/li>\n<li>Encrypts data in transit with TLS<\/li>\n<li>Automated and fast data transfer<\/li>\n<li>Can transfer to S3<\/li>\n<li>Snowball doesn't support HDFS directly<\/li>\n<li>Direct Connect is for network connectivity<\/li>\n<li>Storage Gateway is for hybrid storage, not migration<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DataSync, HDFS Migration<\/p>","fixed":false},{"id":"mig-9","c":"mig","q":"<p>A database migration using AWS DMS needs to handle large transactions and minimize the impact on the source database performance. How should the replication instance be sized?<\/p>","o":["Use the smallest instance to minimize costs","Use an instance type based on the source database workload and data volume","Always use the largest instance available","Instance size doesn't affect DMS performance"],"a":[1],"x":"<ul>\n<li>Replication instance size affects performance<\/li>\n<li>Should be based on workload, data volume, and complexity<\/li>\n<li>Larger instances handle more throughput and complex transformations<\/li>\n<li>Undersizing causes slow migration and potential source impact<\/li>\n<li>Oversizing wastes money<\/li>\n<li>Proper sizing requires workload analysis<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DMS, Replication Instance Sizing<\/p>","fixed":false},{"id":"mig-10","c":"mig","q":"<p>A company wants to migrate an on-premises Microsoft SQL Server database to AWS. They want to minimize management overhead and maintain compatibility. Which target should they choose?<\/p>","o":["Amazon RDS for SQL Server","Microsoft SQL Server on EC2","Amazon Aurora PostgreSQL","Amazon DynamoDB"],"a":[0],"x":"<ul>\n<li>RDS for SQL Server is managed service (minimal overhead)<\/li>\n<li>Maintains SQL Server compatibility<\/li>\n<li>This is a \"Replatform\" strategy<\/li>\n<li>Option B requires managing EC2 and OS (more overhead)<\/li>\n<li>Option C requires heterogeneous migration and code changes<\/li>\n<li>Option D is NoSQL, requires application re-architecture<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS RDS, Replatform Strategy<\/p>","fixed":false},{"id":"mig-11","c":"mig","q":"<p>During a database migration with AWS DMS, which task type should be used to perform an initial data load followed by ongoing replication?<\/p>","o":["Full Load only","CDC (Change Data Capture) only","Full Load + CDC","Multiple Full Load tasks"],"a":[2],"x":"<ul>\n<li>Full Load + CDC is the most common migration pattern<\/li>\n<li>Full Load transfers existing data<\/li>\n<li>CDC replicates ongoing changes<\/li>\n<li>Minimizes downtime<\/li>\n<li>Full Load only doesn't capture changes after initial load<\/li>\n<li>CDC only doesn't transfer existing data<\/li>\n<li>Multiple Full Loads don't capture changes<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DMS, Migration Task Types<\/p>","fixed":false},{"id":"mig-12","c":"mig","q":"<p>A company has 500 TB of data to migrate from on-premises to AWS. The internet connection is 1 Gbps, but business requirements prohibit using the full bandwidth. Which solution is MOST cost-effective?<\/p>","o":["Use AWS DataSync with bandwidth throttling","Order multiple AWS Snowball devices","Upgrade internet connection to 10 Gbps","Use AWS Direct Connect with 10 Gbps connection"],"a":[1],"x":"<ul>\n<li>500 TB is very large, Snowball is designed for this<\/li>\n<li>Even with 1 Gbps, transfer would take months<\/li>\n<li>Can't use full bandwidth due to business requirements<\/li>\n<li>Snowball is faster and more cost-effective for large migrations<\/li>\n<li>DataSync with throttling would be too slow<\/li>\n<li>Upgrading connection is expensive<\/li>\n<li>Direct Connect requires time to provision<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Snowball, Large Data Migration<\/p>","fixed":false},{"id":"mig-13","c":"mig","q":"<p>An application stores data in an on-premises SMB file share. The company wants to migrate this data to AWS and continue accessing it via SMB protocol. Which solution should be implemented?<\/p>","o":["Use DataSync to transfer to S3, then use S3 File Gateway","Use DataSync to transfer to FSx for Windows File Server","Use Snowball to transfer to EFS","Use Storage Gateway Volume Gateway"],"a":[1],"x":"<ul>\n<li>DataSync supports SMB as source<\/li>\n<li>FSx for Windows File Server provides native SMB protocol<\/li>\n<li>Seamless migration path for Windows file shares<\/li>\n<li>S3 File Gateway presents S3 as NFS/SMB but uses S3 storage<\/li>\n<li>EFS doesn't natively support SMB (uses NFS)<\/li>\n<li>Volume Gateway is for block storage<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DataSync, FSx for Windows File Server<\/p>","fixed":false},{"id":"mig-14","c":"mig","q":"<p>A company is using AWS DMS to migrate a database. They need to ensure the data is encrypted both in transit and at rest. How can this be achieved?<\/p>","o":["DMS doesn't support encryption","Enable SSL/TLS for connections and use encrypted RDS instances","Use VPN for all connections","Encryption is automatic and cannot be configured"],"a":[1],"x":"<ul>\n<li>DMS supports encryption in transit using SSL/TLS<\/li>\n<li>Target RDS instances can use encryption at rest<\/li>\n<li>Replication instance can also be encrypted<\/li>\n<li>Both source and target connections should use SSL<\/li>\n<li>VPN adds security but isn't required for encryption<\/li>\n<li>Encryption must be explicitly configured<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DMS Security, Encryption<\/p>","fixed":false},{"id":"mig-15","c":"mig","q":"<p>A solutions architect needs to schedule a DataSync task to run every day at 2 AM UTC. How can this be configured?<\/p>","o":["DataSync doesn't support scheduling","Use the built-in task scheduling in DataSync","Use EventBridge to trigger DataSync tasks","Use Lambda with cron expressions"],"a":[1],"x":"<ul>\n<li>DataSync has built-in task scheduling<\/li>\n<li>Can schedule hourly, daily, weekly, or custom intervals<\/li>\n<li>No additional services required<\/li>\n<li>EventBridge could also trigger tasks but isn't necessary<\/li>\n<li>Lambda is unnecessary complexity<\/li>\n<li>Scheduling is a native DataSync feature<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DataSync, Task Scheduling<\/p>","fixed":false},{"id":"mig-16","c":"mig","q":"<p>A company wants to retire legacy applications that are no longer used as part of their cloud migration. Which migration strategy does this represent?<\/p>","o":["Rehost","Replatform","Retire","Retain"],"a":[2],"x":"<ul>\n<li>Retire strategy identifies and turns off unused applications<\/li>\n<li>Reduces cost and complexity<\/li>\n<li>Part of the 6 R's migration framework<\/li>\n<li>Rehost moves applications to cloud<\/li>\n<li>Replatform optimizes during migration<\/li>\n<li>Retain keeps applications on-premises<\/li>\n<\/ul>\n<p><strong>References:<\/strong> 6 R's of Migration, Retire Strategy<\/p>","fixed":false},{"id":"mig-17","c":"mig","q":"<p>During a database migration, AWS DMS replication instance is in the same VPC as the target RDS database but cannot connect. What is the MOST likely cause?<\/p>","o":["The replication instance is too small","The target RDS security group doesn't allow inbound traffic from the replication instance","DMS doesn't support RDS as a target","SSL must be disabled on RDS"],"a":[1],"x":"<ul>\n<li>Security groups must allow traffic between DMS and RDS<\/li>\n<li>Common misconfiguration during DMS setup<\/li>\n<li>Need to add inbound rule to RDS security group<\/li>\n<li>Instance size doesn't affect connectivity<\/li>\n<li>DMS fully supports RDS as target<\/li>\n<li>SSL is optional, not a blocker<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DMS, VPC Security Groups<\/p>","fixed":false},{"id":"mig-18","c":"mig","q":"<p>A company is planning a large-scale migration to AWS and needs to assess their current environment, plan the migration, and track progress. Which AWS service provides this comprehensive approach?<\/p>","o":["AWS Migration Hub","AWS Application Discovery Service","Both Migration Hub and Application Discovery Service","AWS CloudEndure"],"a":[2],"x":"<ul>\n<li>Application Discovery Service discovers on-premises resources<\/li>\n<li>Collects server specifications, performance data, dependencies<\/li>\n<li>Migration Hub tracks migration progress<\/li>\n<li>Together they provide complete migration solution<\/li>\n<li>Application Discovery feeds data into Migration Hub<\/li>\n<li>CloudEndure is now AWS Application Migration Service<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Migration Hub, Application Discovery Service<\/p>","fixed":false},{"id":"mig-19","c":"mig","q":"<p>A company wants to use AWS DataSync to transfer data but needs to verify that files are identical at source and destination. Which DataSync feature ensures this?<\/p>","o":["DataSync doesn't verify data","Built-in data integrity verification","Manual MD5 checksum comparison","Use CloudWatch to monitor transfers"],"a":[1],"x":"<ul>\n<li>DataSync automatically verifies data integrity<\/li>\n<li>Checks data at source and destination<\/li>\n<li>Ensures data consistency after transfer<\/li>\n<li>Built-in feature, no manual intervention needed<\/li>\n<li>CloudWatch monitors progress but doesn't verify integrity<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS DataSync, Data Integrity<\/p>","fixed":false},{"id":"mig-20","c":"mig","q":"<p>An organization is migrating applications to AWS and wants to refactor a monolithic application into microservices. Which migration strategy is being used?<\/p>","o":["Rehost","Replatform","Refactor/Re-architect","Repurchase"],"a":[2],"x":"<ul>\n<li>Refactor/Re-architect reimagines application architecture<\/li>\n<li>Breaking monolith into microservices is classic refactoring<\/li>\n<li>Uses cloud-native features (ECS, Lambda, etc.)<\/li>\n<li>Most complex but provides maximum cloud benefits<\/li>\n<li>Rehost moves as-is<\/li>\n<li>Replatform makes minimal optimizations<\/li>\n<li>Repurchase moves to SaaS<\/li>\n<\/ul>\n<p><strong>References:<\/strong> 6 R's of Migration, Refactor Strategy<\/p>","fixed":false},{"id":"ana-1","c":"ana","q":"<p>A company stores application logs in Amazon S3 in CSV format. A data analyst needs to run ad-hoc SQL queries on this data without setting up infrastructure. Which AWS service should be used?<\/p>","o":["Amazon EMR","Amazon Athena","Amazon Redshift","AWS Glue"],"a":[1],"x":"<ul>\n<li>Athena is serverless and queries S3 data using SQL<\/li>\n<li>No infrastructure to manage<\/li>\n<li>Pay per query (per TB scanned)<\/li>\n<li>Perfect for ad-hoc querying<\/li>\n<li>EMR requires cluster management<\/li>\n<li>Redshift requires data warehouse setup<\/li>\n<li>Glue is for ETL, not querying<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon Athena, Serverless Analytics<\/p>","fixed":false},{"id":"ana-2","c":"ana","q":"<p>A solutions architect wants to reduce the cost of Athena queries on a large dataset stored in S3. The data is currently in CSV format and queries scan the entire dataset. What should be done to optimize costs?<\/p>","o":["Increase the Athena query timeout","Convert data to Parquet format and partition by commonly queried fields","Move data to Amazon Redshift","Enable S3 versioning"],"a":[1],"x":"<ul>\n<li>Athena charges per TB scanned ($5/TB)<\/li>\n<li>Parquet is columnar format, reduces data scanned by 30-90%<\/li>\n<li>Partitioning limits data scanned to relevant partitions<\/li>\n<li>Both optimizations significantly reduce costs<\/li>\n<li>Increasing timeout doesn't reduce scanned data<\/li>\n<li>Redshift adds infrastructure costs<\/li>\n<li>S3 versioning doesn't affect query performance<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Athena Performance Optimization, Columnar Formats<\/p>","fixed":false},{"id":"ana-3","c":"ana","q":"<p>A real-time analytics application needs to ingest clickstream data from a website, process it with custom business logic, and store results in DynamoDB. Which AWS service should be used for data ingestion?<\/p>","o":["Amazon Kinesis Data Streams","Amazon Kinesis Data Firehose","Amazon SQS","AWS DataSync"],"a":[0],"x":"<ul>\n<li>Kinesis Data Streams is for real-time streaming with custom processing<\/li>\n<li>Supports custom consumers (Lambda, EC2, KCL)<\/li>\n<li>Real-time processing capability<\/li>\n<li>Firehose is for loading data to destinations (S3, Redshift, etc.)<\/li>\n<li>SQS is for message queuing, not streaming analytics<\/li>\n<li>DataSync is for file transfers<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Kinesis Data Streams, Real-Time Processing<\/p>","fixed":false},{"id":"ana-4","c":"ana","q":"<p>A company wants to load streaming IoT sensor data into Amazon S3 for analysis with minimal operational overhead. The data should be delivered every 5 minutes and compressed. Which service is MOST appropriate?<\/p>","o":["Amazon Kinesis Data Streams with Lambda","Amazon Kinesis Data Firehose","Amazon SQS with Lambda","AWS IoT Core with custom application"],"a":[1],"x":"<ul>\n<li>Kinesis Data Firehose is fully managed, no infrastructure<\/li>\n<li>Automatically loads to S3<\/li>\n<li>Built-in compression (GZIP, Snappy)<\/li>\n<li>Buffer interval supports 60-900 seconds (5 minutes = 300 seconds)<\/li>\n<li>Minimal operational overhead<\/li>\n<li>Data Streams requires consumer application<\/li>\n<li>SQS adds unnecessary complexity<\/li>\n<li>Custom application requires maintenance<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Kinesis Data Firehose, Serverless Data Loading<\/p>","fixed":false},{"id":"ana-5","c":"ana","q":"<p>An Athena query is scanning 10 TB of data but only needs records from the last month. The S3 bucket structure is organized by year, month, and day. How can query performance and cost be improved?<\/p>","o":["Use S3 Select to filter data","Create a partitioned table in Athena and query specific partitions","Enable S3 Intelligent-Tiering","Use Athena workgroups"],"a":[1],"x":"<ul>\n<li>Partitioning allows queries to scan only relevant data<\/li>\n<li>WHERE clause with partition keys limits scan to specific partitions<\/li>\n<li>Dramatically reduces data scanned and costs<\/li>\n<li>Example: WHERE year='2024' AND month='01'<\/li>\n<li>S3 Select reduces transfer but doesn't work with Athena<\/li>\n<li>Intelligent-Tiering is for storage costs<\/li>\n<li>Workgroups organize queries but don't optimize scans<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Athena Partitioning, Query Optimization<\/p>","fixed":false},{"id":"ana-6","c":"ana","q":"<p>A company needs to process streaming data in real-time using SQL queries and send alerts when certain thresholds are exceeded. Which service should be used?<\/p>","o":["Amazon Athena","Amazon Kinesis Data Analytics","Amazon Kinesis Data Firehose","AWS Glue"],"a":[1],"x":"<ul>\n<li>Kinesis Data Analytics processes streaming data with SQL<\/li>\n<li>Real-time analytics on streaming data<\/li>\n<li>Can send results to Lambda for alerts<\/li>\n<li>Athena queries static data in S3<\/li>\n<li>Firehose loads data but doesn't analyze<\/li>\n<li>Glue is for ETL jobs<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Kinesis Data Analytics, Stream Processing<\/p>","fixed":false},{"id":"ana-7","c":"ana","q":"<p>A data engineering team needs to run Apache Spark jobs to process large datasets. They want a managed service that handles infrastructure provisioning. Which service should they use?<\/p>","o":["Amazon Athena","Amazon EMR","AWS Glue","Amazon Kinesis"],"a":[1],"x":"<ul>\n<li>EMR (Elastic MapReduce) is managed big data platform<\/li>\n<li>Supports Apache Spark, Hadoop, Hive, etc.<\/li>\n<li>Handles cluster provisioning and scaling<\/li>\n<li>Optimized for large-scale data processing<\/li>\n<li>Athena is for SQL queries, not Spark<\/li>\n<li>Glue supports Spark but EMR provides more control<\/li>\n<li>Kinesis is for streaming, not batch processing<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon EMR, Big Data Processing<\/p>","fixed":false},{"id":"ana-8","c":"ana","q":"<p>A company has streaming data in Kinesis Data Streams and wants to load it into Amazon Redshift for analytics. What is the MOST operationally efficient solution?<\/p>","o":["Use Lambda to read from Kinesis and write to Redshift","Use Kinesis Data Firehose to load data into Redshift","Use EC2 instances with custom scripts","Use EMR to process and load data"],"a":[1],"x":"<ul>\n<li>Firehose can read from Data Streams and load to Redshift<\/li>\n<li>Fully managed, no code required<\/li>\n<li>Automatically scales<\/li>\n<li>Loads via S3 (COPY command)<\/li>\n<li>Lambda requires custom code and error handling<\/li>\n<li>EC2 and EMR add operational overhead<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Kinesis Data Firehose, Redshift Integration<\/p>","fixed":false},{"id":"ana-9","c":"ana","q":"<p>An organization uses AWS Glue Crawlers to discover schemas for data in S3. The crawler should run automatically whenever new data arrives. How can this be configured?<\/p>","o":["Manually run the crawler daily","Use EventBridge to trigger the crawler on S3 PutObject events","Use AWS Config to detect changes","Crawlers cannot be triggered automatically"],"a":[1],"x":"<ul>\n<li>EventBridge (formerly CloudWatch Events) can trigger on S3 events<\/li>\n<li>S3 PutObject events can invoke Glue Crawler<\/li>\n<li>Automated schema discovery when new data arrives<\/li>\n<li>Manual running isn't automatic<\/li>\n<li>Config tracks configuration, doesn't trigger workflows<\/li>\n<li>Glue supports multiple trigger types<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Glue, EventBridge Integration<\/p>","fixed":false},{"id":"ana-10","c":"ana","q":"<p>A Kinesis Data Stream has 4 shards. Producers are writing 5,000 records per second. What is the likely issue and solution?<\/p>","o":["Shards are over capacity; add more shards","Retention period is too short; increase it","No issue, this is within limits","Use Kinesis Data Firehose instead"],"a":[0],"x":"<ul>\n<li>Each shard supports 1,000 records/sec write capacity<\/li>\n<li>4 shards = 4,000 records/sec capacity<\/li>\n<li>5,000 records/sec exceeds capacity<\/li>\n<li>Need at least 5 shards (or use on-demand mode)<\/li>\n<li>Will receive ProvisionedThroughputExceededException<\/li>\n<li>Retention doesn't affect write capacity<\/li>\n<li>Firehose is for different use cases<\/li>\n<\/ul>\n<p><strong>Calculation:<\/strong> 4 shards × 1,000 records/sec = 4,000 records/sec &lt; 5,000 needed<\/p>\n<p><strong>References:<\/strong> Kinesis Data Streams, Shard Capacity<\/p>","fixed":false},{"id":"ana-11","c":"ana","q":"<p>A company wants to visualize data from multiple sources including S3, RDS, and Redshift. They need interactive dashboards for business users. Which AWS service should be used?<\/p>","o":["Amazon Athena","Amazon QuickSight","Amazon CloudWatch","Amazon Kinesis Data Analytics"],"a":[1],"x":"<ul>\n<li>QuickSight is business intelligence and visualization service<\/li>\n<li>Connects to multiple data sources (S3, RDS, Redshift, etc.)<\/li>\n<li>Creates interactive dashboards<\/li>\n<li>SPICE engine for fast analytics<\/li>\n<li>Athena queries data but doesn't visualize<\/li>\n<li>CloudWatch monitors infrastructure<\/li>\n<li>Kinesis analyzes streaming data<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon QuickSight, Business Intelligence<\/p>","fixed":false},{"id":"ana-12","c":"ana","q":"<p>A solutions architect needs to ensure data in Kinesis Data Streams is retained for 7 days for reprocessing. What should be configured?<\/p>","o":["Set retention period to 168 hours (7 days)","Use Kinesis Data Firehose with 7-day buffer","Enable extended data retention in S3","Kinesis cannot retain data beyond 24 hours"],"a":[0],"x":"<ul>\n<li>Kinesis Data Streams supports retention from 24 hours to 365 days<\/li>\n<li>Default is 24 hours<\/li>\n<li>Extended retention has additional cost<\/li>\n<li>7 days = 168 hours<\/li>\n<li>Firehose doesn't have 7-day buffer option<\/li>\n<li>S3 is separate storage, not Kinesis retention<\/li>\n<li>Extended retention is a supported feature<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Kinesis Data Streams, Data Retention<\/p>","fixed":false},{"id":"ana-13","c":"ana","q":"<p>An ETL pipeline needs to transform data from multiple sources, catalog the metadata, and run the jobs on a schedule. Which AWS service provides this functionality?<\/p>","o":["Amazon EMR","AWS Glue","AWS Data Pipeline","Amazon Athena"],"a":[1],"x":"<ul>\n<li>AWS Glue is fully managed ETL service<\/li>\n<li>Glue Data Catalog stores metadata<\/li>\n<li>Glue Crawlers discover schemas<\/li>\n<li>Glue Jobs perform transformations<\/li>\n<li>Supports scheduling<\/li>\n<li>EMR requires more management<\/li>\n<li>Data Pipeline is older service<\/li>\n<li>Athena queries, doesn't transform<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Glue, ETL Pipeline<\/p>","fixed":false},{"id":"ana-14","c":"ana","q":"<p>A company collects application logs in CloudWatch Logs and wants to analyze them using SQL queries. What is the MOST cost-effective solution?<\/p>","o":["Keep logs in CloudWatch and use Logs Insights","Export logs to S3 and query with Athena","Stream logs to Kinesis and use Data Analytics","Load logs into Redshift"],"a":[1],"x":"<ul>\n<li>CloudWatch Logs storage is expensive for long-term retention<\/li>\n<li>Export to S3 significantly reduces storage costs<\/li>\n<li>Athena queries S3 data with SQL ($5/TB scanned)<\/li>\n<li>Most cost-effective for infrequent analysis<\/li>\n<li>Logs Insights is good for recent logs<\/li>\n<li>Kinesis adds streaming costs<\/li>\n<li>Redshift requires cluster costs<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudWatch Logs Export, Athena Cost Optimization<\/p>","fixed":false},{"id":"ana-15","c":"ana","q":"<p>A Kinesis Data Firehose delivery stream should transform incoming JSON data using a Lambda function before storing in S3. How is this configured?<\/p>","o":["Firehose doesn't support transformations","Enable data transformation and specify the Lambda function ARN","Use Kinesis Data Analytics for transformation","Transform data before sending to Firehose"],"a":[1],"x":"<ul>\n<li>Kinesis Data Firehose supports Lambda transformation<\/li>\n<li>Configure transformation in delivery stream settings<\/li>\n<li>Firehose invokes Lambda for each batch<\/li>\n<li>Lambda can modify, filter, or enrich data<\/li>\n<li>Built-in feature, no separate service needed<\/li>\n<li>Transforming before Firehose is possible but not optimal<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Kinesis Data Firehose, Data Transformation<\/p>","fixed":false},{"id":"ana-16","c":"ana","q":"<p>An analytics application queries data in S3 using Athena. The queries are running slowly despite optimizations. The data is already in Parquet format and partitioned. What else can improve performance?<\/p>","o":["Optimize file sizes to 128 MB - 1 GB per file","Switch to CSV format","Disable partitioning","Use smaller file sizes (1-10 MB)"],"a":[0],"x":"<ul>\n<li>Too many small files causes performance issues<\/li>\n<li>Optimal file size is 128 MB - 1 GB<\/li>\n<li>Athena opens each file, many small files = overhead<\/li>\n<li>Combine small files into larger ones<\/li>\n<li>CSV is less efficient than Parquet<\/li>\n<li>Partitioning improves performance<\/li>\n<li>Very small files slow down queries<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Athena Performance, File Size Optimization<\/p>","fixed":false},{"id":"ana-17","c":"ana","q":"<p>A company uses Athena with a Glue Data Catalog. They want to ensure different teams can only query their own datasets. How should access be controlled?<\/p>","o":["Use S3 bucket policies","Use IAM policies with Glue Catalog permissions","Create separate AWS accounts","Use Athena workgroups only"],"a":[1],"x":"<ul>\n<li>IAM policies control access to Glue Catalog databases and tables<\/li>\n<li>Fine-grained permissions per team<\/li>\n<li>Can combine with S3 bucket policies<\/li>\n<li>Separate accounts is overly complex<\/li>\n<li>Workgroups organize queries but don't enforce data access<\/li>\n<li>Glue Catalog permissions are the primary control<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Athena Security, Glue Catalog Permissions<\/p>","fixed":false},{"id":"ana-18","c":"ana","q":"<p>A real-time application needs guaranteed ordering of events for each user. Events should be processed in the order they arrive per user. Which Kinesis feature ensures this?<\/p>","o":["Use the same shard for all records","Use the user ID as the partition key","Enable Kinesis enhanced fan-out","Use multiple shards with round-robin distribution"],"a":[1],"x":"<ul>\n<li>Partition key determines which shard receives the record<\/li>\n<li>Same partition key always goes to the same shard<\/li>\n<li>Records in a shard are ordered by sequence number<\/li>\n<li>Using user ID ensures all user events go to same shard (ordered)<\/li>\n<li>One shard doesn't scale<\/li>\n<li>Enhanced fan-out is for parallel consumers<\/li>\n<li>Round-robin breaks ordering<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Kinesis Data Streams, Ordering Guarantees<\/p>","fixed":false},{"id":"ana-19","c":"ana","q":"<p>A company needs to load VPC Flow Logs into Amazon S3 for analysis with Athena. The solution should be fully managed with minimal setup. What should be configured?<\/p>","o":["Use Kinesis Data Streams with Lambda","Use Kinesis Data Firehose as the Flow Logs destination","Use CloudWatch Logs with manual export","Use custom EC2 instances to collect logs"],"a":[1],"x":"<ul>\n<li>VPC Flow Logs can deliver directly to Kinesis Data Firehose<\/li>\n<li>Firehose automatically loads to S3<\/li>\n<li>Fully managed, no code required<\/li>\n<li>Can compress and partition data<\/li>\n<li>Manual export isn't automated<\/li>\n<li>Data Streams requires consumer application<\/li>\n<li>EC2 instances add operational overhead<\/li>\n<\/ul>\n<p><strong>References:<\/strong> VPC Flow Logs, Kinesis Data Firehose<\/p>","fixed":false},{"id":"ana-20","c":"ana","q":"<p>An Athena workgroup is configured with a data usage control of 1 TB per day. A user's query would scan 1.5 TB of data. What happens?<\/p>","o":["The query runs and scans 1.5 TB","The query is rejected","The query runs but only scans 1 TB","The user receives a warning but query proceeds"],"a":[1],"x":"<ul>\n<li>Workgroup data usage controls enforce limits<\/li>\n<li>Queries exceeding the limit are rejected<\/li>\n<li>Prevents cost overruns<\/li>\n<li>User must optimize query or request limit increase<\/li>\n<li>Query doesn't partially execute<\/li>\n<li>Hard enforcement, not just a warning<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Athena Workgroups, Cost Controls<\/p>","fixed":false},{"id":"ana-21","c":"ana","q":"<p>A financial services company needs to securely share curated, third-party financial datasets with its data analysts on AWS. The solution must support subscription-based access and automate dataset updates. Which AWS service should be used?<\/p>","o":["AWS Data Exchange","Amazon S3","AWS Glue Data Catalog","Amazon Redshift Data Sharing"],"a":[0],"x":"<ul>\n<li>AWS Data Exchange enables secure, subscription-based access to third-party datasets<\/li>\n<li>Automates dataset updates and notifications<\/li>\n<li>Integrates with S3, Redshift, and Lake Formation<\/li>\n<li>S3 is storage, not a data marketplace<\/li>\n<li>Glue Data Catalog is for metadata, not data sharing<\/li>\n<li>Redshift Data Sharing is for sharing data between Redshift clusters<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Data Exchange, Data Sharing<\/p>","fixed":false},{"id":"ana-22","c":"ana","q":"<p>A healthcare company wants to build a secure data lake on AWS to store and analyze sensitive patient data. They need fine-grained access control, data cataloging, and integration with analytics services. Which service should be used to manage permissions and data cataloging?<\/p>","o":["AWS Lake Formation","Amazon S3","AWS Glue","Amazon Athena"],"a":[0],"x":"<ul>\n<li>Lake Formation provides fine-grained access control for data lakes<\/li>\n<li>Manages permissions at table, column, and row level<\/li>\n<li>Integrates with Glue Data Catalog and analytics services (Athena, Redshift, EMR)<\/li>\n<li>S3 is storage, not access management<\/li>\n<li>Glue is for ETL and cataloging, but Lake Formation extends Glue with security<\/li>\n<li>Athena is for querying, not access management<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Lake Formation, Data Lake Security<\/p>","fixed":false},{"id":"ana-23","c":"ana","q":"<p>A media company needs to search, visualize, and analyze large volumes of log and event data in near real-time. Which AWS service is best suited for this use case?<\/p>","o":["Amazon OpenSearch Service","Amazon Athena","Amazon Redshift","AWS Glue"],"a":[0],"x":"<ul>\n<li>OpenSearch Service (formerly Elasticsearch) is designed for log analytics, search, and visualization<\/li>\n<li>Provides near real-time indexing and querying<\/li>\n<li>Integrates with Kibana for dashboards<\/li>\n<li>Athena is for ad-hoc SQL queries, not real-time search<\/li>\n<li>Redshift is for data warehousing<\/li>\n<li>Glue is for ETL, not search/visualization<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon OpenSearch Service, Log Analytics<\/p>","fixed":false},{"id":"ana-24","c":"ana","q":"<p>A data engineering team needs to ingest streaming data from Apache Kafka into AWS for analytics and storage. Which AWS service provides a fully managed, highly available Kafka environment?<\/p>","o":["Amazon MSK","Amazon Kinesis Data Streams","Amazon SQS","AWS Glue Streaming"],"a":[0],"x":"<ul>\n<li>Amazon MSK (Managed Streaming for Apache Kafka) provides a fully managed Kafka service<\/li>\n<li>Handles provisioning, patching, and scaling<\/li>\n<li>Integrates with Kinesis, Lambda, S3, Redshift<\/li>\n<li>Kinesis is a separate streaming service, not Kafka-compatible<\/li>\n<li>SQS is for message queuing, not streaming<\/li>\n<li>Glue Streaming is for ETL, not Kafka management<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon MSK, Streaming Data<\/p>","fixed":false},{"id":"arch-1","c":"arch","q":"<p>A company needs to deploy a web application that can handle unpredictable traffic spikes and minimize operational overhead. The application should scale automatically and use a pay-per-use pricing model. Which architecture is MOST appropriate?<\/p>","o":["EC2 instances with Auto Scaling behind an ALB","Serverless architecture with S3, CloudFront, API Gateway, Lambda, and DynamoDB","ECS containers on EC2 instances","EC2 instances with manual scaling"],"a":[1],"x":"<ul>\n<li>Serverless architecture automatically scales and is pay-per-use<\/li>\n<li>S3/CloudFront for static content<\/li>\n<li>API Gateway/Lambda for compute (scales automatically)<\/li>\n<li>DynamoDB for database (on-demand capacity)<\/li>\n<li>Zero operational overhead for infrastructure<\/li>\n<li>Option A requires some management and continuous costs<\/li>\n<li>Option C requires container orchestration<\/li>\n<li>Option D requires manual intervention<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Serverless Architecture, Auto Scaling<\/p>","fixed":false},{"id":"arch-2","c":"arch","q":"<p>A solutions architect is designing a highly available application that must survive the failure of an entire Availability Zone. The RTO requirement is less than 5 minutes. Which pattern should be implemented?<\/p>","o":["Single AZ deployment with automated backups","Multi-AZ deployment with Auto Scaling and Application Load Balancer","Cross-region replication with manual failover","Single region with daily snapshots"],"a":[1],"x":"<ul>\n<li>Multi-AZ deployment provides automatic failover<\/li>\n<li>ALB distributes traffic across AZs and health checks instances<\/li>\n<li>Auto Scaling replaces failed instances automatically<\/li>\n<li>Meets &lt; 5 minute RTO requirement<\/li>\n<li>Option A doesn't protect against AZ failure<\/li>\n<li>Option C has longer RTO (manual failover)<\/li>\n<li>Option D doesn't provide HA<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Multi-AZ Architecture, High Availability<\/p>","fixed":false},{"id":"arch-3","c":"arch","q":"<p>A company wants to implement a disaster recovery solution for their production database. They can tolerate a 1-hour data loss (RPO) and 4-hour recovery time (RTO). Which DR strategy is MOST cost-effective?<\/p>","o":["Multi-site active-active","Warm standby","Pilot light","Backup and restore"],"a":[2],"x":"<ul>\n<li>Pilot light maintains core services (like database replication)<\/li>\n<li>RPO: Minutes (database replication lag)<\/li>\n<li>RTO: Hours (time to scale up remaining services)<\/li>\n<li>More cost-effective than warm standby<\/li>\n<li>Meets the 1-hour RPO and 4-hour RTO requirements<\/li>\n<li>Multi-site is expensive and over-engineered<\/li>\n<li>Warm standby costs more than necessary<\/li>\n<li>Backup and restore may not meet RPO/RTO<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Disaster Recovery Strategies, Pilot Light<\/p>","fixed":false},{"id":"arch-4","c":"arch","q":"<p>An application experiences high database read load. The data is read frequently but rarely updated. Which caching strategy should be implemented to reduce database load?<\/p>","o":["Write-through caching","Cache-aside (Lazy Loading) with ElastiCache","Database connection pooling only","Increase database instance size"],"a":[1],"x":"<ul>\n<li>Cache-aside pattern is ideal for read-heavy workloads<\/li>\n<li>Application checks cache first, loads from DB if cache miss<\/li>\n<li>ElastiCache (Redis/Memcached) reduces database load<\/li>\n<li>Cost-effective solution<\/li>\n<li>Write-through is better for write-heavy workloads<\/li>\n<li>Connection pooling helps but doesn't cache data<\/li>\n<li>Scaling database is more expensive<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Caching Strategies, ElastiCache<\/p>","fixed":false},{"id":"arch-5","c":"arch","q":"<p>A company is building a microservices architecture and needs to decouple services to handle traffic spikes without losing messages. Which AWS service pattern should be used?<\/p>","o":["Direct API calls between services","SQS queues between services","Shared database between services","File-based communication via S3"],"a":[1],"x":"<ul>\n<li>SQS provides loose coupling and buffering between services<\/li>\n<li>Messages are persisted, not lost during traffic spikes<\/li>\n<li>Services process at their own pace<\/li>\n<li>Standard microservices pattern<\/li>\n<li>Direct API calls create tight coupling<\/li>\n<li>Shared database violates microservices principles<\/li>\n<li>S3 file-based communication is inefficient for real-time<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Microservices Architecture, SQS Decoupling<\/p>","fixed":false},{"id":"arch-6","c":"arch","q":"<p>A solutions architect needs to design a system that processes events from multiple sources (S3, DynamoDB, custom applications) and routes them to different targets based on event content. Which service is MOST appropriate?<\/p>","o":["Amazon SQS","Amazon SNS","Amazon EventBridge","AWS Step Functions"],"a":[2],"x":"<ul>\n<li>EventBridge is an event bus for routing events<\/li>\n<li>Supports multiple sources including AWS services and custom apps<\/li>\n<li>Content-based filtering and routing<\/li>\n<li>Built-in integration with 90+ AWS services<\/li>\n<li>SQS is for point-to-point messaging<\/li>\n<li>SNS is for pub/sub but limited filtering<\/li>\n<li>Step Functions is for workflow orchestration<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Event-Driven Architecture, EventBridge<\/p>","fixed":false},{"id":"arch-7","c":"arch","q":"<p>A company wants to minimize costs for a batch processing workload that runs nightly and can tolerate interruptions. Which compute option should be used?<\/p>","o":["On-Demand EC2 instances","Reserved Instances","Spot Instances","Dedicated Hosts"],"a":[2],"x":"<ul>\n<li>Spot Instances can save up to 90% compared to On-Demand<\/li>\n<li>Batch processing is fault-tolerant (can handle interruptions)<\/li>\n<li>Can checkpoint progress and resume<\/li>\n<li>Most cost-effective for this use case<\/li>\n<li>On-Demand is more expensive<\/li>\n<li>Reserved requires 1-3 year commitment<\/li>\n<li>Dedicated Hosts are most expensive<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Cost Optimization, Spot Instances<\/p>","fixed":false},{"id":"arch-8","c":"arch","q":"<p>An application requires sub-millisecond latency for database queries. The data is accessed in a key-value pattern. Which database solution should be used?<\/p>","o":["Amazon RDS with read replicas","DynamoDB with DAX (DynamoDB Accelerator)","Amazon Aurora","Amazon Redshift"],"a":[1],"x":"<ul>\n<li>DAX provides microsecond latency for DynamoDB<\/li>\n<li>In-memory cache specifically for DynamoDB<\/li>\n<li>Key-value access pattern is perfect for DynamoDB<\/li>\n<li>Meets sub-millisecond requirement<\/li>\n<li>RDS/Aurora have millisecond latency<\/li>\n<li>Redshift is for analytics, not operational workloads<\/li>\n<\/ul>\n<p><strong>References:<\/strong> DynamoDB DAX, Low Latency<\/p>","fixed":false},{"id":"arch-9","c":"arch","q":"<p>A global application needs to serve static content with the lowest possible latency worldwide. Which architecture should be implemented?<\/p>","o":["EC2 instances in multiple regions","S3 with CloudFront distribution","S3 with Cross-Region Replication","ALB in multiple regions"],"a":[1],"x":"<ul>\n<li>CloudFront is a CDN with 400+ edge locations globally<\/li>\n<li>Caches content close to users worldwide<\/li>\n<li>S3 origin for static content<\/li>\n<li>Lowest latency for global distribution<\/li>\n<li>EC2 requires management and doesn't cache at edge<\/li>\n<li>CRR helps availability but doesn't reduce latency<\/li>\n<li>ALB doesn't provide edge caching<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudFront, Global Architecture<\/p>","fixed":false},{"id":"arch-10","c":"arch","q":"<p>A three-tier web application has presentation, application, and database tiers. The database contains sensitive customer data. How should the tiers be deployed for security?<\/p>","o":["All tiers in public subnets","All tiers in private subnets","Presentation in public, application and database in private subnets","Presentation and application in public, database in private subnet"],"a":[2],"x":"<ul>\n<li>Presentation tier (web servers) needs internet access - public subnet<\/li>\n<li>Application tier doesn't need direct internet access - private subnet<\/li>\n<li>Database tier must be isolated - private subnet<\/li>\n<li>Follows defense-in-depth security principle<\/li>\n<li>Application tier accesses internet via NAT Gateway<\/li>\n<li>Database has no internet access<\/li>\n<li>Minimizes attack surface<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Three-Tier Architecture, Security Best Practices<\/p>","fixed":false},{"id":"arch-11","c":"arch","q":"<p>A company needs to orchestrate a complex workflow with multiple Lambda functions, error handling, and retry logic. Which service should be used?<\/p>","o":["EventBridge","SNS with Lambda subscriptions","AWS Step Functions","SQS with Lambda triggers"],"a":[2],"x":"<ul>\n<li>Step Functions orchestrates workflows with state machines<\/li>\n<li>Built-in error handling and retry logic<\/li>\n<li>Visual workflow designer<\/li>\n<li>Integrates with Lambda and other AWS services<\/li>\n<li>Best for complex, multi-step workflows<\/li>\n<li>EventBridge routes events but doesn't orchestrate<\/li>\n<li>SNS/SQS don't provide workflow orchestration<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Step Functions, Serverless Orchestration<\/p>","fixed":false},{"id":"arch-12","c":"arch","q":"<p>An application deployed across multiple regions needs a database that supports multi-region writes with automatic conflict resolution. Which database should be used?<\/p>","o":["RDS with cross-region read replicas","Aurora Global Database","DynamoDB Global Tables","Redshift with cross-region snapshots"],"a":[2],"x":"<ul>\n<li>DynamoDB Global Tables support multi-region active-active writes<\/li>\n<li>Automatic conflict resolution (last-writer-wins)<\/li>\n<li>Multi-master replication<\/li>\n<li>RDS replicas are read-only<\/li>\n<li>Aurora Global Database has one primary region for writes<\/li>\n<li>Redshift is for analytics, not multi-region writes<\/li>\n<\/ul>\n<p><strong>References:<\/strong> DynamoDB Global Tables, Multi-Region Architecture<\/p>","fixed":false},{"id":"arch-13","c":"arch","q":"<p>A company wants to implement a pub/sub messaging pattern where multiple consumers receive the same message. Which service should be used?<\/p>","o":["Amazon SQS Standard Queue","Amazon SQS FIFO Queue","Amazon SNS","Amazon Kinesis Data Streams"],"a":[2],"x":"<ul>\n<li>SNS is publish-subscribe messaging service<\/li>\n<li>One message published to topic, multiple subscribers receive it<\/li>\n<li>Fan-out pattern<\/li>\n<li>Classic pub/sub use case<\/li>\n<li>SQS is point-to-point (one consumer per message)<\/li>\n<li>Kinesis allows multiple consumers but is for streaming data<\/li>\n<\/ul>\n<p><strong>References:<\/strong> SNS, Pub/Sub Pattern<\/p>","fixed":false},{"id":"arch-14","c":"arch","q":"<p>An application needs to process uploaded images: resize, apply filters, and update database. The processing can take several minutes. Which architecture ensures reliable processing?<\/p>","o":["API Gateway → Lambda (process synchronously)","API Gateway → Lambda → S3 → Lambda (triggered by S3) → DynamoDB","EC2 instances polling S3","Upload directly to EC2 for processing"],"a":[1],"x":"<ul>\n<li>Upload triggers first Lambda to save to S3<\/li>\n<li>S3 event triggers second Lambda for processing (asynchronous)<\/li>\n<li>Decoupled, reliable processing<\/li>\n<li>Lambda can run up to 15 minutes<\/li>\n<li>Option A: API Gateway has 29-second timeout<\/li>\n<li>Option C: Inefficient polling<\/li>\n<li>Option D: No auto-scaling, not serverless<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Event-Driven Architecture, Asynchronous Processing<\/p>","fixed":false},{"id":"arch-15","c":"arch","q":"<p>A financial application requires ACID transactions across multiple tables. The database must scale for read traffic. Which database solution should be used?<\/p>","o":["DynamoDB","Amazon Aurora with Read Replicas","Amazon Redshift","ElastiCache"],"a":[1],"x":"<ul>\n<li>Aurora supports ACID transactions (relational database)<\/li>\n<li>Read Replicas scale read traffic (up to 15 replicas)<\/li>\n<li>Better performance than standard RDS<\/li>\n<li>DynamoDB doesn't support traditional ACID across multiple items<\/li>\n<li>Redshift is for analytics, not transactional workloads<\/li>\n<li>ElastiCache is for caching, not primary database<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Aurora, ACID Transactions<\/p>","fixed":false},{"id":"arch-16","c":"arch","q":"<p>A company needs to ensure their web application can handle a sudden 10x traffic increase during product launches. Which architectural pattern should be implemented?<\/p>","o":["Static capacity with manual scaling","Auto Scaling with target tracking based on CPU utilization","Pre-warming with scheduled scaling","Serverless architecture with Lambda and DynamoDB on-demand"],"a":[3],"x":"<ul>\n<li>Serverless scales automatically without pre-warming<\/li>\n<li>Lambda scales to thousands of concurrent executions<\/li>\n<li>DynamoDB on-demand scales with traffic<\/li>\n<li>No capacity planning required<\/li>\n<li>Option A doesn't scale<\/li>\n<li>Option B has lag time for scaling<\/li>\n<li>Option C requires predicting launch time<\/li>\n<li>Serverless handles unpredictable spikes best<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Serverless Architecture, Elastic Scaling<\/p>","fixed":false},{"id":"arch-17","c":"arch","q":"<p>An application uses CloudFront, ALB, EC2, and RDS. Users in a specific region experience slow performance. What is the MOST likely cause and solution?<\/p>","o":["Increase EC2 instance size","Deploy application stack in the user's region with Route 53 latency-based routing","Enable CloudFront compression","Upgrade to Provisioned IOPS for RDS"],"a":[1],"x":"<ul>\n<li>Regional deployment reduces latency for local users<\/li>\n<li>Route 53 latency-based routing directs to nearest region<\/li>\n<li>CloudFront caches static content but dynamic content goes to origin<\/li>\n<li>Multi-region deployment needed for dynamic content<\/li>\n<li>Increasing instance size doesn't reduce network latency<\/li>\n<li>Compression helps but doesn't solve regional latency<\/li>\n<li>IOPS doesn't affect network latency<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Multi-Region Architecture, Latency Optimization<\/p>","fixed":false},{"id":"arch-18","c":"arch","q":"<p>A company wants to implement defense-in-depth security for their web application. Which combination of services should be used?<\/p>","o":["Security Groups only","WAF + Shield + Security Groups + NACLs + KMS encryption","IAM policies and Security Groups","CloudFront with HTTPS only"],"a":[1],"x":"<ul>\n<li>Defense-in-depth requires multiple security layers<\/li>\n<li>WAF: Application layer protection (OWASP Top 10)<\/li>\n<li>Shield: DDoS protection<\/li>\n<li>Security Groups: Instance-level firewall<\/li>\n<li>NACLs: Subnet-level firewall<\/li>\n<li>KMS: Data encryption<\/li>\n<li>Layered approach provides comprehensive security<\/li>\n<li>Single layer security is insufficient<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Defense in Depth, Security Patterns<\/p>","fixed":false},{"id":"arch-19","c":"arch","q":"<p>A batch processing application needs to read messages from a queue, process them, and only delete messages after successful processing. Which service and pattern should be used?<\/p>","o":["SNS with immediate deletion","SQS with visibility timeout and explicit deletion","Kinesis with checkpointing","EventBridge with Lambda"],"a":[1],"x":"<ul>\n<li>SQS supports visibility timeout (hides message during processing)<\/li>\n<li>Message only deleted after explicit DeleteMessage call<\/li>\n<li>Ensures message not lost if processing fails<\/li>\n<li>If processing fails, message becomes visible again<\/li>\n<li>SNS doesn't persist messages<\/li>\n<li>Kinesis is for streaming, not queue pattern<\/li>\n<li>EventBridge doesn't provide message persistence<\/li>\n<\/ul>\n<p><strong>References:<\/strong> SQS, Message Processing Patterns<\/p>","fixed":false},{"id":"arch-20","c":"arch","q":"<p>A company wants to optimize costs for a development environment that runs Monday-Friday, 9 AM-6 PM. The environment uses EC2, RDS, and NAT Gateway. What should be done?<\/p>","o":["Use Reserved Instances","Use Instance Scheduler to start/stop resources outside business hours","Migrate to Serverless","Use Spot Instances"],"a":[1],"x":"<ul>\n<li>Instance Scheduler automatically starts/stops resources on schedule<\/li>\n<li>Saves costs during nights and weekends (65% of week)<\/li>\n<li>Works with EC2 and RDS<\/li>\n<li>Reserved Instances require 1-3 year commitment, doesn't stop resources<\/li>\n<li>Serverless may not support all workloads<\/li>\n<li>Spot Instances can be interrupted during work hours<\/li>\n<li>Scheduled stop/start is most cost-effective for dev environments<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Cost Optimization, Instance Scheduler<\/p>","fixed":false},{"id":"cost-1","c":"cost","q":"<p>A company has a web application running on 20 EC2 instances that operate 24/7 with consistent usage. The instances have been running for 2 years and are expected to run for at least 2 more years. What is the MOST cost-effective pricing model?<\/p>","o":["On-Demand Instances","1-year Reserved Instances with No Upfront payment","3-year Reserved Instances with All Upfront payment","Spot Instances"],"a":[2],"x":"<ul>\n<li>Steady-state workload running 24/7 is perfect for Reserved Instances<\/li>\n<li>3-year term provides highest discount (up to 72%)<\/li>\n<li>All Upfront payment p
