ion (on-demand pricing)<\/li>\n<\/ul>\n<p><strong>DynamoDB Features<\/strong>:\n- Key-value and document database\n- DynamoDB Streams (change data capture)\n- Global Tables (multi-region replication)\n- DynamoDB Accelerator (DAX) for microsecond latency\n- Point-in-time recovery\n- On-demand and provisioned capacity modes<\/p>\n<p><strong>When to use DynamoDB<\/strong>:\n- Need extreme scale\n- Variable workloads\n- Need sub-10ms latency\n- Key-value or document data model<\/p>\n<p><strong>References:<\/strong> Amazon DynamoDB, NoSQL Databases<\/p>","fixed":false},{"id":"db-3","c":"db","q":"<p>A company wants to cache database query results to reduce read load on their RDS database and improve response times. Which service should be used?<\/p>","o":["Amazon CloudFront","Amazon ElastiCache","DynamoDB Accelerator (DAX)","Amazon S3"],"a":[1],"x":"<ul>\n<li><strong>Amazon ElastiCache<\/strong> provides in-memory caching<\/li>\n<li>Redis or Memcached engines<\/li>\n<li>Microsecond latency<\/li>\n<li>Reduces database load<\/li>\n<li>Session storage<\/li>\n<li>Leaderboards, real-time analytics<\/li>\n<\/ul>\n<p><strong>ElastiCache Engines<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Redis<\/th>\n<th>Memcached<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Data Types<\/strong><\/td>\n<td>Advanced (strings, sets, sorted sets)<\/td>\n<td>Simple (strings)<\/td>\n<\/tr>\n<tr>\n<td><strong>Persistence<\/strong><\/td>\n<td>Yes (snapshots)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Replication<\/strong><\/td>\n<td>Yes (Multi-AZ)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Pub/Sub<\/strong><\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Sorted Sets<\/strong><\/td>\n<td>Yes (leaderboards)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Multi-threaded<\/strong><\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Common Pattern<\/strong>: Application → ElastiCache → RDS (cache-aside)<\/p>\n<p><strong>References:<\/strong> Amazon ElastiCache, Caching Strategies<\/p>","fixed":false},{"id":"db-4","c":"db","q":"<p>A data warehouse requires complex analytical queries across petabytes of data. Which AWS database service is MOST appropriate?<\/p>","o":["Amazon RDS","Amazon DynamoDB","Amazon Redshift","Amazon Aurora"],"a":[2],"x":"<ul>\n<li><strong>Amazon Redshift<\/strong> is data warehouse service<\/li>\n<li>Columnar storage<\/li>\n<li>Massively parallel processing (MPP)<\/li>\n<li>Petabyte-scale<\/li>\n<li>SQL queries (PostgreSQL-compatible)<\/li>\n<li>Integration with S3, EMR, Glue<\/li>\n<\/ul>\n<p><strong>Redshift Features<\/strong>:\n- Columnar storage (better compression, faster queries)\n- Redshift Spectrum (query S3 data directly)\n- Automatic backups and snapshots\n- Encryption at rest and in transit\n- Concurrency Scaling (handle burst queries)\n- Result caching<\/p>\n<p><strong>Redshift vs RDS<\/strong>:\n- <strong>Redshift<\/strong>: Analytics, OLAP, data warehouse\n- <strong>RDS<\/strong>: Transactional, OLTP, operational database<\/p>\n<p><strong>Use Cases<\/strong>:\n- Business intelligence\n- Historical data analysis\n- Large-scale analytics\n- Reporting<\/p>\n<p><strong>References:<\/strong> Amazon Redshift, Data Warehousing<\/p>","fixed":false},{"id":"db-5","c":"db","q":"<p>A MongoDB application needs to be migrated to AWS with minimal changes. Which service should be used?<\/p>","o":["Amazon RDS","Amazon DynamoDB","Amazon DocumentDB","Amazon Neptune"],"a":[2],"x":"<ul>\n<li><strong>Amazon DocumentDB<\/strong> is MongoDB-compatible document database<\/li>\n<li>Fully managed<\/li>\n<li>MongoDB 3.6 and 4.0 compatibility<\/li>\n<li>Scales to millions of requests/second<\/li>\n<li>Multi-AZ replication<\/li>\n<li>Automatic backups<\/li>\n<\/ul>\n<p><strong>DocumentDB Features<\/strong>:\n- Document data model (JSON)\n- MongoDB drivers and tools compatible\n- Storage auto-scales to 64 TB\n- Up to 15 read replicas\n- Continuous backup to S3<\/p>\n<p><strong>Migration<\/strong>: Use AWS Database Migration Service (DMS)<\/p>\n<p><strong>When to use<\/strong>:\n- Existing MongoDB workloads\n- Document-oriented data\n- Need managed service<\/p>\n<p><strong>References:<\/strong> Amazon DocumentDB, MongoDB on AWS<\/p>","fixed":false},{"id":"db-6","c":"db","q":"<p>An application needs to store relationships between data entities (social network connections, fraud detection). Which database is MOST suitable?<\/p>","o":["Amazon RDS","Amazon DynamoDB","Amazon Neptune","Amazon DocumentDB"],"a":[2],"x":"<ul>\n<li><strong>Amazon Neptune<\/strong> is graph database<\/li>\n<li>Store and query highly connected data<\/li>\n<li>Supports Gremlin and SPARQL<\/li>\n<li>Fast relationship queries<\/li>\n<li>Multi-AZ replication<\/li>\n<\/ul>\n<p><strong>Neptune Use Cases<\/strong>:\n- Social networks\n- Fraud detection\n- Recommendation engines\n- Knowledge graphs\n- Network topology\n- Supply chain<\/p>\n<p><strong>Graph vs Relational<\/strong>:\n- <strong>Graph<\/strong>: Complex relationships, traversals\n- <strong>Relational<\/strong>: Joins become expensive for deep relationships\n- Graph databases optimize for relationship queries<\/p>\n<p><strong>References:<\/strong> Amazon Neptune, Graph Databases<\/p>","fixed":false},{"id":"db-7","c":"db","q":"<p>A company needs to run an RDS database with automatic failover to a standby instance in another AZ. What should be configured?<\/p>","o":["RDS Read Replicas","RDS Multi-AZ Deployment","RDS Snapshots","RDS Cross-Region Replication"],"a":[1],"x":"<ul>\n<li><strong>RDS Multi-AZ<\/strong> provides high availability<\/li>\n<li>Synchronous replication to standby<\/li>\n<li>Automatic failover (1-2 minutes)<\/li>\n<li>Same region, different AZ<\/li>\n<li>No manual intervention<\/li>\n<\/ul>\n<p><strong>Multi-AZ vs Read Replicas<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Multi-AZ<\/th>\n<th>Read Replicas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Purpose<\/strong><\/td>\n<td>High availability<\/td>\n<td>Read scaling<\/td>\n<\/tr>\n<tr>\n<td><strong>Replication<\/strong><\/td>\n<td>Synchronous<\/td>\n<td>Asynchronous<\/td>\n<\/tr>\n<tr>\n<td><strong>Failover<\/strong><\/td>\n<td>Automatic<\/td>\n<td>Manual promotion<\/td>\n<\/tr>\n<tr>\n<td><strong>Access<\/strong><\/td>\n<td>Standby not accessible<\/td>\n<td>Can read from replicas<\/td>\n<\/tr>\n<tr>\n<td><strong>Region<\/strong><\/td>\n<td>Same<\/td>\n<td>Same or cross-region<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Multi-AZ Failover Triggers<\/strong>:\n- AZ failure\n- Instance failure\n- Storage failure\n- Software patching (planned)<\/p>\n<p><strong>References:<\/strong> RDS Multi-AZ, High Availability<\/p>","fixed":false},{"id":"db-8","c":"db","q":"<p>An application requires DynamoDB but needs to support complex queries with multiple attributes. What feature should be used?<\/p>","o":["DynamoDB Streams","DynamoDB Global Secondary Index (GSI)","DynamoDB Auto Scaling","DynamoDB Accelerator (DAX)"],"a":[1],"x":"<ul>\n<li><strong>Global Secondary Index (GSI)<\/strong>:<\/li>\n<li>Query on non-primary key attributes<\/li>\n<li>Different partition and sort keys than base table<\/li>\n<li>Eventually consistent reads<\/li>\n<li>Can be added after table creation<\/li>\n<\/ul>\n<p><strong>DynamoDB Index Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Keys<\/th>\n<th>Projection<\/th>\n<th>Creation<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LSI<\/strong><\/td>\n<td>Same partition key<\/td>\n<td>Can choose<\/td>\n<td>At table creation only<\/td>\n<\/tr>\n<tr>\n<td><strong>GSI<\/strong><\/td>\n<td>Different keys<\/td>\n<td>Can choose<\/td>\n<td>Anytime<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>GSI Use Cases<\/strong>:\n- Query by different attributes\n- Support multiple access patterns\n- Flexible querying<\/p>\n<p><strong>Example<\/strong>:\n- Table: Partition Key = UserID\n- GSI: Partition Key = Email\n- Can now query by email<\/p>\n<p><strong>References:<\/strong> DynamoDB Indexes, GSI vs LSI<\/p>","fixed":false},{"id":"db-9","c":"db","q":"<p>A company wants to achieve microsecond latency for DynamoDB read operations. Which feature should be enabled?<\/p>","o":["DynamoDB Streams","DynamoDB Global Tables","DynamoDB Accelerator (DAX)","DynamoDB Auto Scaling"],"a":[2],"x":"<ul>\n<li><strong>DynamoDB Accelerator (DAX)<\/strong>:<\/li>\n<li>In-memory cache for DynamoDB<\/li>\n<li>Microsecond latency (vs millisecond)<\/li>\n<li>Fully managed, highly available<\/li>\n<li>No application code changes (drop-in replacement)<\/li>\n<\/ul>\n<p><strong>DAX Benefits<\/strong>:\n- 10x performance improvement for read-heavy workloads\n- Reduces read load on DynamoDB\n- Eventually consistent reads\n- Write-through cache<\/p>\n<p><strong>DAX vs ElastiCache<\/strong>:\n- <strong>DAX<\/strong>: DynamoDB-specific, easier integration\n- <strong>ElastiCache<\/strong>: General purpose, more control<\/p>\n<p><strong>When to use DAX<\/strong>:\n- Read-heavy workloads\n- Need microsecond latency\n- Repeated reads of same items\n- Real-time bidding, gaming<\/p>\n<p><strong>References:<\/strong> DynamoDB Accelerator (DAX), Caching<\/p>","fixed":false},{"id":"db-10","c":"db","q":"<p>An RDS database needs to handle increased read traffic. Write traffic is low. What is the MOST cost-effective solution?<\/p>","o":["Upgrade to larger instance","Enable RDS Multi-AZ","Create RDS Read Replicas","Use ElastiCache"],"a":[2],"x":"<ul>\n<li><strong>RDS Read Replicas<\/strong>:<\/li>\n<li>Asynchronous replication<\/li>\n<li>Offload read traffic from primary<\/li>\n<li>Up to 15 replicas (Aurora)<\/li>\n<li>Same region or cross-region<\/li>\n<li>Can be promoted to standalone<\/li>\n<\/ul>\n<p><strong>Read Replica Use Cases<\/strong>:\n- Read-heavy workloads\n- Reporting/analytics (separate from production)\n- Cross-region disaster recovery (promotion)\n- Read scaling<\/p>\n<p><strong>Benefits<\/strong>:\n- Cost-effective scaling for reads\n- No impact on primary instance\n- Can use different instance types<\/p>\n<p><strong>Replication Lag<\/strong>: Monitor with CloudWatch metric<\/p>\n<p><strong>References:<\/strong> RDS Read Replicas, Read Scaling<\/p>","fixed":false},{"id":"db-11","c":"db","q":"<p>A global application requires DynamoDB tables to be replicated across multiple AWS regions with low-latency local reads and writes. Which feature should be used?<\/p>","o":["DynamoDB Streams","DynamoDB Global Tables","DynamoDB Cross-Region Replication","AWS Database Migration Service"],"a":[1],"x":"<ul>\n<li><strong>DynamoDB Global Tables<\/strong>:<\/li>\n<li>Multi-region, multi-active replication<\/li>\n<li>Bi-directional replication<\/li>\n<li>Local read/write in each region<\/li>\n<li>Sub-second latency<\/li>\n<li>Conflict resolution (last writer wins)<\/li>\n<\/ul>\n<p><strong>Global Tables Requirements<\/strong>:\n- DynamoDB Streams enabled\n- Same table name across regions\n- Same primary key structure<\/p>\n<p><strong>Use Cases<\/strong>:\n- Global applications\n- Disaster recovery\n- Multi-region high availability\n- Reduce latency for global users<\/p>\n<p><strong>References:<\/strong> DynamoDB Global Tables, Multi-Region<\/p>","fixed":false},{"id":"db-12","c":"db","q":"<p>A company needs to ensure RDS database backups are retained for 90 days for compliance. What should be configured?<\/p>","o":["Automated Backups with 90-day retention","Manual Snapshots","Both automated backups (35 days) and manual snapshots","RDS Cross-Region Replication"],"a":[2],"x":"<ul>\n<li><strong>RDS Automated Backups<\/strong>: Max 35 days retention<\/li>\n<li><strong>Manual Snapshots<\/strong>: Retained until explicitly deleted<\/li>\n<li>For &gt; 35 days: Use manual snapshots<\/li>\n<\/ul>\n<p><strong>RDS Backup Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Retention<\/th>\n<th>Deleted with DB<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Automated<\/strong><\/td>\n<td>1-35 days<\/td>\n<td>Yes<\/td>\n<td>Point-in-time recovery<\/td>\n<\/tr>\n<tr>\n<td><strong>Manual<\/strong><\/td>\n<td>Until deleted<\/td>\n<td>No<\/td>\n<td>Long-term retention<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Best Practice for Long Retention<\/strong>:\n1. Enable automated backups (35 days)\n2. Create manual snapshots for long-term\n3. Use lifecycle policies to copy to S3/Glacier<\/p>\n<p><strong>Automated Backup Features<\/strong>:\n- Daily full snapshot\n- Transaction logs every 5 minutes\n- Point-in-time recovery within retention period<\/p>\n<p><strong>References:<\/strong> RDS Backups, Backup Retention<\/p>","fixed":false},{"id":"db-13","c":"db","q":"<p>An application needs time-series data storage for IoT sensor data with automatic data retention policies. Which database is MOST appropriate?<\/p>","o":["Amazon DynamoDB","Amazon RDS","Amazon Timestream","Amazon Redshift"],"a":[2],"x":"<ul>\n<li><strong>Amazon Timestream<\/strong> is purpose-built for time-series data<\/li>\n<li>IoT, DevOps, analytics<\/li>\n<li>Automatic data lifecycle management<\/li>\n<li>Built-in time-series analytics<\/li>\n<li>1000x faster, 1/10th cost vs relational<\/li>\n<\/ul>\n<p><strong>Timestream Features<\/strong>:\n- Automatic tiering (memory → magnetic)\n- Built-in time-series functions\n- Serverless, auto-scaling\n- SQL queries<\/p>\n<p><strong>Use Cases<\/strong>:\n- IoT sensor data\n- Application monitoring\n- DevOps metrics\n- Industrial telemetry<\/p>\n<p><strong>Timestream vs Alternatives<\/strong>:\n- <strong>DynamoDB<\/strong>: General NoSQL, manual TTL\n- <strong>Redshift<\/strong>: Data warehouse, not optimized for time-series\n- <strong>Timestream<\/strong>: Purpose-built, best for time-series<\/p>\n<p><strong>References:<\/strong> Amazon Timestream, Time-Series Databases<\/p>","fixed":false},{"id":"db-14","c":"db","q":"<p>A company wants to migrate an on-premises Oracle database to AWS with minimal downtime. Which service should be used?<\/p>","o":["AWS Database Migration Service (DMS)","AWS DataSync","AWS Snowball","Manual export/import"],"a":[0],"x":"<ul>\n<li><strong>AWS DMS<\/strong> (Database Migration Service):<\/li>\n<li>Migrate databases with minimal downtime<\/li>\n<li>Source database remains operational<\/li>\n<li>Supports homogeneous and heterogeneous migrations<\/li>\n<li>Continuous data replication<\/li>\n<\/ul>\n<p><strong>DMS Migration Types<\/strong>:\n1. <strong>Homogeneous<\/strong>: Oracle → Oracle, MySQL → Aurora MySQL\n2. <strong>Heterogeneous<\/strong>: Oracle → Aurora PostgreSQL (use SCT)<\/p>\n<p><strong>DMS Features<\/strong>:\n- Continuous replication\n- Multi-AZ for high availability\n- Automatic failover\n- Supports many database engines<\/p>\n<p><strong>Migration Steps<\/strong>:\n1. Create replication instance\n2. Configure source and target endpoints\n3. Create migration task\n4. Full load + CDC (Change Data Capture)\n5. Cutover when ready<\/p>\n<p><strong>References:<\/strong> AWS Database Migration Service, Database Migration<\/p>","fixed":false},{"id":"db-15","c":"db","q":"<p>An application uses RDS MySQL. The company wants to encrypt an existing unencrypted database. What is the correct approach?<\/p>","o":["Enable encryption on the existing database","Create encrypted snapshot, restore to new encrypted instance","Use AWS KMS to encrypt in-place","Export data and re-import to encrypted instance"],"a":[1],"x":"<ul>\n<li><strong>Cannot encrypt existing RDS instance directly<\/strong><\/li>\n<li>Must create encrypted copy<\/li>\n<\/ul>\n<p><strong>Encryption Process<\/strong>:\n1. Create snapshot of unencrypted DB\n2. Copy snapshot with encryption enabled\n3. Restore encrypted snapshot to new DB instance\n4. Update application endpoint\n5. Delete old instance<\/p>\n<p><strong>RDS Encryption<\/strong>:\n- Uses AWS KMS for key management\n- Encrypts data at rest (storage, backups, snapshots, read replicas)\n- Cannot disable encryption once enabled\n- Minimal performance impact<\/p>\n<p><strong>Alternative<\/strong>: Use AWS DMS to migrate with encryption enabled<\/p>\n<p><strong>References:<\/strong> RDS Encryption, Encrypting Existing Databases<\/p>","fixed":false},{"id":"db-16","c":"db","q":"<p>A DynamoDB table experiences variable traffic patterns throughout the day. What capacity mode should be used to optimize costs?<\/p>","o":["Provisioned Capacity","On-Demand Capacity","Reserved Capacity","Auto Scaling"],"a":[1],"x":"<ul>\n<li><strong>On-Demand Capacity<\/strong>:<\/li>\n<li>Pay per request<\/li>\n<li>No capacity planning<\/li>\n<li>Scales automatically<\/li>\n<li>Ideal for unpredictable/variable workloads<\/li>\n<\/ul>\n<p><strong>Capacity Modes Comparison<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Mode<\/th>\n<th>Best For<\/th>\n<th>Pricing<\/th>\n<th>Scaling<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>On-Demand<\/strong><\/td>\n<td>Variable traffic<\/td>\n<td>Per request<\/td>\n<td>Automatic<\/td>\n<\/tr>\n<tr>\n<td><strong>Provisioned<\/strong><\/td>\n<td>Predictable traffic<\/td>\n<td>Per hour (RCU/WCU)<\/td>\n<td>Manual or Auto Scaling<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>When to Use<\/strong>:\n- <strong>On-Demand<\/strong>: New tables, unpredictable, spiky traffic\n- <strong>Provisioned<\/strong>: Predictable, steady traffic, cost optimization<\/p>\n<p><strong>Cost<\/strong>: On-Demand can be more expensive for consistent workloads<\/p>\n<p><strong>Can switch between modes<\/strong> once per 24 hours<\/p>\n<p><strong>References:<\/strong> DynamoDB Capacity Modes, On-Demand vs Provisioned<\/p>","fixed":false},{"id":"db-17","c":"db","q":"<p>An application requires ACID transactions across multiple DynamoDB tables. Which feature should be used?<\/p>","o":["DynamoDB Streams","DynamoDB Transactions","DynamoDB Batch Operations","DynamoDB Global Tables"],"a":[1],"x":"<ul>\n<li><strong>DynamoDB Transactions<\/strong>:<\/li>\n<li>ACID properties (Atomicity, Consistency, Isolation, Durability)<\/li>\n<li>All-or-nothing operations<\/li>\n<li>Up to 100 items or 4 MB per transaction<\/li>\n<li>TransactWriteItems and TransactGetItems<\/li>\n<\/ul>\n<p><strong>Transaction Use Cases<\/strong>:\n- Financial transactions\n- Order processing\n- Inventory management\n- Need data consistency across items<\/p>\n<p><strong>Transaction APIs<\/strong>:\n- <code>TransactWriteItems<\/code>: Atomic writes\n- <code>TransactGetItems<\/code>: Snapshot reads<\/p>\n<p><strong>Cost<\/strong>: 2x the cost of standard reads/writes<\/p>\n<p><strong>References:<\/strong> DynamoDB Transactions, ACID Compliance<\/p>","fixed":false},{"id":"db-18","c":"db","q":"<p>A company wants to track changes to DynamoDB items in real-time to update materialized views and trigger workflows. Which feature should be used?<\/p>","o":["DynamoDB Auto Scaling","DynamoDB Streams","DynamoDB Backups","CloudWatch Events"],"a":[1],"x":"<ul>\n<li><strong>DynamoDB Streams<\/strong>:<\/li>\n<li>Ordered record of item-level changes<\/li>\n<li>Near real-time (typically &lt; 1 second)<\/li>\n<li>24-hour retention<\/li>\n<li>Exactly-once delivery<\/li>\n<\/ul>\n<p><strong>Stream View Types<\/strong>:\n- <strong>KEYS_ONLY<\/strong>: Only key attributes\n- <strong>NEW_IMAGE<\/strong>: Entire item after change\n- <strong>OLD_IMAGE<\/strong>: Entire item before change\n- <strong>NEW_AND_OLD_IMAGES<\/strong>: Both before and after<\/p>\n<p><strong>Use Cases<\/strong>:\n- Update materialized views\n- Trigger Lambda functions\n- Cross-region replication (Global Tables)\n- Data pipelines\n- Analytics<\/p>\n<p><strong>Common Pattern<\/strong>: DynamoDB Streams → Lambda → Process changes<\/p>\n<p><strong>References:<\/strong> DynamoDB Streams, Change Data Capture<\/p>","fixed":false},{"id":"db-19","c":"db","q":"<p>An Aurora database cluster needs to handle analytics queries without impacting production traffic. What should be configured?<\/p>","o":["Aurora Read Replicas","Aurora Serverless","Aurora Global Database","RDS Read Replicas"],"a":[0],"x":"<ul>\n<li><strong>Aurora Read Replicas<\/strong>:<\/li>\n<li>Up to 15 replicas<\/li>\n<li>Low replication lag (&lt; 10ms)<\/li>\n<li>Offload read traffic<\/li>\n<li>Can have custom endpoints<\/li>\n<\/ul>\n<p><strong>Aurora Custom Endpoints<\/strong>:\n- Direct specific workloads to specific replicas\n- Example: Analytics queries to larger instances<\/p>\n<p><strong>Reader Endpoint<\/strong>:\n- Load balances across all read replicas\n- Automatic failover if primary fails<\/p>\n<p><strong>Aurora Auto Scaling<\/strong>:\n- Automatically add/remove replicas based on load<\/p>\n<p><strong>References:<\/strong> Aurora Read Replicas, Aurora Endpoints<\/p>","fixed":false},{"id":"db-20","c":"db","q":"<p>A serverless application needs a database that automatically scales capacity based on workload. Which option is MOST suitable?<\/p>","o":["RDS with Auto Scaling","Aurora Serverless","DynamoDB On-Demand","Both B and C"],"a":[3],"x":"<p>Both are suitable for serverless applications:<\/p>\n<p><strong>Aurora Serverless<\/strong>:\n- Automatically scales compute capacity\n- Pay per second for compute\n- Ideal for intermittent/unpredictable workloads\n- SQL database (PostgreSQL/MySQL)<\/p>\n<p><strong>DynamoDB On-Demand<\/strong>:\n- Automatically scales throughput\n- Pay per request\n- NoSQL database\n- Sub-10ms latency<\/p>\n<p><strong>Choose Based On<\/strong>:\n- <strong>Need SQL, relational<\/strong> → Aurora Serverless\n- <strong>Need NoSQL, extreme scale<\/strong> → DynamoDB On-Demand\n- <strong>Intermittent workloads<\/strong> → Both work\n- <strong>Dev/test environments<\/strong> → Aurora Serverless\n- <strong>Serverless apps<\/strong> → Both work<\/p>\n<p><strong>References:<\/strong> Aurora Serverless, DynamoDB On-Demand, Serverless Databases<\/p>","fixed":true},{"id":"db-21","c":"db","q":"<p>A development team needs a fully managed, scalable, and highly available Apache Cassandra-compatible database for their application. Which AWS service should they use?<\/p>","o":["Amazon Keyspaces","Amazon DynamoDB","Amazon RDS for PostgreSQL","Amazon Aurora"],"a":[0],"x":"<ul>\n<li>Amazon Keyspaces is a managed Cassandra-compatible database<\/li>\n<li>Supports Cassandra Query Language (CQL)<\/li>\n<li>DynamoDB is NoSQL but not Cassandra-compatible<\/li>\n<li>RDS and Aurora are relational databases<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon Keyspaces, Managed Cassandra<\/p>","fixed":false},{"id":"db-22","c":"db","q":"<p>A financial institution needs a fully managed, immutable, cryptographically verifiable ledger database for recording transactions. Which AWS service should they use?<\/p>","o":["Amazon QLDB","Amazon Aurora","Amazon RDS","Amazon DynamoDB"],"a":[0],"x":"<ul>\n<li>Amazon QLDB (Quantum Ledger Database) is a fully managed ledger database<\/li>\n<li>Provides immutable, cryptographically verifiable transaction log<\/li>\n<li>Aurora, RDS, and DynamoDB are not ledger databases<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon QLDB, Ledger Database<\/p>","fixed":false},{"id":"net-1","c":"net","q":"<p>A company wants to create an isolated network in AWS where they can launch resources. Which AWS service should they use?<\/p>","o":["AWS Direct Connect","Amazon VPC","AWS Transit Gateway","Amazon Route 53"],"a":[1],"x":"<ul>\n<li><strong>Amazon VPC<\/strong> (Virtual Private Cloud) provides isolated network environment<\/li>\n<li>Logically isolated section of AWS Cloud<\/li>\n<li>Complete control over networking (IP ranges, subnets, route tables, gateways)<\/li>\n<li>Can create public and private subnets<\/li>\n<\/ul>\n<p><strong>VPC Key Components<\/strong>:\n- <strong>CIDR Block<\/strong>: IP address range (e.g., 10.0.0.0/16)\n- <strong>Subnets<\/strong>: Subdivisions within VPC\n- <strong>Route Tables<\/strong>: Control traffic routing\n- <strong>Internet Gateway<\/strong>: Access to internet\n- <strong>NAT Gateway<\/strong>: Outbound internet for private subnets<\/p>\n<p><strong>References:<\/strong> Amazon VPC, VPC Fundamentals<\/p>","fixed":false},{"id":"net-2","c":"net","q":"<p>A private subnet contains EC2 instances that need to download software updates from the internet. The instances should NOT be directly accessible from the internet. What should be configured?<\/p>","o":["Internet Gateway","NAT Gateway","Virtual Private Gateway","VPC Peering"],"a":[1],"x":"<ul>\n<li><strong>NAT Gateway<\/strong> enables outbound internet access for private subnets<\/li>\n<li>Instances remain private (no inbound from internet)<\/li>\n<li>Placed in public subnet<\/li>\n<li>Route private subnet traffic to NAT Gateway<\/li>\n<\/ul>\n<p><strong>NAT Gateway vs NAT Instance<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>NAT Gateway<\/th>\n<th>NAT Instance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Managed<\/strong><\/td>\n<td>AWS-managed<\/td>\n<td>Customer-managed<\/td>\n<\/tr>\n<tr>\n<td><strong>Availability<\/strong><\/td>\n<td>Highly available (AZ)<\/td>\n<td>Single instance<\/td>\n<\/tr>\n<tr>\n<td><strong>Bandwidth<\/strong><\/td>\n<td>Up to 45 Gbps<\/td>\n<td>Instance type dependent<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost<\/strong><\/td>\n<td>Hourly + data transfer<\/td>\n<td>Instance cost<\/td>\n<\/tr>\n<tr>\n<td><strong>Maintenance<\/strong><\/td>\n<td>AWS handles<\/td>\n<td>Customer handles<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Configuration<\/strong>:\n1. Create NAT Gateway in public subnet\n2. Update private subnet route table\n3. Route 0.0.0.0/0 to NAT Gateway<\/p>\n<p><strong>References:<\/strong> NAT Gateway, Private Subnet Internet Access<\/p>","fixed":false},{"id":"net-3","c":"net","q":"<p>A company has a VPC with CIDR 10.0.0.0/16. They want to divide it into subnets. How many IP addresses are available in a /24 subnet?<\/p>","o":["128","256","251","254"],"a":[2],"x":"<ul>\n<li><strong>/24 subnet<\/strong> has 256 total IP addresses (2^8)<\/li>\n<li><strong>AWS reserves 5 IP addresses<\/strong> in each subnet:<\/li>\n<li>.0: Network address<\/li>\n<li>.1: VPC router<\/li>\n<li>.2: DNS server<\/li>\n<li>.3: Future use<\/li>\n<li>\n<p>.255: Broadcast<\/p>\n<\/li>\n<li>\n<p><strong>Available<\/strong>: 256 - 5 = <strong>251 IP addresses<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>CIDR Calculations<\/strong>:\n- /16: 65,536 IPs (65,531 usable)\n- /24: 256 IPs (251 usable)\n- /28: 16 IPs (11 usable)<\/p>\n<p><strong>References:<\/strong> VPC CIDR, Subnet Sizing<\/p>","fixed":false},{"id":"net-4","c":"net","q":"<p>An application running in a VPC needs to connect to AWS services (S3, DynamoDB) without traversing the internet. What should be configured?<\/p>","o":["NAT Gateway","Internet Gateway","VPC Endpoint","VPN Connection"],"a":[2],"x":"<ul>\n<li><strong>VPC Endpoints<\/strong> provide private connectivity to AWS services<\/li>\n<li>Traffic stays within AWS network<\/li>\n<li>No internet gateway or NAT required<\/li>\n<li>Enhanced security and performance<\/li>\n<\/ul>\n<p><strong>VPC Endpoint Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Services<\/th>\n<th>Implementation<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Gateway<\/strong><\/td>\n<td>S3, DynamoDB<\/td>\n<td>Route table entry<\/td>\n<td>Free<\/td>\n<\/tr>\n<tr>\n<td><strong>Interface<\/strong><\/td>\n<td>Most AWS services<\/td>\n<td>ENI in subnet<\/td>\n<td>Hourly + data<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Gateway Endpoint Benefits<\/strong>:\n- No data transfer charges\n- Better performance\n- No internet exposure\n- Policy control<\/p>\n<p><strong>References:<\/strong> VPC Endpoints, Private Connectivity<\/p>","fixed":false},{"id":"net-5","c":"net","q":"<p>A company wants to connect their on-premises data center to AWS with a dedicated, private network connection. Which service should they use?<\/p>","o":["AWS VPN","AWS Direct Connect","Internet Gateway","VPC Peering"],"a":[1],"x":"<ul>\n<li><strong>AWS Direct Connect<\/strong> provides dedicated physical connection<\/li>\n<li>Bypasses public internet<\/li>\n<li>More consistent performance<\/li>\n<li>Reduced bandwidth costs<\/li>\n<\/ul>\n<p><strong>Direct Connect vs VPN<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Direct Connect<\/th>\n<th>Site-to-Site VPN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Connection<\/strong><\/td>\n<td>Dedicated fiber<\/td>\n<td>Internet-based<\/td>\n<\/tr>\n<tr>\n<td><strong>Bandwidth<\/strong><\/td>\n<td>1 Gbps to 100 Gbps<\/td>\n<td>Up to 1.25 Gbps<\/td>\n<\/tr>\n<tr>\n<td><strong>Latency<\/strong><\/td>\n<td>Low, consistent<\/td>\n<td>Variable<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost<\/strong><\/td>\n<td>Higher (port + data)<\/td>\n<td>Lower<\/td>\n<\/tr>\n<tr>\n<td><strong>Setup Time<\/strong><\/td>\n<td>Weeks/months<\/td>\n<td>Minutes<\/td>\n<\/tr>\n<tr>\n<td><strong>Encryption<\/strong><\/td>\n<td>Not by default<\/td>\n<td>Yes (IPSec)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Use Cases<\/strong>:\n- Large data transfers\n- Consistent performance needed\n- Hybrid cloud architectures\n- Compliance requirements<\/p>\n<p><strong>References:<\/strong> AWS Direct Connect, Hybrid Connectivity<\/p>","fixed":false},{"id":"net-6","c":"net","q":"<p>A company needs to route traffic between multiple VPCs in different AWS accounts. What is the MOST scalable solution?<\/p>","o":["VPC Peering between all VPCs","AWS Transit Gateway","Multiple VPN connections","Internet Gateway"],"a":[1],"x":"<ul>\n<li><strong>AWS Transit Gateway<\/strong> is central hub for VPCs<\/li>\n<li>Connects multiple VPCs, on-premises networks<\/li>\n<li>Simplifies network topology<\/li>\n<li>Scalable (up to 5000 VPCs)<\/li>\n<\/ul>\n<p><strong>Transit Gateway vs VPC Peering<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Transit Gateway<\/th>\n<th>VPC Peering<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Topology<\/strong><\/td>\n<td>Hub-and-spoke<\/td>\n<td>Mesh (1-to-1)<\/td>\n<\/tr>\n<tr>\n<td><strong>Scalability<\/strong><\/td>\n<td>Thousands of VPCs<\/td>\n<td>Limited<\/td>\n<\/tr>\n<tr>\n<td><strong>Routing<\/strong><\/td>\n<td>Centralized<\/td>\n<td>Per peering<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost<\/strong><\/td>\n<td>Higher<\/td>\n<td>Lower (small scale)<\/td>\n<\/tr>\n<tr>\n<td><strong>Cross-Region<\/strong><\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Peering Limitations<\/strong>:\n- Non-transitive (must peer each VPC)\n- Complex with many VPCs (N*(N-1)/2 connections)<\/p>\n<p><strong>References:<\/strong> AWS Transit Gateway, VPC Connectivity<\/p>","fixed":false},{"id":"net-7","c":"net","q":"<p>An application needs to resolve domain names. Where should the DNS server be configured in a VPC?<\/p>","o":["Custom DNS server on EC2","Use AWS-provided DNS at .2 address","Use Route 53 Resolver","Both B and C"],"a":[3],"x":"<ul>\n<li><strong>VPC DNS<\/strong> is available at base IP + 2 (e.g., 10.0.0.2)<\/li>\n<li><strong>Route 53 Resolver<\/strong> provides DNS resolution<\/li>\n<li>Resolves AWS resources<\/li>\n<li>Forwards to on-premises DNS<\/li>\n<li>Inbound/outbound endpoints<\/li>\n<\/ul>\n<p><strong>DNS Options<\/strong>:\n- <strong>AWS-provided DNS<\/strong>: Default, automatic\n- <strong>Route 53 Resolver<\/strong>: Advanced, hybrid scenarios\n- <strong>Custom DNS<\/strong>: Full control, more management<\/p>\n<p><strong>enableDnsHostnames<\/strong>: EC2 instances get public DNS names\n<strong>enableDnsSupport<\/strong>: Amazon-provided DNS enabled<\/p>\n<p><strong>References:<\/strong> VPC DNS, Route 53 Resolver<\/p>","fixed":true},{"id":"net-8","c":"net","q":"<p>A company wants to protect their web application from DDoS attacks and filter malicious traffic. Which AWS services should be used? (Choose TWO)<\/p>","o":["AWS WAF","AWS Shield","Security Groups","AWS GuardDuty","Network ACLs"],"a":[0,1],"x":"<ul>\n<li><strong>AWS Shield<\/strong>: DDoS protection<\/li>\n<li><strong>Standard<\/strong>: Free, automatic, common attacks<\/li>\n<li>\n<p><strong>Advanced<\/strong>: Paid, advanced attacks, 24/7 support, cost protection<\/p>\n<\/li>\n<li>\n<p><strong>AWS WAF<\/strong>: Web Application Firewall<\/p>\n<\/li>\n<li>Filter HTTP/HTTPS requests<\/li>\n<li>SQL injection, XSS protection<\/li>\n<li>Custom rules<\/li>\n<li>Integration with CloudFront, ALB, API Gateway<\/li>\n<\/ul>\n<p><strong>DDoS Protection Layers<\/strong>:\n1. <strong>Shield Standard<\/strong>: Network/transport layer (free)\n2. <strong>Shield Advanced<\/strong>: Application layer, enhanced\n3. <strong>WAF<\/strong>: Application-level filtering\n4. <strong>CloudFront<\/strong>: Absorb traffic at edge<\/p>\n<p><strong>Other Options<\/strong>:\n- <strong>Security Groups<\/strong>: Instance-level firewall, not DDoS\n- <strong>NACLs<\/strong>: Subnet-level firewall, not DDoS\n- <strong>GuardDuty<\/strong>: Threat detection, not prevention<\/p>\n<p><strong>References:<\/strong> AWS Shield, AWS WAF, DDoS Protection<\/p>","fixed":false},{"id":"net-9","c":"net","q":"<p>An application needs to distribute traffic across EC2 instances in multiple Availability Zones. The instances fail health checks intermittently. What should be configured?<\/p>","o":["Increase health check interval","Configure unhealthy threshold","Use health check grace period","Disable health checks"],"a":[1],"x":"<ul>\n<li><strong>Unhealthy threshold<\/strong>: Number of consecutive failed checks before marking unhealthy<\/li>\n<li>Prevents temporary issues from removing instances<\/li>\n<li>Balance between responsiveness and stability<\/li>\n<\/ul>\n<p><strong>Health Check Parameters<\/strong>:\n- <strong>HealthCheckIntervalSeconds<\/strong>: Time between checks (5-300s)\n- <strong>HealthyThresholdCount<\/strong>: Consecutive successes to mark healthy\n- <strong>UnhealthyThresholdCount<\/strong>: Consecutive failures to mark unhealthy\n- <strong>HealthCheckTimeoutSeconds<\/strong>: Time to wait for response<\/p>\n<p><strong>Best Practices<\/strong>:\n- Set appropriate thresholds for application\n- Monitor health check metrics\n- Use ALB health checks for HTTP endpoints\n- Consider application startup time<\/p>\n<p><strong>References:<\/strong> ELB Health Checks, Health Check Configuration<\/p>","fixed":false},{"id":"net-10","c":"net","q":"<p>A company wants to route traffic based on the geographic location of users. Which Route 53 routing policy should be used?<\/p>","o":["Simple Routing","Weighted Routing","Geolocation Routing","Latency-based Routing"],"a":[2],"x":"<ul>\n<li><strong>Geolocation Routing<\/strong> routes based on user's geographic location<\/li>\n<li>Routes by continent, country, or state<\/li>\n<li>Use cases: Content localization, compliance, load distribution<\/li>\n<\/ul>\n<p><strong>Route 53 Routing Policies<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Policy<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Simple<\/strong><\/td>\n<td>Single resource<\/td>\n<\/tr>\n<tr>\n<td><strong>Weighted<\/strong><\/td>\n<td>A/B testing, gradual rollout<\/td>\n<\/tr>\n<tr>\n<td><strong>Latency<\/strong><\/td>\n<td>Best performance for users<\/td>\n<\/tr>\n<tr>\n<td><strong>Failover<\/strong><\/td>\n<td>Active-passive DR<\/td>\n<\/tr>\n<tr>\n<td><strong>Geolocation<\/strong><\/td>\n<td>Route by user location<\/td>\n<\/tr>\n<tr>\n<td><strong>Geoproximity<\/strong><\/td>\n<td>Route by resource location + bias<\/td>\n<\/tr>\n<tr>\n<td><strong>Multivalue<\/strong><\/td>\n<td>Multiple IPs, health checks<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Geolocation vs Latency<\/strong>:\n- <strong>Geolocation<\/strong>: Based on WHERE user is\n- <strong>Latency<\/strong>: Based on WHICH region has lowest latency<\/p>\n<p><strong>References:<\/strong> Route 53 Routing Policies, Geolocation Routing<\/p>","fixed":false},{"id":"net-11","c":"net","q":"<p>A Security Group allows inbound traffic on port 443 from 0.0.0.0/0. What outbound rule is needed for responses?<\/p>","o":["Allow port 443 outbound to 0.0.0.0/0","Allow ephemeral ports outbound","No outbound rule needed","Allow all traffic outbound"],"a":[2],"x":"<ul>\n<li><strong>Security Groups are stateful<\/strong><\/li>\n<li>If inbound is allowed, return traffic automatically allowed<\/li>\n<li>No need to configure outbound rule for responses<\/li>\n<li>Only need outbound rules for instance-initiated traffic<\/li>\n<\/ul>\n<p><strong>Security Groups vs NACLs<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Security Groups<\/th>\n<th>NACLs<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>State<\/strong><\/td>\n<td>Stateful<\/td>\n<td>Stateless<\/td>\n<\/tr>\n<tr>\n<td><strong>Level<\/strong><\/td>\n<td>Instance<\/td>\n<td>Subnet<\/td>\n<\/tr>\n<tr>\n<td><strong>Rules<\/strong><\/td>\n<td>Allow only<\/td>\n<td>Allow and Deny<\/td>\n<\/tr>\n<tr>\n<td><strong>Return Traffic<\/strong><\/td>\n<td>Automatic<\/td>\n<td>Must configure<\/td>\n<\/tr>\n<tr>\n<td><strong>Evaluation<\/strong><\/td>\n<td>All rules<\/td>\n<td>Ordered rules<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>References:<\/strong> Security Groups, Stateful Firewalls<\/p>","fixed":false},{"id":"net-13","c":"net","q":"<p>A company has resources in two VPCs in the same region and wants them to communicate privately. What should be configured?<\/p>","o":["Internet Gateway","VPC Peering","AWS Transit Gateway","VPN Connection"],"a":[1],"x":"<ul>\n<li><strong>VPC Peering<\/strong> connects two VPCs privately<\/li>\n<li>Same or different regions<\/li>\n<li>Same or different accounts<\/li>\n<li>Uses AWS network (no internet)<\/li>\n<\/ul>\n<p><strong>VPC Peering Requirements<\/strong>:\n- Non-overlapping CIDR blocks\n- Accept peering request\n- Update route tables in both VPCs\n- Update security groups if needed<\/p>\n<p><strong>VPC Peering Characteristics<\/strong>:\n- Not transitive (VPC A ↔ VPC B, VPC B ↔ VPC C, but NOT A ↔ C)\n- 1-to-1 connection\n- No single point of failure\n- No bandwidth bottleneck<\/p>\n<p><strong>When to use Transit Gateway instead<\/strong>:\n- Many VPCs (&gt;3-4)\n- Complex routing\n- Need transitive routing<\/p>\n<p><strong>References:<\/strong> VPC Peering, VPC Connectivity<\/p>","fixed":false},{"id":"net-14","c":"net","q":"<p>An application running on EC2 instances needs to maintain client connections to the same instance for session persistence. Which load balancer feature should be enabled?<\/p>","o":["Cross-Zone Load Balancing","Connection Draining","Sticky Sessions","Health Checks"],"a":[2],"x":"<ul>\n<li><strong>Sticky Sessions<\/strong> (Session Affinity) routes requests from same client to same instance<\/li>\n<li>Uses cookies to track sessions<\/li>\n<li>Duration-based or application-based cookies<\/li>\n<\/ul>\n<p><strong>ALB Sticky Session Types<\/strong>:\n- <strong>Duration-based<\/strong>: LB-generated cookie (AWSALB)\n- <strong>Application-based<\/strong>: Application-generated cookie<\/p>\n<p><strong>Sticky Sessions Limitations<\/strong>:\n- Can cause uneven load distribution\n- Instance failure = lost sessions<\/p>\n<p><strong>Better Alternative<\/strong>: \n- Store sessions in ElastiCache or DynamoDB\n- True stateless architecture<\/p>\n<p><strong>References:<\/strong> Sticky Sessions, Session Persistence<\/p>","fixed":false},{"id":"net-15","c":"net","q":"<p>A company wants to use custom domain name with CloudFront distribution. What must be configured?<\/p>","o":["Route 53 CNAME record only","SSL/TLS certificate in ACM and Route 53 alias","CloudFront custom origin","S3 bucket name matching domain"],"a":[1],"x":"<p><strong>Requirements for custom domain<\/strong>:\n1. <strong>SSL/TLS Certificate in ACM<\/strong> (us-east-1 region)\n2. <strong>Alternate Domain Names<\/strong> (CNAMEs) in CloudFront\n3. <strong>Route 53 Alias Record<\/strong> pointing to CloudFront distribution<\/p>\n<p><strong>Configuration Steps<\/strong>:\n1. Request/import certificate in ACM (us-east-1)\n2. Add alternate domain names to CloudFront\n3. Associate ACM certificate with distribution\n4. Create Route 53 alias record<\/p>\n<p><strong>Certificate Requirements<\/strong>:\n- Must be in us-east-1 for CloudFront\n- Domain name must match\n- Can use wildcard (*.example.com)<\/p>\n<p><strong>References:<\/strong> CloudFront Custom Domains, ACM with CloudFront<\/p>","fixed":false},{"id":"net-16","c":"net","q":"<p>A company needs a highly available solution for connecting on-premises data center to AWS. What should be implemented?<\/p>","o":["Single Direct Connect connection","Redundant Direct Connect connections to different locations","Site-to-Site VPN as backup to Direct Connect","Both B and C (Maximum redundancy)"],"a":[3],"x":"<p><strong>Maximum High Availability<\/strong>:\n- Multiple Direct Connect connections in different locations\n- Site-to-Site VPN as backup\n- Redundant customer routers\n- Multiple VPN tunnels<\/p>\n<p><strong>HA Architecture Layers<\/strong>:\n1. <strong>Redundant DX connections<\/strong>: Different locations\n2. <strong>Redundant customer routers<\/strong>: No single point failure\n3. <strong>VPN backup<\/strong>: Failover if DX fails\n4. <strong>Multiple VPN tunnels<\/strong>: AWS provides 2 tunnels per connection<\/p>\n<p><strong>Benefits<\/strong>:\n- 99.99% availability possible\n- Automatic failover\n- Protection against location/connection failures<\/p>\n<p><strong>References:<\/strong> Direct Connect High Availability, Hybrid Network HA<\/p>","fixed":true},{"id":"net-17","c":"net","q":"<p>An application needs to resolve private DNS names between on-premises network and AWS VPC. What should be configured?<\/p>","o":["VPC Peering","Route 53 Private Hosted Zone","Route 53 Resolver Endpoints","AWS PrivateLink"],"a":[2],"x":"<ul>\n<li><strong>Route 53 Resolver Endpoints<\/strong> enable DNS resolution between on-premises and AWS<\/li>\n<li><strong>Inbound Endpoints<\/strong>: On-premises queries AWS resources<\/li>\n<li><strong>Outbound Endpoints<\/strong>: AWS queries on-premises resources<\/li>\n<\/ul>\n<p><strong>Endpoint Types<\/strong>:\n- <strong>Inbound<\/strong>: On-premises → AWS VPC\n- <strong>Outbound<\/strong>: AWS VPC → On-premises (with forwarding rules)<\/p>\n<p><strong>Configuration<\/strong>:\n1. Create inbound/outbound endpoints in VPC\n2. Configure forwarding rules\n3. Update on-premises DNS to forward to inbound endpoint\n4. Create rules to forward to on-premises DNS<\/p>\n<p><strong>Use Cases<\/strong>:\n- Hybrid cloud DNS resolution\n- Migrate workloads with DNS dependencies\n- Unified naming across environments<\/p>\n<p><strong>References:<\/strong> Route 53 Resolver, Hybrid DNS<\/p>","fixed":false},{"id":"net-18","c":"net","q":"<p>A company wants to share services (like NLB) from one VPC with other VPCs/accounts without VPC peering. Which service enables this?<\/p>","o":["VPC Peering","AWS PrivateLink","Transit Gateway","VPN Connection"],"a":[1],"x":"<ul>\n<li><strong>AWS PrivateLink<\/strong> provides private connectivity to services<\/li>\n<li>Expose services via VPC Endpoint Services<\/li>\n<li>Consumers access via Interface VPC Endpoints<\/li>\n<li>No VPC peering, Internet Gateway, NAT required<\/li>\n<\/ul>\n<p><strong>PrivateLink Architecture<\/strong>:\n- <strong>Provider<\/strong>: Creates Endpoint Service (backed by NLB)\n- <strong>Consumer<\/strong>: Creates Interface VPC Endpoint\n- <strong>Connection<\/strong>: Private, within AWS network<\/p>\n<p><strong>Benefits<\/strong>:\n- Simplified network management\n- No CIDR overlap issues\n- Enhanced security (private connectivity)\n- Scalable (thousands of consumers)<\/p>\n<p><strong>Use Cases<\/strong>:\n- SaaS applications\n- Shared services\n- Third-party services\n- Marketplace applications<\/p>\n<p><strong>References:<\/strong> AWS PrivateLink, VPC Endpoint Services<\/p>","fixed":false},{"id":"net-19","c":"net","q":"<p>A company wants to implement a global accelerator for their application with static IP addresses and deterministic routing. Which service should be used?<\/p>","o":["Amazon CloudFront","AWS Global Accelerator","Route 53 with Latency Routing","Elastic Load Balancing"],"a":[1],"x":"<ul>\n<li><strong>AWS Global Accelerator<\/strong> provides static anycast IPs<\/li>\n<li>Routes traffic over AWS global network<\/li>\n<li>Deterministic, fast failover<\/li>\n<li>Health checks and instant failover<\/li>\n<\/ul>\n<p><strong>Global Accelerator vs CloudFront<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Global Accelerator<\/th>\n<th>CloudFront<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>TCP/UDP apps<\/td>\n<td>HTTP/HTTPS content<\/td>\n<\/tr>\n<tr>\n<td><strong>Caching<\/strong><\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><strong>Static IP<\/strong><\/td>\n<td>Yes (2 anycast)<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Failover<\/strong><\/td>\n<td>Instant (&lt; 30s)<\/td>\n<td>DNS-based<\/td>\n<\/tr>\n<tr>\n<td><strong>Protocol<\/strong><\/td>\n<td>TCP, UDP<\/td>\n<td>HTTP, HTTPS, WebSocket<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Global Accelerator Benefits<\/strong>:\n- Static IPs (no DNS changes)\n- AWS network routing (better performance)\n- Health-based routing\n- Traffic dials for blue/green deployments<\/p>\n<p><strong>Use Cases<\/strong>:\n- Gaming (UDP)\n- IoT\n- VoIP\n- Non-HTTP applications<\/p>\n<p><strong>References:<\/strong> AWS Global Accelerator, Global Traffic Management<\/p>","fixed":false},{"id":"net-20","c":"net","q":"<p>A web application receives sudden traffic spikes. The company wants to protect backend servers from being overwhelmed. What should be implemented at the Network ACL level?<\/p>","o":["Allow all traffic","Rate limiting","Connection draining","NACLs don't support rate limiting, use WAF"],"a":[3],"x":"<ul>\n<li><strong>NACLs<\/strong> provide basic allow/deny rules<\/li>\n<li><strong>No rate limiting capabilities<\/strong><\/li>\n<li><strong>AWS WAF<\/strong> provides rate limiting<\/li>\n<\/ul>\n<p><strong>Rate Limiting Solutions<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Level<\/th>\n<th>Capability<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>AWS WAF<\/strong><\/td>\n<td>Application (L7)<\/td>\n<td>Rate-based rules<\/td>\n<\/tr>\n<tr>\n<td><strong>API Gateway<\/strong><\/td>\n<td>API<\/td>\n<td>Throttling<\/td>\n<\/tr>\n<tr>\n<td><strong>Shield Advanced<\/strong><\/td>\n<td>Network<\/td>\n<td>DDoS mitigation<\/td>\n<\/tr>\n<tr>\n<td><strong>NACL<\/strong><\/td>\n<td>Network (L4)<\/td>\n<td>No rate limiting<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>WAF Rate-Based Rule<\/strong>:\n- Block IPs exceeding request threshold\n- 5-minute time window\n- Example: Block if &gt; 2000 requests in 5 minutes<\/p>\n<p><strong>Best Practice for Traffic Spikes<\/strong>:\n1. Auto Scaling for capacity\n2. WAF for rate limiting\n3. CloudFront for caching\n4. ElastiCache for session/data<\/p>\n<p><strong>References:<\/strong> AWS WAF Rate Limiting, DDoS Protection<\/p>","fixed":false},{"id":"net-21","c":"net","q":"<p>A mobile gaming company needs to deliver ultra-low latency multiplayer experiences to users on 5G networks in major cities. The solution must run AWS compute and storage services at the edge of telecom networks. Which AWS service should they use?<\/p>","o":["AWS Wavelength","Amazon CloudFront","AWS Outposts","AWS Direct Connect"],"a":[0],"x":"<ul>\n<li>AWS Wavelength brings AWS compute and storage to the edge of 5G networks<\/li>\n<li>Minimizes latency by running workloads at telecom provider locations<\/li>\n<li>Ideal for mobile apps, gaming, AR/VR, IoT requiring &lt;10ms latency<\/li>\n<li>CloudFront is a CDN for static/dynamic content, not edge compute<\/li>\n<li>Outposts is for on-premises data centers, not telecom edge<\/li>\n<li>Direct Connect is for dedicated network connectivity<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Wavelength, Edge Computing<\/p>","fixed":false},{"id":"sec-1","c":"sec","q":"<p>A company wants to encrypt data at rest in S3 with full control over encryption keys including custom rotation policies and audit trails. Which encryption method should be used?<\/p>","o":["SSE-S3 (Server-Side Encryption with S3-Managed Keys)","SSE-KMS with AWS managed keys","SSE-KMS with Customer Managed Keys (CMK)","SSE-C (Customer-Provided Keys)"],"a":[2],"x":"<ul>\n<li><strong>SSE-KMS with Customer Managed Keys (CMK)<\/strong> provides complete control<\/li>\n<li>Create, manage, rotate encryption keys<\/li>\n<li>CloudTrail audit trail for key usage<\/li>\n<li>Fine-grained access control via key policies<\/li>\n<li>Automatic or manual key rotation<\/li>\n<\/ul>\n<p><strong>S3 Encryption Options Comparison<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Key Management<\/th>\n<th>Rotation<\/th>\n<th>Audit Trail<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SSE-S3<\/strong><\/td>\n<td>AWS<\/td>\n<td>AWS handles<\/td>\n<td>No<\/td>\n<td>Free<\/td>\n<\/tr>\n<tr>\n<td><strong>SSE-KMS (AWS managed)<\/strong><\/td>\n<td>AWS<\/td>\n<td>Annual (automatic)<\/td>\n<td>Yes (CloudTrail)<\/td>\n<td>KMS API charges<\/td>\n<\/tr>\n<tr>\n<td><strong>SSE-KMS (CMK)<\/strong><\/td>\n<td>Customer<\/td>\n<td>On-demand/annual<\/td>\n<td>Yes (CloudTrail)<\/td>\n<td>KMS API charges<\/td>\n<\/tr>\n<tr>\n<td><strong>SSE-C<\/strong><\/td>\n<td>Customer provides<\/td>\n<td>Customer manages<\/td>\n<td>No<\/td>\n<td>Free<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>CMK Benefits<\/strong>:\n- Custom rotation schedule (enable automatic yearly rotation)\n- Disable/enable keys\n- Define key policies and grants\n- Cross-account access\n- Complete audit trail<\/p>\n<p><strong>References:<\/strong> AWS KMS, S3 Encryption, Customer Managed Keys<\/p>","fixed":false},{"id":"sec-2","c":"sec","q":"<p>An application needs to securely store database credentials that should be automatically rotated every 30 days. Which AWS service is MOST appropriate?<\/p>","o":["AWS Systems Manager Parameter Store","AWS Secrets Manager","AWS KMS","Amazon S3 with encryption"],"a":[1],"x":"<ul>\n<li><strong>AWS Secrets Manager<\/strong> designed specifically for secrets with built-in rotation<\/li>\n<li>Automatic rotation for RDS, DocumentDB, Redshift, Amazon Redshift<\/li>\n<li>Lambda-based custom rotation for other services<\/li>\n<li>Versioning and immediate rotation<\/li>\n<\/ul>\n<p><strong>Secrets Manager Features<\/strong>:\n- Automatic rotation (configurable schedule)\n- Built-in integration with AWS databases\n- Encryption at rest (KMS)\n- Fine-grained access control (IAM)\n- Audit capability (CloudTrail)\n- Cross-region replication\n- Version management<\/p>\n<p><strong>Secrets Manager vs Parameter Store<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Secrets Manager<\/th>\n<th>Parameter Store (Standard)<\/th>\n<th>Parameter Store (Advanced)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Automatic Rotation<\/strong><\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Built-in RDS Integration<\/strong><\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost<\/strong><\/td>\n<td>$0.40/secret/month + API calls<\/td>\n<td>Free<\/td>\n<td>$0.05/parameter/month<\/td>\n<\/tr>\n<tr>\n<td><strong>Secret Size<\/strong><\/td>\n<td>64 KB<\/td>\n<td>4 KB<\/td>\n<td>8 KB<\/td>\n<\/tr>\n<tr>\n<td><strong>Encryption<\/strong><\/td>\n<td>Always (KMS)<\/td>\n<td>Optional (KMS)<\/td>\n<td>Optional (KMS)<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>DB credentials, API keys<\/td>\n<td>Configuration, non-rotating secrets<\/td>\n<td>Configuration, larger values<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Rotation Configuration<\/strong>:\n<code>json\n{\n  \"automaticallyAfterDays\": 30,\n  \"rotationLambdaARN\": \"arn:aws:lambda:...\",\n  \"rotationEnabled\": true\n}<\/code><\/p>\n<p><strong>References:<\/strong> AWS Secrets Manager, Secrets Rotation, Credential Management<\/p>","fixed":false},{"id":"sec-3","c":"sec","q":"<p>A company must ensure that all API calls across their AWS organization are logged and stored for 7 years for compliance. Which services should be configured?<\/p>","o":["CloudWatch Logs with 7-year retention","CloudTrail with S3 storage and Glacier lifecycle","AWS Config with long-term storage","VPC Flow Logs"],"a":[1],"x":"<ul>\n<li><strong>AWS CloudTrail<\/strong> records all API calls (management and data events)<\/li>\n<li>Store logs in S3 for long-term retention<\/li>\n<li>Use S3 Lifecycle policies to transition to Glacier for cost optimization<\/li>\n<\/ul>\n<p><strong>CloudTrail Configuration<\/strong>:\n1. Enable CloudTrail in all regions\n2. Store logs in S3 bucket\n3. Enable log file validation (integrity checking)\n4. Configure S3 Lifecycle policy:\n   - Transition to Glacier after 90 days\n   - Retain for 7 years<\/p>\n<p><strong>CloudTrail Features<\/strong>:\n- <strong>Management Events<\/strong>: Control plane operations (CreateInstance, DeleteBucket)\n- <strong>Data Events<\/strong>: Data plane operations (S3 GetObject, Lambda invocations)\n- <strong>Insights Events<\/strong>: Detect unusual activity\n- <strong>Multi-region<\/strong>: Capture events from all regions\n- <strong>Multi-account<\/strong>: Organization trail\n- <strong>Log file integrity<\/strong>: Detect tampering<\/p>\n<p><strong>Best Practice Configuration<\/strong>:\n<code>json\n{\n  \"Trail\": {\n    \"IsMultiRegionTrail\": true,\n    \"IncludeGlobalServiceEvents\": true,\n    \"IsOrganizationTrail\": true,\n    \"EnableLogFileValidation\": true\n  }\n}<\/code><\/p>\n<p><strong>S3 Lifecycle for Cost Optimization<\/strong>:\n<code>json\n{\n  \"Rules\": [\n    {\n      \"Transitions\": [\n        {\"Days\": 90, \"StorageClass\": \"GLACIER\"},\n        {\"Days\": 180, \"StorageClass\": \"DEEP_ARCHIVE\"}\n      ],\n      \"Expiration\": {\"Days\": 2555}\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> AWS CloudTrail, Compliance Logging, Long-term Retention<\/p>","fixed":false},{"id":"sec-4","c":"sec","q":"<p>A company wants to detect and respond to security threats in their AWS environment automatically. Which service provides intelligent threat detection?<\/p>","o":["AWS CloudTrail","Amazon GuardDuty","AWS Config","AWS Security Hub"],"a":[1],"x":"<ul>\n<li><strong>Amazon GuardDuty<\/strong> provides intelligent, continuous threat detection<\/li>\n<li>Uses machine learning and threat intelligence<\/li>\n<li>Analyzes multiple data sources automatically<\/li>\n<li>No infrastructure to manage<\/li>\n<\/ul>\n<p><strong>GuardDuty Data Sources<\/strong>:\n1. <strong>AWS CloudTrail Events<\/strong>: Unusual API calls, unauthorized deployments\n2. <strong>VPC Flow Logs<\/strong>: Malicious IP addresses, unusual traffic patterns\n3. <strong>DNS Logs<\/strong>: Domain generation algorithms, C&amp;C communication\n4. <strong>EKS Audit Logs<\/strong>: Kubernetes security events\n5. <strong>S3 Data Events<\/strong>: Suspicious access patterns\n6. <strong>Lambda Network Activity<\/strong>: Suspicious connections<\/p>\n<p><strong>GuardDuty Finding Types<\/strong>:\n- <strong>Reconnaissance<\/strong>: Port scanning, unusual API activity\n- <strong>Instance Compromise<\/strong>: Malware, cryptocurrency mining, backdoor\n- <strong>Account Compromise<\/strong>: Credential misuse, unusual behavior\n- <strong>Bucket Compromise<\/strong>: Suspicious S3 access\n- <strong>Persistence<\/strong>: IAM changes, unauthorized access<\/p>\n<p><strong>GuardDuty vs Other Security Services<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Purpose<\/th>\n<th>Detection Type<\/th>\n<th>Response<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>GuardDuty<\/strong><\/td>\n<td>Threat detection<\/td>\n<td>Automated ML-based<\/td>\n<td>EventBridge rules<\/td>\n<\/tr>\n<tr>\n<td><strong>Security Hub<\/strong><\/td>\n<td>Centralized findings<\/td>\n<td>Aggregation<\/td>\n<td>Manual/automated<\/td>\n<\/tr>\n<tr>\n<td><strong>Inspector<\/strong><\/td>\n<td>Vulnerability scanning<\/td>\n<td>Agent/agentless scans<\/td>\n<td>Manual remediation<\/td>\n<\/tr>\n<tr>\n<td><strong>Macie<\/strong><\/td>\n<td>Data protection<\/td>\n<td>PII/sensitive data<\/td>\n<td>Manual/automated<\/td>\n<\/tr>\n<tr>\n<td><strong>Config<\/strong><\/td>\n<td>Compliance<\/td>\n<td>Rule-based<\/td>\n<td>Remediation actions<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Automated Response Pattern<\/strong>:\nGuardDuty Finding → EventBridge → Lambda → Isolate Instance/Block IP<\/p>\n<p><strong>References:<\/strong> Amazon GuardDuty, Threat Detection, Security Automation<\/p>","fixed":false},{"id":"sec-5","c":"sec","q":"<p>A company needs to ensure all S3 buckets are encrypted and not publicly accessible. Which service can continuously monitor and evaluate compliance?<\/p>","o":["AWS CloudTrail","AWS Config","Amazon GuardDuty","AWS Trusted Advisor"],"a":[1],"x":"<ul>\n<li><strong>AWS Config<\/strong> continuously monitors and records resource configurations<\/li>\n<li>Evaluates compliance against desired configurations<\/li>\n<li>Provides configuration history and change tracking<\/li>\n<li>Automated or manual remediation<\/li>\n<\/ul>\n<p><strong>AWS Config Key Features<\/strong>:<\/p>\n<p><strong>Config Rules<\/strong> (Managed and Custom):\n- <code>s3-bucket-public-read-prohibited<\/code>\n- <code>s3-bucket-public-write-prohibited<\/code>\n- <code>s3-bucket-server-side-encryption-enabled<\/code>\n- <code>encrypted-volumes<\/code>\n- <code>required-tags<\/code>\n- <code>approved-amis-by-id<\/code><\/p>\n<p><strong>Config Components<\/strong>:\n1. <strong>Configuration Recorder<\/strong>: Captures resource configurations\n2. <strong>Config Rules<\/strong>: Define desired configurations\n3. <strong>Remediation Actions<\/strong>: Automatic fixes via SSM Automation\n4. <strong>Conformance Packs<\/strong>: Packaged compliance rules\n5. <strong>Aggregators<\/strong>: Multi-account/region view<\/p>\n<p><strong>Example: S3 Encryption Compliance<\/strong>:\n<code>json\n{\n  \"ConfigRule\": {\n    \"ConfigRuleName\": \"s3-encryption-enabled\",\n    \"Source\": {\n      \"Owner\": \"AWS\",\n      \"SourceIdentifier\": \"S3_BUCKET_SERVER_SIDE_ENCRYPTION_ENABLED\"\n    }\n  },\n  \"RemediationConfiguration\": {\n    \"Automatic\": true,\n    \"TargetType\": \"SSM_DOCUMENT\",\n    \"TargetIdentifier\": \"AWS-EnableS3BucketEncryption\"\n  }\n}<\/code><\/p>\n<p><strong>Config vs CloudTrail vs GuardDuty<\/strong>:\n- <strong>Config<\/strong>: WHAT (configuration state, compliance)\n- <strong>CloudTrail<\/strong>: WHO/WHEN (API calls, audit trail)\n- <strong>GuardDuty<\/strong>: THREATS (security threats, anomalies)<\/p>\n<p><strong>References:<\/strong> AWS Config, Compliance Monitoring, Configuration Management<\/p>","fixed":false},{"id":"sec-6","c":"sec","q":"<p>An organization wants to centrally manage security findings from multiple AWS accounts and security services. Which service should be used?<\/p>","o":["Amazon GuardDuty","AWS Security Hub","AWS Config","Amazon Inspector"],"a":[1],"x":"<ul>\n<li><strong>AWS Security Hub<\/strong> provides centralized security and compliance view<\/li>\n<li>Aggregates findings from multiple AWS services and accounts<\/li>\n<li>Security standards compliance (CIS, PCI-DSS, AWS Foundational Security Best Practices)<\/li>\n<li>Automated compliance checks<\/li>\n<\/ul>\n<p><strong>Security Hub Integrations<\/strong>:<\/p>\n<p><strong>AWS Services<\/strong>:\n- Amazon GuardDuty (threat detection)\n- Amazon Inspector (vulnerability assessment)\n- Amazon Macie (data protection)\n- AWS IAM Access Analyzer (IAM policy analysis)\n- AWS Firewall Manager (firewall rule management)\n- AWS Config (compliance rules)\n- Amazon Detective (security investigation)<\/p>\n<p><strong>Third-Party Integrations<\/strong>:\n- Splunk, Palo Alto Networks, Trend Micro, etc.<\/p>\n<p><strong>Security Hub Features<\/strong>:\n1. <strong>Consolidated Dashboard<\/strong>: Single pane of glass\n2. <strong>Security Standards<\/strong>: CIS AWS Foundations, PCI-DSS, AWS Best Practices\n3. <strong>Automated Checks<\/strong>: Continuous compliance evaluation\n4. <strong>Finding Aggregation<\/strong>: From all integrated services\n5. <strong>Custom Insights<\/strong>: Create custom views\n6. <strong>Automated Remediation<\/strong>: EventBridge + Lambda/SSM<\/p>\n<p><strong>Security Hub Workflow<\/strong>:\n<code>Multiple Accounts → Security Hub Master Account\n↓\nFindings from GuardDuty, Inspector, Macie, Config, IAM Access Analyzer\n↓\nSecurity Standards Compliance Checks\n↓\nConsolidated Dashboard + Automated Remediation<\/code><\/p>\n<p><strong>Use Cases<\/strong>:\n- Multi-account security management\n- Compliance reporting\n- Security posture assessment\n- Automated remediation workflows<\/p>\n<p><strong>References:<\/strong> AWS Security Hub, Centralized Security Management<\/p>","fixed":false},{"id":"sec-7","c":"sec","q":"<p>A company wants to detect when S3 buckets contain sensitive personally identifiable information (PII). Which service should be used?<\/p>","o":["Amazon GuardDuty","Amazon Macie","AWS Config","Amazon Inspector"],"a":[1],"x":"<ul>\n<li><strong>Amazon Macie<\/strong> is data security service that discovers and protects sensitive data<\/li>\n<li>Uses machine learning to identify PII, financial data, credentials<\/li>\n<li>Automated S3 bucket inventory and classification<\/li>\n<li>Continuous monitoring and alerts<\/li>\n<\/ul>\n<p><strong>Macie Capabilities<\/strong>:<\/p>\n<p><strong>Data Discovery<\/strong>:\n- Credit card numbers\n- Social security numbers\n- Passport numbers\n- Driver's license numbers\n- Bank account numbers\n- Personal health information\n- Authentication credentials<\/p>\n<p><strong>Macie Features<\/strong>:\n1. <strong>Automated Discovery Jobs<\/strong>: Scan S3 buckets\n2. <strong>Sensitive Data Types<\/strong>: Pre-built and custom identifiers\n3. <strong>Bucket Inventory<\/strong>: Complete S3 bucket assessment\n4. <strong>Policy Findings<\/strong>: Public access, encryption, replication issues\n5. <strong>Sensitive Data Findings<\/strong>: Location and type of sensitive data\n6. <strong>Integration<\/strong>: Security Hub, EventBridge for automation<\/p>\n<p><strong>Macie Finding Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Category<\/th>\n<th>Examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Policy Findings<\/strong><\/td>\n<td>Public bucket, unencrypted, no versioning<\/td>\n<\/tr>\n<tr>\n<td><strong>Sensitive Data Findings<\/strong><\/td>\n<td>PII detected, credentials found<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Automated Response Pattern<\/strong>:\n<code>Macie Detects PII → EventBridge → Lambda → \n  - Encrypt bucket\n  - Update bucket policy\n  - Send SNS notification\n  - Create Jira ticket<\/code><\/p>\n<p><strong>Macie vs Other Services<\/strong>:\n- <strong>Macie<\/strong>: Data privacy, PII detection in S3\n- <strong>GuardDuty<\/strong>: Threat detection, malicious activity\n- <strong>Inspector<\/strong>: Vulnerability scanning (EC2, ECR, Lambda)\n- <strong>Config<\/strong>: Configuration compliance<\/p>\n<p><strong>References:<\/strong> Amazon Macie, Data Protection, PII Detection<\/p>","fixed":false},{"id":"sec-8","c":"sec","q":"<p>A company wants to analyze IAM policies to identify resources shared with external entities. Which service provides this capability?<\/p>","o":["AWS IAM Policy Simulator","IAM Access Analyzer","AWS Trusted Advisor","AWS Config"],"a":[1],"x":"<ul>\n<li><strong>IAM Access Analyzer<\/strong> uses automated reasoning to analyze resource policies<\/li>\n<li>Identifies resources shared with external principals<\/li>\n<li>Validates IAM policies against best practices<\/li>\n<li>Generates findings for review<\/li>\n<\/ul>\n<p><strong>IAM Access Analyzer Features<\/strong>:<\/p>\n<p><strong>1. External Access Analysis<\/strong>:\n- S3 buckets\n- IAM roles\n- KMS keys\n- Lambda functions\n- SQS queues\n- Secrets Manager secrets\n- SNS topics<\/p>\n<p><strong>2. Policy Validation<\/strong>:\n- Check policy grammar\n- Security warnings\n- Errors and suggestions\n- Best practice recommendations<\/p>\n<p><strong>3. Policy Generation<\/strong>:\n- Generate policies based on CloudTrail activity\n- Least privilege policies\n- Review and refine<\/p>\n<p><strong>Finding Types<\/strong>:\n<code>json\n{\n  \"FindingType\": \"ExternalAccess\",\n  \"Resource\": \"arn:aws:s3:::my-bucket\",\n  \"Principal\": {\n    \"AWS\": \"123456789012\"\n  },\n  \"Condition\": {},\n  \"Action\": [\"s3:GetObject\"]\n}<\/code><\/p>\n<p><strong>Access Analyzer vs Other Tools<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Purpose<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Access Analyzer<\/strong><\/td>\n<td>External access, policy validation, policy generation<\/td>\n<\/tr>\n<tr>\n<td><strong>Policy Simulator<\/strong><\/td>\n<td>Test policy effects<\/td>\n<\/tr>\n<tr>\n<td><strong>Trusted Advisor<\/strong><\/td>\n<td>Best practices, cost optimization<\/td>\n<\/tr>\n<tr>\n<td><strong>Config<\/strong><\/td>\n<td>Resource configuration compliance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Use Cases<\/strong>:\n- Identify unintended external access\n- Validate policies before deployment\n- Generate least-privilege policies\n- Continuous monitoring for access changes<\/p>\n<p><strong>References:<\/strong> IAM Access Analyzer, Policy Analysis, External Access Detection<\/p>","fixed":false},{"id":"sec-9","c":"sec","q":"<p>A web application needs protection against common web exploits like SQL injection and cross-site scripting (XSS). Which AWS service provides this protection?<\/p>","o":["AWS Shield","AWS WAF","Security Groups","Network ACLs"],"a":[1],"x":"<ul>\n<li><strong>AWS WAF<\/strong> (Web Application Firewall) protects against common web exploits<\/li>\n<li>Filters HTTP/HTTPS requests based on rules<\/li>\n<li>Integrates with CloudFront, ALB, API Gateway, AppSync<\/li>\n<li>Managed rules and custom rules<\/li>\n<\/ul>\n<p><strong>AWS WAF Capabilities<\/strong>:<\/p>\n<p><strong>1. Managed Rule Groups<\/strong>:\n- AWS Managed Rules (Core Rule Set, Known Bad Inputs, SQL Database, etc.)\n- AWS Marketplace Rules (third-party)\n- Rate-based rules (DDoS protection)<\/p>\n<p><strong>2. Custom Rules<\/strong>:\n- IP address filtering\n- Geographic blocking\n- String/regex matching\n- Size constraints\n- SQL injection protection\n- XSS protection<\/p>\n<p><strong>3. Request Filtering<\/strong>:\n<code>json\n{\n  \"Rule\": {\n    \"Name\": \"BlockSQLInjection\",\n    \"Statement\": {\n      \"SqliMatchStatement\": {\n        \"FieldToMatch\": {\n          \"QueryString\": {}\n        }\n      }\n    },\n    \"Action\": {\"Block\": {}}\n  }\n}<\/code><\/p>\n<p><strong>WAF Components<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Web ACL<\/strong><\/td>\n<td>Container for rules<\/td>\n<\/tr>\n<tr>\n<td><strong>Rules<\/strong><\/td>\n<td>Match conditions + action<\/td>\n<\/tr>\n<tr>\n<td><strong>Rule Groups<\/strong><\/td>\n<td>Collection of reusable rules<\/td>\n<\/tr>\n<tr>\n<td><strong>IP Sets<\/strong><\/td>\n<td>List of IP addresses<\/td>\n<\/tr>\n<tr>\n<td><strong>Regex Pattern Sets<\/strong><\/td>\n<td>Regex patterns<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Rate-Based Rule<\/strong> (DDoS Protection):\n<code>json\n{\n  \"RateBasedStatement\": {\n    \"Limit\": 2000,\n    \"AggregateKeyType\": \"IP\"\n  }\n}<\/code><\/p>\n<p><strong>WAF vs Shield<\/strong>:\n- <strong>WAF<\/strong>: Application-level (Layer 7) filtering, custom rules\n- <strong>Shield Standard<\/strong>: Network/transport (Layer 3/4) DDoS protection, automatic, free\n- <strong>Shield Advanced<\/strong>: Enhanced DDoS protection, cost protection, 24/7 support<\/p>\n<p><strong>Common WAF Rules<\/strong>:\n1. Block SQL injection attempts\n2. Block XSS attacks\n3. Rate limiting (prevent abuse)\n4. Geographic restrictions\n5. IP blacklist/whitelist\n6. String/pattern matching<\/p>\n<p><strong>References:<\/strong> AWS WAF, Web Application Security, OWASP Protection<\/p>","fixed":false},{"id":"sec-10","c":"sec","q":"<p>A company wants to protect their application from DDoS attacks and ensure cost protection during large-scale attacks. Which service provides these features?<\/p>","o":["AWS WAF","AWS Shield Standard","AWS Shield Advanced","Security Groups"],"a":[2],"x":"<ul>\n<li><strong>AWS Shield Advanced<\/strong> provides enhanced DDoS protection with cost protection<\/li>\n<li>24/7 access to DDoS Response Team (DRT)<\/li>\n<li>Advanced attack detection and mitigation<\/li>\n<li>Cost protection against scaling charges during attacks<\/li>\n<\/ul>\n<p><strong>Shield Comparison<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Shield Standard<\/th>\n<th>Shield Advanced<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Cost<\/strong><\/td>\n<td>Free<\/td>\n<td>$3,000/month<\/td>\n<\/tr>\n<tr>\n<td><strong>Protection Level<\/strong><\/td>\n<td>Network/Transport (L3/L4)<\/td>\n<td>Network + Application (L3/L4/L7)<\/td>\n<\/tr>\n<tr>\n<td><strong>DDoS Response Team<\/strong><\/td>\n<td>No<\/td>\n<td>24/7 access<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost Protection<\/strong><\/td>\n<td>No<\/td>\n<td>Yes (scaling charges)<\/td>\n<\/tr>\n<tr>\n<td><strong>Advanced Detection<\/strong><\/td>\n<td>Basic<\/td>\n<td>Enhanced, real-time<\/td>\n<\/tr>\n<tr>\n<td><strong>Health-based Detection<\/strong><\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td><strong>Application Layer<\/strong><\/td>\n<td>Via WAF<\/td>\n<td>Included + WAF<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Shield Advanced Features<\/strong>:<\/p>\n<p><strong>1. Cost Protection<\/strong>:\n- Protects against scaling charges during DDoS attacks\n- Covers: EC2, ELB, CloudFront, Route 53, Global Accelerator<\/p>\n<p><strong>2. DDoS Response Team (DRT)<\/strong>:\n- 24/7 expert support\n- Attack analysis and mitigation\n- Custom mitigation rules<\/p>\n<p><strong>3. Advanced Metrics<\/strong>:\n- Real-time attack visibility\n- Historical attack data\n- Integration with CloudWatch<\/p>\n<p><strong>4. Protection Scope<\/strong>:\n- CloudFront distributions\n- Route 53 hosted zones\n- Global Accelerator accelerators\n- Elastic Load Balancers\n- EC2 Elastic IP addresses<\/p>\n<p><strong>5. Health-Based Detection<\/strong>:\n- Monitors application health\n- Proactive mitigation\n- Route 53 health checks integration<\/p>\n<p><strong>When to Use Shield Advanced<\/strong>:\n- Business-critical applications\n- High-profile websites\n- Cannot tolerate downtime\n- Need cost protection\n- Want expert DRT support<\/p>\n<p><strong>Best Practice Architecture<\/strong>:\n<code>Users → CloudFront (Shield Advanced) → \n  ALB (Shield Advanced + WAF) → \n    EC2 instances (Auto Scaling)<\/code><\/p>\n<p><strong>References:<\/strong> AWS Shield Advanced, DDoS Protection, Cost Protection<\/p>","fixed":false},{"id":"sec-11","c":"sec","q":"<p>A company needs to scan EC2 instances and container images for software vulnerabilities. Which service should be used?<\/p>","o":["Amazon GuardDuty","Amazon Inspector","AWS Security Hub","Amazon Macie"],"a":[1],"x":"<ul>\n<li><strong>Amazon Inspector<\/strong> provides automated vulnerability assessment<\/li>\n<li>Scans EC2 instances, container images (ECR), Lambda functions<\/li>\n<li>Network reachability analysis<\/li>\n<li>Package vulnerability detection (CVEs)<\/li>\n<\/ul>\n<p><strong>Amazon Inspector v2 Features<\/strong>:<\/p>\n<p><strong>1. Continuous Scanning<\/strong>:\n- Automated, continuous assessment\n- No agents needed for ECR\n- SSM agent for EC2 (automatic deployment)<\/p>\n<p><strong>2. Vulnerability Detection<\/strong>:\n- <strong>CVE (Common Vulnerabilities and Exposures)<\/strong>\n- OS packages\n- Application dependencies\n- Network exposure<\/p>\n<p><strong>3. Resource Types<\/strong>:\n- <strong>EC2 Instances<\/strong>: OS and application vulnerabilities\n- <strong>ECR Container Images<\/strong>: Image vulnerabilities\n- <strong>Lambda Functions<\/strong>: Code and package vulnerabilities<\/p>\n<p><strong>4. Risk Scoring<\/strong>:\n- Inspector score (0-10)\n- Severity: Critical, High, Medium, Low, Informational\n- Prioritization based on exploitability and CVSS<\/p>\n<p><strong>5. Integration<\/strong>:\n- Security Hub (centralized findings)\n- EventBridge (automated remediation)\n- AWS Organizations (multi-account)<\/p>\n<p><strong>Inspector Finding Example<\/strong>:\n<code>json\n{\n  \"FindingType\": \"PACKAGE_VULNERABILITY\",\n  \"Severity\": \"HIGH\",\n  \"Title\": \"CVE-2021-44228 - Apache Log4j\",\n  \"Description\": \"Remote code execution vulnerability\",\n  \"Recommendation\": \"Update to version 2.17.0 or later\",\n  \"AffectedResources\": [\"i-1234567890abcdef0\"]\n}<\/code><\/p>\n<p><strong>Inspector vs Other Services<\/strong>:\n- <strong>Inspector<\/strong>: Vulnerability scanning (EC2, ECR, Lambda)\n- <strong>GuardDuty<\/strong>: Threat detection (malicious activity)\n- <strong>Macie<\/strong>: Data protection (PII in S3)\n- <strong>Config<\/strong>: Configuration compliance<\/p>\n<p><strong>Automated Remediation<\/strong>:\n<code>Inspector Finding → EventBridge → Lambda → \n  - Patch instance (SSM Patch Manager)\n  - Update image\n  - Create ticket<\/code><\/p>\n<p><strong>References:<\/strong> Amazon Inspector, Vulnerability Assessment, CVE Detection<\/p>","fixed":false},{"id":"sec-12","c":"sec","q":"<p>A company wants to enforce that all new EC2 instances must have encrypted EBS volumes. How can this be enforced across the organization?<\/p>","o":["AWS Config rule with manual remediation","Service Control Policy (SCP) in AWS Organizations","IAM policy on each user","AWS Lambda function to check instances"],"a":[1],"x":"<ul>\n<li><strong>Service Control Policies (SCPs)<\/strong> provide centralized, preventive controls<\/li>\n<li>Applied at organization, OU, or account level<\/li>\n<li>Cannot be overridden by anyone in member accounts<\/li>\n<li>Maximum permission boundaries<\/li>\n<\/ul>\n<p><strong>SCP Example - Enforce Encrypted EBS<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"DenyUnencryptedEBSVolumes\",\n      \"Effect\": \"Deny\",\n      \"Action\": [\n        \"ec2:RunInstances\",\n        \"ec2:CreateVolume\"\n      ],\n      \"Resource\": \"arn:aws:ec2:*:*:volume/*\",\n      \"Condition\": {\n        \"Bool\": {\n          \"ec2:Encrypted\": \"false\"\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p><strong>SCPs vs Other Controls<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Prevention<\/th>\n<th>Detection<\/th>\n<th>Scope<\/th>\n<th>Override<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>SCP<\/strong><\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<td>Organization/OU/Account<\/td>\n<td>Cannot override<\/td>\n<\/tr>\n<tr>\n<td><strong>IAM Policy<\/strong><\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<td>User/Role/Group<\/td>\n<td>Admin can change<\/td>\n<\/tr>\n<tr>\n<td><strong>Config Rule<\/strong><\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Account<\/td>\n<td>Detection only<\/td>\n<\/tr>\n<tr>\n<td><strong>Lambda<\/strong><\/td>\n<td>Possible<\/td>\n<td>Yes<\/td>\n<td>Custom<\/td>\n<td>Complex<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>SCP Best Practices<\/strong>:<\/p>\n<p><strong>1. Preventive Controls<\/strong>:\n- Deny unencrypted resources\n- Deny public S3 buckets\n- Restrict regions\n- Prevent root user actions<\/p>\n<p><strong>2. Example - Region Restriction<\/strong>:\n<code>json\n{\n  \"Effect\": \"Deny\",\n  \"Action\": \"*\",\n  \"Resource\": \"*\",\n  \"Condition\": {\n    \"StringNotEquals\": {\n      \"aws:RequestedRegion\": [\"us-east-1\", \"us-west-2\"]\n    }\n  }\n}<\/code><\/p>\n<p><strong>3. Example - Deny Public S3<\/strong>:\n<code>json\n{\n  \"Effect\": \"Deny\",\n  \"Action\": [\n    \"s3:PutBucketPublicAccessBlock\"\n  ],\n  \"Resource\": \"*\",\n  \"Condition\": {\n    \"Bool\": {\n      \"s3:BlockPublicAcls\": \"false\"\n    }\n  }\n}<\/code><\/p>\n<p><strong>SCP Evaluation Logic<\/strong>:\n1. Explicit Deny in SCP → DENY\n2. SCP allows + IAM allows → ALLOW\n3. Default → DENY<\/p>\n<p><strong>Multi-Layer Security<\/strong>:\n- <strong>SCP<\/strong>: Preventive (organization-wide)\n- <strong>Config<\/strong>: Detective (compliance monitoring)\n- <strong>Automated Remediation<\/strong>: Corrective (fix non-compliant)<\/p>\n<p><strong>References:<\/strong> AWS Organizations SCPs, Preventive Controls, Multi-Account Governance<\/p>","fixed":false},{"id":"sec-13","c":"sec","q":"<p>A company needs to ensure S3 objects cannot be deleted for 7 years and even the root account cannot override this. Which feature should be configured?<\/p>","o":["S3 Versioning with Lifecycle policies","S3 Object Lock in Compliance Mode","S3 Object Lock in Governance Mode","MFA Delete"],"a":[1],"x":"<ul>\n<li><strong>S3 Object Lock in Compliance Mode<\/strong> enforces WORM (Write Once Read Many)<\/li>\n<li>Cannot be overridden by anyone, including root account<\/li>\n<li>Retention period cannot be shortened<\/li>\n<li>Object versions cannot be deleted during retention period<\/li>\n<\/ul>\n<p><strong>Object Lock Modes<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Governance Mode<\/th>\n<th>Compliance Mode<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Override<\/strong><\/td>\n<td>Yes (with special permission)<\/td>\n<td>No (even root cannot)<\/td>\n<\/tr>\n<tr>\n<td><strong>Delete<\/strong><\/td>\n<td>Can be deleted with permission<\/td>\n<td>Cannot be deleted<\/td>\n<\/tr>\n<tr>\n<td><strong>Retention Change<\/strong><\/td>\n<td>Can shorten with permission<\/td>\n<td>Cannot shorten<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>Internal governance<\/td>\n<td>Regulatory compliance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Object Lock Components<\/strong>:<\/p>\n<p><strong>1. Retention Modes<\/strong>:\n- <strong>Compliance<\/strong>: Immutable, regulatory compliance\n- <strong>Governance<\/strong>: Flexible, internal policies<\/p>\n<p><strong>2. Retention Period<\/strong>:\n- Fixed period (days/years)\n- Protect-until date<\/p>\n<p><strong>3. Legal Hold<\/strong>:\n- Indefinite protection\n- On/off toggle\n- Independent of retention period\n- Requires <code>s3:PutObjectLegalHold<\/code> permission<\/p>\n<p><strong>Configuration Requirements<\/strong>:\n1. <strong>Versioning must be enabled<\/strong> (object lock requires versioning)\n2. <strong>Object Lock enabled at bucket creation<\/strong> (cannot enable later)\n3. <strong>Default retention settings<\/strong> (optional, can be per-object)<\/p>\n<p><strong>Compliance Mode Example<\/strong>:\n<code>json\n{\n  \"ObjectLockConfiguration\": {\n    \"ObjectLockEnabled\": \"Enabled\",\n    \"Rule\": {\n      \"DefaultRetention\": {\n        \"Mode\": \"COMPLIANCE\",\n        \"Years\": 7\n      }\n    }\n  }\n}<\/code><\/p>\n<p><strong>Legal Hold Example<\/strong>:\n<code>bash\naws s3api put-object-legal-hold \\\n  --bucket my-bucket \\\n  --key document.pdf \\\n  --legal-hold Status=ON<\/code><\/p>\n<p><strong>Compliance Use Cases<\/strong>:\n- SEC Rule 17a-4 (financial services)\n- HIPAA (healthcare)\n- FINRA (financial industry)\n- Legal documents\n- Regulatory archives<\/p>\n<p><strong>Object Lock vs Other Protection<\/strong>:\n- <strong>Versioning<\/strong>: Can delete versions\n- <strong>MFA Delete<\/strong>: Adds MFA but can still delete\n- <strong>Object Lock Governance<\/strong>: Can override with permissions\n- <strong>Object Lock Compliance<\/strong>: True immutability<\/p>\n<p><strong>References:<\/strong> S3 Object Lock, WORM Compliance, Regulatory Requirements<\/p>","fixed":false},{"id":"sec-14","c":"sec","q":"<p>A company wants to provide temporary, limited-privilege access to third-party vendors to perform specific tasks in their AWS account. What is the BEST approach?<\/p>","o":["Create IAM users with passwords","Share root ac
