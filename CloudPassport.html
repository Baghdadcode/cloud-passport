count credentials temporarily","Create cross-account IAM roles with external ID","Create access keys and share them"],"a":[2],"x":"<ul>\n<li><strong>Cross-account IAM roles with External ID<\/strong> provide secure temporary access<\/li>\n<li>No long-term credentials needed<\/li>\n<li>External ID prevents confused deputy problem<\/li>\n<li>Fine-grained permissions with session duration limits<\/li>\n<\/ul>\n<p><strong>Cross-Account Access Architecture<\/strong>:<\/p>\n<p><strong>1. Trust Policy<\/strong> (in your account):\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Principal\": {\n        \"AWS\": \"arn:aws:iam::VENDOR-ACCOUNT:root\"\n      },\n      \"Action\": \"sts:AssumeRole\",\n      \"Condition\": {\n        \"StringEquals\": {\n          \"sts:ExternalId\": \"UniqueExternalId12345\"\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p><strong>2. Permissions Policy<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"s3:GetObject\",\n        \"s3:ListBucket\"\n      ],\n      \"Resource\": [\n        \"arn:aws:s3:::my-bucket\",\n        \"arn:aws:s3:::my-bucket/*\"\n      ]\n    }\n  ]\n}<\/code><\/p>\n<p><strong>External ID - Confused Deputy Prevention<\/strong>:<\/p>\n<p><strong>The Problem<\/strong>:\n- Vendor uses same role name for all customers\n- Attacker could trick vendor into accessing your resources<\/p>\n<p><strong>The Solution<\/strong>:\n- Unique External ID per customer\n- Vendor must provide correct External ID to assume role\n- Prevents unauthorized access<\/p>\n<p><strong>Implementation Steps<\/strong>:<\/p>\n<p><strong>Your Account<\/strong>:\n1. Create IAM role for vendor\n2. Set trust policy with vendor's account ID\n3. Add External ID condition (vendor provides this)\n4. Attach permissions policy (least privilege)\n5. Configure session duration (1-12 hours)<\/p>\n<p><strong>Vendor Account<\/strong>:\n1. Configure to assume role\n2. Provide External ID when assuming\n3. Receive temporary credentials\n4. Credentials auto-expire after session duration<\/p>\n<p><strong>AssumeRole Example<\/strong> (vendor side):\n<code>bash\naws sts assume-role \\\n  --role-arn arn:aws:iam::YOUR-ACCOUNT:role/VendorRole \\\n  --role-session-name vendor-session \\\n  --external-id UniqueExternalId12345 \\\n  --duration-seconds 3600<\/code><\/p>\n<p><strong>Benefits<\/strong>:\n- ✅ No long-term credentials\n- ✅ Automatic credential rotation\n- ✅ Auditable (CloudTrail)\n- ✅ Time-limited access\n- ✅ Revocable (delete role)\n- ✅ Prevents confused deputy<\/p>\n<p><strong>Best Practices<\/strong>:\n1. Always use External ID\n2. Principle of least privilege\n3. Short session durations (1-2 hours)\n4. Monitor with CloudTrail\n5. Review permissions regularly\n6. Use MFA for sensitive roles<\/p>\n<p><strong>References:<\/strong> Cross-Account Access, External ID, Confused Deputy Problem, IAM Roles<\/p>","fixed":false},{"id":"sec-15","c":"sec","q":"<p>A company needs to rotate SSL/TLS certificates for their application load balancers automatically. Which service should they use?<\/p>","o":["AWS Certificate Manager (ACM)","AWS Secrets Manager","AWS KMS","IAM Server Certificates"],"a":[0],"x":"<ul>\n<li><strong>AWS Certificate Manager (ACM)<\/strong> provides free SSL/TLS certificates<\/li>\n<li>Automatic renewal (no manual intervention)<\/li>\n<li>Automatic deployment to integrated services<\/li>\n<li>Free for public certificates<\/li>\n<\/ul>\n<p><strong>ACM Features<\/strong>:<\/p>\n<p><strong>1. Automatic Renewal<\/strong>:\n- ACM automatically renews certificates before expiration\n- No downtime during renewal\n- Deploys renewed certificate automatically<\/p>\n<p><strong>2. Supported Services<\/strong>:\n- Elastic Load Balancing (ALB, NLB, CLB)\n- Amazon CloudFront\n- Amazon API Gateway\n- AWS App Runner\n- AWS Elastic Beanstalk<\/p>\n<p><strong>3. Certificate Types<\/strong>:\n- <strong>Public Certificates<\/strong>: Free, validated via DNS or email\n- <strong>Private Certificates<\/strong>: Paid, via AWS Private CA<\/p>\n<p><strong>4. Validation Methods<\/strong>:\n- <strong>DNS Validation<\/strong>: Add CNAME record (recommended)\n- <strong>Email Validation<\/strong>: Email to domain contacts<\/p>\n<p><strong>ACM Certificate Request<\/strong>:\n<code>bash\naws acm request-certificate \\\n  --domain-name example.com \\\n  --subject-alternative-names *.example.com \\\n  --validation-method DNS<\/code><\/p>\n<p><strong>DNS Validation (Route 53)<\/strong>:\n```bash<\/p>\n<h1>ACM provides CNAME record<\/h1>\n<h1>Add to Route 53:<\/h1>\n<p>Name: _abc123.example.com\nType: CNAME\nValue: _xyz789.acm-validations.aws\n```<\/p>\n<p><strong>CloudFront Requirement<\/strong>:\n- Certificate must be in <strong>us-east-1<\/strong> region\n- Must be public certificate\n- Can use wildcard (*.example.com)<\/p>\n<p><strong>Certificate Monitoring<\/strong>:\n- CloudWatch metrics for expiration\n- EventBridge events for renewal status\n- AWS Health Dashboard notifications<\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use DNS validation (faster, automatic)\n2. Use ACM for all supported services\n3. Monitor certificate expiration (backup)\n4. Use wildcard for subdomains\n5. Enable automatic renewal<\/p>\n<p><strong>References:<\/strong> AWS Certificate Manager, SSL/TLS Certificates, Automatic Renewal<\/p>","fixed":false},{"id":"sec-16","c":"sec","q":"<p>A company wants to centrally manage firewall rules across multiple AWS accounts and VPCs. Which service should be used?<\/p>","o":["Security Groups","Network ACLs","AWS Firewall Manager","AWS WAF"],"a":[2],"x":"<ul>\n<li><strong>AWS Firewall Manager<\/strong> centrally configures and manages firewall rules<\/li>\n<li>Works across accounts and resources in AWS Organizations<\/li>\n<li>Ensures consistent security policies<\/li>\n<li>Automatic policy application to new resources<\/li>\n<\/ul>\n<p><strong>Firewall Manager Capabilities<\/strong>:<\/p>\n<p><strong>1. Supported Policies<\/strong>:\n- AWS WAF rules (ALB, CloudFront, API Gateway)\n- AWS Shield Advanced protections\n- VPC Security Groups\n- AWS Network Firewall rules\n- Route 53 Resolver DNS Firewall\n- Third-party firewall appliances<\/p>\n<p><strong>2. Policy Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Policy Type<\/th>\n<th>Scope<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>WAF Policy<\/strong><\/td>\n<td>CloudFront, ALB, API Gateway<\/td>\n<td>Web application protection<\/td>\n<\/tr>\n<tr>\n<td><strong>Shield Advanced<\/strong><\/td>\n<td>CloudFront, ALB, EIP<\/td>\n<td>DDoS protection<\/td>\n<\/tr>\n<tr>\n<td><strong>Security Group<\/strong><\/td>\n<td>EC2, ENI<\/td>\n<td>VPC-level firewall<\/td>\n<\/tr>\n<tr>\n<td><strong>Network Firewall<\/strong><\/td>\n<td>VPC<\/td>\n<td>Stateful firewall<\/td>\n<\/tr>\n<tr>\n<td><strong>DNS Firewall<\/strong><\/td>\n<td>VPC<\/td>\n<td>DNS query filtering<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>3. Policy Application<\/strong>:\n- Automatically applied to all accounts in organization\n- Applied to new resources automatically\n- Centralized compliance monitoring<\/p>\n<p><strong>Firewall Manager Example Use Case<\/strong>:<\/p>\n<p><strong>Scenario<\/strong>: Enforce WAF rules across all ALBs in organization<\/p>\n<p><strong>Configuration<\/strong>:\n<code>json\n{\n  \"Policy\": {\n    \"PolicyName\": \"EnforceWAFOnAllALBs\",\n    \"ResourceType\": \"AWS::ElasticLoadBalancingV2::LoadBalancer\",\n    \"IncludeMap\": {\n      \"ACCOUNT\": [\"*\"]\n    },\n    \"RemediationEnabled\": true,\n    \"SecurityServicePolicyData\": {\n      \"Type\": \"WAF\",\n      \"ManagedServiceData\": {\n        \"RuleGroups\": [\"AWSManagedRulesCommonRuleSet\"]\n      }\n    }\n  }\n}<\/code><\/p>\n<p><strong>Benefits<\/strong>:\n1. <strong>Centralized Management<\/strong>: Single console for all accounts\n2. <strong>Automatic Compliance<\/strong>: Policies auto-applied\n3. <strong>Consistent Security<\/strong>: Same rules everywhere\n4. <strong>Reduced Overhead<\/strong>: No manual configuration per account\n5. <strong>Visibility<\/strong>: Compliance dashboard<\/p>\n<p><strong>Firewall Manager vs Manual Management<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Aspect<\/th>\n<th>Firewall Manager<\/th>\n<th>Manual<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Setup<\/strong><\/td>\n<td>Once (centralized)<\/td>\n<td>Per account/resource<\/td>\n<\/tr>\n<tr>\n<td><strong>New Resources<\/strong><\/td>\n<td>Automatic<\/td>\n<td>Manual<\/td>\n<\/tr>\n<tr>\n<td><strong>Compliance<\/strong><\/td>\n<td>Monitored<\/td>\n<td>Manual checks<\/td>\n<\/tr>\n<tr>\n<td><strong>Updates<\/strong><\/td>\n<td>Centralized<\/td>\n<td>Per account<\/td>\n<\/tr>\n<tr>\n<td><strong>Accounts<\/strong><\/td>\n<td>Multi-account<\/td>\n<td>Single account<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Common Policies<\/strong>:<\/p>\n<p><strong>1. Common WAF Rules<\/strong>:\n- SQL injection protection\n- XSS protection\n- Rate limiting (prevent abuse)\n- Geographic restrictions\n- IP blacklist/whitelist\n- String/pattern matching<\/p>\n<p><strong>2. Security Group Rules<\/strong>:\n- Restrict SSH (port 22) to corporate IPs\n- Deny all unauthorized outbound traffic<\/p>\n<p><strong>3. DNS Firewall<\/strong>:\n- Block known malicious domains\n- Data exfiltration prevention<\/p>\n<p><strong>Prerequisites<\/strong>:\n- AWS Organizations enabled\n- Firewall Manager administrator account\n- AWS Config enabled in all accounts\n- AWS Config Service-Linked Role<\/p>\n<p><strong>References:<\/strong> AWS Firewall Manager, Centralized Security Management, Multi-Account Firewall<\/p>","fixed":false},{"id":"sec-17","c":"sec","q":"<p>A developer accidentally commits AWS credentials to a public GitHub repository. What immediate actions should be taken? (Choose THREE)<\/p>","o":["Change the IAM user's password","Deactivate and delete the exposed access keys immediately","Review CloudTrail logs for unauthorized activity","Enable MFA on the account","Create new access keys before deleting old ones","Check AWS Personal Health Dashboard"],"a":[1,2,4],"x":"<p><strong>Immediate Response Steps<\/strong>:<\/p>\n<p><strong>1. Deactivate/Delete Exposed Credentials (B)<\/strong>:\n- <strong>FIRST<\/strong>: Deactivate keys immediately\n- <strong>SECOND<\/strong>: Review activity\n- <strong>THIRD<\/strong>: Delete keys after creating new ones<\/p>\n<p>```bash<\/p>\n<h1>Deactivate immediately<\/h1>\n<p>aws iam update-access-key \\\n  --access-key-id AKIAIOSFODNN7EXAMPLE \\\n  --status Inactive \\\n  --user-name compromised-user<\/p>\n<h1>After review, delete<\/h1>\n<p>aws iam delete-access-key \\\n  --access-key-id AKIAIOSFODNN7EXAMPLE \\\n  --user-name compromised-user\n```<\/p>\n<p><strong>2. Review CloudTrail Logs (C)<\/strong>:\n- Check for unauthorized API calls\n- Identify scope of compromise\n- Document affected resources<\/p>\n<p>```bash<\/p>\n<h1>Check recent activity<\/h1>\n<p>aws cloudtrail lookup-events \\\n  --lookup-attributes AttributeKey=AccessKeyId,AttributeValue=AKIA... \\\n  --max-items 50\n```<\/p>\n<p><strong>3. Create New Credentials Before Deleting (E)<\/strong>:\n- Ensure application continuity\n- Update applications with new keys\n- Then delete compromised keys<\/p>\n<p><strong>Complete Incident Response Checklist<\/strong>:<\/p>\n<p><strong>Immediate (Minutes)<\/strong>:\n- [ ] Deactivate exposed credentials\n- [ ] Alert security team\n- [ ] Check GuardDuty for findings<\/p>\n<p><strong>Short-term (Hours)<\/strong>:\n- [ ] Review CloudTrail logs (7-90 days)\n- [ ] Identify unauthorized actions\n- [ ] Assess damage (new resources, data access)\n- [ ] Create new credentials\n- [ ] Update applications\n- [ ] Delete old credentials\n- [ ] Revoke temporary credentials (if role assumed)<\/p>\n<p><strong>Medium-term (Days)<\/strong>:\n- [ ] Review IAM policies (reduce permissions)\n- [ ] Enable MFA (not immediate priority but important)\n- [ ] Implement AWS Secrets Manager\n- [ ] Set up CloudWatch alarms for unusual activity\n- [ ] Review security groups, NACLs\n- [ ] Check for backdoors (IAM users, roles)<\/p>\n<p><strong>Long-term (Weeks)<\/strong>:\n- [ ] Implement AWS SSO\n- [ ] Enforce MFA organization-wide\n- [ ] Use IAM roles instead of access keys\n- [ ] Implement secrets rotation\n- [ ] Security training\n- [ ] Code repository scanning (git-secrets)\n- [ ] Implement preventive controls<\/p>\n<p><strong>CloudTrail Investigation Queries<\/strong>:\n```sql\n-- Find all actions by compromised key\nSELECT eventTime, eventName, awsRegion, sourceIPAddress, userAgent\nFROM cloudtrail_logs\nWHERE userIdentity.accessKeyId = 'AKIA...'\nORDER BY eventTime DESC<\/p>\n<p>-- Look for suspicious patterns\n-- - CreateUser, CreateAccessKey (persistence)\n-- - RunInstances (cryptocurrency mining)\n-- - PutBucketPolicy (data exfiltration)\n-- - CreateRole, AttachRolePolicy (privilege escalation)\n```<\/p>\n<p><strong>GuardDuty Findings to Check<\/strong>:\n- UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration\n- Persistence:IAMUser/UserPermissions\n- PrivilegeEscalation:IAMUser/AdministrativePermissions\n- Impact:IAMUser/MaliciousIPCaller<\/p>\n<p><strong>Why Other Options are Wrong<\/strong>:\n- <strong>A (Password)<\/strong>: Access keys and passwords are separate\n- <strong>D (MFA)<\/strong>: Important but not immediate priority\n- <strong>F (PHD)<\/strong>: Doesn't relate to credential exposure<\/p>\n<p><strong>Prevention Strategies<\/strong>:\n1. <strong>Never commit credentials<\/strong> to version control\n2. Use <strong>IAM roles<\/strong> for applications\n3. Implement <strong>AWS Secrets Manager<\/strong> or <strong>Parameter Store<\/strong>\n4. Use <strong>git-secrets<\/strong> or <strong>git-hound<\/strong> to scan repositories\n5. Enable <strong>AWS GuardDuty<\/strong> for detection\n6. Rotate credentials regularly\n7. Use <strong>short-lived credentials<\/strong> (STS)\n8. Implement <strong>AWS SSO<\/strong> for users<\/p>\n<p><strong>References:<\/strong> Incident Response, Credential Exposure, CloudTrail Analysis, Security Best Practices<\/p>","fixed":false},{"id":"sec-18","c":"sec","q":"<p>A company wants to ensure data encryption in transit between their on-premises data center and AWS. Which connectivity option provides encryption by default?<\/p>","o":["AWS Direct Connect","AWS Site-to-Site VPN","Internet Gateway","AWS PrivateLink"],"a":[1],"x":"<ul>\n<li><strong>AWS Site-to-Site VPN<\/strong> uses IPsec to encrypt data in transit<\/li>\n<li>Encryption is built-in and automatic<\/li>\n<li>No additional configuration needed for encryption<\/li>\n<\/ul>\n<p><strong>Connectivity Options Comparison<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Option<\/th>\n<th>Encryption<\/th>\n<th>Speed<\/th>\n<th>Setup<\/th>\n<th>Cost<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Site-to-Site VPN<\/strong><\/td>\n<td>Yes (IPsec)<\/td>\n<td>Up to 1.25 Gbps<\/td>\n<td>Minutes<\/td>\n<td>Low<\/td>\n<\/tr>\n<tr>\n<td><strong>Direct Connect<\/strong><\/td>\n<td>No (but can add)<\/td>\n<td>1-100 Gbps<\/td>\n<td>Weeks<\/td>\n<td>High<\/td>\n<\/tr>\n<tr>\n<td><strong>DX + VPN<\/strong><\/td>\n<td>Yes<\/td>\n<td>1-100 Gbps<\/td>\n<td>Weeks<\/td>\n<td>High<\/td>\n<\/tr>\n<tr>\n<td><strong>Internet<\/strong><\/td>\n<td>HTTPS only<\/td>\n<td>Variable<\/td>\n<td>Immediate<\/td>\n<td>Very low<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Site-to-Site VPN Features<\/strong>:<\/p>\n<p><strong>1. Encryption<\/strong>:\n- IPsec tunnel\n- AES-256-GCM or AES-128-GCM encryption\n- SHA-2 hashing\n- DH (Diffie-Hellman) groups<\/p>\n<p><strong>2. Redundancy<\/strong>:\n- AWS provides 2 VPN tunnels per connection\n- Active/passive or active/active\n- Multi-AZ availability<\/p>\n<p><strong>3. Dynamic Routing<\/strong>:\n- BGP support\n- Automatic failover\n- Route propagation<\/p>\n<p><strong>VPN Configuration<\/strong>:\n<code>json\n{\n  \"VPNConnection\": {\n    \"IKEVersions\": [\"ikev2\"],\n    \"Phase1EncryptionAlgorithms\": [\"AES256-GCM-16\"],\n    \"Phase1IntegrityAlgorithms\": [\"SHA2-256\"],\n    \"Phase1DHGroupNumbers\": [14],\n    \"Phase2EncryptionAlgorithms\": [\"AES256-GCM-16\"],\n    \"Phase2IntegrityAlgorithms\": [\"SHA2-256\"]\n  }\n}<\/code><\/p>\n<p><strong>Direct Connect Encryption<\/strong>:<\/p>\n<p><strong>Option 1: DX + Public VIF + VPN<\/strong>:\n- VPN over Direct Connect\n- Encrypted but complex<\/p>\n<p><strong>Option 2: DX + VPN (Separate)<\/strong>:\n- Direct Connect for primary (unencrypted)\n- VPN for backup (encrypted)<\/p>\n<p><strong>Option 3: MACsec<\/strong> (Direct Connect):\n- Layer 2 encryption\n- 10 Gbps and 100 Gbps connections only\n- Not available for all locations<\/p>\n<p><strong>When to Choose<\/strong>:<\/p>\n<p><strong>Site-to-Site VPN<\/strong>:\n- Need immediate encryption\n- Budget-conscious\n- Bandwidth &lt; 1 Gbps adequate\n- Quick setup required<\/p>\n<p><strong>Direct Connect<\/strong>:\n- Large data transfers\n- Consistent performance needed\n- Can add VPN for encryption\n- Long-term investment<\/p>\n<p><strong>Best Practice - Hybrid<\/strong>:\n- Primary: Direct Connect (performance)\n- Backup: VPN (encrypted, failover)\n- Provides both performance and encryption<\/p>\n<p><strong>References:<\/strong> Site-to-Site VPN, Direct Connect, Encryption in Transit, Hybrid Connectivity<\/p>","fixed":false},{"id":"sec-19","c":"sec","q":"<p>A company wants to ensure EC2 instances can only launch in approved VPCs and subnets. How can this be enforced at the organization level?<\/p>","o":["IAM policy condition checking VPC ID","Service Control Policy (SCP) in AWS Organizations","AWS Config rule","Security Group rules"],"a":[1],"x":"<ul>\n<li><strong>Service Control Policy (SCP)<\/strong> provides organization-wide preventive control<\/li>\n<li>Can restrict actions based on VPC/subnet<\/li>\n<li>Cannot be bypassed by member accounts<\/li>\n<li>Enforced before IAM policies<\/li>\n<\/ul>\n<p><strong>SCP Example - Restrict to Approved VPCs<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"RequireApprovedVPC\",\n      \"Effect\": \"Deny\",\n      \"Action\": \"ec2:RunInstances\",\n      \"Resource\": \"arn:aws:ec2:*:*:subnet/*\",\n      \"Condition\": {\n        \"StringNotEquals\": {\n          \"ec2:Vpc\": [\n            \"arn:aws:ec2:us-east-1:123456789012:vpc/vpc-approved1\",\n            \"arn:aws:ec2:us-west-2:123456789012:vpc/vpc-approved2\"\n          ]\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p><strong>SCP Example - Restrict to Approved Subnets<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"RequireApprovedSubnets\",\n      \"Effect\": \"Deny\",\n      \"Action\": \"ec2:RunInstances\",\n      \"Resource\": \"arn:aws:ec2:*:*:subnet/*\",\n      \"Condition\": {\n        \"StringNotLike\": {\n          \"ec2:Subnet\": [\n            \"arn:aws:ec2:*:*:subnet/subnet-12345678\",\n            \"arn:aws:ec2:*:*:subnet/subnet-87654321\"\n          ]\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p><strong>Useful EC2 Condition Keys<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Condition Key<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ec2:Vpc<\/code><\/td>\n<td>Restrict to specific VPCs<\/td>\n<\/tr>\n<tr>\n<td><code>ec2:Subnet<\/code><\/td>\n<td>Restrict to specific subnets<\/td>\n<\/tr>\n<tr>\n<td><code>ec2:InstanceType<\/code><\/td>\n<td>Limit instance types<\/td>\n<\/tr>\n<tr>\n<td><code>ec2:Region<\/code><\/td>\n<td>Region restrictions<\/td>\n<\/tr>\n<tr>\n<td><code>ec2:Tenancy<\/code><\/td>\n<td>Dedicated vs default<\/td>\n<\/tr>\n<tr>\n<td><code>ec2:RootDeviceType<\/code><\/td>\n<td>EBS vs instance store<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Multi-Layer Enforcement<\/strong>:<\/p>\n<p><strong>Layer 1 - SCP (Preventive)<\/strong>:\n<code>json\n{\n  \"Effect\": \"Deny\",\n  \"Action\": \"ec2:RunInstances\",\n  \"Resource\": \"*\",\n  \"Condition\": {\n    \"StringNotEquals\": {\n      \"ec2:Vpc\": \"arn:aws:ec2:*:*:vpc/vpc-approved*\"\n    }\n  }\n}<\/code><\/p>\n<p><strong>Layer 2 - IAM Policy (Preventive)<\/strong>:\n<code>json\n{\n  \"Effect\": \"Allow\",\n  \"Action\": \"ec2:RunInstances\",\n  \"Resource\": \"*\",\n  \"Condition\": {\n    \"StringEquals\": {\n      \"ec2:Subnet\": [\n        \"arn:aws:ec2:*:*:subnet/subnet-prod1\",\n        \"arn:aws:ec2:*:*:subnet/subnet-prod2\"\n      ]\n    }\n  }\n}<\/code><\/p>\n<p><strong>Layer 3 - Config (Detective)<\/strong>:\n<code>json\n{\n  \"ConfigRuleName\": \"instances-in-approved-subnets\",\n  \"Source\": {\n    \"Owner\": \"CUSTOM_LAMBDA\",\n    \"SourceIdentifier\": \"arn:aws:lambda:...\"\n  }\n}<\/code><\/p>\n<p><strong>Why SCP is Best<\/strong>:\n1. <strong>Organization-wide<\/strong>: Applies to all accounts\n2. <strong>Preventive<\/strong>: Blocks before creation\n3. <strong>Cannot override<\/strong>: Even admins cannot bypass\n4. <strong>Centralized<\/strong>: Managed from master account\n5. <strong>Inherited<\/strong>: Applied to OUs and child accounts<\/p>\n<p><strong>Comparison<\/strong>:\n- <strong>SCP<\/strong>: Preventive, organization-wide, cannot override\n- <strong>IAM<\/strong>: Preventive, account-level, admins can change\n- <strong>Config<\/strong>: Detective, alerts after creation\n- <strong>Security Groups<\/strong>: Network-level, not launch control<\/p>\n<p><strong>References:<\/strong> Service Control Policies, VPC Restrictions, EC2 Launch Controls<\/p>","fixed":false},{"id":"sec-20","c":"sec","q":"<p>A company needs to monitor and respond to unusual API activity patterns that might indicate compromised credentials. Which service combination is MOST effective?<\/p>","o":["CloudTrail + CloudWatch Logs","GuardDuty + EventBridge + Lambda","Config + SNS","Inspector + Security Hub"],"a":[1],"x":"<ul>\n<li><strong>GuardDuty<\/strong> uses ML to detect unusual API activity automatically<\/li>\n<li><strong>EventBridge<\/strong> routes findings to automated response<\/li>\n<li><strong>Lambda<\/strong> executes remediation actions<\/li>\n<li>Fully automated threat detection and response<\/li>\n<\/ul>\n<p><strong>Automated Threat Response Architecture<\/strong>:<\/p>\n<p><code>CloudTrail Events (API calls)\n      ↓\nGuardDuty (ML-based analysis)\n      ↓\nFinding: UnauthorizedAccess:IAMUser/MaliciousIPCaller\n      ↓\nEventBridge Rule\n      ↓\nLambda Function\n      ↓\nAutomated Response:\n  - Isolate instance\n  - Disable credentials\n  - Create snapshot\n  - Send SNS notification\n  - Create support ticket<\/code><\/p>\n<p><strong>GuardDuty Finding Example<\/strong>:\n<code>json\n{\n  \"schemaVersion\": \"2.0\",\n  \"accountId\": \"123456789012\",\n  \"region\": \"us-east-1\",\n  \"partition\": \"aws\",\n  \"id\": \"finding-id\",\n  \"arn\": \"arn:aws:guardduty:...\",\n  \"type\": \"UnauthorizedAccess:IAMUser/MaliciousIPCaller.Custom\",\n  \"service\": {\n    \"serviceName\": \"guardduty\",\n    \"detectorId\": \"detector-id\",\n    \"action\": {\n      \"actionType\": \"AWS_API_CALL\",\n      \"awsApiCallAction\": {\n        \"api\": \"RunInstances\",\n        \"serviceName\": \"ec2.amazonaws.com\",\n        \"callerType\": \"Remote IP\",\n        \"remoteIpDetails\": {\n          \"ipAddressV4\": \"198.51.100.0\",\n          \"organization\": {\n            \"isp\": \"Malicious ISP\"\n          },\n          \"geoLocation\": {\n            \"lat\": 39.0,\n            \"lon\": -77.0\n          }\n        }\n      }\n    }\n  },\n  \"severity\": 8,\n  \"title\": \"API call originated from a known malicious IP address\",\n  \"description\": \"API RunInstances was invoked from a known malicious IP address\"\n}<\/code><\/p>\n<p><strong>EventBridge Rule<\/strong> (routes GuardDuty findings):\n<code>json\n{\n  \"source\": [\"aws.guardduty\"],\n  \"detail-type\": [\"GuardDuty Finding\"],\n  \"detail\": {\n    \"severity\": [7, 8, 9],\n    \"type\": [\n      \"UnauthorizedAccess:IAMUser/MaliciousIPCaller\",\n      \"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration\",\n      \"PrivilegeEscalation:IAMUser/AdministrativePermissions\"\n    ]\n  }\n}<\/code><\/p>\n<p><strong>Lambda Response Function<\/strong> (Python example):\n```python\nimport boto3<\/p>\n<p>def lambda_handler(event, context):\n    finding = event['detail']\n    finding_type = finding['type']\n    severity = finding['severity']<\/p>\n<pre><code>iam = boto3.client('iam')\nec2 = boto3.client('ec2')\nsns = boto3.client('sns')\n\n# Extract compromised credentials\nif 'resource' in finding:\n    resource = finding['resource']\n\n    # If IAM user compromised\n    if resource['resourceType'] == 'AccessKey':\n        access_key_id = resource['accessKeyDetails']['accessKeyId']\n        user_name = resource['accessKeyDetails']['userName']\n\n        # Disable access key\n        iam.update_access_key(\n            UserName=user_name,\n            AccessKeyId=access_key_id,\n            Status='Inactive'\n        )\n\n        # Attach deny-all policy\n        iam.attach_user_policy(\n            UserName=user_name,\n            PolicyArn='arn:aws:iam::aws:policy/AWSDenyAll'\n        )\n\n    # If EC2 instance compromised\n    elif resource['resourceType'] == 'Instance':\n        instance_id = resource['instanceDetails']['instanceId']\n\n        # Create snapshot for forensics\n        volumes = ec2.describe_volumes(\n            Filters=[{'Name': 'attachment.instance-id', 'Values': [instance_id]}]\n        )\n        for volume in volumes['Volumes']:\n            ec2.create_snapshot(\n                VolumeId=volume['VolumeId'],\n                Description=f'Forensic snapshot - GuardDuty finding {finding[\"id\"]}'\n            )\n\n        # Isolate instance (change to quarantine SG)\n        ec2.modify_instance_attribute(\n            InstanceId=instance_id,\n            Groups=['sg-quarantine']\n        )\n\n        # Optionally stop instance\n        ec2.stop_instances(InstanceIds=[instance_id])\n\n# Send notification\nsns.publish(\n    TopicArn='arn:aws:sns:us-east-1:123456789012:security-alerts',\n    Subject=f'GuardDuty Finding: {finding_type}',\n    Message=f\"\"\"\n    Severity: {severity}\n    Type: {finding_type}\n    Description: {finding['description']}\n\n    Automated actions taken:\n    - Credentials disabled\n    - Instance isolated\n    - Forensic snapshots created\n    - Security team notified\n    - Create support ticket\n    \"\"\"\n)\n\nreturn {\n    'statusCode': 200,\n    'body': 'Automated response completed'\n}\n<\/code><\/pre>\n<p>```<\/p>\n<p><strong>Common GuardDuty Finding Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Finding Type<\/th>\n<th>Description<\/th>\n<th>Response<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>UnauthorizedAccess:IAMUser/MaliciousIPCaller<\/strong><\/td>\n<td>API calls from malicious IP<\/td>\n<td>Disable credentials<\/td>\n<\/tr>\n<tr>\n<td><strong>UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration<\/strong><\/td>\n<td>Credentials used outside AWS<\/td>\n<td>Rotate credentials<\/td>\n<\/tr>\n<tr>\n<td><strong>PrivilegeEscalation:IAMUser/AdministrativePermissions<\/strong><\/td>\n<td>User gained admin permissions<\/td>\n<td>Revoke permissions<\/td>\n<\/tr>\n<tr>\n<td><strong>Persistence:IAMUser/UserPermissions<\/strong><\/td>\n<td>User created new access keys<\/td>\n<td>Review and delete<\/td>\n<\/tr>\n<tr>\n<td><strong>Impact:IAMUser/AnomalousBehavior<\/strong><\/td>\n<td>Unusual API activity<\/td>\n<td>Investigate<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Complete Response Playbook<\/strong>:<\/p>\n<p><strong>Detection<\/strong> (GuardDuty):\n- Continuous monitoring\n- ML-based anomaly detection\n- Threat intelligence feeds<\/p>\n<p><strong>Routing<\/strong> (EventBridge):\n- Filter by severity\n- Route to appropriate response<\/p>\n<p><strong>Response<\/strong> (Lambda):\n- Disable credentials\n- Isolate resources\n- Create forensic snapshots\n- Alert security team\n- Create incident ticket<\/p>\n<p><strong>Investigation<\/strong> (Manual):\n- Review CloudTrail logs\n- Analyze scope of compromise\n- Identify affected resources\n- Root cause analysis<\/p>\n<p><strong>Remediation<\/strong> (Manual/Automated):\n- Rotate credentials\n- Update IAM policies\n- Remove backdoors\n- Apply security patches\n- Update security groups<\/p>\n<p><strong>Prevention<\/strong> (Long-term):\n- Implement MFA\n- Use IAM roles\n- Enforce least privilege\n- Regular access reviews\n- Security training<\/p>\n<p><strong>Why This Combination is Best<\/strong>:\n1. <strong>GuardDuty<\/strong>: Intelligent detection (no manual rules)\n2. <strong>EventBridge<\/strong>: Flexible routing\n3. <strong>Lambda<\/strong>: Automated response (immediate action)\n4. <strong>Scalable<\/strong>: No infrastructure\n5. <strong>Comprehensive<\/strong>: Covers all AWS API activity<\/p>\n<p><strong>Alternative (Manual)<\/strong>:\n- CloudTrail → CloudWatch Logs → Metric Filters → Alarms → SNS\n- Requires manual pattern definition\n- Less intelligent\n- Manual response<\/p>\n<p><strong>References:<\/strong> GuardDuty, Automated Incident Response, EventBridge, Security Automation<\/p>","fixed":false},{"id":"sec-21","c":"sec","q":"<p>A company needs to provide auditors with access to compliance reports and agreements for various AWS services. Which AWS service should they use?<\/p>","o":["AWS Artifact","AWS Audit Manager","AWS Config","AWS Security Hub"],"a":[0],"x":"<ul>\n<li>AWS Artifact provides on-demand access to AWS compliance reports and agreements<\/li>\n<li>Used for audit, compliance, and regulatory requirements<\/li>\n<li>Audit Manager is for automating evidence collection, not report access<\/li>\n<li>Config is for resource compliance, not reports<\/li>\n<li>Security Hub is for security findings, not compliance documents<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Artifact, Compliance Reports<\/p>","fixed":false},{"id":"sec-22","c":"sec","q":"<p>A security team wants to automate evidence collection for compliance frameworks such as PCI DSS and HIPAA. Which AWS service should they use?<\/p>","o":["AWS Audit Manager","AWS Artifact","AWS Config","AWS Security Hub"],"a":[0],"x":"<ul>\n<li>AWS Audit Manager automates evidence collection for audits<\/li>\n<li>Maps AWS resources to control requirements<\/li>\n<li>Artifact is for downloading compliance reports<\/li>\n<li>Config is for resource compliance, not evidence collection<\/li>\n<li>Security Hub is for security findings<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Audit Manager, Compliance Automation<\/p>","fixed":false},{"id":"sec-23","c":"sec","q":"<p>A company needs to manage and use dedicated hardware security modules (HSMs) for cryptographic operations in the AWS Cloud. Which service should they use?<\/p>","o":["AWS CloudHSM","AWS KMS","AWS Secrets Manager","Amazon Macie"],"a":[0],"x":"<ul>\n<li>AWS CloudHSM provides dedicated HSM appliances in the AWS Cloud<\/li>\n<li>Used for single-tenant key management with FIPS 140-3 Level 3 compliance<\/li>\n<li>KMS is managed, shared HSMs<\/li>\n<li>Secrets Manager is for secrets, not HSM<\/li>\n<li>Macie is for PII detection<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS CloudHSM, Hardware Security Modules<\/p>","fixed":false},{"id":"sec-24","c":"sec","q":"<p>A security analyst needs to investigate and visualize relationships between AWS resources and suspicious activity for a security incident. Which AWS service should they use?<\/p>","o":["Amazon Detective","AWS Security Hub","Amazon GuardDuty","AWS Config"],"a":[0],"x":"<ul>\n<li>Amazon Detective helps analyze, investigate, and visualize security incidents<\/li>\n<li>Integrates with GuardDuty, Security Hub, CloudTrail<\/li>\n<li>Security Hub aggregates findings, not investigation<\/li>\n<li>GuardDuty detects threats, not investigation<\/li>\n<li>Config tracks resource changes, not relationships<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Amazon Detective, Security Investigation<\/p>","fixed":false},{"id":"sec-25","c":"sec","q":"<p>A company needs to provide Microsoft Active Directory authentication for AWS applications and resources. Which AWS service should they use?<\/p>","o":["AWS Directory Service","AWS IAM","AWS SSO","Amazon Cognito"],"a":[0],"x":"<ul>\n<li>AWS Directory Service provides managed Microsoft AD in AWS<\/li>\n<li>Supports AD authentication for EC2, RDS, WorkSpaces, and more<\/li>\n<li>IAM is for AWS-native identities<\/li>\n<li>SSO is for SAML/OIDC-based SSO<\/li>\n<li>Cognito is for app user authentication, not AD<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Directory Service, Managed Microsoft AD<\/p>","fixed":false},{"id":"integ-1","c":"integ","q":"<p>A microservices architecture needs asynchronous communication where multiple services must process the same message independently. Which AWS service is MOST appropriate?<\/p>","o":["Amazon SQS Standard Queue","Amazon SNS","Amazon Kinesis Data Streams","AWS Step Functions"],"a":[1],"x":"<ul>\n<li><strong>Amazon SNS<\/strong> (Simple Notification Service) provides pub/sub messaging pattern<\/li>\n<li>One message published → Multiple subscribers receive copy<\/li>\n<li>Push-based delivery (proactive)<\/li>\n<li>Perfect for fan-out scenarios<\/li>\n<\/ul>\n<p><strong>SNS Architecture<\/strong>:\n<code>Publisher (Microservice A)\n      ↓\n   SNS Topic\n      ↓\n   ┌──┴──┬──────┬──────┐\n   ↓     ↓      ↓      ↓\nService B  C    D    Lambda<\/code><\/p>\n<p><strong>SNS Features<\/strong>:\n- <strong>Message Filtering<\/strong>: Subscribers receive only relevant messages\n- <strong>Multiple Protocols<\/strong>: SQS, Lambda, HTTP/HTTPS, Email, SMS, Mobile Push\n- <strong>Message Attributes<\/strong>: Metadata for filtering\n- <strong>Fan-out<\/strong>: 1-to-many delivery\n- <strong>FIFO Topics<\/strong>: Ordered, exactly-once delivery<\/p>\n<p><strong>SNS vs SQS<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>SNS<\/th>\n<th>SQS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pattern<\/strong><\/td>\n<td>Pub/Sub (1-to-many)<\/td>\n<td>Queue (1-to-1)<\/td>\n<\/tr>\n<tr>\n<td><strong>Delivery<\/strong><\/td>\n<td>Push<\/td>\n<td>Pull<\/td>\n<\/tr>\n<tr>\n<td><strong>Subscribers<\/strong><\/td>\n<td>Multiple (fan-out)<\/td>\n<td>Single consumer per message<\/td>\n<\/tr>\n<tr>\n<td><strong>Retention<\/strong><\/td>\n<td>No retention<\/td>\n<td>Up to 14 days<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>Notifications, fan-out<\/td>\n<td>Decoupling, buffering<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Example Use Case<\/strong>:\n<code>Order Placed Event → SNS Topic\n  ├→ Inventory Service (update stock)\n  ├→ Payment Service (charge customer)\n  ├→ Shipping Service (create shipment)\n  ├→ Email Service (send confirmation)\n  └→ Analytics Service (track metrics)<\/code><\/p>\n<p><strong>Message Filtering Example<\/strong>:\n<code>json\n{\n  \"FilterPolicy\": {\n    \"order_type\": [\"premium\", \"express\"],\n    \"amount\": [{\"numeric\": [\"&gt;=\", 100]}]\n  }\n}<\/code><\/p>\n<p><strong>References:<\/strong> Amazon SNS, Pub/Sub Messaging, Fan-out Pattern<\/p>","fixed":false},{"id":"integ-2","c":"integ","q":"<p>An application needs to decouple components with message buffering. Messages must be processed exactly once in strict order. Which service should be used?<\/p>","o":["Amazon SQS Standard Queue","Amazon SQS FIFO Queue","Amazon SNS","Amazon Kinesis Data Streams"],"a":[1],"x":"<ul>\n<li><strong>Amazon SQS FIFO Queue<\/strong> provides exactly-once processing with strict ordering<\/li>\n<li>Messages processed in the order received<\/li>\n<li>Content-based deduplication prevents duplicates<\/li>\n<li>Message groups enable parallel processing<\/li>\n<\/ul>\n<p><strong>SQS Standard vs FIFO<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Standard<\/th>\n<th>FIFO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ordering<\/strong><\/td>\n<td>Best-effort<\/td>\n<td>Guaranteed (FIFO)<\/td>\n<\/tr>\n<tr>\n<td><strong>Delivery<\/strong><\/td>\n<td>At-least-once<\/td>\n<td>Exactly-once<\/td>\n<\/tr>\n<tr>\n<td><strong>Throughput<\/strong><\/td>\n<td>Unlimited<\/td>\n<td>300 msg/s (3000 batched)<\/td>\n<\/tr>\n<tr>\n<td><strong>Deduplication<\/strong><\/td>\n<td>No<\/td>\n<td>Yes (5 min window)<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>High throughput<\/td>\n<td>Order critical<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>FIFO Queue Features<\/strong>:<\/p>\n<p><strong>1. Message Ordering<\/strong>:\n<code>Send: A → B → C\nReceive: A → B → C (always)<\/code><\/p>\n<p><strong>2. Message Groups<\/strong>:\n- Multiple groups for parallel processing\n- Order maintained within each group\n- Different groups can process simultaneously<\/p>\n<p>```python<\/p>\n<h1>Send with message group<\/h1>\n<p>sqs.send_message(\n    QueueUrl='https://sqs.../MyQueue.fifo',\n    MessageBody='Order payment processed',\n    MessageGroupId='order-12345',  # Group by order ID\n    MessageDeduplicationId='payment-abc-123'\n)\n```<\/p>\n<p><strong>3. Content-Based Deduplication<\/strong>:\n- SHA-256 hash of message body\n- Automatic duplicate detection (5 minutes)\n- Or use MessageDeduplicationId<\/p>\n<p><strong>4. High Throughput Mode<\/strong>:\n- 3,000 messages per second with batching\n- 9,000 TPS per group (with batching)<\/p>\n<p><strong>FIFO Queue Naming<\/strong>:\n- Must end with <code>.fifo<\/code> suffix\n- Example: <code>OrderQueue.fifo<\/code><\/p>\n<p><strong>Use Cases<\/strong>:\n- <strong>Financial transactions<\/strong>: No duplicate charges\n- <strong>Order processing<\/strong>: Correct sequence\n- <strong>Command execution<\/strong>: Sequential operations\n- <strong>Event sourcing<\/strong>: Order matters<\/p>\n<p><strong>Message Groups Example<\/strong>:\n```\nOrder Processing Queue.fifo\n├─ Group: order-001 → Payment → Shipping → Confirmation\n├─ Group: order-002 → Payment → Shipping → Confirmation\n└─ Group: order-003 → Payment → Shipping → Confirmation<\/p>\n<p>Each group processes in order, groups process in parallel\n```<\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use message groups for parallelism\n2. Enable content-based deduplication\n3. Set appropriate visibility timeout\n4. Use batch operations (10 messages per batch)\n5. Monitor <code>ApproximateAgeOfOldestMessage<\/code><\/p>\n<p><strong>References:<\/strong> Amazon SQS FIFO, Exactly-Once Processing, Message Ordering<\/p>","fixed":false},{"id":"integ-3","c":"integ","q":"<p>A serverless application needs to process real-time streaming data from thousands of IoT devices. Each device sends data every second. Which service is MOST appropriate?<\/p>","o":["Amazon SQS","Amazon SNS","Amazon Kinesis Data Streams","Amazon MQ"],"a":[2],"x":"<ul>\n<li><strong>Amazon Kinesis Data Streams<\/strong> designed for real-time streaming data<\/li>\n<li>Handles massive data ingestion from thousands of producers<\/li>\n<li>Multiple consumers can read same data stream<\/li>\n<li>Data retention (24 hours to 365 days)<\/li>\n<li>Ordered records per shard<\/li>\n<\/ul>\n<p><strong>Kinesis Data Streams Architecture<\/strong>:\n<code>IoT Devices (producers)\n   ↓\nKinesis Stream (shards)\n   ├→ Lambda (real-time processing)\n   ├→ Kinesis Data Analytics (SQL queries)\n   ├→ Kinesis Data Firehose (S3/Redshift)\n   └→ Custom consumers (EC2, containers)<\/code><\/p>\n<p><strong>Kinesis Key Concepts<\/strong>:<\/p>\n<p><strong>1. Shards<\/strong>:\n- Throughput unit\n- 1 MB/s write, 2 MB/s read per shard\n- 1,000 records/s write per shard\n- Ordered within shard<\/p>\n<p><strong>2. Records<\/strong>:\n- Partition key (determines shard)\n- Sequence number (order within shard)\n- Data blob (up to 1 MB)<\/p>\n<p><strong>3. Consumers<\/strong>:\n- Multiple consumers can read same stream\n- Enhanced fan-out (dedicated 2 MB/s per consumer)\n- Shared throughput mode (2 MB/s total)<\/p>\n<p><strong>Kinesis Features<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Description<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Retention<\/strong><\/td>\n<td>24 hours default, up to 365 days<\/td>\n<\/tr>\n<tr>\n<td><strong>Ordering<\/strong><\/td>\n<td>Per partition key/shard<\/td>\n<\/tr>\n<tr>\n<td><strong>Replay<\/strong><\/td>\n<td>Can reprocess data<\/td>\n<\/tr>\n<tr>\n<td><strong>Scaling<\/strong><\/td>\n<td>Add/remove shards<\/td>\n<\/tr>\n<tr>\n<td><strong>Encryption<\/strong><\/td>\n<td>At rest (KMS), in transit (HTTPS)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Capacity Planning<\/strong>:\n```\nIncoming Data: 1,000 devices × 1 KB/s = 1 MB/s\nRequired Shards: 1 MB/s ÷ 1 MB/s per shard = 1 shard<\/p>\n<p>Incoming Data: 5,000 devices × 1 KB/s = 5 MB/s\nRequired Shards: 5 MB/s ÷ 1 MB/s per shard = 5 shards\n```<\/p>\n<p><strong>Kinesis Producer<\/strong> (Python):\n```python\nimport boto3\nimport json<\/p>\n<p>kinesis = boto3.client('kinesis')<\/p>\n<p>def send_iot_data(device_id, temperature, humidity):\n    data = {\n        'device_id': device_id,\n        'temperature': temperature,\n        'humidity': humidity,\n        'timestamp': int(time.time())\n    }<\/p>\n<pre><code>kinesis.put_record(\n    StreamName='IoTDataStream',\n    Data=json.dumps(data),\n    PartitionKey=device_id  # Routes to specific shard\n)\n<\/code><\/pre>\n<p>```<\/p>\n<p><strong>Kinesis Consumer<\/strong> (Lambda):\n```python\ndef lambda_handler(event, context):\n    for record in event['Records']:\n        # Kinesis data is base64 encoded\n        payload = base64.b64decode(record['kinesis']['data'])\n        data = json.loads(payload)<\/p>\n<pre><code>    # Process IoT data\n    device_id = data['device_id']\n    temperature = data['temperature']\n\n    # Alert if temperature too high\n    if temperature &gt; 80:\n        send_alert(device_id, temperature)\n<\/code><\/pre>\n<p>```<\/p>\n<p><strong>Kinesis Family<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Service<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Data Streams<\/strong><\/td>\n<td>Custom real-time processing<\/td>\n<\/tr>\n<tr>\n<td><strong>Data Firehose<\/strong><\/td>\n<td>Load to S3, Redshift, ES (easier)<\/td>\n<\/tr>\n<tr>\n<td><strong>Data Analytics<\/strong><\/td>\n<td>SQL on streaming data<\/td>\n<\/tr>\n<tr>\n<td><strong>Video Streams<\/strong><\/td>\n<td>Video ingestion and processing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Kinesis vs SQS<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Kinesis<\/th>\n<th>SQS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ordering<\/strong><\/td>\n<td>Per shard<\/td>\n<td>FIFO queue only<\/td>\n<\/tr>\n<tr>\n<td><strong>Multiple Consumers<\/strong><\/td>\n<td>Yes<\/td>\n<td>No (fanout via SNS)<\/td>\n<\/tr>\n<tr>\n<td><strong>Retention<\/strong><\/td>\n<td>Up to 365 days<\/td>\n<td>Up to 14 days<\/td>\n<\/tr>\n<tr>\n<td><strong>Replay<\/strong><\/td>\n<td>Yes<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>Streaming, analytics<\/td>\n<td>Decoupling, buffering<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>When to Use Kinesis<\/strong>:\n- Real-time analytics\n- Log and event data collection\n- IoT data ingestion\n- Multiple consumers need same data\n- Need to replay data\n- Streaming ETL<\/p>\n<p><strong>References:<\/strong> Amazon Kinesis Data Streams, Real-Time Streaming, IoT Data Ingestion<\/p>","fixed":false},{"id":"integ-4","c":"integ","q":"<p>A company wants to implement a fan-out pattern where an SNS message triggers multiple SQS queues for different services. What is this architecture called?<\/p>","o":["SQS Message Chaining","SNS to SQS Fan-out","Kinesis Fan-out","EventBridge Routing"],"a":[1],"x":"<ul>\n<li><strong>SNS to SQS Fan-out<\/strong> is common pattern for parallel, asynchronous processing<\/li>\n<li>Single message to SNS triggers multiple SQS queues<\/li>\n<li>Each service consumes from its own queue<\/li>\n<li>Decoupled, resilient architecture<\/li>\n<\/ul>\n<p><strong>SNS-SQS Fan-out Architecture<\/strong>:\n<code>Event Source\n     ↓\n  SNS Topic\n     ↓\n  ┌──┴──┬────────┬────────┐\n  ↓     ↓        ↓        ↓\nSQS-1  SQS-2   SQS-3    SQS-4\n  ↓     ↓        ↓        ↓\nSvc-A  Svc-B   Svc-C    Svc-D<\/code><\/p>\n<p><strong>Benefits<\/strong>:<\/p>\n<p><strong>1. Parallel Processing<\/strong>:\n- Services process independently\n- No blocking between services<\/p>\n<p><strong>2. Reliability<\/strong>:\n- SQS provides message persistence\n- Retries on failure\n- Dead Letter Queue for failed messages<\/p>\n<p><strong>3. Scalability<\/strong>:\n- Each service scales independently\n- Add new subscribers without changes<\/p>\n<p><strong>4. Decoupling<\/strong>:\n- Services don't know about each other\n- Add/remove services easily<\/p>\n<p><strong>Configuration<\/strong>:<\/p>\n<p><strong>Step 1: Create SNS Topic<\/strong>:\n<code>bash\naws sns create-topic --name OrderEvents<\/code><\/p>\n<p><strong>Step 2: Create SQS Queues<\/strong>:\n<code>bash\naws sqs create-queue --queue-name InventoryQueue\naws sqs create-queue --queue-name PaymentQueue\naws sqs create-queue --queue-name ShippingQueue<\/code><\/p>\n<p><strong>Step 3: Subscribe Queues to Topic<\/strong>:\n<code>bash\naws sns subscribe \\\n  --topic-arn arn:aws:sns:us-east-1:123456789012:OrderEvents \\\n  --protocol sqs \\\n  --notification-endpoint arn:aws:sqs:us-east-1:123456789012:InventoryQueue<\/code><\/p>\n<p><strong>Step 4: Update SQS Policy<\/strong> (allow SNS to send):\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Allow\",\n    \"Principal\": {\"Service\": \"sns.amazonaws.com\"},\n    \"Action\": \"SQS:SendMessage\",\n    \"Resource\": \"arn:aws:sqs:us-east-1:123456789012:InventoryQueue\",\n    \"Condition\": {\n      \"ArnEquals\": {\n        \"aws:SourceArn\": \"arn:aws:sns:us-east-1:123456789012:OrderEvents\"\n      }\n    }\n  }]\n}<\/code><\/p>\n<p><strong>Real-World Example - E-commerce Order<\/strong>:<\/p>\n<p><code>Customer Places Order\n        ↓\n  SNS: OrderPlaced\n        ↓\n  ┌─────┴─────┬──────────┬──────────┐\n  ↓           ↓          ↓          ↓\nInventory  Payment  Shipping   Email\n  Queue     Queue     Queue     Queue\n  ↓           ↓          ↓          ↓\nUpdate    Process   Create    Send\n Stock    Payment  Shipment   Conf.<\/code><\/p>\n<p><strong>Message Filtering<\/strong> (each service gets relevant messages only):\n<code>json\n{\n  \"InventoryQueue\": {\n    \"FilterPolicy\": {\n      \"order_type\": [\"physical_goods\"]\n    }\n  },\n  \"EmailQueue\": {\n    \"FilterPolicy\": {\n      \"notification_type\": [\"order_confirmation\"]\n    }\n  }\n}<\/code><\/p>\n<p><strong>Error Handling - Dead Letter Queue<\/strong>:\n<code>SQS Queue → Process → Failure (after retries)\n                            ↓\n                     Dead Letter Queue\n                            ↓\n                    Alert/Manual Review<\/code><\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use message filtering to reduce unnecessary processing\n2. Configure Dead Letter Queues for failed messages\n3. Set appropriate visibility timeout\n4. Use batching for cost optimization\n5. Monitor queue depth (CloudWatch)\n6. Implement idempotency in consumers<\/p>\n<p><strong>SNS-SQS vs Kinesis<\/strong>:\n- <strong>SNS-SQS<\/strong>: Different processing per service\n- <strong>Kinesis<\/strong>: Same data, different consumers<\/p>\n<p><strong>References:<\/strong> SNS to SQS Fan-out, Asynchronous Processing, Decoupling Patterns<\/p>","fixed":false},{"id":"integ-5","c":"integ","q":"<p>A serverless workflow needs to coordinate multiple Lambda functions with conditional logic, parallel execution, and error handling. Which service should be used?<\/p>","o":["Amazon SQS with multiple queues","Amazon SNS with message filtering","AWS Step Functions","Amazon EventBridge"],"a":[2],"x":"<ul>\n<li><strong>AWS Step Functions<\/strong> orchestrates serverless workflows<\/li>\n<li>Visual workflow designer<\/li>\n<li>Built-in error handling and retries<\/li>\n<li>Parallel execution, conditional logic, wait states<\/li>\n<li>Integration with 200+ AWS services<\/li>\n<\/ul>\n<p><strong>Step Functions State Machine Example<\/strong>:\n<code>json\n{\n  \"Comment\": \"Order Processing Workflow\",\n  \"StartAt\": \"ValidateOrder\",\n  \"States\": {\n    \"ValidateOrder\": {\n      \"Type\": \"Task\",\n      \"Resource\": \"arn:aws:lambda:...:function:ValidateOrder\",\n      \"Next\": \"CheckInventory\",\n      \"Catch\": [{\n        \"ErrorEquals\": [\"ValidationError\"],\n        \"Next\": \"OrderFailed\"\n      }]\n    },\n    \"CheckInventory\": {\n      \"Type\": \"Task\",\n      \"Resource\": \"arn:aws:lambda:...:function:CheckInventory\",\n      \"Next\": \"InventoryAvailable?\"\n    },\n    \"InventoryAvailable?\": {\n      \"Type\": \"Choice\",\n      \"Choices\": [{\n        \"Variable\": \"$.inventoryAvailable\",\n        \"BooleanEquals\": true,\n        \"Next\": \"ParallelProcessing\"\n      }],\n      \"Default\": \"OutOfStock\"\n    },\n    \"ParallelProcessing\": {\n      \"Type\": \"Parallel\",\n      \"Branches\": [\n        {\n          \"StartAt\": \"ProcessPayment\",\n          \"States\": {\n            \"ProcessPayment\": {\n              \"Type\": \"Task\",\n              \"Resource\": \"arn:aws:lambda:...:function:ProcessPayment\",\n              \"End\": true\n            }\n          }\n        },\n        {\n          \"StartAt\": \"ReserveInventory\",\n          \"States\": {\n            \"ReserveInventory\": {\n              \"Type\": \"Task\",\n              \"Resource\": \"arn:aws:lambda:...:function:ReserveInventory\",\n              \"End\": true\n            }\n          }\n        },\n        {\n          \"StartAt\": \"SendConfirmation\",\n          \"States\": {\n            \"SendConfirmation\": {\n              \"Type\": \"Task\",\n              \"Resource\": \"arn:aws:lambda:...:function:SendEmail\",\n              \"End\": true\n            }\n          }\n        }\n      ],\n      \"Next\": \"CreateShipment\"\n    },\n    \"CreateShipment\": {\n      \"Type\": \"Task\",\n      \"Resource\": \"arn:aws:lambda:...:function:CreateShipment\",\n      \"End\": true\n    },\n    \"OutOfStock\": {\n      \"Type\": \"Task\",\n      \"Resource\": \"arn:aws:lambda:...:function:NotifyOutOfStock\",\n      \"End\": true\n    },\n    \"OrderFailed\": {\n      \"Type\": \"Fail\",\n      \"Error\": \"OrderValidationFailed\",\n      \"Cause\": \"Order validation failed\"\n    }\n  }\n}<\/code><\/p>\n<p><strong>Step Functions State Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>State Type<\/th>\n<th>Purpose<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Task<\/strong><\/td>\n<td>Execute work (Lambda, ECS, SNS, etc.)<\/td>\n<td>Call API, process data<\/td>\n<\/tr>\n<tr>\n<td><strong>Choice<\/strong><\/td>\n<td>Conditional logic (if/else)<\/td>\n<td>Check inventory status<\/td>\n<\/tr>\n<tr>\n<td><strong>Parallel<\/strong><\/td>\n<td>Execute branches simultaneously<\/td>\n<td>Payment + Inventory + Email<\/td>\n<\/tr>\n<tr>\n<td><strong>Wait<\/strong><\/td>\n<td>Delay (seconds, timestamp)<\/td>\n<td>Wait for approval<\/td>\n<\/tr>\n<tr>\n<td><strong>Pass<\/strong><\/td>\n<td>Pass input to output, transform<\/td>\n<td>Data transformation<\/td>\n<\/tr>\n<tr>\n<td><strong>Map<\/strong><\/td>\n<td>Iterate over array<\/td>\n<td>Process batch items<\/td>\n<\/tr>\n<tr>\n<td><strong>Succeed<\/strong><\/td>\n<td>Successful termination<\/td>\n<td>Order complete<\/td>\n<\/tr>\n<tr>\n<td><strong>Fail<\/strong><\/td>\n<td>Failed termination<\/td>\n<td>Validation failed<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Error Handling<\/strong>:<\/p>\n<p><strong>1. Retry<\/strong>:\n<code>json\n{\n  \"Retry\": [{\n    \"ErrorEquals\": [\"States.TaskFailed\"],\n    \"IntervalSeconds\": 2,\n    \"MaxAttempts\": 3,\n    \"BackoffRate\": 2.0\n  }]\n}<\/code><\/p>\n<p><strong>2. Catch<\/strong>:\n<code>json\n{\n  \"Catch\": [{\n    \"ErrorEquals\": [\"PaymentFailed\"],\n    \"Next\": \"RefundAndCancel\"\n  }]\n}<\/code><\/p>\n<p><strong>Step Functions Workflow Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Duration<\/th>\n<th>Execution Rate<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Standard<\/strong><\/td>\n<td>Up to 1 year<\/td>\n<td>2,000/s<\/td>\n<td>Long-running, exactly-once<\/td>\n<\/tr>\n<tr>\n<td><strong>Express<\/strong><\/td>\n<td>Up to 5 min<\/td>\n<td>100,000/s<\/td>\n<td>High-volume, at-least-once<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Integration with AWS Services<\/strong>:\n- <strong>Lambda<\/strong>: Execute functions\n- <strong>ECS/Fargate<\/strong>: Run containers\n- <strong>DynamoDB<\/strong>: Read/write data\n- <strong>SNS/SQS<\/strong>: Send messages\n- <strong>Glue<\/strong>: Run ETL jobs\n- <strong>SageMaker<\/strong>: ML training/inference\n- <strong>Batch<\/strong>: Run batch jobs<\/p>\n<p><strong>Step Functions vs Alternatives<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Best For<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Step Functions<\/strong><\/td>\n<td>Complex workflows, orchestration<\/td>\n<\/tr>\n<tr>\n<td><strong>Lambda<\/strong><\/td>\n<td>Single tasks<\/td>\n<\/tr>\n<tr>\n<td><strong>SQS<\/strong><\/td>\n<td>Queue-based processing<\/td>\n<\/tr>\n<tr>\n<td><strong>EventBridge<\/strong><\/td>\n<td>Event routing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Real-World Use Cases<\/strong>:\n1. <strong>ETL Pipelines<\/strong>: Extract → Transform → Load\n2. <strong>Order Processing<\/strong>: Validate → Payment → Fulfillment\n3. <strong>Video Processing<\/strong>: Upload → Transcode → Thumbnail → Delivery\n4. <strong>Machine Learning<\/strong>: Data prep → Training → Deploy → Monitor\n5. <strong>Approval Workflows<\/strong>: Submit → Review → Approve/Reject → Execute<\/p>\n<p><strong>Visual Workflow Benefits<\/strong>:\n- Easy to understand complex logic\n- Debug with execution history\n- See exactly where failures occur\n- Modify without code changes (drag-and-drop)<\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use Express Workflows for high-volume, short-duration\n2. Implement error handling at each step\n3. Use Parallel states for independent tasks\n4. Monitor with CloudWatch metrics\n5. Use input/output filtering to manage data size\n6. Implement idempotency in Lambda functions<\/p>\n<p><strong>References:<\/strong> AWS Step Functions, Serverless Orchestration, Workflow Management<\/p>","fixed":false},{"id":"integ-6","c":"integ","q":"<p>An application needs to load streaming data into S3, Redshift, and Elasticsearch with minimal code. Which service is MOST appropriate?<\/p>","o":["Amazon Kinesis Data Streams with custom consumers","Amazon Kinesis Data Firehose","AWS Lambda triggered by Kinesis","Amazon SQS with Lambda consumers"],"a":[1],"x":"<ul>\n<li><strong>Amazon Kinesis Data Firehose<\/strong> is fully managed service for loading streaming data<\/li>\n<li>No code required (vs Data Streams which needs custom consumers)<\/li>\n<li>Automatic scaling<\/li>\n<li>Built-in data transformation (Lambda)<\/li>\n<li>Direct delivery to S3, Redshift, Elasticsearch, HTTP endpoints<\/li>\n<\/ul>\n<p><strong>Kinesis Data Firehose Architecture<\/strong>:\n<code>Data Producers\n  ├─ Applications\n  ├─ IoT Devices\n  ├─ Clickstream\n  └─ Logs\n       ↓\nKinesis Data Firehose\n  ├─ Optional: Lambda transformation\n  ├─ Optional: Format conversion (Parquet, ORC)\n  └─ Buffering (size/time)\n       ↓\nDestinations\n  ├─ Amazon S3\n  ├─ Amazon Redshift (via S3)\n  ├─ Amazon Elasticsearch\n  ├─ Splunk\n  └─ HTTP endpoints<\/code><\/p>\n<p><strong>Firehose Features<\/strong>:<\/p>\n<p><strong>1. Automatic Scaling<\/strong>:\n- No capacity planning\n- Scales to gigabytes per second\n- Pay for data volume<\/p>\n<p><strong>2. Buffering<\/strong>:\n- Buffer by size (1-128 MB)\n- Buffer by time (60-900 seconds)\n- Delivers when either threshold met<\/p>\n<p><strong>3. Data Transformation<\/strong>:\n- Lambda function processes each record\n- Format conversion (JSON to Parquet/ORC)\n- Compression (GZIP, ZIP, Snappy)<\/p>\n<p><strong>4. Backup<\/strong>:\n- Backup source data to S3\n- Failed records to separate S3 prefix<\/p>\n<p><strong>Firehose Delivery Configuration<\/strong>:\n<code>json\n{\n  \"DeliveryStreamName\": \"WebLogsToS3\",\n  \"S3DestinationConfiguration\": {\n    \"RoleARN\": \"arn:aws:iam::123456789012:role/FirehoseRole\",\n    \"BucketARN\": \"arn:aws:s3:::my-logs-bucket\",\n    \"Prefix\": \"logs/year=!{timestamp:yyyy}/month=!{timestamp:MM}/day=!{timestamp:dd}/\",\n    \"BufferingHints\": {\n      \"SizeInMBs\": 5,\n      \"IntervalInSeconds\": 300\n    },\n    \"CompressionFormat\": \"GZIP\",\n    \"CloudWatchLoggingOptions\": {\n      \"Enabled\": true,\n      \"LogGroupName\": \"/aws/kinesisfirehose/WebLogs\"\n    }\n  },\n  \"ProcessingConfiguration\": {\n    \"Enabled\": true,\n    \"Processors\": [{\n      \"Type\": \"Lambda\",\n      \"Parameters\": [{\n        \"ParameterName\": \"LambdaArn\",\n        \"ParameterValue\": \"arn:aws:lambda:...:function:TransformLogs\"\n      }]\n    }]\n  }\n}<\/code><\/p>\n<p><strong>Data Transformation Example<\/strong> (Lambda):\n```python\nimport base64\nimport json<\/p>\n<p>def lambda_handler(event, context):\n    output = []<\/p>\n<pre><code>for record in event['records']:\n    # Decode input data\n    payload = base64.b64decode(record['data']).decode('utf-8')\n    data = json.loads(payload)\n\n    # Transform data\n    transformed = {\n        'timestamp': data['timestamp'],\n        'user_id': data['user_id'],\n        'event_type': data['event_type'],\n        'country': data.get('country', 'UNKNOWN')\n    }\n\n    # Encode output\n    output_record = {\n        'recordId': record['recordId'],\n        'result': 'Ok',\n        'data': base64.b64encode(\n            json.dumps(transformed).encode('utf-8')\n        ).decode('utf-8')\n    }\n    output.append(output_record)\n\nreturn {'records': output}\n<\/code><\/pre>\n<p>```<\/p>\n<p><strong>Delivery Destinations<\/strong>:<\/p>\n<p><strong>1. Amazon S3<\/strong>:\n- Object storage\n- Data lake\n- Archive\n- Partitioning by time<\/p>\n<p><strong>2. Amazon Redshift<\/strong>:\n- Data warehouse\n- Analytics\n- Data via S3 COPY command<\/p>\n<p><strong>3. Amazon Elasticsearch<\/strong>:\n- Search and analytics\n- Log analysis\n- Real-time dashboards<\/p>\n<p><strong>4. Splunk<\/strong>:\n- Security monitoring\n- Operational intelligence<\/p>\n<p><strong>5. HTTP Endpoints<\/strong>:\n- Custom destinations\n- Third-party services<\/p>\n<p><strong>Firehose vs Data Streams<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Data Firehose<\/th>\n<th>Data Streams<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Management<\/strong><\/td>\n<td>Fully managed<\/td>\n<td>Manage shards<\/td>\n<\/tr>\n<tr>\n<td><strong>Destinations<\/strong><\/td>\n<td>Built-in (S3, Redshift, ES)<\/td>\n<td>Custom code<\/td>\n<\/tr>\n<tr>\n<td><strong>Scaling<\/strong><\/td>\n<td>Automatic<\/td>\n<td>Manual shard management<\/td>\n<\/tr>\n<tr>\n<td><strong>Retention<\/strong><\/td>\n<td>No retention<\/td>\n<td>24h to 365 days<\/td>\n<\/tr>\n<tr>\n<td><strong>Consumers<\/strong><\/td>\n<td>One (delivery)<\/td>\n<td>Multiple possible<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>Load to destinations<\/td>\n<td>Custom processing<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cost Comparison<\/strong>:\n<code>Data Firehose: $0.029/GB + destination costs\nData Streams: $0.015/shard/hour + $0.014/million PUT units<\/code><\/p>\n<p><strong>When to Use Firehose<\/strong>:\n- Load data to S3, Redshift, ES, Splunk\n- Don't need multiple consumers\n- Want fully managed solution\n- Near real-time (60+ seconds latency)\n- Simple transformations<\/p>\n<p><strong>When to Use Data Streams<\/strong>:\n- Need real-time processing (&lt; 1 second)\n- Multiple consumers\n- Custom processing logic\n- Need to replay data\n- Order matters within shard<\/p>\n<p><strong>Real-World Examples<\/strong>:<\/p>\n<p><strong>1. Clickstream Analytics<\/strong>:\n<code>Website → Firehose → S3 (Parquet) → Athena/QuickSight<\/code><\/p>\n<p><strong>2. Log Aggregation<\/strong>:\n<code>Applications → Firehose → Elasticsearch → Kibana<\/code><\/p>\n<p><strong>3. Data Lake<\/strong>:\n<code>IoT Devices → Firehose → S3 (partitioned) → Glue → Athena<\/code><\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use buffering to optimize cost (batch writes)\n2. Enable S3 backup for source records\n3. Use compression (GZIP) to reduce storage costs\n4. Convert to columnar formats (Parquet/ORC) for analytics\n5. Partition S3 data by time for better query performance\n6. Monitor delivery to CloudWatch<\/p>\n<p><strong>References:<\/strong> Amazon Kinesis Data Firehose, Streaming Data Delivery, Data Lake<\/p>","fixed":false},{"id":"integ-7","c":"integ","q":"<p>A company wants to route events from multiple AWS services to different targets based on event content. Which service provides centralized event routing?<\/p>","o":["Amazon SNS","Amazon SQS","Amazon EventBridge","AWS Step Functions"],"a":[2],"x":"<ul>\n<li><strong>Amazon EventBridge<\/strong> is serverless event bus for application and AWS service events<\/li>\n<li>Content-based routing using event patterns<\/li>\n<li>100+ AWS service integrations as event sources<\/li>\n<li>20+ AWS services as targets<\/li>\n<\/ul>\n<p><strong>EventBridge Architecture<\/strong>:\n<code>Event Sources\n├─ AWS Services (EC2, S3, Lambda, etc.)\n├─ Custom Applications\n├─ SaaS Partners (Salesforce, Datadog, etc.)\n       ↓\n   EventBridge Bus\n       ↓\n   Event Rules (filtering)\n       ↓\n   Targets\n   ├─ Lambda\n   ├─ Step Functions\n   ├─ SQS\n   ├─ SNS\n   ├─ Kinesis\n   └─ API Gateway<\/code><\/p>\n<p><strong>EventBridge Components<\/strong>:<\/p>\n<p><strong>1. Events<\/strong>:\n<code>json\n{\n  \"version\": \"0\",\n  \"id\": \"event-id\",\n  \"detail-type\": \"EC2 Instance State-change Notification\",\n  \"source\": \"aws.ec2\",\n  \"account\": \"123456789012\",\n  \"time\": \"2026-01-03T12:00:00Z\",\n  \"region\": \"us-east-1\",\n  \"resources\": [\"arn:aws:ec2:us-east-1:123456789012:instance/i-0123456789\"],\n  \"detail\": {\n    \"instance-id\": \"i-0123456789\",\n    \"state\": \"running\"\n  }\n}<\/code><\/p>\n<p><strong>2. Event Rules<\/strong> (pattern matching):\n<code>json\n{\n  \"source\": [\"aws.ec2\"],\n  \"detail-type\": [\"EC2 Instance State-change Notification\"],\n  \"detail\": {\n    \"state\": [\"terminated\"]\n  }\n}<\/code><\/p>\n<p><strong>3. Event Buses<\/strong>:\n- <strong>Default<\/strong>: AWS service events\n- <strong>Custom<\/strong>: Application events\n- <strong>Partner<\/strong>: SaaS provider events<\/p>\n<p><strong>4. Targets<\/strong>:\n- Multiple targets per rule (up to 5)\n- Input transformation\n- Retry policies<\/p>\n<p><strong>Real-World Examples<\/strong>:<\/p>\n<p><strong>Example 1: Security Automation<\/strong>\n<code>json\n{\n  \"EventPattern\": {\n    \"source\": [\"aws.guardduty\"],\n    \"detail-type\": [\"GuardDuty Finding\"],\n    \"detail\": {\n      \"severity\": [7, 8, 9]  // High and Critical\n    }\n  },\n  \"Targets\": [\n    {\n      \"Arn\": \"arn:aws:lambda:...:function:IsolateInstance\",\n      \"Id\": \"1\"\n    },\n    {\n      \"Arn\": \"arn:aws:sns:...:SecurityAlerts\",\n      \"Id\": \"2\"\n    }\n  ]\n}<\/code><\/p>\n<p><strong>Example 2: Multi-Account Event Aggregation<\/strong>\n<code>Production Account Events\n       ↓\n EventBridge Rule\n       ↓\nCross-Account Event Bus (Security Account)\n       ↓\nCentralized Monitoring/Alerting<\/code><\/p>\n<p><strong>Example 3: Scheduled Events<\/strong> (cron/rate):\n```json\n{\n  \"ScheduleExpression\": \"rate(5 minutes)\",\n  \"Targets\": [{\n    \"Arn\": \"arn:aws:lambda:...:function:HealthCheck\",\n    \"Id\": \"1\"\n  }]\n}<\/p>\n<p>// Or cron syntax\n{\n  \"ScheduleExpression\": \"cron(0 12 * * ? *)\",  // Noon daily\n  \"Targets\": [{\n    \"Arn\": \"arn:aws:lambda:...:function:DailyReport\",\n    \"Id\": \"1\"\n  }]\n}\n```<\/p>\n<p><strong>EventBridge Features<\/strong>:<\/p>\n<p><strong>1. Content-Based Filtering<\/strong>:\n- Match specific event attributes\n- Numeric matching (&gt;, &lt;, &gt;=, &lt;=, range)\n- Prefix matching\n- Exists checking\n- IP address matching<\/p>\n<p><strong>2. Input Transformation<\/strong>:\n<code>json\n{\n  \"InputTransformer\": {\n    \"InputPathsMap\": {\n      \"instance\": \"$.detail.instance-id\",\n      \"state\": \"$.detail.state\"\n    },\n    \"InputTemplate\": \"\\\"Instance &lt;instance&gt; is now &lt;state&gt;\\\"\"\n  }\n}<\/code><\/p>\n<p><strong>3. Dead Letter Queue<\/strong>:\n- Failed invocations sent to DLQ\n- Retry configuration\n- Maximum age and retry attempts<\/p>\n<p><strong>4. Archive and Replay<\/strong>:\n- Archive events for retention\n- Replay events for testing/recovery<\/p>\n<p><strong>EventBridge vs SNS vs SQS<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>EventBridge<\/th>\n<th>SNS<\/th>\n<th>SQS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pattern<\/strong><\/td>\n<td>Event routing<\/td>\n<td>Pub/Sub<\/td>\n<td>Queue<\/td>\n<\/tr>\n<tr>\n<td><strong>Filtering<\/strong><\/td>\n<td>Advanced (content-based)<\/td>\n<td>Basic (attributes)<\/td>\n<td>No filtering<\/td>\n<\/tr>\n<tr>\n<td><strong>Sources<\/strong><\/td>\n<td>100+ AWS services<\/td>\n<td>Applications<\/td>\n<td>Applications<\/td>\n<\/tr>\n<tr>\n<td><strong>Targets<\/strong><\/td>\n<td>20+ AWS services<\/td>\n<td>Limited<\/td>\n<td>Consumers<\/td>\n<\/tr>\n<tr>\n<td><strong>Scheduling<\/strong><\/td>\n<td>Built-in (cron)<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>Event-driven architecture<\/td>\n<td>Fan-out notifications<\/td>\n<td>Decoupling<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Advanced Pattern Examples<\/strong>:<\/p>\n<p><strong>IP Address Matching<\/strong>:\n<code>json\n{\n  \"detail\": {\n    \"sourceIPAddress\": [{\n      \"cidr\": \"10.0.0.0/8\"\n    }]\n  }\n}<\/code><\/p>\n<p><strong>Numeric Matching<\/strong>:\n<code>json\n{\n  \"detail\": {\n    \"temperature\": [{\n      \"numeric\": [\"&gt;\", 80]\n    }]\n  }\n}<\/code><\/p>\n<p><strong>Anything-but<\/strong>:\n<code>json\n{\n  \"detail\": {\n    \"state\": [{\n      \"anything-but\": [\"running\", \"stopped\"]\n    }]\n  }\n}<\/code><\/p>\n<p><strong>Common Use Cases<\/strong>:\n1. <strong>Security Automation<\/strong>:\n- GuardDuty findings → Lambda → Isolate instance\n- Config non-compliance → SNS → Alert<\/p>\n<ol start=\"2\">\n<li>\n<p><strong>Application Integration<\/strong>:\n- Custom app events → EventBridge → Trigger workflows\n- SaaS webhooks → EventBridge → Process data<\/p>\n<\/li>\n<li>\n<p><strong>Scheduled Tasks<\/strong>:\n- Daily reports\n- Periodic cleanup\n- Health checks<\/p>\n<\/li>\n<li>\n<p><strong>Cross-Account Event Aggregation<\/strong>:\n- Multiple accounts → Central event bus\n- Centralized monitoring<\/p>\n<\/li>\n<li>\n<p><strong>Event Replay<\/strong>:\n- Archive production events\n- Replay for testing\n- Disaster recovery<\/p>\n<\/li>\n<\/ol>\n<p><strong>Best Practices<\/strong>:\n1. Use content-based filtering to reduce target invocations\n2. Implement dead letter queues for failed events\n3. Archive critical events for replay\n4. Use cross-account event buses for multi-account architectures\n5. Monitor rule metrics in CloudWatch\n6. Use input transformers to send only needed data<\/p>\n<p><strong>References:<\/strong> Amazon EventBridge, Event-Driven Architecture, Serverless Integration<\/p>","fixed":false},{"id":"integ-8","c":"integ","q":"<p>A legacy application uses Java Message Service (JMS) API. What is the BEST AWS migration path with minimal code changes?<\/p>","o":["Migrate to Amazon SQS","Migrate to Amazon SNS","Migrate to Amazon MQ","Rewrite using Kinesis"],"a":[2],"x":"<ul>\n<li><strong>Amazon MQ<\/strong> is managed message broker for Apache ActiveMQ and RabbitMQ<\/li>\n<li>JMS, AMQP, MQTT, OpenWire, STOMP protocols<\/li>\n<li>Minimal code changes for lift-and-shift<\/li>\n<li>Compatible with existing messaging APIs<\/li>\n<\/ul>\n<p><strong>Amazon MQ vs SQS/SNS<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Amazon MQ<\/th>\n<th>SQS/SNS<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Protocols<\/strong><\/td>\n<td>JMS, AMQP, MQTT, STOMP<\/td>\n<td>AWS API only<\/td>\n<\/tr>\n<tr>\n<td><strong>Migration<\/strong><\/td>\n<td>Minimal code changes<\/td>\n<td>Requires code changes<\/td>\n<\/tr>\n<tr>\n<td><strong>Use Case<\/strong><\/td>\n<td>Legacy app migration<\/td>\n<td>Cloud-native apps<\/td>\n<\/tr>\n<tr>\n<td><strong>Scaling<\/strong><\/td>\n<td>Limited<\/td>\n<td>Highly scalable<\/td>\n<\/tr>\n<tr>\n<td><strong>Management<\/strong><\/td>\n<td>Managed broker<\/td>\n<td>Fully serverless<\/td>\n<\/tr>\n<tr>\n<td><strong>Cost<\/strong><\/td>\n<td>Instance-based<\/td>\n<td>Pay per use<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Amazon MQ Deployment<\/strong>:\n<code>Applications (JMS/AMQP)\n      ↓\nAmazon MQ Broker\n├─ Active/Standby (Multi-AZ)\n├─ Apache ActiveMQ or RabbitMQ\n├─ Persistent storage (EBS/EFS)\n└─ Built-in monitoring<\/code><\/p>\n<p><strong>Amazon MQ Features<\/strong>:<\/p>\n<p><strong>1. Broker Engines<\/strong>:\n- <strong>ActiveMQ<\/strong>: JMS, OpenWire, STOMP, MQTT, WSS\n- <strong>RabbitMQ<\/strong>: AMQP 0-9-1, MQTT, STOMP<\/p>\n<p><strong>2. High Availability<\/strong>:\n- Active/Standby deployment (Multi-AZ)\n- Automatic failover\n- Durable message storage<\/p>\n<p><strong>3. Network Connectivity<\/strong>:\n- VPC deployment\n- Private connectivity\n- Security groups<\/p>\n<p><strong>4. Authentication<\/strong>:\n- Simple authentication\n- LDAP integration<\/p>\n<p><strong>Migration Strategy<\/strong>:<\/p>\n<p><strong>Before (On-Premises)<\/strong>:\n<code>java\n// Existing JMS code\nConnectionFactory factory = new ActiveMQConnectionFactory(\n    \"tcp://on-prem-broker:61616\"\n);\nConnection connection = factory.createConnection();\nSession session = connection.createSession(false, Session.AUTO_ACKNOWLEDGE);\nQueue queue = session.createQueue(\"OrderQueue\");\nMessageProducer producer = session.createProducer(queue);<\/code><\/p>\n<p><strong>After (Amazon MQ)<\/strong> - Minimal changes:\n<code>java\n// Just change broker endpoint\nConnectionFactory factory = new ActiveMQConnectionFactory(\n    \"ssl://b-xxx-yyy.mq.us-east-1.amazonaws.com:61617\"\n);\n// Rest of the code remains the same\nConnection connection = factory.createConnection(\"username\", \"password\");\nSession session = connection.createSession(false, Session.AUTO_ACKNOWLEDGE);\nQueue queue = session.createQueue(\"OrderQueue\");\nMessageProducer producer = session.createProducer(queue);<\/code><\/p>\n<p><strong>When to Use Amazon MQ<\/strong>:\n- Migrating from on-premises message brokers\n- Existing applications using JMS, AMQP\n- Need protocol compatibility\n- Complex message routing\n- Message selectors and filters<\/p>\n<p><strong>When to Use SQS/SNS<\/strong>:\n- Cloud-native applications\n- Need massive scale\n- Serverless architecture\n- Cost optimization\n- Can rewrite code<\/p>\n<p><strong>Amazon MQ Configuration<\/strong>:\n<code>json\n{\n  \"BrokerName\": \"ProductionBroker\",\n  \"EngineType\": \"ActiveMQ\",\n  \"EngineVersion\": \"5.16.5\",\n  \"DeploymentMode\": \"ACTIVE_STANDBY_MULTI_AZ\",\n  \"HostInstanceType\": \"mq.m5.large\",\n  \"PubliclyAccessible\": false,\n  \"SecurityGroups\": [\"sg-12345\"],\n  \"SubnetIds\": [\"subnet-1\", \"subnet-2\"],\n  \"Users\": [{\n    \"Username\": \"admin\",\n    \"Password\": \"SecurePassword123!\",\n    \"ConsoleAccess\": true\n  }],\n  \"MaintenanceWindowStartTime\": {\n    \"DayOfWeek\": \"MONDAY\",\n    \"TimeOfDay\": \"03:00\",\n    \"TimeZone\": \"America/New_York\"\n  }\n}<\/code><\/p>\n<p><strong>Cost Comparison<\/strong>:<\/p>\n<p><strong>Amazon MQ<\/strong>:\n- Instance costs (hourly)\n- Storage costs (EBS/EFS)\n- Data transfer<\/p>\n<p><strong>SQS/SNS<\/strong>:\n- Per request\n- No instance costs\n- Generally cheaper at scale<\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use Multi-AZ for production\n2. Configure automatic minor version upgrades\n3. Enable CloudWatch logging\n4. Use VPC endpoints for secure access\n5. Implement message selectors for filtering\n6. Monitor broker metrics<\/p>\n<p><strong>References:<\/strong> Amazon MQ, Message Brokers, JMS Migration<\/p>","fixed":false},{"id":"integ-9","c":"integ","q":"<p>An application publishes custom metrics to CloudWatch. These metrics should trigger automated responses. What is the BEST approach?<\/p>","o":["Poll CloudWatch API periodically","Use CloudWatch Alarms with SNS","Use EventBridge rule for CloudWatch events","Use Lambda to check metrics"],"a":[1],"x":"<ul>\n<li><strong>CloudWatch Alarms<\/strong> monitor metrics and trigger actions automatically<\/li>\n<li>SNS integration for notifications and automated responses<\/li>\n<li>Can trigger Auto Scaling, EC2 actions, SNS, Systems Manager<\/li>\n<\/ul>\n<p><strong>CloudWatch Alarms Architecture<\/strong>:\n<code>Custom Application\n       ↓\nCloudWatch Custom Metrics\n       ↓\nCloudWatch Alarm (threshold)\n       ↓\nSNS Topic\n  ├→ Email notifications\n  ├→ Lambda (automated remediation)\n  ├→ SQS (queue for processing)\n  └→ Auto Scaling (scale up/down)<\/code><\/p>\n<p><strong>CloudWatch Alarm States<\/strong>:\n- <strong>OK<\/strong>: Metric within threshold\n- <strong>ALARM<\/strong>: Metric breached threshold\n- <strong>INSUFFICIENT_DATA<\/strong>: Not enough data<\/p>\n<p><strong>Alarm Configuration<\/strong>:\n```python\nimport boto3<\/p>\n<p>cloudwatch = boto3.client('cloudwatch')<\/p>\n<h1>Create alarm<\/h1>\n<p>cloudwatch.put_metric_alarm(\n    AlarmName='HighCPUUtilization',\n    ComparisonOperator='GreaterThanThreshold',\n    EvaluationPeriods=2,\n    MetricName='CPUUtilization',\n    Namespace='AWS/EC2',\n    Period=300,  # 5 minutes\n    Statistic='Average',\n    Threshold=80.0,\n    ActionsEnabled=True,\n    AlarmActions=[\n        'arn:aws:sns:us-east-1:123456789012:AlertTopic',\n        'arn:aws:autoscaling:us-east-1:123456789012:scalingPolicy:...'\n    ],\n    AlarmDescription='Alert when CPU exceeds 80%',\n    Dimensions=[{\n        'Name': 'InstanceId',\n        'Value': 'i-1234567890abcdef0'\n    }]\n)\n```<\/p>\n<p><strong>Custom Metrics Example<\/strong>:\n```python<\/p>\n<h1>Publish custom metric<\/h1>\n<p>cloudwatch.put_metric_data(\n    Namespace='MyApp/Orders',\n    MetricData=[{\n        'MetricName': 'OrdersProcessed',\n        'Value': 150,\n        'Unit': 'Count',\n        'Timestamp': datetime.datetime.utcnow(),\n        'Dimensions': [{\n            'Name': 'Environment',\n            'Value': 'Production'\n        }]\n    }]\n)<\/p>\n<h1>Create alarm on custom metric<\/h1>\n<p>cloudwatch.put_metric_alarm(\n    AlarmName='LowOrderProcessing',\n    ComparisonOperator='LessThanThreshold',\n    EvaluationPeriods=1,\n    MetricName='OrdersProcessed',\n    Namespace='MyApp/Orders',\n    Period=60,\n    Statistic='Sum',\n    Threshold=100.0,\n    ActionsEnabled=True,\n    AlarmActions=['arn:aws:sns:...'],\n    Dimensions=[{\n        'Name': 'Environment',\n        'Value': 'Production'\n    }]\n)\n```<\/p>\n<p><strong>Alarm Actions<\/strong>:<\/p>\n<p><strong>1. SNS Notifications<\/strong>:\n<code>Alarm → SNS → Email/SMS/Lambda/HTTP<\/code><\/p>\n<p><strong>2. Auto Scaling<\/strong>:\n<code>Alarm → Auto Scaling Policy → Scale EC2/ECS<\/code><\/p>\n<p><strong>3. EC2 Actions<\/strong>:\n<code>Alarm → Stop/Terminate/Reboot Instance<\/code><\/p>\n<p><strong>4. Systems Manager Actions<\/strong>:\n<code>Alarm → SSM Automation → Run playbook<\/code><\/p>\n<p><strong>Automated Response Example<\/strong> (Lambda):\n```python\ndef lambda_handler(event, context):\n    message = json.loads(event['Records'][0]['Sns']['Message'])<\/p>\n<pre><code>alarm_name = message['AlarmName']\nnew_state = message['NewStateValue']\nreason = message['NewStateReason']\n\nif new_state == 'ALARM':\n    # Automated remediation\n    if 'HighCPU' in alarm_name:\n        scale_up_instances()\n    elif 'LowOrders' in alarm_name:\n        investigate_issue()\n        send_alert_to_team()\n<\/code><\/pre>\n<p>```<\/p>\n<p><strong>Composite Alarms<\/strong> (multiple conditions):\n<code>python\ncloudwatch.put_composite_alarm(\n    AlarmName='CriticalSystemHealth',\n    AlarmRule='(ALARM(HighCPU) OR ALARM(HighMemory)) AND ALARM(HighErrorRate)',\n    ActionsEnabled=True,\n    AlarmActions=['arn:aws:sns:...']\n)<\/code><\/p>\n<p><strong>Alarm Statistics<\/strong>:\n- <strong>Average<\/strong>: Mean value\n- <strong>Sum<\/strong>: Total\n- <strong>Minimum<\/strong>: Lowest value\n- <strong>Maximum<\/strong>: Highest value\n- <strong>SampleCount<\/strong>: Number of data points\n- <strong>p99<\/strong>: 99th percentile<\/p>\n<p><strong>Best Practices<\/strong>:\n1. Use meaningful alarm names\n2. Set appropriate evaluation periods (avoid flapping)\n3. Use composite alarms for complex conditions\n4. Test alarms with CloudWatch Alarm Testing\n5. Document alarm thresholds\n6. Review and adjust thresholds regularly<\/p>\n<p><strong>CloudWatch Alarms vs EventBridge<\/strong>:\n- <strong>Alarms<\/strong>: Metric-based thresholds\n- <strong>EventBridge<\/strong>: Event-driven (state changes, API calls)<\/p>\n<p><strong>References:<\/strong> CloudWatch Alarms, Automated Monitoring, Metric-Based Actions<\/p>","fixed":false},{"id":"integ-10","c":"integ","q":"<p>A company wants to implement API Gateway to trigger different Lambda functions based on the API path. What feature enables this?<\/p>","o":["API Gateway Stages","API Gateway Methods","API Gateway Resources with Lambda Integration","API Gateway Authorizers"],"a":[2],"x":"<ul>\n<li><strong>API Gateway Resources<\/strong> define API paths<\/li>\n<li>Each resource/method can integrate with different Lambda functions<\/li>\n<li>Enables REST API routing to microservices<\/li>\n<\/ul>\n<p><strong>API Gateway Lambda Integration<\/strong>:\n<code>GET /users → Lambda: ListUsers\nPOST /users → Lambda: CreateUser\nGET /users/{id} → Lambda: GetUser\nPUT /users/{id} → Lambda: UpdateUser\nDELETE /users/{id} → Lambda: DeleteUser<\/code><\/p>\n<p><strong>API Gateway Structure<\/strong>:\n<code>REST API: UserService\n├─ /users (Resource)\n│  ├─ GET (Method) → Lambda: ListUsers\n│  ├─ POST (Method) → Lambda: CreateUser\n│  └─ /{id} (Resource)\n│     ├─ GET (Method) → Lambda: GetUser\n│     ├─ PUT (Method) → Lambda: UpdateUser\n│     └─ DELETE (Method) → Lambda: DeleteUser\n└─ /orders (Resource)\n   ├─ GET → Lambda: ListOrders\n   └─ POST → Lambda: CreateOrder<\/code><\/p>\n<p><strong>API Gateway Integration Types<\/strong>:<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Lambda<\/strong><\/td>\n<td>Serverless backend<\/td>\n<\/tr>\n<tr>\n<td><strong>HTTP<\/strong><\/td>\n<td>HTTP endpoints<\/td>\n<\/tr>\n<tr>\n<td><strong>AWS Service<\/strong><\/td>\n<td>Direct AWS service integration<\/td>\n<\/tr>\n<tr>\n<td><strong>Mock<\/strong><\/td>\n<td>Testing, return fixed response<\/td>\n<\/tr>\n<tr>\n<td><strong>VPC Link<\/strong><\/td>\n<td>Private VPC resources<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lambda Integration Configuration<\/strong>:\n<code>json\n{\n  \"httpMethod\": \"POST\",\n  \"type\": \"AWS_PROXY\",  // Lambda proxy integration\n  \"uri\": \"arn:aws:apigateway:us-east-1:lambda:path/2015-03-31/functions/arn:aws:lambda:us-east-1:123456789012:function:CreateUser/invocations\",\n  \"credentials\": \"arn:aws:iam::123456789012:role/APIGatewayLambdaRole\",\n  \"requestTemplates\": {\n    \"application/json\": \"{\\\"body\\\": $input.json('$')}\"\n  }\n}<\/code><\/p>
