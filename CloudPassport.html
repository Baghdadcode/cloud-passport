><strong>Legacy<\/strong> (use Application Migration Service instead)<\/li>\n<\/ul>\n<h2>Server Migration Service (SMS)<\/h2>\n<ul>\n<li><strong>Integration<\/strong>: Migration Hub<\/li>\n<li><strong>Agent-based<\/strong>: Detailed info (processes, connections)<\/li>\n<li><strong>Agentless<\/strong>: VMware vCenter<\/li>\n<li><strong>Discover on-premises<\/strong> servers<\/li>\n<\/ul>\n<h2>Application Discovery Service<\/h2>\n<ul>\n<li><strong>Not a migration tool<\/strong> (just tracking/planning)<\/li>\n<li><strong>Integrates with<\/strong>: MGN, DMS, Server Migration Service<\/li>\n<li><strong>Track migrations<\/strong> from single location<\/li>\n<\/ul>\n<h2>Migration Hub<\/h2>\n<ul>\n<li><strong>Time<\/strong>: <code>(Data Size / Network Speed) &gt; Ship Time<\/code><\/li>\n<li><strong>Network<\/strong>: Limited bandwidth, expensive data transfer<\/li>\n<li><strong>&gt;10 TB<\/strong>: Consider Snow devices<\/li>\n<\/ul>\n<h3>When to Use Snow?<\/h3>\n<ul>\n<li><strong>Use case<\/strong>: Datacenter migration, 10+ PB data<\/li>\n<li><strong>Physical truck<\/strong> to your datacenter<\/li>\n<li><strong>100 PB<\/strong> per truck<\/li>\n<\/ul>\n<h3>Snowmobile<\/h3>\n<ul>\n<li><strong>Cluster<\/strong>: 5-10 devices<\/li>\n<li><strong>Use case<\/strong>: Local processing + data transfer<\/li>\n<li><strong>Compute Optimized<\/strong>: 42 TB, 52 vCPUs, optional GPU<\/li>\n<li><strong>Storage Optimized<\/strong>: 80 TB, 24 vCPUs<\/li>\n<\/ul>\n<h3>Snowball Edge<\/h3>\n<ul>\n<li><strong>Use case<\/strong>: Edge computing, small data transfer<\/li>\n<li><strong>DataSync agent<\/strong> pre-installed<\/li>\n<li><strong>Small<\/strong>, rugged, portable<\/li>\n<li><strong>8 TB<\/strong> usable storage<\/li>\n<\/ul>\n<h3>Snowcone<\/h3>\n<h2>Snow Family<\/h2>\n<ul>\n<li>Example: SQL Server → PostgreSQL<\/li>\n<li><strong>Not needed<\/strong> for same engine (homogeneous)<\/li>\n<li>Convert schema for heterogeneous migrations<\/li>\n<\/ul>\n<h3>Schema Conversion Tool (SCT)<\/h3>\n<ul>\n<li><strong>Replication task<\/strong>: Migration job<\/li>\n<li><strong>Target endpoint<\/strong>: Target database<\/li>\n<li><strong>Source endpoint<\/strong>: Source database<\/li>\n<li><strong>Replication instance<\/strong>: EC2 running DMS<\/li>\n<\/ul>\n<h3>DMS Components<\/h3>\n<ul>\n<li><strong>CDC only<\/strong>: Only ongoing changes<\/li>\n<li><strong>Full load + CDC<\/strong>: Initial + ongoing changes<\/li>\n<li><strong>Full load<\/strong>: One-time migration<\/li>\n<\/ul>\n<h3>Migration Types<\/h3>\n<ul>\n<li><strong>Heterogeneous<\/strong>: Oracle → Aurora (need SCT)<\/li>\n<li><strong>Homogeneous<\/strong>: Oracle → Oracle<\/li>\n<li><strong>Source DB stays operational<\/strong> during migration<\/li>\n<li>Migrate databases to AWS<\/li>\n<\/ul>\n<h3>DMS Basics<\/h3>\n<h2>Database Migration Service (DMS)<\/h2>\n<ul>\n<li><strong>Integration<\/strong>: Existing authentication (AD, LDAP)<\/li>\n<li><strong>Use case<\/strong>: Migrate file transfer workflows<\/li>\n<li><strong>Store in<\/strong>: S3, EFS<\/li>\n<li><strong>Managed SFTP/FTPS/FTP<\/strong> service<\/li>\n<\/ul>\n<h2>AWS Transfer Family<\/h2>\n<ul>\n<li><strong>Speed<\/strong>: 10x faster than open-source tools<\/li>\n<li><strong>Agent<\/strong>: Install on-premises<\/li>\n<li><strong>Schedule<\/strong>: Hourly, daily, weekly<\/li>\n<li><strong>Destinations<\/strong>: S3, EFS, FSx<\/li>\n<li><strong>Bandwidth optimization<\/strong>, compression, encryption<\/li>\n<li><strong>Automated data transfer<\/strong> (on-premises ↔ AWS)<\/li>\n<\/ul>\n<h2>AWS DataSync<\/h2>\n<p><strong>Exam Tip<\/strong>: Match scenario to strategy!<\/p>\n<ul>\n<li>Migrate later<\/li>\n<li>\n<p>Keep on-premises (for now)\n6. <strong>Retain (Revisit)<\/strong><\/p>\n<\/li>\n<li>\n<p>Reduce cost and complexity<\/p>\n<\/li>\n<li>\n<p>Turn off unused applications\n5. <strong>Retire<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Most expensive<\/strong>, most benefits<\/p>\n<\/li>\n<li>Example: Monolith → Microservices/Lambda<\/li>\n<li>\n<p>Redesign for cloud-native\n4. <strong>Refactor/Re-architect<\/strong><\/p>\n<\/li>\n<li>\n<p>Example: Exchange → Office 365<\/p>\n<\/li>\n<li>\n<p>Switch to SaaS\n3. <strong>Repurchase (Drop-and-Shop)<\/strong><\/p>\n<\/li>\n<li>\n<p>Example: Self-managed DB → RDS<\/p>\n<\/li>\n<li>\n<p>Minor optimizations, no code changes\n2. <strong>Replatform (Lift-Tinker-Shift)<\/strong><\/p>\n<\/li>\n<li>\n<p>Use: AWS Application Migration Service (MGN)<\/p>\n<\/li>\n<li><strong>Fastest<\/strong>, least changes<\/li>\n<li>Move as-is to AWS (VMs → EC2)\n1. <strong>Rehost (Lift-and-Shift)<\/strong><\/li>\n<\/ul>\n<h2>6 R's Migration Strategies<\/h2>"},{"id":"ana","title":"Analytics & ML","color":"#0F6F7A","count":24,"lesson":"<h2>Amazon Athena<\/h2>\n<ul>\n<li><strong>Serverless<\/strong> SQL queries on S3<\/li>\n<li><strong>Pay per query<\/strong>: $5 per TB scanned<\/li>\n<li><strong>No infrastructure<\/strong> to manage<\/li>\n<li><strong>ANSI SQL<\/strong> (uses Presto engine)<\/li>\n<li><strong>Formats<\/strong>: CSV, JSON, Parquet, ORC, Avro<\/li>\n<\/ul>\n<h3>Athena Performance<\/h3>\n<ul>\n<li><strong>Partition data<\/strong>: Reduce scan (<code>/year/month/day<\/code>)<\/li>\n<li><strong>Columnar formats<\/strong>: Parquet, ORC (huge savings)<\/li>\n<li><strong>Compress data<\/strong>: gzip, snappy, zstd<\/li>\n<li><strong>Larger files<\/strong>: Combine small files (&gt;128 MB optimal)<\/li>\n<li><strong>Federated queries<\/strong>: Query across data sources (Lambda)<\/li>\n<\/ul>\n<h3>Athena Use Cases<\/h3>\n<ul>\n<li>Ad-hoc analysis, log analysis<\/li>\n<li>Query S3 data without ETL<\/li>\n<li>BI tools integration (QuickSight)<\/li>\n<\/ul>\n<h2>Amazon Kinesis<\/h2>\n<h3>Kinesis Data Streams<\/h3>\n<ul>\n<li><strong>Real-time<\/strong> streaming data<\/li>\n<li><strong>Retention<\/strong>: 1-365 days<\/li>\n<li><strong>Shards<\/strong>: Provision throughput<\/li>\n<li><strong>Write<\/strong>: 1 MB/s or 1,000 records/s per shard<\/li>\n<li><strong>Read<\/strong>: 2 MB/s per shard<\/li>\n<li><strong>Consumers<\/strong>: Lambda, KCL, Kinesis Data Analytics<\/li>\n<li><strong>Replay<\/strong>: Re-process data<\/li>\n<\/ul>\n<h3>Kinesis Data Firehose<\/h3>\n<ul>\n<li><strong>Near real-time<\/strong> (60 sec buffer minimum)<\/li>\n<li><strong>Load to<\/strong>: S3, Redshift, OpenSearch, Splunk, HTTP endpoints<\/li>\n<li><strong>Auto-scaling<\/strong> (no shards)<\/li>\n<li><strong>Transformations<\/strong>: Lambda<\/li>\n<li><strong>Compression<\/strong>: GZIP, Snappy, Zip<\/li>\n<li><strong>Pay per GB<\/strong> ingested<\/li>\n<\/ul>\n<h3>Kinesis Data Analytics<\/h3>\n<ul>\n<li><strong>Real-time SQL<\/strong> queries on streaming data<\/li>\n<li><strong>Input<\/strong>: Kinesis Streams or Firehose<\/li>\n<li><strong>Output<\/strong>: Kinesis Streams, Firehose, Lambda<\/li>\n<li><strong>Use case<\/strong>: Real-time dashboards, metrics, alerts<\/li>\n<\/ul>\n<h3>Kinesis Video Streams<\/h3>\n<ul>\n<li><strong>Stream video<\/strong> from devices<\/li>\n<li><strong>Use case<\/strong>: Computer vision, ML, video playback<\/li>\n<\/ul>\n<h2>EMR (Elastic MapReduce)<\/h2>\n<ul>\n<li><strong>Big data processing<\/strong> (Hadoop, Spark, HBase, Presto, Flink)<\/li>\n<li><strong>Cluster<\/strong>: Master, core, task nodes<\/li>\n<li><strong>Storage<\/strong>: HDFS, EMRFS (S3), instance store<\/li>\n<li><strong>Spot instances<\/strong>: Save cost on task nodes<\/li>\n<li><strong>Use case<\/strong>: Big data, ML, genomics, log analysis<\/li>\n<\/ul>\n<h3>EMR Node Types<\/h3>\n<ul>\n<li><strong>Master<\/strong>: Manage cluster, coordinate tasks<\/li>\n<li><strong>Core<\/strong>: Run tasks, store HDFS data<\/li>\n<li><strong>Task<\/strong>: Run tasks only (optional), use Spot<\/li>\n<\/ul>\n<h2>AWS Glue<\/h2>\n<ul>\n<li><strong>Serverless ETL<\/strong> (Extract, Transform, Load)<\/li>\n<li><strong>Glue Data Catalog<\/strong>: Metadata repository (tables, schemas)<\/li>\n<li><strong>Glue Crawler<\/strong>: Auto-discover schema<\/li>\n<li><strong>Glue Jobs<\/strong>: ETL scripts (Spark/Python)<\/li>\n<li><strong>Integration<\/strong>: Athena, Redshift, EMR<\/li>\n<\/ul>\n<h3>Glue Components<\/h3>\n<ul>\n<li><strong>Data Catalog<\/strong>: Central metadata repository<\/li>\n<li><strong>Crawlers<\/strong>: Discover data and populate catalog<\/li>\n<li><strong>ETL Jobs<\/strong>: Transform data<\/li>\n<li><strong>Triggers<\/strong>: Schedule or event-driven<\/li>\n<li><strong>Development Endpoints<\/strong>: Test ETL scripts<\/li>\n<\/ul>\n<h3>Glue Use Cases<\/h3>\n<ul>\n<li>Prepare data for analytics<\/li>\n<li>Migrate databases<\/li>\n<li>Build data lake<\/li>\n<li>Data discovery<\/li>\n<\/ul>\n<h2>Amazon Redshift<\/h2>\n<ul>\n<li><strong>Data warehouse<\/strong> (OLAP, analytics)<\/li>\n<li><strong>Columnar<\/strong> storage, parallel queries<\/li>\n<li><strong>Petabyte-scale<\/strong><\/li>\n<li><strong>Not for OLTP<\/strong> (use RDS/Aurora)<\/li>\n<li><strong>Cluster<\/strong>: Leader node + compute nodes<\/li>\n<\/ul>\n<h3>Redshift Features<\/h3>\n<ul>\n<li><strong>Compression<\/strong>: Auto-compression<\/li>\n<li><strong>Massively Parallel Processing (MPP)<\/strong><\/li>\n<li><strong>Result caching<\/strong>: Fast repeated queries<\/li>\n<li><strong>Backup<\/strong>: Automated (1-35 days), manual snapshots<\/li>\n<li><strong>Redshift Spectrum<\/strong>: Query S3 directly (no load)<\/li>\n<\/ul>\n<h3>Redshift Pricing<\/h3>\n<ul>\n<li><strong>On-Demand<\/strong>: Pay per hour<\/li>\n<li><strong>Reserved<\/strong>: 1-3 years (up to 75% discount)<\/li>\n<\/ul>\n<h2>QuickSight<\/h2>\n<ul>\n<li><strong>Serverless BI<\/strong> (Business Intelligence)<\/li>\n<li><strong>Visualizations<\/strong>, dashboards, ad-hoc analysis<\/li>\n<li><strong>Auto-scaling<\/strong>, pay per session<\/li>\n<li><strong>Data sources<\/strong>: Redshift, RDS, Aurora, Athena, S3, on-premises<\/li>\n<li><strong>SPICE engine<\/strong>: In-memory calculation (fast)<\/li>\n<li><strong>ML Insights<\/strong>: Anomaly detection, forecasting<\/li>\n<\/ul>\n<h2>Amazon OpenSearch (Elasticsearch)<\/h2>\n<ul>\n<li><strong>Search and analytics<\/strong> engine<\/li>\n<li><strong>Use cases<\/strong>: Log analytics, full-text search, real-time app monitoring<\/li>\n<li><strong>Managed service<\/strong>: Previously called Elasticsearch Service<\/li>\n<li><strong>Kibana<\/strong>: Visualization (included)<\/li>\n<li><strong>Integration<\/strong>: Kinesis Firehose, Lambda, CloudWatch Logs<\/li>\n<\/ul>\n<h2>AWS Data Pipeline<\/h2>\n<ul>\n<li><strong>Legacy<\/strong> (use Glue or Step Functions)<\/li>\n<li>Orchestrate data movement and transformation<\/li>\n<li><strong>On-premises + AWS<\/strong> data sources<\/li>\n<\/ul>\n<h2>AWS Lake Formation<\/h2>\n<ul>\n<li><strong>Build data lakes<\/strong> easily<\/li>\n<li><strong>Centralized permissions<\/strong> (fine-grained access control)<\/li>\n<li><strong>Built on Glue<\/strong>: Uses Glue Data Catalog<\/li>\n<li><strong>Features<\/strong>: Data ingestion, cataloging, transformation, security<\/li>\n<\/ul>\n<h2>MSK (Managed Streaming for Apache Kafka)<\/h2>\n<ul>\n<li><strong>Managed Apache Kafka<\/strong> service<\/li>\n<li><strong>Alternative to Kinesis<\/strong><\/li>\n<li><strong>Use case<\/strong>: Existing Kafka workloads, need full Kafka features<\/li>\n<\/ul>\n<h3>MSK vs Kinesis<\/h3>\n<table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>MSK<\/th>\n<th>Kinesis<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Management<\/td>\n<td>More control<\/td>\n<td>Fully managed<\/td>\n<\/tr>\n<tr>\n<td>Compatibility<\/td>\n<td>Apache Kafka<\/td>\n<td>AWS proprietary<\/td>\n<\/tr>\n<tr>\n<td>Use case<\/td>\n<td>Kafka migration<\/td>\n<td>New AWS apps<\/td>\n<\/tr>\n<tr>\n<td>Cost<\/td>\n<td>Generally cheaper<\/td>\n<td>Pay for shards<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>AWS Batch<\/h2>\n<ul>\n<li><strong>Batch processing<\/strong> at any scale<\/li>\n<li><strong>Dynamically provisions<\/strong> EC2 or Spot<\/li>\n<li><strong>Jobs<\/strong>: Units of work (Docker containers)<\/li>\n<li><strong>Job queues<\/strong>: Priority-based<\/li>\n<li><strong>Use case<\/strong>: Image processing, genomics, financial modeling<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>Athena<\/strong>: Serverless SQL on S3, $5/TB<\/li>\n<li><strong>Kinesis Streams<\/strong>: Real-time, shards, 1-365 days retention<\/li>\n<li><strong>Kinesis Firehose<\/strong>: Near real-time, load to S3/Redshift, no shards<\/li>\n<li><strong>EMR<\/strong>: Hadoop/Spark, big data processing<\/li>\n<li><strong>Glue<\/strong>: Serverless ETL, Data Catalog<\/li>\n<li><strong>Redshift<\/strong>: Data warehouse, OLAP, columnar<\/li>\n<li><strong>Redshift Spectrum<\/strong>: Query S3 without loading<\/li>\n<li><strong>QuickSight<\/strong>: Serverless BI, SPICE engine<\/li>\n<li><strong>OpenSearch<\/strong>: Search, log analytics, Kibana<\/li>\n<li><strong>Lake Formation<\/strong>: Build data lakes, centralized permissions<\/li>\n<li><strong>MSK<\/strong>: Managed Kafka (migrate existing workloads)<\/li>\n<li><strong>AWS Batch<\/strong>: Batch jobs, EC2/Spot provisioning<\/li>\n<li><strong>Use Parquet/ORC<\/strong>: Reduce Athena costs significantly<\/li>\n<\/ul>"},{"id":"arch","title":"Architecture Patterns","color":"#5A1424","count":20,"lesson":"<h2>Well-Architected Framework (6 Pillars)<\/h2>\n<h3>1. Operational Excellence<\/h3>\n<ul>\n<li><strong>Run and monitor<\/strong> systems<\/li>\n<li><strong>IaC<\/strong>: CloudFormation, CDK<\/li>\n<li><strong>Automate<\/strong>: CI/CD pipelines<\/li>\n<li><strong>Frequent, small changes<\/strong>: Reduce risk<\/li>\n<li><strong>Learn from failures<\/strong>: Post-mortems<\/li>\n<li><strong>Runbooks and playbooks<\/strong>: Document procedures<\/li>\n<\/ul>\n<h3>2. Security<\/h3>\n<ul>\n<li><strong>Identity<\/strong>: IAM, least privilege<\/li>\n<li><strong>Detection<\/strong>: CloudTrail, GuardDuty, Config<\/li>\n<li><strong>Protection<\/strong>: Encryption (at-rest, in-transit)<\/li>\n<li><strong>Infrastructure protection<\/strong>: VPC, Security Groups, NACLs<\/li>\n<li><strong>Data protection<\/strong>: Versioning, MFA Delete, backup<\/li>\n<\/ul>\n<h3>3. Reliability<\/h3>\n<ul>\n<li><strong>Recover from failures<\/strong>: Auto Scaling, Multi-AZ<\/li>\n<li><strong>Test recovery<\/strong>: Simulate failures<\/li>\n<li><strong>Auto-scale<\/strong>: Handle demand changes<\/li>\n<li><strong>Manage capacity<\/strong>: Right-size resources<\/li>\n<li><strong>Design principles<\/strong>: Distributed systems, graceful degradation<\/li>\n<\/ul>\n<h3>4. Performance Efficiency<\/h3>\n<ul>\n<li><strong>Use right resources<\/strong>: Instance types, storage<\/li>\n<li><strong>Monitor performance<\/strong>: CloudWatch<\/li>\n<li><strong>Experiment<\/strong>: Test different configurations<\/li>\n<li><strong>Go global<\/strong>: Multi-region deployment<\/li>\n<li><strong>Serverless<\/strong>: Lambda, Fargate (no server management)<\/li>\n<\/ul>\n<h3>5. Cost Optimization<\/h3>\n<ul>\n<li><strong>Pay for what you use<\/strong>: Stop unused resources<\/li>\n<li><strong>Reserved/Savings Plans<\/strong>: Commit for discounts<\/li>\n<li><strong>Right-size<\/strong>: Match resources to workload<\/li>\n<li><strong>Monitor costs<\/strong>: Cost Explorer, Budgets<\/li>\n<li><strong>Measure efficiency<\/strong>: Cost per transaction<\/li>\n<\/ul>\n<h3>6. Sustainability<\/h3>\n<ul>\n<li><strong>Minimize environmental impact<\/strong><\/li>\n<li><strong>Use managed services<\/strong>: Higher utilization<\/li>\n<li><strong>Reduce idle resources<\/strong>: Auto Scaling<\/li>\n<li><strong>Optimize regions<\/strong>: Lower carbon footprint<\/li>\n<\/ul>\n<h2>Multi-Tier Architecture<\/h2>\n<h3>3-Tier Web Application<\/h3>\n<p><code>Users → CloudFront → Route 53\n  ↓\nALB (Public Subnet)\n  ↓\nEC2 Auto Scaling Group (Private Subnet)\n  ↓\nRDS Multi-AZ (Private Subnet)<\/code><\/p>\n<p><strong>Components<\/strong>:\n- <strong>Presentation<\/strong>: CloudFront, Route 53, ALB\n- <strong>Application<\/strong>: EC2 Auto Scaling (private subnets)\n- <strong>Data<\/strong>: RDS Multi-AZ (private subnets)<\/p>\n<p><strong>Features<\/strong>:\n- ✅ High availability (Multi-AZ)\n- ✅ Scalability (Auto Scaling)\n- ✅ Security (Private subnets, SGs)\n- ✅ Performance (CloudFront CDN)<\/p>\n<h2>Serverless Architecture<\/h2>\n<h3>Serverless Web App<\/h3>\n<p><code>Users → CloudFront + S3 (static)\n  ↓\nAPI Gateway\n  ↓\nLambda\n  ↓\nDynamoDB<\/code><\/p>\n<p><strong>Benefits<\/strong>:\n- ✅ No server management\n- ✅ Auto-scaling\n- ✅ Pay per use\n- ✅ High availability (built-in)<\/p>\n<p><strong>Use cases<\/strong>: Web apps, mobile backends, APIs<\/p>\n<h2>Event-Driven Architecture<\/h2>\n<h3>Pattern 1: S3 → Lambda<\/h3>\n<p><code>S3 (file upload) → Lambda (process) → DynamoDB/S3<\/code>\n<strong>Use case<\/strong>: Image processing, ETL<\/p>\n<h3>Pattern 2: SNS Fan-out<\/h3>\n<p><code>Application → SNS Topic → [SQS 1, SQS 2, Lambda]<\/code>\n<strong>Use case<\/strong>: Parallel processing, multiple consumers<\/p>\n<h3>Pattern 3: EventBridge<\/h3>\n<p><code>AWS Service → EventBridge → [Lambda, Step Functions, SQS]<\/code>\n<strong>Use case<\/strong>: Event-driven automation<\/p>\n<h2>High Availability Patterns<\/h2>\n<h3>Multi-AZ Deployment<\/h3>\n<ul>\n<li><strong>RDS Multi-AZ<\/strong>: Automatic failover<\/li>\n<li><strong>ELB<\/strong>: Distribute across AZs<\/li>\n<li><strong>Auto Scaling<\/strong>: Launch in multiple AZs<\/li>\n<li><strong>S3<\/strong>: 11 nines durability, auto-replicated<\/li>\n<\/ul>\n<h3>Multi-Region Deployment<\/h3>\n<ul>\n<li><strong>Route 53<\/strong>: Failover routing policy<\/li>\n<li><strong>Global Accelerator<\/strong>: Anycast IPs<\/li>\n<li><strong>DynamoDB Global Tables<\/strong>: Multi-region replication<\/li>\n<li><strong>Aurora Global Database<\/strong>: &lt;1 sec replication lag<\/li>\n<li><strong>CloudFront<\/strong>: Edge locations worldwide<\/li>\n<\/ul>\n<h2>Disaster Recovery Patterns<\/h2>\n<h3>1. Backup &amp; Restore (Cheapest, Slowest)<\/h3>\n<ul>\n<li>Backup to S3/Glacier<\/li>\n<li><strong>RTO/RPO<\/strong>: Hours to days<\/li>\n<li><strong>Cost<\/strong>: Low<\/li>\n<\/ul>\n<h3>2. Pilot Light (Core services always on)<\/h3>\n<ul>\n<li>Minimal setup always running<\/li>\n<li><strong>RTO<\/strong>: 10s of minutes<\/li>\n<li><strong>Cost<\/strong>: Low-Medium<\/li>\n<\/ul>\n<h3>3. Warm Standby (Scaled-down version)<\/h3>\n<ul>\n<li>Running but minimal capacity<\/li>\n<li><strong>RTO<\/strong>: Minutes<\/li>\n<li><strong>Cost<\/strong>: Medium<\/li>\n<\/ul>\n<h3>4. Multi-Site (Full active-active)<\/h3>\n<ul>\n<li>Full capacity in multiple regions<\/li>\n<li><strong>RTO<\/strong>: Real-time<\/li>\n<li><strong>Cost<\/strong>: High<\/li>\n<\/ul>\n<h2>Decoupling Patterns<\/h2>\n<h3>SQS Queue Pattern<\/h3>\n<p><code>Producer → SQS Queue → Consumer (Auto Scaling)<\/code>\n<strong>Benefits<\/strong>: Asynchronous, decouple, scale independently<\/p>\n<h3>Load Balancer Pattern<\/h3>\n<p><code>Users → ALB → Target Groups (EC2, Lambda, IP)<\/code>\n<strong>Benefits<\/strong>: Distribute load, health checks<\/p>\n<h2>Caching Patterns<\/h2>\n<h3>Layer 1: CloudFront (Edge)<\/h3>\n<ul>\n<li>Cache static content at edge locations<\/li>\n<li><strong>TTL<\/strong>: 24 hours default<\/li>\n<li><strong>Use case<\/strong>: Global users, static assets<\/li>\n<\/ul>\n<h3>Layer 2: ElastiCache (Application)<\/h3>\n<ul>\n<li>Cache database queries<\/li>\n<li><strong>Sub-millisecond<\/strong> latency<\/li>\n<li><strong>Use case<\/strong>: Frequent DB reads<\/li>\n<\/ul>\n<h3>Layer 3: DAX (DynamoDB)<\/h3>\n<ul>\n<li>In-memory cache for DynamoDB<\/li>\n<li><strong>Microsecond<\/strong> latency<\/li>\n<li><strong>Use case<\/strong>: DynamoDB read-heavy workloads<\/li>\n<\/ul>\n<h2>Microservices Patterns<\/h2>\n<h3>Container-Based<\/h3>\n<p><code>ALB → ECS Fargate (Service Discovery)\n  ↓\nDynamoDB / RDS<\/code><\/p>\n<h3>Serverless<\/h3>\n<p><code>API Gateway → Lambda Functions → DynamoDB<\/code><\/p>\n<p><strong>Benefits<\/strong>: Independent scaling, deployment, development<\/p>\n<h2>Security Patterns<\/h2>\n<h3>Defense in Depth<\/h3>\n<p><code>CloudFront (WAF) → ALB (SG) → Private Subnet (NACL) → EC2 (SG) → Data (Encryption)<\/code><\/p>\n<p><strong>Layers<\/strong>:\n1. <strong>Edge<\/strong>: CloudFront, WAF, Shield\n2. <strong>Network<\/strong>: VPC, NACLs, Security Groups\n3. <strong>Application<\/strong>: IAM, encryption\n4. <strong>Data<\/strong>: Encryption at rest/transit<\/p>\n<h2>Real-World Scenarios<\/h2>\n<h3>Scenario 1: E-Commerce Site<\/h3>\n<ul>\n<li><strong>Front<\/strong>: CloudFront + S3 (static)<\/li>\n<li><strong>API<\/strong>: API Gateway + Lambda<\/li>\n<li><strong>Database<\/strong>: DynamoDB (products), RDS (orders)<\/li>\n<li><strong>Search<\/strong>: OpenSearch<\/li>\n<li><strong>Cache<\/strong>: ElastiCache<\/li>\n<\/ul>\n<h3>Scenario 2: Video Streaming<\/h3>\n<ul>\n<li><strong>Storage<\/strong>: S3<\/li>\n<li><strong>CDN<\/strong>: CloudFront<\/li>\n<li><strong>Transcoding<\/strong>: MediaConvert or Lambda<\/li>\n<li><strong>Auth<\/strong>: Cognito<\/li>\n<li><strong>Signed URLs<\/strong>: Restrict access<\/li>\n<\/ul>\n<h3>Scenario 3: Big Data Pipeline<\/h3>\n<ul>\n<li><strong>Ingest<\/strong>: Kinesis Data Streams<\/li>\n<li><strong>Process<\/strong>: Lambda or Kinesis Analytics<\/li>\n<li><strong>Store<\/strong>: S3 (Data Lake)<\/li>\n<li><strong>Query<\/strong>: Athena<\/li>\n<li><strong>Visualize<\/strong>: QuickSight<\/li>\n<\/ul>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>3-Tier<\/strong>: Presentation, Application, Data layers<\/li>\n<li><strong>Serverless<\/strong>: Lambda + API Gateway + DynamoDB<\/li>\n<li><strong>HA<\/strong>: Multi-AZ + Auto Scaling + ELB<\/li>\n<li><strong>DR<\/strong>: Backup (cheapest) → Multi-Site (fastest)<\/li>\n<li><strong>Decoupling<\/strong>: Use SQS, SNS, EventBridge<\/li>\n<li><strong>Caching<\/strong>: CloudFront (edge) → ElastiCache (app) → DAX (DynamoDB)<\/li>\n<li><strong>Security<\/strong>: Defense in depth, multiple layers<\/li>\n<li><strong>Microservices<\/strong>: ECS/EKS or Lambda<\/li>\n<li><strong>Cost<\/strong>: Reserved/Savings Plans, right-size, monitor<\/li>\n<li><strong>Performance<\/strong>: Right resources, CDN, caching<\/li>\n<li><strong>Read scenario carefully<\/strong>: Match pattern to requirements!<\/li>\n<\/ul>"},{"id":"cost","title":"Cost Optimization","color":"#2449A6","count":20,"lesson":"<h2>AWS Pricing Fundamentals<\/h2>\n<h3>Pay-As-You-Go Model<\/h3>\n<ul>\n<li><strong>No upfront costs<\/strong>: Start/stop anytime<\/li>\n<li><strong>Pay for what you use<\/strong>: Per second/hour/GB<\/li>\n<li><strong>No termination fees<\/strong>: Cancel anytime<\/li>\n<\/ul>\n<h3>Pricing Dimensions<\/h3>\n<ol>\n<li><strong>Compute<\/strong>: Per second/hour (EC2, Lambda)<\/li>\n<li><strong>Storage<\/strong>: Per GB stored (S3, EBS)<\/li>\n<li><strong>Data Transfer<\/strong>:\n   - <strong>IN<\/strong>: Free (most cases)\n   - <strong>OUT<\/strong>: Charges apply\n   - <strong>Same region<\/strong>: Often free\n   - <strong>Cross-region<\/strong>: Charges apply<\/li>\n<\/ol>\n<h2>AWS Free Tier<\/h2>\n<h3>Three Types<\/h3>\n<p><strong>1. Always Free<\/strong>\n- <strong>Lambda<\/strong>: 1M requests/month\n- <strong>DynamoDB<\/strong>: 25 GB storage, 25 RCU/WCU\n- <strong>SNS<\/strong>: 1M publishes/month\n- <strong>CloudWatch<\/strong>: 10 metrics, 10 alarms\n- <strong>Cognito<\/strong>: 50K MAUs<\/p>\n<p><strong>2. 12 Months Free<\/strong> (new accounts)\n- <strong>EC2<\/strong>: 750 hrs/month t2.micro (Linux/Windows)\n- <strong>S3<\/strong>: 5 GB Standard storage\n- <strong>RDS<\/strong>: 750 hrs/month db.t2.micro\n- <strong>EBS<\/strong>: 30 GB<\/p>\n<p><strong>3. Trials<\/strong>\n- <strong>Inspector<\/strong>: 90 days\n- <strong>QuickSight<\/strong>: 30 days\n- <strong>Lightsail<\/strong>: 1 month<\/p>\n<h2>EC2 Cost Optimization<\/h2>\n<h3>Pricing Models<\/h3>\n<table>\n<thead>\n<tr>\n<th>Model<\/th>\n<th>Discount<\/th>\n<th>Commitment<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>On-Demand<\/td>\n<td>0%<\/td>\n<td>None<\/td>\n<td>Short, unpredictable<\/td>\n<\/tr>\n<tr>\n<td>Savings Plans<\/td>\n<td>Up to 72%<\/td>\n<td>1-3 years<\/td>\n<td>Flexible workloads<\/td>\n<\/tr>\n<tr>\n<td>Reserved<\/td>\n<td>Up to 72%<\/td>\n<td>1-3 years<\/td>\n<td>Steady state<\/td>\n<\/tr>\n<tr>\n<td>Spot<\/td>\n<td>Up to 90%<\/td>\n<td>None<\/td>\n<td>Fault-tolerant<\/td>\n<\/tr>\n<tr>\n<td>Dedicated<\/td>\n<td>0%<\/td>\n<td>None<\/td>\n<td>Compliance<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Savings Plans<\/h3>\n<ul>\n<li><strong>Compute Savings Plans<\/strong>: Most flexible (EC2, Fargate, Lambda) - up to 66%<\/li>\n<li><strong>EC2 Instance Savings Plans<\/strong>: Specific instance family/region - up to 72%<\/li>\n<li><strong>1 or 3 years<\/strong>: Greater discount for longer term<\/li>\n<li><strong>Payment<\/strong>: All upfront (max discount), partial upfront, no upfront<\/li>\n<\/ul>\n<h3>Reserved Instances<\/h3>\n<ul>\n<li><strong>Standard<\/strong>: Up to 72% discount, can't change<\/li>\n<li><strong>Convertible<\/strong>: Up to 66% discount, can change instance type<\/li>\n<li><strong>Scheduled<\/strong>: Predictable recurring schedule<\/li>\n<li><strong>Scope<\/strong>: Regional or zonal<\/li>\n<li><strong>Marketplace<\/strong>: Sell unused reservations<\/li>\n<\/ul>\n<h3>Spot Instances<\/h3>\n<ul>\n<li><strong>Up to 90% discount<\/strong><\/li>\n<li><strong>2-minute warning<\/strong> before termination<\/li>\n<li><strong>Use cases<\/strong>: Batch jobs, big data, stateless workloads<\/li>\n<li><strong>Spot Fleet<\/strong>: Mix of Spot + On-Demand<\/li>\n<li><strong>Spot Block<\/strong>: 1-6 hours (deprecated)<\/li>\n<\/ul>\n<h3>Right-Sizing<\/h3>\n<ul>\n<li>Match instance type to workload<\/li>\n<li>Use <strong>CloudWatch<\/strong> metrics to identify underutilized<\/li>\n<li><strong>Compute Optimizer<\/strong>: ML-based recommendations<\/li>\n<li>Start small, scale up as needed<\/li>\n<\/ul>\n<h2>Storage Cost Optimization<\/h2>\n<h3>S3 Storage Classes (Cost: Cheap → Expensive)<\/h3>\n<ol>\n<li><strong>S3 Glacier Deep Archive<\/strong>: $1/TB/month<\/li>\n<li><strong>S3 Glacier Flexible<\/strong>: $4/TB/month<\/li>\n<li><strong>S3 Glacier Instant<\/strong>: $4/TB/month<\/li>\n<li><strong>S3 One Zone-IA<\/strong>: $10/TB/month<\/li>\n<li><strong>S3 Standard-IA<\/strong>: $12.5/TB/month<\/li>\n<li><strong>S3 Intelligent-Tiering<\/strong>: $12.5-23/TB/month<\/li>\n<li><strong>S3 Standard<\/strong>: $23/TB/month<\/li>\n<\/ol>\n<p><strong>Optimization<\/strong>:\n- <strong>Lifecycle policies<\/strong>: Auto-transition to cheaper classes\n- <strong>Intelligent-Tiering<\/strong>: Unknown access patterns\n- <strong>Delete old data<\/strong>: Expiration policies<\/p>\n<h3>EBS Optimization<\/h3>\n<ul>\n<li><strong>gp3<\/strong>: Cheaper than gp2, better performance<\/li>\n<li><strong>Delete unattached volumes<\/strong><\/li>\n<li><strong>Snapshots<\/strong>: Incremental, compress, delete old<\/li>\n<li><strong>Cold HDD (sc1)<\/strong>: Cheapest for cold data<\/li>\n<\/ul>\n<h2>Database Cost Optimization<\/h2>\n<h3>RDS<\/h3>\n<ul>\n<li><strong>Reserved Instances<\/strong>: Up to 69% discount<\/li>\n<li><strong>Stop instances<\/strong>: Dev/test environments<\/li>\n<li><strong>Right-size<\/strong>: Use CloudWatch metrics<\/li>\n<li><strong>Aurora Serverless<\/strong>: Pay per second used<\/li>\n<li><strong>Read Replicas<\/strong>: Cheaper than scaling master<\/li>\n<\/ul>\n<h3>DynamoDB<\/h3>\n<ul>\n<li><strong>On-Demand<\/strong>: Unpredictable workloads<\/li>\n<li><strong>Provisioned<\/strong>: Cheaper for predictable (use auto-scaling)<\/li>\n<li><strong>Reserved Capacity<\/strong>: Up to 76% discount<\/li>\n<li><strong>Delete old data<\/strong>: TTL (free)<\/li>\n<\/ul>\n<h2>Data Transfer Optimization<\/h2>\n<h3>Minimize Costs<\/h3>\n<ul>\n<li><strong>Same region<\/strong>: Free for most services<\/li>\n<li><strong>Use CloudFront<\/strong>: Cheaper than S3 direct<\/li>\n<li><strong>VPC Endpoints<\/strong>: Avoid NAT/IGW charges<\/li>\n<li><strong>Direct Connect<\/strong>: Cheaper for large volumes<\/li>\n<li><strong>S3 Transfer Acceleration<\/strong>: Faster but costs more<\/li>\n<\/ul>\n<h3>Data Transfer Pricing<\/h3>\n<ul>\n<li><strong>IN<\/strong>: Free<\/li>\n<li><strong>S3 → Internet<\/strong>: $0.09/GB<\/li>\n<li><strong>S3 → CloudFront<\/strong>: $0.00/GB<\/li>\n<li><strong>CloudFront → Internet<\/strong>: $0.085/GB (cheaper!)<\/li>\n<\/ul>\n<h2>AWS Cost Management Tools<\/h2>\n<h3>Cost Explorer<\/h3>\n<ul>\n<li><strong>Visualize spending<\/strong> over time<\/li>\n<li><strong>Filter<\/strong>: By service, tag, account<\/li>\n<li><strong>Forecast<\/strong>: Next 12 months<\/li>\n<li><strong>Reserved Instance recommendations<\/strong><\/li>\n<li><strong>Savings Plans recommendations<\/strong><\/li>\n<\/ul>\n<h3>AWS Budgets<\/h3>\n<ul>\n<li><strong>Set custom budgets<\/strong>: Cost, usage, RI/SP utilization<\/li>\n<li><strong>Alerts<\/strong>: SNS notifications when threshold exceeded<\/li>\n<li><strong>Types<\/strong>: Cost, usage, reservation, savings plans<\/li>\n<li><strong>First 2 budgets free<\/strong>, $0.02/day per additional<\/li>\n<\/ul>\n<h3>Cost and Usage Report (CUR)<\/h3>\n<ul>\n<li><strong>Most detailed<\/strong> billing report<\/li>\n<li><strong>Hourly/daily/monthly<\/strong> granularity<\/li>\n<li><strong>Store in S3<\/strong>: Query with Athena<\/li>\n<li><strong>Integration<\/strong>: QuickSight for visualization<\/li>\n<\/ul>\n<h3>Cost Allocation Tags<\/h3>\n<ul>\n<li><strong>Track costs<\/strong> by project, team, environment<\/li>\n<li><strong>User-defined tags<\/strong>: <code>project:website<\/code><\/li>\n<li><strong>AWS-generated tags<\/strong>: <code>aws:createdBy<\/code><\/li>\n<li><strong>Activate tags<\/strong> in Billing console<\/li>\n<li><strong>Tag resources<\/strong> consistently<\/li>\n<\/ul>\n<h3>AWS Compute Optimizer<\/h3>\n<ul>\n<li><strong>ML-based recommendations<\/strong> for EC2, EBS, Lambda<\/li>\n<li><strong>Right-sizing<\/strong>: Identify over-provisioned resources<\/li>\n<li><strong>Free<\/strong> (requires opt-in)<\/li>\n<li><strong>Supports<\/strong>: EC2, Auto Scaling, EBS, Lambda<\/li>\n<\/ul>\n<h3>Trusted Advisor<\/h3>\n<ul>\n<li><strong>Cost optimization checks<\/strong> (Business/Enterprise support)<\/li>\n<li>Idle RDS, unattached ELBs, underutilized EC2<\/li>\n<li><strong>Core checks free<\/strong> (Basic/Developer)<\/li>\n<\/ul>\n<h2>Cost Optimization Strategies<\/h2>\n<h3>1. Turn Off Unused Resources<\/h3>\n<ul>\n<li>Stop EC2 instances (dev/test)<\/li>\n<li>Delete unattached EBS volumes<\/li>\n<li>Delete old snapshots<\/li>\n<li>Remove unused Elastic IPs<\/li>\n<\/ul>\n<h3>2. Right-Size Resources<\/h3>\n<ul>\n<li>Use Compute Optimizer<\/li>\n<li>Monitor CloudWatch metrics<\/li>\n<li>Start small, scale up<\/li>\n<\/ul>\n<h3>3. Purchase Commitments<\/h3>\n<ul>\n<li>Savings Plans (most flexible)<\/li>\n<li>Reserved Instances (specific)<\/li>\n<li>Reserved Capacity (DynamoDB, RDS, Redshift)<\/li>\n<\/ul>\n<h3>4. Use Spot Instances<\/h3>\n<ul>\n<li>Batch processing<\/li>\n<li>Big data workloads<\/li>\n<li>Stateless applications<\/li>\n<\/ul>\n<h3>5. Optimize Storage<\/h3>\n<ul>\n<li>Lifecycle policies (S3)<\/li>\n<li>Delete old data<\/li>\n<li>Compress files<\/li>\n<li>Use cheaper storage classes<\/li>\n<\/ul>\n<h3>6. Optimize Data Transfer<\/h3>\n<ul>\n<li>CloudFront for content delivery<\/li>\n<li>VPC Endpoints for AWS services<\/li>\n<li>Direct Connect for large volumes<\/li>\n<\/ul>\n<h3>7. Use Serverless<\/h3>\n<ul>\n<li>Lambda (no idle capacity)<\/li>\n<li>DynamoDB On-Demand<\/li>\n<li>Aurora Serverless<\/li>\n<li>Fargate (no EC2 management)<\/li>\n<\/ul>\n<h3>8. Monitor and Alert<\/h3>\n<ul>\n<li>Cost Explorer (visualize)<\/li>\n<li>Budgets (alert)<\/li>\n<li>Cost Anomaly Detection (ML)<\/li>\n<\/ul>\n<h2>Billing &amp; Pricing<\/h2>\n<h3>Consolidated Billing (Organizations)<\/h3>\n<ul>\n<li><strong>One bill<\/strong> for all accounts<\/li>\n<li><strong>Volume discounts<\/strong>: Combined usage<\/li>\n<li><strong>Reserved Instance sharing<\/strong>: Across accounts<\/li>\n<li><strong>Free<\/strong> feature<\/li>\n<\/ul>\n<h3>AWS Pricing Calculator<\/h3>\n<ul>\n<li><strong>Estimate costs<\/strong> before deployment<\/li>\n<li><strong>Configure services<\/strong>: Instance types, storage, transfer<\/li>\n<li><strong>Export<\/strong>: CSV, PDF<\/li>\n<li><strong>URL<\/strong>: calculator.aws<\/li>\n<\/ul>\n<h3>Support Plans<\/h3>\n<table>\n<thead>\n<tr>\n<th>Plan<\/th>\n<th>Cost<\/th>\n<th>Use Case<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Basic<\/td>\n<td>Free<\/td>\n<td>Everyone<\/td>\n<\/tr>\n<tr>\n<td>Developer<\/td>\n<td>$29/month<\/td>\n<td>Individual dev<\/td>\n<\/tr>\n<tr>\n<td>Business<\/td>\n<td>$100/month<\/td>\n<td>Production workloads<\/td>\n<\/tr>\n<tr>\n<td>Enterprise<\/td>\n<td>$15K/month<\/td>\n<td>Mission-critical<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Quick Exam Tips<\/h2>\n<ul>\n<li><strong>Savings Plans<\/strong>: Most flexible (up to 72%)<\/li>\n<li><strong>Reserved Instances<\/strong>: Specific instance (up to 72%)<\/li>\n<li><strong>Spot<\/strong>: Up to 90%, can be terminated<\/li>\n<li><strong>S3 Lifecycle<\/strong>: Auto-transition to cheaper classes<\/li>\n<li><strong>Cost Explorer<\/strong>: Visualize, forecast, recommendations<\/li>\n<li><strong>Budgets<\/strong>: Set alerts, $0.02/day after first 2<\/li>\n<li><strong>CUR<\/strong>: Most detailed billing data<\/li>\n<li><strong>Tags<\/strong>: Track costs by project/team<\/li>\n<li><strong>Compute Optimizer<\/strong>: ML-based right-sizing<\/li>\n<li><strong>Consolidated Billing<\/strong>: Combined usage, volume discounts<\/li>\n<li><strong>CloudFront<\/strong>: Cheaper data transfer than S3 direct<\/li>\n<li><strong>VPC Endpoints<\/strong>: Avoid NAT/IGW charges<\/li>\n<li><strong>Trusted Advisor<\/strong>: Cost optimization checks (Business+)<\/li>\n<li><strong>Stop unused resources<\/strong>: Biggest savings!<\/li>\n<li><strong>Free tier<\/strong>: 12 months for new accounts<\/li>\n<\/ul>"},{"id":"mixed","title":"Mixed Practice","color":"#8A5300","count":15,"lesson":"<h2>Exam Format (SAA-C03)<\/h2>\n<h3>Exam Details<\/h3>\n<ul>\n<li><strong>Questions<\/strong>: 65 (50 scored + 15 unscored)<\/li>\n<li><strong>Duration<\/strong>: 130 minutes (2 hours 10 minutes)<\/li>\n<li><strong>Format<\/strong>: Multiple choice + multiple response<\/li>\n<li><strong>Passing Score<\/strong>: 720/1000 (72%)<\/li>\n<li><strong>Cost<\/strong>: $150 USD<\/li>\n<li><strong>Valid<\/strong>: 3 years<\/li>\n<li><strong>Language<\/strong>: English, Japanese, Korean, Simplified Chinese<\/li>\n<\/ul>\n<h3>Question Types<\/h3>\n<ol>\n<li><strong>Multiple Choice<\/strong>: 1 correct answer out of 4<\/li>\n<li><strong>Multiple Response<\/strong>: 2+ correct answers out of 5+<\/li>\n<\/ol>\n<h3>Exam Domains<\/h3>\n<table>\n<thead>\n<tr>\n<th>Domain<\/th>\n<th>Weight<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Design Secure Architectures<\/td>\n<td>30%<\/td>\n<\/tr>\n<tr>\n<td>2. Design Resilient Architectures<\/td>\n<td>26%<\/td>\n<\/tr>\n<tr>\n<td>3. Design High-Performing Architectures<\/td>\n<td>24%<\/td>\n<\/tr>\n<tr>\n<td>4. Design Cost-Optimized Architectures<\/td>\n<td>20%<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Key Exam Topics<\/h2>\n<h3>Domain 1: Secure Architectures (30%)<\/h3>\n<ul>\n<li>✅ <strong>IAM<\/strong>: Users, groups, roles, policies, MFA<\/li>\n<li>✅ <strong>Encryption<\/strong>: KMS, CloudHSM, SSL/TLS<\/li>\n<li>✅ <strong>Network Security<\/strong>: Security Groups, NACLs, WAF<\/li>\n<li>✅ <strong>Data Protection<\/strong>: S3 encryption, RDS encryption, versioning<\/li>\n<li>✅ <strong>Compliance<\/strong>: CloudTrail, Config, GuardDuty, Inspector<\/li>\n<\/ul>\n<h3>Domain 2: Resilient Architectures (26%)<\/h3>\n<ul>\n<li>✅ <strong>High Availability<\/strong>: Multi-AZ, Auto Scaling, ELB<\/li>\n<li>✅ <strong>Disaster Recovery<\/strong>: Backup, RTO/RPO, failover<\/li>\n<li>✅ <strong>Decoupling<\/strong>: SQS, SNS, EventBridge<\/li>\n<li>✅ <strong>Data Durability<\/strong>: S3 (11 nines), RDS Multi-AZ, Aurora<\/li>\n<\/ul>\n<h3>Domain 3: High-Performing Architectures (24%)<\/h3>\n<ul>\n<li>✅ <strong>Storage<\/strong>: S3 classes, EBS types, EFS vs FSx<\/li>\n<li>✅ <strong>Database<\/strong>: RDS vs Aurora vs DynamoDB vs Redshift<\/li>\n<li>✅ <strong>Caching<\/strong>: CloudFront, ElastiCache, DAX<\/li>\n<li>✅ <strong>Compute<\/strong>: EC2 types, Lambda, containers<\/li>\n<li>✅ <strong>Network<\/strong>: VPC, Direct Connect, CloudFront, Global Accelerator<\/li>\n<\/ul>\n<h3>Domain 4: Cost-Optimized Architectures (20%)<\/h3>\n<ul>\n<li>✅ <strong>EC2 Pricing<\/strong>: On-Demand, Reserved, Savings Plans, Spot<\/li>\n<li>✅ <strong>Storage Optimization<\/strong>: S3 lifecycle, EBS gp3<\/li>\n<li>✅ <strong>Cost Tools<\/strong>: Cost Explorer, Budgets, Trusted Advisor<\/li>\n<li>✅ <strong>Right-Sizing<\/strong>: Compute Optimizer, CloudWatch metrics<\/li>\n<li>✅ <strong>Serverless<\/strong>: Lambda, DynamoDB On-Demand, Fargate<\/li>\n<\/ul>\n<h2>Critical Services to Master<\/h2>\n<h3>Top 20 Services (Know Inside-Out)<\/h3>\n<ol>\n<li><strong>IAM<\/strong>: Policies, roles, permission boundaries<\/li>\n<li><strong>EC2<\/strong>: Instance types, pricing, placement groups<\/li>\n<li><strong>S3<\/strong>: Storage classes, versioning, replication, lifecycle<\/li>\n<li><strong>VPC<\/strong>: Subnets, route tables, IGW, NAT, endpoints<\/li>\n<li><strong>ELB<\/strong>: ALB vs NLB vs GWLB, cross-zone, sticky sessions<\/li>\n<li><strong>Auto Scaling<\/strong>: Policies, health checks, cooldown<\/li>\n<li><strong>RDS<\/strong>: Multi-AZ, read replicas, backups<\/li>\n<li><strong>Aurora<\/strong>: Global database, serverless, endpoints<\/li>\n<li><strong>DynamoDB<\/strong>: Keys, indexes, capacity modes, streams<\/li>\n<li><strong>Lambda<\/strong>: Limits, concurrency, layers, triggers<\/li>\n<li><strong>CloudFront<\/strong>: Origins, OAI, signed URLs, TTL<\/li>\n<li><strong>Route 53<\/strong>: Routing policies, health checks<\/li>\n<li><strong>SQS<\/strong>: Standard vs FIFO, visibility timeout, DLQ<\/li>\n<li><strong>SNS<\/strong>: Topics, fan-out pattern, filtering<\/li>\n<li><strong>CloudWatch<\/strong>: Metrics, alarms, logs, dashboards<\/li>\n<li><strong>CloudTrail<\/strong>: API logging, management vs data events<\/li>\n<li><strong>KMS<\/strong>: Keys types, envelope encryption, policies<\/li>\n<li><strong>EBS<\/strong>: Volume types, snapshots, encryption<\/li>\n<li><strong>ElastiCache<\/strong>: Redis vs Memcached, caching strategies<\/li>\n<li><strong>EventBridge<\/strong>: Event patterns, rules, targets<\/li>\n<\/ol>\n<h2>Common Exam Scenarios<\/h2>\n<h3>Scenario 1: High Availability<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Company needs 99.99% availability...\"\n<strong>Answer<\/strong>: Multi-AZ + Auto Scaling + ALB/NLB<\/p>\n<h3>Scenario 2: Cost Optimization<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Reduce costs for predictable workload...\"\n<strong>Answer<\/strong>: Reserved Instances or Savings Plans<\/p>\n<h3>Scenario 3: Serverless<\/h3>\n<p><strong>Question Pattern<\/strong>: \"No infrastructure management...\"\n<strong>Answer<\/strong>: Lambda + API Gateway + DynamoDB<\/p>\n<h3>Scenario 4: Disaster Recovery<\/h3>\n<p><strong>Question Pattern<\/strong>: \"RTO of 1 hour, RPO of 15 minutes...\"\n<strong>Answer<\/strong>: Match to DR strategy (Pilot Light or Warm Standby)<\/p>\n<h3>Scenario 5: Data Transfer<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Transfer 500 TB to AWS...\"\n<strong>Answer<\/strong>: Snowball (not over internet)<\/p>\n<h3>Scenario 6: Caching<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Reduce database load, sub-millisecond latency...\"\n<strong>Answer<\/strong>: ElastiCache (Redis or Memcached)<\/p>\n<h3>Scenario 7: Analytics<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Query S3 data without loading...\"\n<strong>Answer<\/strong>: Athena (or Redshift Spectrum)<\/p>\n<h3>Scenario 8: Real-Time Processing<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Process streaming data in real-time...\"\n<strong>Answer<\/strong>: Kinesis Data Streams + Lambda/Analytics<\/p>\n<h3>Scenario 9: Cross-Region Replication<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Replicate data to another region for DR...\"\n<strong>Answer<\/strong>: S3 CRR, RDS read replica, Aurora Global Database<\/p>\n<h3>Scenario 10: Security<\/h3>\n<p><strong>Question Pattern<\/strong>: \"Encrypt data at rest and in transit...\"\n<strong>Answer<\/strong>: KMS (at rest) + SSL/TLS (in transit)<\/p>\n<h2>Key Mnemonics &amp; Memory Tricks<\/h2>\n<h3>EC2 Instance Types: <strong>CRAMFGPDI<\/strong><\/h3>\n<ul>\n<li><strong>C<\/strong>: Compute<\/li>\n<li><strong>R<\/strong>: RAM (memory)<\/li>\n<li><strong>A<\/strong>: ARM<\/li>\n<li><strong>M<\/strong>: Medium (general)<\/li>\n<li><strong>T<\/strong>: Tiny/Burstable<\/li>\n<li><strong>F<\/strong>: FPGA<\/li>\n<li><strong>G<\/strong>: GPU (graphics)<\/li>\n<li><strong>P<\/strong>: GPU (parallel)<\/li>\n<li><strong>D<\/strong>: Dense storage<\/li>\n<li><strong>I<\/strong>: I/O optimized<\/li>\n<\/ul>\n<h3>S3 Storage Classes: <strong>S-I-S-O-G³<\/strong><\/h3>\n<ul>\n<li><strong>S<\/strong>: Standard<\/li>\n<li><strong>I<\/strong>: Intelligent-Tiering<\/li>\n<li><strong>S<\/strong>: Standard-IA<\/li>\n<li><strong>O<\/strong>: One Zone-IA<\/li>\n<li><strong>G³<\/strong>: 3 Glacier types (Instant, Flexible, Deep Archive)<\/li>\n<\/ul>\n<h3>Route 53 Routing: <strong>SWLFGPM<\/strong><\/h3>\n<ul>\n<li><strong>S<\/strong>: Simple<\/li>\n<li><strong>W<\/strong>: Weighted<\/li>\n<li><strong>L<\/strong>: Latency<\/li>\n<li><strong>F<\/strong>: Failover<\/li>\n<li><strong>G<\/strong>: Geolocation<\/li>\n<li><strong>P<\/strong>: Geoproximity<\/li>\n<li><strong>M<\/strong>: Multi-value<\/li>\n<\/ul>\n<h3>Migration 6 R's: <strong>RRRRRT<\/strong><\/h3>\n<ul>\n<li><strong>R<\/strong>ehost<\/li>\n<li><strong>R<\/strong>eplatform<\/li>\n<li><strong>R<\/strong>epurchase<\/li>\n<li><strong>R<\/strong>efactor<\/li>\n<li><strong>R<\/strong>etire<\/li>\n<li><strong>R<\/strong>etain<\/li>\n<\/ul>\n<h2>Last-Minute Cheat Sheet<\/h2>\n<h3>Storage Decision Tree<\/h3>\n<ul>\n<li><strong>Object storage<\/strong>: S3<\/li>\n<li><strong>Block storage<\/strong>: EBS (single AZ) or EFS (multi-AZ)<\/li>\n<li><strong>File storage (Windows)<\/strong>: FSx for Windows<\/li>\n<li><strong>File storage (Linux)<\/strong>: EFS or FSx for Lustre<\/li>\n<li><strong>Archive<\/strong>: S3 Glacier<\/li>\n<\/ul>\n<h3>Database Decision Tree<\/h3>\n<ul>\n<li><strong>Relational + AWS managed<\/strong>: RDS or Aurora<\/li>\n<li><strong>NoSQL key-value<\/strong>: DynamoDB<\/li>\n<li><strong>Cache<\/strong>: ElastiCache (Redis or Memcached)<\/li>\n<li><strong>Data warehouse<\/strong>: Redshift<\/li>\n<li><strong>Graph<\/strong>: Neptune<\/li>\n<li><strong>Ledger<\/strong>: QLDB<\/li>\n<li><strong>Time-series<\/strong>: Timestream<\/li>\n<\/ul>\n<h3>Compute Decision Tree<\/h3>\n<ul>\n<li><strong>Traditional apps<\/strong>: EC2<\/li>\n<li><strong>Containers<\/strong>: ECS, EKS, Fargate<\/li>\n<li><strong>Serverless functions<\/strong>: Lambda<\/li>\n<li><strong>PaaS<\/strong>: Elastic Beanstalk<\/li>\n<li><strong>Batch processing<\/strong>: AWS Batch<\/li>\n<\/ul>\n<h3>Key Numbers to Remember<\/h3>\n<ul>\n<li><strong>S3<\/strong>: 5 TB max object, 11 nines durability<\/li>\n<li><strong>Lambda<\/strong>: 15 min max, 10 GB max memory<\/li>\n<li><strong>RDS<\/strong>: 1-35 days automated backup<\/li>\n<li><strong>DynamoDB<\/strong>: 400 KB max item<\/li>\n<li><strong>SQS<\/strong>: 256 KB max message, 14 days max retention<\/li>\n<li><strong>EC2<\/strong>: Spot 90% discount, Reserved 72% discount<\/li>\n<li><strong>VPC<\/strong>: 5 IPs reserved per subnet<\/li>\n<li><strong>CloudTrail<\/strong>: 90 days free in Event History<\/li>\n<li><strong>EBS<\/strong>: gp3 16K IOPS, io2 256K IOPS<\/li>\n<\/ul>\n<h2>Exam Day Tips<\/h2>\n<h3>Before the Exam<\/h3>\n<ul>\n<li>✅ Review this ultra-fast guide<\/li>\n<li>✅ Take practice exams (score 80%+ consistently)<\/li>\n<li>✅ Sleep well (8 hours)<\/li>\n<li>✅ Arrive 30 min early (or test internet for online)<\/li>\n<\/ul>\n<h3>During the Exam<\/h3>\n<ul>\n<li>✅ <strong>Read carefully<\/strong>: Every word matters<\/li>\n<li>✅ <strong>Flag for review<\/strong>: Don't get stuck (2 min max per question)<\/li>\n<li>✅ <strong>Eliminate wrong answers<\/strong>: Usually 2 are obviously wrong<\/li>\n<li>✅ <strong>Watch for keywords<\/strong>: \"most cost-effective\", \"least operational overhead\", \"highest availability\"<\/li>\n<li>✅ <strong>Time management<\/strong>: 2 min per question = 130 min total<\/li>\n<li>✅ <strong>Review flagged<\/strong>: Use remaining time<\/li>\n<\/ul>\n<h3>Common Traps<\/h3>\n<ul>\n<li>❌ <strong>Overthinking<\/strong>: Usually first instinct is correct<\/li>\n<li>❌ <strong>Ignoring keywords<\/strong>: \"cost-effective\" ≠ \"high-performance\"<\/li>\n<li>❌ <strong>Not reading all options<\/strong>: Answer D might be better<\/li>\n<li>❌ <strong>Assuming<\/strong>: Stick to what question says<\/li>\n<\/ul>\n<h2>Keywords to Watch<\/h2>\n<h3>Performance/Speed<\/h3>\n<ul>\n<li>\"<strong>Lowest latency<\/strong>\" → CloudFront, ElastiCache, DAX<\/li>\n<li>\"<strong>Real-time<\/strong>\" → Kinesis Streams, Lambda<\/li>\n<li>\"<strong>High IOPS<\/strong>\" → io1/io2, Instance Store<\/li>\n<li>\"<strong>Fast transfer<\/strong>\" → S3 Transfer Acceleration, DataSync<\/li>\n<\/ul>\n<h3>Cost<\/h3>\n<ul>\n<li>\"<strong>Most cost-effective<\/strong>\" → Spot, S3 Glacier, Serverless<\/li>\n<li>\"<strong>Optimize costs<\/strong>\" → Reserved, Savings Plans, Right-sizing<\/li>\n<li>\"<strong>Pay per use<\/strong>\" → Lambda, DynamoDB On-Demand<\/li>\n<\/ul>\n<h3>Availability/Reliability<\/h3>\n<ul>\n<li>\"<strong>High availability<\/strong>\" → Multi-AZ, Auto Scaling<\/li>\n<li>\"<strong>Disaster recovery<\/strong>\" → Backup, Multi-Region<\/li>\n<li>\"<strong>Durable<\/strong>\" → S3 (11 nines)<\/li>\n<\/ul>\n<h3>Security<\/h3>\n<ul>\n<li>\"<strong>Encrypt<\/strong>\" → KMS, SSL/TLS<\/li>\n<li>\"<strong>Least privilege<\/strong>\" → IAM policies, roles<\/li>\n<li>\"<strong>Audit<\/strong>\" → CloudTrail, Config<\/li>\n<\/ul>\n<h3>Operational<\/h3>\n<ul>\n<li>\"<strong>Least operational overhead<\/strong>\" → Managed services, Serverless<\/li>\n<li>\"<strong>Automate<\/strong>\" → Lambda, EventBridge, Step Functions<\/li>\n<li>\"<strong>No infrastructure<\/strong>\" → Serverless (Lambda, Fargate, Aurora Serverless)<\/li>\n<\/ul>\n<h2>Final Reminders<\/h2>\n<ul>\n<li>🎯 <strong>Read the question twice<\/strong> before answering<\/li>\n<li>🎯 <strong>Eliminate obviously wrong answers<\/strong> first<\/li>\n<li>🎯 <strong>Look for keywords<\/strong> (cost, performance, security)<\/li>\n<li>🎯 <strong>Don't overthink<\/strong> - it's not a trick<\/li>\n<li>🎯 <strong>AWS best practices<\/strong> usually win<\/li>\n<li>🎯 <strong>Managed &gt; Self-managed<\/strong> when in doubt<\/li>\n<li>🎯 <strong>Multi-AZ &gt; Single AZ<\/strong> for production<\/li>\n<li>🎯 <strong>Review flagged questions<\/strong> at the end<\/li>\n<\/ul>\n<h2>Good Luck! 🍀<\/h2>\n<p><strong>You've got this!<\/strong> Trust your preparation and stay calm. 💪<\/p>"}],"questions":[{"id":"fund-1","c":"fund","q":"<p>A company is deploying a new application on AWS and needs to ensure the highest level of availability and fault tolerance. The application must continue to operate even if an entire data center fails. Which AWS infrastructure component should be used?<\/p>","o":["Deploy across multiple Edge Locations","Deploy across multiple Availability Zones within a single Region","Deploy across multiple Regions","Deploy using AWS Local Zones"],"a":[1],"x":"<ul>\n<li>Availability Zones (AZs) are separate data centers within a Region<\/li>\n<li>Deploying across multiple AZs protects against data center failure<\/li>\n<li>This is the standard approach for high availability within a Region<\/li>\n<li>Option C (multiple Regions) is for disaster recovery, not just data center failure<\/li>\n<li>Edge Locations are for content delivery, not application hosting<\/li>\n<li>Local Zones are for ultra-low latency but don't provide the same fault tolerance<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Global Infrastructure, Well-Architected Framework - Reliability Pillar<\/p>","fixed":false},{"id":"fund-2","c":"fund","q":"<p>A solutions architect needs to design a solution that minimizes latency for users accessing static content globally. Which combination of AWS services should be used?<\/p>","o":["Amazon S3 with Cross-Region Replication","Amazon CloudFront with S3 as the origin","Amazon S3 with Transfer Acceleration","Multiple EC2 instances in different Regions"],"a":[1],"x":"<ul>\n<li>CloudFront is AWS's Content Delivery Network (CDN) with 400+ edge locations globally<\/li>\n<li>It caches content close to users, minimizing latency<\/li>\n<li>S3 serves as the origin for static content<\/li>\n<li>Option A provides redundancy but doesn't optimize latency<\/li>\n<li>Option C accelerates uploads, not downloads<\/li>\n<li>Option D is cost-ineffective and complex to manage<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudFront, Edge Locations, Global Infrastructure<\/p>","fixed":false},{"id":"fund-3","c":"fund","q":"<p>According to the AWS Shared Responsibility Model, which of the following is AWS's responsibility?<\/p>","o":["Encryption of data at rest in S3","Patch management of guest operating systems on EC2","Physical security of data centers","Configuration of security groups"],"a":[2],"x":"<ul>\n<li>AWS is responsible for \"Security OF the Cloud\" - physical infrastructure<\/li>\n<li>This includes data centers, hardware, and facilities<\/li>\n<li>Customers are responsible for \"Security IN the Cloud\"<\/li>\n<li>Options A, B, and D are all customer responsibilities<\/li>\n<li>Customers choose whether to encrypt, patch OS, and configure security<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Shared Responsibility Model<\/p>","fixed":false},{"id":"fund-4","c":"fund","q":"<p>A startup company wants to deploy an application without managing servers, operating systems, or runtime environments. Which AWS service category best fits this requirement?<\/p>","o":["Infrastructure as a Service (IaaS)","Platform as a Service (PaaS)","Software as a Service (SaaS)","Function as a Service (FaaS)"],"a":[1],"x":"<ul>\n<li>PaaS services (like Elastic Beanstalk) abstract infrastructure management<\/li>\n<li>Users deploy code without managing servers or OS<\/li>\n<li>IaaS (like EC2) requires managing virtual machines<\/li>\n<li>SaaS is fully managed applications (like Amazon Chime)<\/li>\n<li>FaaS (like Lambda) is event-driven, not for full applications typically<\/li>\n<li>PaaS is the best fit for deploying applications without infrastructure management<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Service Categories, Cloud Computing Models<\/p>","fixed":false},{"id":"fund-5","c":"fund","q":"<p>A company has regulatory requirements to ensure that data stored in AWS does not leave a specific geographic location. How can this be achieved?<\/p>","o":["Enable AWS GuardDuty","Choose the appropriate AWS Region and do not enable cross-region features","Use AWS Organizations with Service Control Policies","Enable AWS CloudTrail"],"a":[1],"x":"<ul>\n<li>Data in an AWS Region stays in that Region unless you explicitly configure otherwise<\/li>\n<li>No cross-region replication, backups, or data transfer ensures data residency<\/li>\n<li>GuardDuty is for threat detection, not data residency<\/li>\n<li>SCPs can enforce policies but the key is choosing the right Region<\/li>\n<li>CloudTrail is for logging, not data residency<\/li>\n<li>Primary control: select Region and don't configure cross-region services<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Regions, Data Sovereignty, Compliance<\/p>","fixed":false},{"id":"fund-6","c":"fund","q":"<p>Which pillar of the AWS Well-Architected Framework focuses on the ability to recover from failures and dynamically acquire computing resources to meet demand?<\/p>","o":["Operational Excellence","Security","Reliability","Performance Efficiency"],"a":[2],"x":"<ul>\n<li>Reliability pillar focuses on recovery from failures and maintaining workload functionality<\/li>\n<li>Key aspects: fault tolerance, disaster recovery, self-healing<\/li>\n<li>Operational Excellence focuses on operations and monitoring<\/li>\n<li>Security focuses on protecting information and systems<\/li>\n<li>Performance Efficiency focuses on using resources efficiently<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Well-Architected Framework - Reliability Pillar<\/p>","fixed":false},{"id":"fund-7","c":"fund","q":"<p>A company wants to estimate the cost of running their planned AWS infrastructure before deployment. Which AWS tool should they use?<\/p>","o":["AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator","AWS Cost and Usage Report"],"a":[2],"x":"<ul>\n<li>AWS Pricing Calculator estimates costs for planned architectures<\/li>\n<li>Cost Explorer analyzes existing/historical costs<\/li>\n<li>AWS Budgets sets budget alerts<\/li>\n<li>Cost and Usage Report provides detailed billing data<\/li>\n<li>For estimation BEFORE deployment, Pricing Calculator is correct<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Pricing Tools, Cost Management<\/p>","fixed":false},{"id":"fund-8","c":"fund","q":"<p>An application requires 15 milliseconds or less of latency for users in a specific metropolitan area. Which AWS infrastructure component should be used?<\/p>","o":["AWS Region","Availability Zone","AWS Local Zone","AWS Wavelength Zone"],"a":[2],"x":"<ul>\n<li>AWS Local Zones bring compute, storage, and database closer to end-users<\/li>\n<li>Designed for single-digit millisecond latency requirements<\/li>\n<li>Placed in metropolitan areas for ultra-low latency applications<\/li>\n<li>Wavelength Zones are for 5G edge computing<\/li>\n<li>Regular Regions/AZs may not meet ultra-low latency requirements<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Local Zones, Global Infrastructure<\/p>","fixed":false},{"id":"fund-9","c":"fund","q":"<p>Which AWS service provides a unified interface to manage multiple AWS accounts within an organization?<\/p>","o":["AWS IAM","AWS Organizations","AWS Control Tower","AWS Systems Manager"],"a":[1],"x":"<ul>\n<li>AWS Organizations centrally manages multiple AWS accounts<\/li>\n<li>Provides consolidated billing, account creation, and policy management<\/li>\n<li>IAM manages permissions within an account<\/li>\n<li>Control Tower sets up multi-account environments (uses Organizations underneath)<\/li>\n<li>Systems Manager manages AWS resources, not accounts<\/li>\n<li>Direct answer for multi-account management: Organizations<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Organizations, Account Management<\/p>","fixed":false},{"id":"fund-10","c":"fund","q":"<p>According to the AWS Well-Architected Framework, which design principle is recommended for the Security pillar?<\/p>","o":["Implement a strong identity foundation","Go global in minutes","Stop spending money on data center operations","Implement feedback loops"],"a":[0],"x":"<ul>\n<li>\"Implement a strong identity foundation\" is a Security pillar principle<\/li>\n<li>Includes: least privilege, separation of duties, centralized identity management<\/li>\n<li>Option B relates to global deployment (general AWS benefit)<\/li>\n<li>Option C is a cloud advantage, not security principle<\/li>\n<li>Option D relates to Operational Excellence pillar<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Well-Architected Framework - Security Pillar Design Principles<\/p>","fixed":false},{"id":"fund-11","c":"fund","q":"<p>A company wants to use AWS CLI to manage resources but wants to avoid embedding long-term credentials in their scripts. What is the BEST practice?<\/p>","o":["Use root account credentials","Create an IAM user and store credentials in the script","Use IAM roles with temporary security credentials","Use access keys without secret keys"],"a":[2],"x":"<ul>\n<li>IAM roles provide temporary security credentials via AWS STS<\/li>\n<li>Credentials rotate automatically, enhancing security<\/li>\n<li>Never use root account credentials for daily tasks<\/li>\n<li>Never hardcode credentials in scripts<\/li>\n<li>Access keys always require secret keys<\/li>\n<li>Best practice: IAM roles with temporary credentials<\/li>\n<\/ul>\n<p><strong>References:<\/strong> IAM Best Practices, AWS CLI Security<\/p>","fixed":false},{"id":"fund-12","c":"fund","q":"<p>Which of the following is a benefit of using AWS Regions? (Choose TWO)<\/p>","o":["Reduced latency for users in specific geographic areas","Automatic data replication across all Regions","Compliance with data sovereignty requirements","Lower costs compared to using a single Region","Automatic failover between Regions"],"a":[0,2],"x":"<ul>\n<li><strong>A is correct<\/strong>: Deploying in Regions closer to users reduces latency<\/li>\n<li><strong>C is correct<\/strong>: Regions enable meeting data residency/sovereignty requirements<\/li>\n<li>B is incorrect: Replication is NOT automatic, must be configured<\/li>\n<li>D is incorrect: Multiple Regions typically increase costs<\/li>\n<li>E is incorrect: Failover is NOT automatic, requires architecture design<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Regions, Global Infrastructure Benefits<\/p>","fixed":false},{"id":"fund-13","c":"fund","q":"<p>A solutions architect needs to design a system that follows the \"Design for Failure\" principle of the Well-Architected Framework. Which approach should be taken?<\/p>","o":["Use only the largest EC2 instance types to prevent failures","Design the application to handle component failures gracefully","Deploy all resources in a single Availability Zone for simplicity","Rely on AWS Support to handle all failures"],"a":[1],"x":"<ul>\n<li>\"Design for Failure\" means assuming components will fail and planning accordingly<\/li>\n<li>Applications should handle failures gracefully with retry logic, health checks, etc.<\/li>\n<li>Larger instances don't prevent failures<\/li>\n<li>Single AZ deployment increases failure risk<\/li>\n<li>You must design for failure, not rely solely on support<\/li>\n<li>Proper approach: graceful degradation, automatic recovery<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Well-Architected Framework - Reliability Pillar<\/p>","fixed":false},{"id":"fund-14","c":"fund","q":"<p>Which statement about AWS Edge Locations is correct?<\/p>","o":["Edge Locations are only used for CloudFront content delivery","There are fewer Edge Locations than Regions","Edge Locations can be used for both content delivery and edge computing","Edge Locations are the same as Availability Zones"],"a":[2],"x":"<ul>\n<li>Edge Locations support CloudFront (CDN), Lambda@Edge, and other edge services<\/li>\n<li>There are 400+ edge locations vs 30+ Regions<\/li>\n<li>Edge Locations ≠ Availability Zones (different purposes)<\/li>\n<li>Used for content delivery AND edge computing (Lambda@Edge, CloudFront Functions)<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Global Infrastructure - Edge Locations<\/p>","fixed":false},{"id":"fund-15","c":"fund","q":"<p>A company wants to receive alerts when their monthly AWS costs exceed a threshold. Which service should they use?<\/p>","o":["AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator","AWS Trusted Advisor"],"a":[1],"x":"<ul>\n<li>AWS Budgets allows setting custom cost/usage budgets with alerts<\/li>\n<li>Can send notifications via SNS when thresholds are exceeded<\/li>\n<li>Cost Explorer visualizes historical costs but doesn't send alerts<\/li>\n<li>Pricing Calculator estimates future costs<\/li>\n<li>Trusted Advisor provides best practice recommendations<\/li>\n<li>For threshold alerts: AWS Budgets<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Budgets, Cost Management<\/p>","fixed":false},{"id":"fund-16","c":"fund","q":"<p>According to the AWS Shared Responsibility Model, who is responsible for patching the underlying hypervisor for EC2 instances?<\/p>","o":["Customer","AWS","Both AWS and Customer","Third-party vendors"],"a":[1],"x":"<ul>\n<li>AWS manages the hypervisor layer (security OF the cloud)<\/li>\n<li>Customers manage guest OS patches (security IN the cloud)<\/li>\n<li>Hypervisor is infrastructure, AWS's responsibility<\/li>\n<li>Customer patches OS, applications, data encryption<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Shared Responsibility Model - EC2<\/p>","fixed":false},{"id":"fund-17","c":"fund","q":"<p>A company wants to deploy applications closer to 5G mobile users for ultra-low latency. Which AWS service should be used?<\/p>","o":["AWS Local Zones","AWS Wavelength","AWS Outposts","AWS Direct Connect"],"a":[1],"x":"<ul>\n<li>AWS Wavelength embeds compute at 5G network edge<\/li>\n<li>Provides single-digit millisecond latency to mobile devices<\/li>\n<li>Local Zones are for metro areas but not 5G-specific<\/li>\n<li>Outposts is for on-premises AWS infrastructure<\/li>\n<li>Direct Connect is for dedicated network connection<\/li>\n<li>For 5G mobile: Wavelength<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Wavelength, Edge Computing<\/p>","fixed":false},{"id":"fund-18","c":"fund","q":"<p>Which pillar of the AWS Well-Architected Framework includes the principle \"Stop guessing your capacity needs\"?<\/p>","o":["Cost Optimization","Performance Efficiency","Reliability","Operational Excellence"],"a":[1],"x":"<ul>\n<li>Performance Efficiency pillar includes capacity planning principles<\/li>\n<li>\"Stop guessing capacity\" - use Auto Scaling and elastic services<\/li>\n<li>Enables right-sizing and dynamic capacity adjustment<\/li>\n<li>Cost Optimization focuses on eliminating waste<\/li>\n<li>Reliability focuses on recovery and testing<\/li>\n<li>Operational Excellence focuses on running/monitoring<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Well-Architected Framework - Performance Efficiency Pillar<\/p>","fixed":false},{"id":"fund-19","c":"fund","q":"<p>A company has multiple development teams that need separate AWS accounts for isolation. They want consolidated billing. What should they implement?<\/p>","o":["AWS Control Tower","AWS Organizations with consolidated billing","Multiple IAM users in one account","AWS Resource Groups"],"a":[1],"x":"<ul>\n<li>AWS Organizations provides consolidated billing across multiple accounts<\/li>\n<li>Each team gets isolated account with separate resources<\/li>\n<li>Single bill for entire organization<\/li>\n<li>Control Tower helps set up Organizations but Organizations is the direct answer<\/li>\n<li>IAM users don't provide account-level isolation<\/li>\n<li>Resource Groups organize resources, not billing<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Organizations, Consolidated Billing<\/p>","fixed":false},{"id":"fund-20","c":"fund","q":"<p>What is the primary purpose of Availability Zones within an AWS Region?<\/p>","o":["To provide different pricing tiers","To enable fault tolerance and high availability","To support different AWS services","To reduce data transfer costs"],"a":[1],"x":"<ul>\n<li>Availability Zones are isolated locations within a Region<\/li>\n<li>Primary purpose: fault tolerance and high availability<\/li>\n<li>Each AZ has independent power, cooling, networking<\/li>\n<li>Deploying across AZs protects against single point of failure<\/li>\n<li>Not for pricing, service availability, or cost reduction<\/li>\n<li>Core purpose: resilience and availability<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Availability Zones, High Availability Architecture<\/p>","fixed":false},{"id":"fund-21","c":"fund","q":"<p>A company has 50 AWS accounts and wants to centrally manage billing and apply organization-wide security policies. Which AWS service should they use?<\/p>","o":["AWS IAM","AWS Organizations","AWS Control Tower","AWS Systems Manager"],"a":[1],"x":"<ul>\n<li><strong>AWS Organizations<\/strong> is the service for managing multiple AWS accounts<\/li>\n<li>Provides consolidated billing across all accounts<\/li>\n<li>Enables Service Control Policies (SCPs) for organization-wide policies<\/li>\n<li>Can create Organizational Units (OUs) for logical grouping<\/li>\n<li>Control Tower (C) is built on Organizations but is for automated setup<\/li>\n<li>IAM (A) is for user/role management within a single account<\/li>\n<li>Systems Manager (D) is for operations, not multi-account management<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Organizations, Multi-Account Strategy<\/p>","fixed":false},{"id":"fund-22","c":"fund","q":"<p>A security team wants to prevent all member accounts in their AWS Organization from creating resources in any region except us-east-1 and eu-west-1. How should this be implemented?<\/p>","o":["Create IAM policies in each account restricting regions","Use AWS Config rules to detect non-compliant resources","Create a Service Control Policy (SCP) denying actions in other regions","Use AWS Firewall Manager to block region access"],"a":[2],"x":"<ul>\n<li><strong>Service Control Policies (SCPs)<\/strong> provide centralized, preventive controls<\/li>\n<li>SCPs can restrict which AWS regions can be used<\/li>\n<li>Applied at the Organization, OU, or account level<\/li>\n<li>Cannot be overridden by users in member accounts<\/li>\n<li>IAM policies (A) can be changed by account administrators<\/li>\n<li>Config rules (B) are detective, not preventive<\/li>\n<li>Firewall Manager (D) is for security group/WAF rules, not region restrictions<\/li>\n<\/ul>\n<p><strong>SCP Example:<\/strong>\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Deny\",\n    \"Action\": \"*\",\n    \"Resource\": \"*\",\n    \"Condition\": {\n      \"StringNotEquals\": {\n        \"aws:RequestedRegion\": [\"us-east-1\", \"eu-west-1\"]\n      }\n    }\n  }]\n}<\/code><\/p>\n<p><strong>References:<\/strong> Service Control Policies, AWS Organizations, Region Restrictions<\/p>","fixed":false},{"id":"fund-23","c":"fund","q":"<p>Which of the following statements about Service Control Policies (SCPs) is TRUE?<\/p>","o":["SCPs grant permissions to users and roles","SCPs affect the management account in an AWS Organization","SCPs define maximum permissions for member accounts","SCPs can only be applied to individual accounts, not OUs"],"a":[2],"x":"<ul>\n<li><strong>SCPs define maximum permissions<\/strong> - they act as guardrails<\/li>\n<li>SCPs do NOT grant permissions (A is wrong)<\/li>\n<li>They only restrict what is possible<\/li>\n<li>SCPs do NOT affect the management account (B is wrong)<\/li>\n<li>SCPs can be applied to Organization root, OUs, or accounts (D is wrong)<\/li>\n<li>Effective permissions = IAM policy AND SCP<\/li>\n<\/ul>\n<p><strong>Key SCP Rules:<\/strong>\n- ❌ Don't grant permissions\n- ❌ Don't affect management account\n- ✅ Set maximum permission boundaries\n- ✅ Can be applied to OUs\n- ✅ Inherited down the hierarchy<\/p>\n<p><strong>References:<\/strong> Service Control Policies, Permission Boundaries<\/p>","fixed":false},{"id":"fund-24","c":"fund","q":"<p>A company wants to quickly set up a secure, multi-account AWS environment following best practices with automated account provisioning and pre-configured governance guardrails. Which service should they use?<\/p>","o":["AWS Organizations","AWS Control Tower","AWS CloudFormation StackSets","AWS Service Catalog"],"a":[1],"x":"<ul>\n<li><strong>AWS Control Tower<\/strong> provides automated multi-account setup<\/li>\n<li>Includes Landing Zone (well-architected baseline)<\/li>\n<li>Pre-configured guardrails (preventive and detective)<\/li>\n<li>Account Factory for automated provisioning<\/li>\n<li>Built on top of AWS Organizations<\/li>\n<li>AWS Organizations (A) requires manual setup<\/li>\n<li>CloudFormation StackSets (C) deploys templates, not governance<\/li>\n<li>Service Catalog (D) is for self-service IT resources<\/li>\n<\/ul>\n<p><strong>Control Tower Features:<\/strong>\n- ✅ Automated setup (minutes vs days)\n- ✅ Pre-built guardrails\n- ✅ Account Factory\n- ✅ Compliance dashboard\n- ✅ Integrated with Organizations, IAM Identity Center, CloudTrail<\/p>\n<p><strong>When to Use:<\/strong>\n- Quick setup with best practices\n- Less AWS expertise required\n- Want pre-built governance<\/p>\n<p><strong>When to Use Organizations Directly:<\/strong>\n- Need maximum flexibility\n- Have custom requirements\n- Experienced AWS team<\/p>\n<p><strong>References:<\/strong> AWS Control Tower, Landing Zone, Multi-Account Governance<\/p>","fixed":false},{"id":"fund-25","c":"fund","q":"<p>A company has a centralized networking account and wants to share VPC subnets with multiple application accounts without duplicating VPC infrastructure. Which AWS service enables this?<\/p>","o":["VPC Peering","AWS Transit Gateway","AWS Resource Access Manager (RAM)","AWS PrivateLink"],"a":[2],"x":"<ul>\n<li><strong>AWS Resource Access Manager (RAM)<\/strong> allows sharing resources across accounts<\/li>\n<li>Can share VPC subnets between accounts<\/li>\n<li>Resources remain in owner account, but accessible to shared accounts<\/li>\n<li>No need to duplicate VPCs<\/li>\n<li>VPC Peering (A) connects VPCs but doesn't share subnets<\/li>\n<li>Transit Gateway (B) connects networks but doesn't share subnets<\/li>\n<li>PrivateLink (D) is for service-to-VPC connectivity<\/li>\n<\/ul>\n<p><strong>Benefits of Subnet Sharing with RAM:<\/strong>\n- ✅ Centralized network management\n- ✅ Reduced VPC sprawl\n- ✅ Efficient IP address usage\n- ✅ Simplified network architecture\n- ✅ Lower operational overhead<\/p>\n<p><strong>Other Shareable Resources via RAM:<\/strong>\n- VPC Subnets (most common)\n- Transit Gateway attachments\n- Route 53 Resolver rules\n- License Manager configurations\n- Aurora DB clusters\n- Prefix lists<\/p>\n<p><strong>References:<\/strong> AWS Resource Access Manager, VPC Subnet Sharing, Centralized Networking<\/p>","fixed":false},{"id":"fund-26","c":"fund","q":"<p>A company uses AWS Organizations with consolidated billing. They notice they're receiving volume discounts on S3 storage even though no single account uses enough storage to qualify. Why?<\/p>","o":["AWS provides automatic discounts for Organizations","Consolidated billing combines usage across all accounts for volume pricing","The management account gets all the discounts","SCPs enable cost savings automatically"],"a":[1],"x":"<ul>\n<li><strong>Consolidated billing<\/strong> combines usage across all accounts<\/li>\n<li>AWS treats the entire organization as a single billing entity<\/li>\n<li>Volume discounts apply to combined usage<\/li>\n<li>Example: 3 accounts with 500GB each = 1500GB total → higher tier pricing<\/li>\n<li>Not automatic discounts (A), just usage aggregation<\/li>\n<li>All accounts benefit, not just management account (C)<\/li>\n<li>SCPs are for permissions, not costs (D)<\/li>\n<\/ul>\n<p><strong>Consolidated Billing Benefits:<\/strong>\n- ✅ Volume discounts across accounts\n- ✅ Single payment method\n- ✅ Easier cost tracking\n- ✅ Cost allocation tags across org\n- ✅ Reserved Instance sharing<\/p>\n<p><strong>References:<\/strong> AWS Organizations, Consolidated Billing, Volume Pricing<\/p>","fixed":false},{"id":"fund-27","c":"fund","q":"<p>Which AWS Organizations feature allows you to create policies that prevent accounts from leaving the organization?<\/p>","o":["IAM Policy","Service Control Policy (SCP)","Resource Control Policy","Organizational Lock"],"a":[1],"x":"<ul>\n<li><strong>Service Control Policies (SCPs)<\/strong> can prevent accounts from leaving<\/li>\n<li>SCP can deny the <code>organizations:LeaveOrganization<\/code> action<\/li>\n<li>Applied at Organization or OU level<\/li>\n<li>Cannot be overridden by member accounts<\/li>\n<\/ul>\n<p><strong>Example SCP:<\/strong>\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [{\n    \"Effect\": \"Deny\",\n    \"Action\": \"organizations:LeaveOrganization\",\n    \"Resource\": \"*\"\n  }]\n}<\/code><\/p>\n<p><strong>Other Preventive SCP Use Cases:<\/strong>\n- Prevent deletion of CloudTrail\n- Deny public S3 buckets\n- Restrict to approved instance types\n- Enforce encryption requirements\n- Restrict root user actions<\/p>\n<p><strong>References:<\/strong> Service Control Policies, Organization Governance<\/p>","fixed":false},{"id":"iam-1","c":"iam","q":"<p>An application running on Amazon EC2 instances needs to access objects in an Amazon S3 bucket. What is the MOST secure way to grant this access?<\/p>","o":["Create an IAM user with programmatic access and store the access keys on the EC2 instance","Create an IAM role with S3 permissions and attach it to the EC2 instance","Make the S3 bucket public and allow anonymous access","Use the root account credentials on the EC2 instance"],"a":[1],"x":"<ul>\n<li>IAM roles provide temporary security credentials that rotate automatically<\/li>\n<li>No need to manage or embed long-term credentials<\/li>\n<li>Most secure and AWS-recommended approach<\/li>\n<li>Option A: Access keys are long-term credentials, security risk if exposed<\/li>\n<li>Option C: Violates security best practices<\/li>\n<li>Option D: Never use root credentials for applications<\/li>\n<li><strong>Best Practice<\/strong>: Always use IAM roles for EC2 instances<\/li>\n<\/ul>\n<p><strong>References:<\/strong> IAM Roles, EC2 Instance Profiles, AWS Security Best Practices<\/p>","fixed":false},{"id":"iam-2","c":"iam","q":"<p>A company needs to grant temporary access to external auditors to review CloudTrail logs in S3. The access should expire after 7 days. What is the BEST solution?<\/p>","o":["Create IAM users for auditors and delete them after 7 days","Create IAM roles and provide auditors with temporary security credentials using AWS STS","Share the root account credentials for 7 days","Create an S3 pre-signed URL valid for 7 days"],"a":[1],"x":"<ul>\n<li>AWS STS (Security Token Service) generates temporary credentials<\/li>\n<li>IAM roles can be assumed by external users via federation<\/li>\n<li>Credentials automatically expire based on session duration<\/li>\n<li>Option A: Requires manual deletion, operational overhead<\/li>\n<li>Option C: Never share root credentials<\/li>\n<li>Option D: Pre-signed URLs work but IAM roles are more comprehensive<\/li>\n<li><strong>Best for temporary access<\/strong>: STS with IAM roles<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS STS, Temporary Security Credentials, Cross-Account Access<\/p>","fixed":false},{"id":"iam-3","c":"iam","q":"<p>A solutions architect is writing an IAM policy to deny access to all S3 buckets except one specific bucket named \"production-data\". Which policy element should be used?<\/p>\n<p><code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:*\",\n      \"Resource\": [\n        \"arn:aws:s3:::production-data\",\n        \"arn:aws:s3:::production-data/*\"\n      ]\n    },\n    {\n      \"Effect\": \"Deny\",\n      \"Action\": \"s3:*\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"StringNotEquals\": {\n          \"s3:ResourceAccount\": \"${aws:PrincipalAccount}\"\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<p>What is the correct approach?<\/p>","o":["Use Allow effect for the specific bucket only","Use Deny effect for all buckets except the one","Use both Allow for specific bucket and implicit Deny for others","Use resource-based policy on S3 bucket"],"a":[2],"x":"<ul>\n<li>IAM uses default Deny for all actions not explicitly allowed<\/li>\n<li>Allow access to \"production-data\" bucket explicitly<\/li>\n<li>All other buckets are implicitly denied<\/li>\n<li>No need for explicit Deny statement for other buckets<\/li>\n<li><strong>IAM Evaluation Logic<\/strong>: Explicit Deny &gt; Allow &gt; Implicit Deny<\/li>\n<li>Simpler policy: Just Allow the specific bucket<\/li>\n<\/ul>\n<p><strong>Correct Policy<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:*\",\n      \"Resource\": [\n        \"arn:aws:s3:::production-data\",\n        \"arn:aws:s3:::production-data/*\"\n      ]\n    }\n  ]\n}<\/code><\/p>\n<p><strong>References:<\/strong> IAM Policy Evaluation Logic, S3 IAM Policies<\/p>","fixed":false},{"id":"iam-4","c":"iam","q":"<p>A company has a requirement that all IAM users must use Multi-Factor Authentication (MFA) before they can delete any S3 objects. How can this be enforced?<\/p>","o":["Enable MFA Delete on the S3 bucket","Create an IAM policy with a condition requiring MFA","Use AWS Organizations Service Control Policies","Configure S3 bucket policy to require MFA"],"a":[1],"x":"<ul>\n<li>IAM policy condition <code>aws:MultiFactorAuthPresent<\/code> enforces MFA<\/li>\n<li>Can be applied to specific actions like <code>s3:DeleteObject<\/code><\/li>\n<\/ul>\n<p><strong>Example Policy<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"s3:DeleteObject\",\n      \"Resource\": \"arn:aws:s3:::my-bucket/*\",\n      \"Condition\": {\n        \"Bool\": {\n          \"aws:MultiFactorAuthPresent\": \"true\"\n        }\n      }\n    }\n  ]\n}<\/code><\/p>\n<ul>\n<li>Option A: MFA Delete protects versioning but requires bucket owner MFA<\/li>\n<li>Option C: SCPs can enforce but IAM policy is more direct<\/li>\n<li>Option D: Can work but IAM policy is standard approach<\/li>\n<\/ul>\n<p><strong>References:<\/strong> IAM Policy Conditions, MFA with IAM Policies<\/p>","fixed":false},{"id":"iam-5","c":"iam","q":"<p>A development team needs read-only access to all EC2 instances, but write access should only be granted during business hours (9 AM - 5 PM). How can this be implemented?<\/p>","o":["Use time-based IAM policy conditions","Manually attach/detach policies during business hours","Use AWS Lambda to modify IAM policies based on time","Create two separate IAM groups and move users between them"],"a":[0],"x":"<ul>\n<li>IAM supports time-based conditions using <code>aws:CurrentTime<\/code><\/li>\n<li>Can specify date/time ranges for policy evaluation<\/li>\n<\/ul>\n<p><strong>Example Policy<\/strong>:\n<code>json\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": \"ec2:*\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"DateGreaterThan\": {\"aws:CurrentTime\": \"2026-01-01T09:00:00Z\"},\n        \"DateLessThan\": {\"aws:CurrentTime\": \"2026-01-01T17:00:00Z\"}\n      }\n    },\n    {\n      \"Effect\": \"Allow\",\n      \"Action\": [\n        \"ec2:Describe*\",\n        \"ec2:Get*\",\n        \"ec2:List*\"\n      ],\n      \"Resource\": \"*\"\n    }\n  ]\n}<\/code><\/p>\n<ul>\n<li>Read-only access always allowed<\/li>\n<li>Write access only during specified hours<\/li>\n<li>Other options require manual intervention or complex automation<\/li>\n<\/ul>\n<p><strong>References:<\/strong> IAM Policy Conditions, Time-Based Access Control<\/p>","fixed":false},{"id":"iam-6","c":"iam","q":"<p>A company wants to allow users to change their own passwords but nothing else. Which AWS managed policy should be attached?<\/p>","o":["IAMFullAccess","IAMUserChangePassword","IAMReadOnlyAccess","PowerUserAccess"],"a":[1],"x":"<ul>\n<li><code>IAMUserChangePassword<\/code> is an AWS managed policy for self-service password changes<\/li>\n<li>Follows principle of least privilege<\/li>\n<li>Allows users to manage only their own passwords<\/li>\n<li>Option A: Too permissive, full IAM access<\/li>\n<li>Option C: Read-only, can't change passwords<\/li>\n<li
