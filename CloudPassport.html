rovides maximum savings<\/li>\n<li>Expected to run 2+ years, so 3-year commitment is justified<\/li>\n<li>On-Demand is most expensive<\/li>\n<li>Spot Instances can be interrupted<\/li>\n<li>1-year RI provides lower discount than 3-year<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Reserved Instances, Cost Optimization<\/p>","fixed":false},{"id":"cost-2","c":"cost","q":"<p>A company runs batch processing jobs that can be interrupted and resumed without data loss. The jobs run for 4-6 hours daily. What is the MOST cost-effective compute option?<\/p>","o":["On-Demand Instances","Reserved Instances","Spot Instances","Dedicated Hosts"],"a":[2],"x":"<ul>\n<li>Spot Instances provide up to 90% savings vs On-Demand<\/li>\n<li>Batch processing is fault-tolerant (can handle interruptions)<\/li>\n<li>Jobs can checkpoint and resume<\/li>\n<li>Perfect use case for Spot<\/li>\n<li>On-Demand is too expensive<\/li>\n<li>Reserved requires commitment (not needed for 4-6 hours daily)<\/li>\n<li>Dedicated Hosts are most expensive<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Spot Instances, Fault-Tolerant Workloads<\/p>","fixed":false},{"id":"cost-3","c":"cost","q":"<p>A solutions architect needs to reduce S3 storage costs for 500 TB of log data. Logs older than 30 days are rarely accessed but must be retained for 7 years for compliance. What should be done?<\/p>","o":["Keep all data in S3 Standard","Use S3 lifecycle policies to transition data to S3 Glacier Deep Archive after 30 days","Delete logs after 30 days","Use S3 Intelligent-Tiering for all data"],"a":[1],"x":"<ul>\n<li>S3 Glacier Deep Archive is cheapest storage class ($0.00099/GB/month)<\/li>\n<li>Lifecycle policies automatically transition objects<\/li>\n<li>Meets 7-year retention requirement<\/li>\n<li>Transition after 30 days when access becomes rare<\/li>\n<li>S3 Standard costs $0.023/GB/month (23x more expensive)<\/li>\n<li>Deleting violates compliance<\/li>\n<li>Intelligent-Tiering costs more than Glacier Deep Archive<\/li>\n<\/ul>\n<p><strong>Savings:<\/strong> 500 TB × ($0.023 - $0.00099) × 12 months = ~$132,000/year<\/p>\n<p><strong>References:<\/strong> S3 Lifecycle Policies, S3 Glacier Deep Archive<\/p>","fixed":false},{"id":"cost-4","c":"cost","q":"<p>An application uses a mix of EC2 instances (different families and sizes) across multiple regions, along with Fargate and Lambda. The usage is steady and predictable. Which pricing model provides the MOST flexibility and savings?<\/p>","o":["EC2 Reserved Instances","Compute Savings Plans","EC2 Instance Savings Plans","On-Demand Instances"],"a":[1],"x":"<ul>\n<li>Compute Savings Plans apply to EC2, Fargate, and Lambda<\/li>\n<li>Most flexible (any instance family, region, size)<\/li>\n<li>Up to 66% discount<\/li>\n<li>Automatically applies to eligible usage<\/li>\n<li>EC2 RIs only cover EC2, not Fargate/Lambda<\/li>\n<li>EC2 Instance Savings Plans limited to specific instance family<\/li>\n<li>On-Demand provides no discount<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Compute Savings Plans, Flexible Pricing<\/p>","fixed":false},{"id":"cost-5","c":"cost","q":"<p>A company wants to identify which EC2 instances are underutilized and could be downsized to reduce costs. Which AWS tool provides this recommendation?<\/p>","o":["AWS Budgets","AWS Cost Explorer with Right-Sizing Recommendations","AWS Trusted Advisor","Both B and C"],"a":[3],"x":"<ul>\n<li>Cost Explorer provides right-sizing recommendations<\/li>\n<li>Trusted Advisor also provides underutilized instance recommendations<\/li>\n<li>Both analyze CloudWatch metrics (CPU, memory, network)<\/li>\n<li>Both suggest smaller instance types and estimate savings<\/li>\n<li>Budgets sets spending limits but doesn't analyze utilization<\/li>\n<li>Using both tools provides comprehensive insights<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Cost Explorer, Trusted Advisor, Right-Sizing<\/p>","fixed":true},{"id":"cost-6","c":"cost","q":"<p>A development team runs EC2 instances Monday-Friday, 9 AM-6 PM. The instances sit idle outside business hours. What is the MOST cost-effective approach?<\/p>","o":["Use Reserved Instances","Use Spot Instances","Use Instance Scheduler to automatically stop instances outside business hours","Manually stop instances daily"],"a":[2],"x":"<ul>\n<li>Instance Scheduler automates start/stop based on schedules<\/li>\n<li>Running only 45 hours/week instead of 168 hours saves ~73%<\/li>\n<li>No manual intervention required<\/li>\n<li>Reserved Instances charge 24/7 whether running or not<\/li>\n<li>Spot Instances could be interrupted during work hours<\/li>\n<li>Manual stopping is error-prone and requires effort<\/li>\n<\/ul>\n<p><strong>Savings:<\/strong> Running 45/168 hours = 73% time savings<\/p>\n<p><strong>References:<\/strong> Instance Scheduler, Cost Optimization<\/p>","fixed":false},{"id":"cost-7","c":"cost","q":"<p>A company has multiple AWS accounts and wants to get volume discounts and consolidated billing. What should they implement?<\/p>","o":["AWS Budgets","AWS Cost Explorer","AWS Organizations with consolidated billing","AWS Marketplace"],"a":[2],"x":"<ul>\n<li>AWS Organizations enables consolidated billing<\/li>\n<li>Combines usage across all accounts for volume discounts<\/li>\n<li>Single bill for all accounts<\/li>\n<li>Shared Reserved Instances and Savings Plans<\/li>\n<li>Cost Explorer and Budgets are reporting tools<\/li>\n<li>Marketplace is for purchasing software<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Organizations, Consolidated Billing<\/p>","fixed":false},{"id":"cost-8","c":"cost","q":"<p>An application stores 1 PB of data in S3 with unpredictable access patterns. Some objects are accessed frequently, others rarely. What is the MOST cost-effective storage solution?<\/p>","o":["S3 Standard for all objects","S3 Intelligent-Tiering","Manually move objects to different storage classes","S3 Glacier for all objects"],"a":[1],"x":"<ul>\n<li>S3 Intelligent-Tiering automatically moves objects between access tiers<\/li>\n<li>Optimizes costs without manual intervention<\/li>\n<li>Monitoring fee: $0.0025/1000 objects<\/li>\n<li>No retrieval fees for Frequent/Infrequent tiers<\/li>\n<li>S3 Standard wastes money on infrequently accessed data<\/li>\n<li>Manual management is operationally intensive<\/li>\n<li>Glacier has retrieval delays for frequent access<\/li>\n<\/ul>\n<p><strong>References:<\/strong> S3 Intelligent-Tiering, Unknown Access Patterns<\/p>","fixed":false},{"id":"cost-9","c":"cost","q":"<p>A company wants to forecast their AWS costs for the next 6 months based on current usage trends. Which tool should they use?<\/p>","o":["AWS Budgets","AWS Cost Explorer with forecasting","AWS Trusted Advisor","AWS Cost and Usage Report"],"a":[1],"x":"<ul>\n<li>Cost Explorer provides cost forecasting up to 12 months<\/li>\n<li>Based on historical usage patterns<\/li>\n<li>Interactive graphs showing predictions<\/li>\n<li>80% confidence interval<\/li>\n<li>Budgets sets alerts but doesn't forecast<\/li>\n<li>Trusted Advisor provides recommendations<\/li>\n<li>Cost and Usage Report is for detailed analysis<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Cost Explorer, Cost Forecasting<\/p>","fixed":false},{"id":"cost-10","c":"cost","q":"<p>A company has 50 m5.large instances running continuously in us-east-1 with consistent usage. They want to purchase Reserved Instances. What type provides the highest discount?<\/p>","o":["Standard RI, 1-year, No Upfront","Standard RI, 3-year, All Upfront","Convertible RI, 3-year, All Upfront","Convertible RI, 1-year, Partial Upfront"],"a":[1],"x":"<ul>\n<li>Standard RIs provide higher discount than Convertible (up to 72%)<\/li>\n<li>3-year term provides higher discount than 1-year<\/li>\n<li>All Upfront payment provides highest discount<\/li>\n<li>Consistent usage makes 3-year commitment viable<\/li>\n<li>Convertible RIs have lower discount (up to 54%)<\/li>\n<li>Partial/No Upfront have lower discounts<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Reserved Instances, Discount Maximization<\/p>","fixed":false},{"id":"cost-11","c":"cost","q":"<p>An RDS database runs continuously but only needs Multi-AZ during business hours for high availability. How can costs be optimized?<\/p>","o":["This is not possible; Multi-AZ cannot be toggled","Disable Multi-AZ outside business hours, re-enable during business hours","Use Aurora Serverless","Use read replicas instead of Multi-AZ"],"a":[1],"x":"<ul>\n<li>Multi-AZ can be enabled/disabled (causes brief downtime)<\/li>\n<li>For non-production databases, can disable outside business hours<\/li>\n<li>Reduces costs by ~50% when disabled<\/li>\n<li>Can be scripted/automated with Lambda<\/li>\n<li>Aurora Serverless has different use case<\/li>\n<li>Read replicas don't provide automatic failover<\/li>\n<\/ul>\n<p><strong>Note:<\/strong> This is only suitable for non-production workloads<\/p>\n<p><strong>References:<\/strong> RDS Multi-AZ, Cost Optimization<\/p>","fixed":false},{"id":"cost-12","c":"cost","q":"<p>A company wants to track costs by department (Engineering, Marketing, Finance). How should they implement this?<\/p>","o":["Create separate AWS accounts for each department","Use Cost Allocation Tags and activate them in the Billing console","Use different regions for each department","Create separate VPCs for each department"],"a":[1],"x":"<ul>\n<li>Cost Allocation Tags enable tracking costs by custom dimensions<\/li>\n<li>Tag resources with \"Department\" key and values<\/li>\n<li>Activate tags in Billing console to appear in reports<\/li>\n<li>View costs grouped by department in Cost Explorer<\/li>\n<li>Separate accounts add management overhead<\/li>\n<li>Regions don't affect cost tracking<\/li>\n<li>VPCs don't enable cost tracking<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Cost Allocation Tags, Cost Tracking<\/p>","fixed":false},{"id":"cost-13","c":"cost","q":"<p>A Lambda function is configured with 3008 MB memory but only uses 512 MB. The function runs 10 million times per month. What should be done to optimize costs?<\/p>","o":["Increase memory to 10 GB","Reduce memory allocation to 512 MB","Switch to EC2","Keep current configuration"],"a":[1],"x":"<ul>\n<li>Lambda charges based on GB-seconds (memory × duration)<\/li>\n<li>Allocating 3008 MB when only 512 MB is used wastes money<\/li>\n<li>Reducing to 512 MB reduces costs ~6x<\/li>\n<li>Right-sizing memory is critical for Lambda cost optimization<\/li>\n<li>Increasing memory increases costs<\/li>\n<li>EC2 adds operational overhead<\/li>\n<li>Current configuration is wasteful<\/li>\n<\/ul>\n<p><strong>Calculation:<\/strong> 3008 MB vs 512 MB = 5.86x cost reduction<\/p>\n<p><strong>References:<\/strong> Lambda Pricing, Right-Sizing<\/p>","fixed":false},{"id":"cost-14","c":"cost","q":"<p>A company has Reserved Instances that are expiring soon. They want to know if they should renew. Which Cost Explorer feature helps with this decision?<\/p>","o":["Cost forecasting","Reserved Instance Utilization report","Right-sizing recommendations","Savings Plans recommendations"],"a":[1],"x":"<ul>\n<li>RI Utilization report shows how much Reserved capacity is used<\/li>\n<li>High utilization (&gt;80%) indicates RI should be renewed<\/li>\n<li>Low utilization suggests downsizing or not renewing<\/li>\n<li>Also shows RI Coverage (what % of usage is covered)<\/li>\n<li>Cost forecasting predicts future costs<\/li>\n<li>Right-sizing is for instance size optimization<\/li>\n<li>Savings Plans recommendations compare to RIs<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Reserved Instance Utilization, Cost Explorer<\/p>","fixed":false},{"id":"cost-15","c":"cost","q":"<p>Data transfer costs are high for a web application serving static content globally. How can data transfer costs be reduced?<\/p>","o":["Use S3 Transfer Acceleration","Use CloudFront as a CDN","Move data to Glacier","Use larger EC2 instances"],"a":[1],"x":"<ul>\n<li>CloudFront reduces data transfer from origin<\/li>\n<li>Caches content at edge locations globally<\/li>\n<li>Data transfer from CloudFront to users is cheaper than from EC2/S3<\/li>\n<li>Free data transfer from S3/EC2 to CloudFront<\/li>\n<li>S3 Transfer Acceleration accelerates uploads, doesn't reduce costs<\/li>\n<li>Glacier is for archival, not active content<\/li>\n<li>Instance size doesn't affect transfer costs<\/li>\n<\/ul>\n<p><strong>References:<\/strong> CloudFront, Data Transfer Costs<\/p>","fixed":false},{"id":"cost-16","c":"cost","q":"<p>A company wants to set a budget of $10,000/month and receive alerts at 80% and 100% of budget. Which service should be used?<\/p>","o":["AWS Cost Explorer","AWS Budgets","CloudWatch Alarms","AWS Trusted Advisor"],"a":[1],"x":"<ul>\n<li>AWS Budgets creates custom cost and usage budgets<\/li>\n<li>Set thresholds (80%, 100%) for alerts<\/li>\n<li>Sends SNS notifications when thresholds are exceeded<\/li>\n<li>Can set monthly, quarterly, or annual budgets<\/li>\n<li>Cost Explorer analyzes costs but doesn't alert<\/li>\n<li>CloudWatch monitors resources, not costs<\/li>\n<li>Trusted Advisor provides recommendations<\/li>\n<\/ul>\n<p><strong>References:<\/strong> AWS Budgets, Cost Alerts<\/p>","fixed":false},{"id":"cost-17","c":"cost","q":"<p>A company has a mix of Convertible and Standard Reserved Instances. They want to change instance families due to application changes. Which RIs can be modified?<\/p>","o":["Only Standard RIs","Only Convertible RIs","Both can be modified","Neither can be modified"],"a":[1],"x":"<ul>\n<li>Convertible RIs can change instance family, OS, and tenancy<\/li>\n<li>Provides flexibility for changing requirements<\/li>\n<li>Standard RIs cannot change instance family<\/li>\n<li>Standard RIs can only change instance size within same family<\/li>\n<li>Trade-off: Convertible RIs have lower discount (54% vs 72%)<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Reserved Instances, Convertible vs Standard<\/p>","fixed":false},{"id":"cost-18","c":"cost","q":"<p>A database requires 3000 IOPS consistently. Currently using GP3 with 16,000 IOPS provisioned. What should be done to optimize costs?<\/p>","o":["Switch to GP2","Reduce provisioned IOPS to 3000 on GP3","Switch to Magnetic storage","Keep current configuration"],"a":[1],"x":"<ul>\n<li>GP3 allows independent provisioning of IOPS<\/li>\n<li>Reduce from 16,000 to 3,000 IOPS to reduce costs<\/li>\n<li>Still provides required performance<\/li>\n<li>GP2 IOPS scale with volume size (less flexible)<\/li>\n<li>Magnetic storage has unpredictable performance<\/li>\n<li>Current configuration over-provisions by 5x<\/li>\n<\/ul>\n<p><strong>References:<\/strong> EBS GP3, Cost Optimization<\/p>","fixed":false},{"id":"cost-19","c":"cost","q":"<p>A company wants to identify unused EBS volumes and old snapshots to reduce costs. Which tools can help?<\/p>","o":["AWS Trusted Advisor only","AWS Cost Explorer only","Both Trusted Advisor and custom scripts/AWS Config","AWS Budgets"],"a":[2],"x":"<ul>\n<li>Trusted Advisor identifies unattached EBS volumes<\/li>\n<li>Custom scripts can identify old snapshots<\/li>\n<li>AWS Config Rules can detect unattached volumes<\/li>\n<li>Combine multiple approaches for comprehensive cleanup<\/li>\n<li>Cost Explorer shows costs but doesn't identify unused resources<\/li>\n<li>Budgets sets limits but doesn't identify waste<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Trusted Advisor, Resource Cleanup<\/p>","fixed":false},{"id":"cost-20","c":"cost","q":"<p>A company runs a web application with unpredictable traffic that can spike 10x instantly. They want to minimize costs while ensuring performance. What architecture should be used?<\/p>","o":["Fixed number of EC2 On-Demand instances","EC2 Auto Scaling with target tracking + Spot Instances","Large Reserved Instances","Manual scaling with CloudWatch alarms"],"a":[1],"x":"<ul>\n<li>Auto Scaling automatically adjusts capacity based on demand<\/li>\n<li>Target tracking scales based on metrics (CPU, requests, etc.)<\/li>\n<li>Spot Instances reduce costs (up to 90%) for scale-out capacity<\/li>\n<li>Can combine On-Demand (baseline) + Spot (spikes)<\/li>\n<li>Fixed capacity wastes money during low traffic<\/li>\n<li>Reserved Instances charge for capacity even if unused<\/li>\n<li>Manual scaling is slow and error-prone<\/li>\n<\/ul>\n<p><strong>References:<\/strong> Auto Scaling, Spot Instances, Cost Optimization<\/p>","fixed":false},{"id":"mixed-1","c":"mixed","q":"<p>An Auto Scaling group isn't responding to CloudWatch alarms despite the alarm firing. What's the most likely cause?<\/p>","o":["Wrong CloudWatch metric configured","The Auto Scaling group is in cooldown period","Minimum size of ASG is 0","Desired size of ASG is 0"],"a":[1],"x":"<p>Cooldown periods suppress scaling actions to let metrics stabilize after a scaling event.<\/p>","fixed":false},{"id":"mixed-2","c":"mixed","q":"<p>You need to upgrade one EC2 instance in an ASG without receiving traffic. What should you do?<\/p>","o":["Hibernate the instance","Use cooldown timers","Put instance in Standby, upgrade, return to InService","Use lifecycle hooks"],"a":[2],"x":"<p>Standby detaches from load balancing while retaining in ASG, preventing replacement.<\/p>\n<hr />\n<h2>Storage &amp; Data Management<\/h2>","fixed":false},{"id":"mixed-3","c":"mixed","q":"<p>How do you achieve WORM (Write Once Read Many) in S3?<\/p>","o":["Enable versioning","Enable Object Lock at bucket creation","Use S3 Glacier","Configure bucket policy"],"a":[1],"x":"<p>Object Lock enforces WORM with retention periods; must be enabled at bucket creation.<\/p>","fixed":false},{"id":"mixed-4","c":"mixed","q":"<p>After deleting an S3 object (no versioning), what do you see immediately in a list-objects call?<\/p>","o":["Object still appears","Object is deleted","May appear or not depending on consistency","Object has a delete marker"],"a":[1],"x":"<p>S3 provides strong consistency; object disappears immediately after successful delete.<\/p>\n<hr />\n<h2>Networking<\/h2>","fixed":false},{"id":"mixed-5","c":"mixed","q":"<p>What VPC feature provides private connectivity to S3 and DynamoDB without cost?<\/p>","o":["NAT Gateway","VPC Peering","Gateway Endpoints","Interface Endpoints"],"a":[2],"x":"<p>Gateway endpoints for S3/DynamoDB are free and route-table based.<\/p>","fixed":false},{"id":"mixed-6","c":"mixed","q":"<p>Internet-facing ALB requests fail despite healthy targets. What's likely wrong?<\/p>","o":["ALB subnet route table lacks IGW route","Targets in public subnet","ALB has no Elastic IP","Cross-zone LB disabled"],"a":[0],"x":"<p>ALB must be in public subnets with 0.0.0.0/0 → IGW route.<\/p>\n<hr />\n<h2>Databases<\/h2>","fixed":false},{"id":"mixed-7","c":"mixed","q":"<p>Your read-heavy app hits 100% CPU on RDS. What helps scale reads? (Choose 3)<\/p>","o":["Add Read Replicas","Enable Storage Auto Scaling","Use SQS to throttle","Use ElastiCache","Shard across multiple RDS instances","Enable Multi-AZ"],"a":[0,3,4],"x":"<p>Read replicas, caching, and sharding all reduce read load on primary.<\/p>","fixed":false},{"id":"mixed-8","c":"mixed","q":"<p>Multi-AZ RDS deployment provides:<\/p>","o":["Read scaling","Automatic failover for high availability","Cross-region disaster recovery","Cost optimization"],"a":[1],"x":"<p>Multi-AZ maintains synchronous standby for automatic failover, not for reads.<\/p>\n<hr />\n<h2>Serverless &amp; Containers<\/h2>","fixed":false},{"id":"mixed-9","c":"mixed","q":"<p>Lambda needs to write CloudWatch Logs. Which permissions required? (Choose 3)<\/p>","o":["logs:CreateLogGroup","logs:GetLogEvents","logs:CreateLogStream","logs:DescribeLogStreams","logs:PutLogEvents"],"a":[0,2,4],"x":"<p>Lambda runtime needs all three to create log groups, streams, and write events.<\/p>","fixed":false},{"id":"mixed-10","c":"mixed","q":"<p>Which ECS networking mode provides task-level security groups?<\/p>","o":["Host","Bridge","awsvpc","Default"],"a":[2],"x":"<p>awsvpc gives each task its own ENI, enabling task-level security groups.<\/p>\n<hr />\n<h2>Security<\/h2>","fixed":false},{"id":"mixed-11","c":"mixed","q":"<p>How do you restrict S3 bucket access to specific IAM roles only?<\/p>","o":["Bucket policy with explicit deny for all except listed roles","Bucket policy with explicit deny for all users except listed","Bucket policy allowing only specific role; users assume role","Bucket policy with NotPrincipal"],"a":[2],"x":"<p>Grant bucket access to a role; users authenticate then assume that role.<\/p>","fixed":false},{"id":"mixed-12","c":"mixed","q":"<p>CloudFront serves private content from S3. How do you grant access to multiple files?<\/p>","o":["S3 pre-signed URLs","CloudFront signed URLs","CloudFront signed cookies","CloudFront geo restrictions"],"a":[2],"x":"<p>Signed cookies grant access to multiple objects without changing URLs.<\/p>\n<hr />\n<h2>Cost Optimization<\/h2>","fixed":false},{"id":"mixed-13","c":"mixed","q":"<p>Which services identify underutilized EC2 instances? (Choose 2)<\/p>","o":["CloudWatch","SNS","Trusted Advisor","CloudTrail","Config"],"a":[0,2],"x":"<p>CloudWatch metrics and Trusted Advisor checks identify low-utilization instances.<\/p>","fixed":false},{"id":"mixed-14","c":"mixed","q":"<p>Most cost-effective connectivity for small vendor team to VPC databases?<\/p>","o":["AWS Client VPN","Direct Connect","Site-to-Site VPN to VGW","Site-to-Site VPN to Transit Gateway"],"a":[0],"x":"<p>Client VPN provides user-level auth, pay-as-you-go pricing, minimal setup.<\/p>\n<hr />\n<h2>Architecture Patterns<\/h2>","fixed":false},{"id":"mixed-15","c":"mixed","q":"<p>Serverless media processing pipeline with visual workflow and priority queues?<\/p>","o":["S3 → Lambda → SQS → DynamoDB","S3 → Lambda → SWF → DynamoDB","S3 → Lambda → process → DynamoDB","S3 → Lambda → Step Functions → DynamoDB"],"a":[3],"x":"<p>Step Functions orchestrates with visual console, priority via separate entry points.<\/p>\n<hr />\n<p><em>Practice these scenarios until you can explain each answer confidently!<\/em><\/p>","fixed":false}]};</script>
<script>
"use strict";
const BANK = window.BANK;
const CH = Object.fromEntries(BANK.chapters.map((c, i) => [c.id, { ...c, n: i + 1 }]));
const Q = Object.fromEntries(BANK.questions.map(q => [q.id, q]));
const ALL = BANK.questions;
const byCh = id => ALL.filter(q => q.c === id);

/* ---------- Storage (per device) ---------- */
const KEY = "cloudpassport.v1";
const fresh = () => ({ p: {}, days: {}, exams: [], goal: 20 });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = { ...fresh(), ...JSON.parse(raw) }; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- Smart repetition (ported from Studiepass lib/repetition.ts) ---------- */
const DAY = 864e5, INTERVAL = [0, 1, 3, 7, 14, 30], MAXBOX = 5;
const now = () => Date.now();
const today = () => new Date().toLocaleDateString("sv-SE");
function record(id, ok, t = now()) {
  const prev = S.p[id];
  const box = ok ? Math.min((prev?.box ?? 0) + 1, MAXBOX) : 0;
  S.p[id] = { box, due: t + INTERVAL[box] * DAY, seen: (prev?.seen ?? 0) + 1, right: (prev?.right ?? 0) + (ok ? 1 : 0), ever: !!prev?.ever || ok, last: ok, at: t };
  S.days[today()] = (S.days[today()] || 0) + 1;
  save();
}
const isDue = p => p && p.due <= now();
const dueIds = () => ALL.filter(q => isDue(S.p[q.id])).map(q => q.id);

/* Readiness (ported from lib/readiness.ts; 4–5 options so a blind guess ≈ 0.25) */
const BOX_MASTERY = [0, .4, .6, .8, 1, 1], BOX_CHANCE = [.35, .55, .7, .8, .9, .95], GUESS = .25;
function chance(p) { if (!p) return GUESS; let b = Math.min(p.box, 5); if (b > 0 && now() > p.due + INTERVAL[b] * DAY) b--; return BOX_CHANCE[b]; }
const started = qs => qs.filter(q => S.p[q.id]).length;
const expected = (qs = ALL) => qs.reduce((a, q) => a + chance(S.p[q.id]), 0) / (qs.length || 1);
const mastery = qs => Math.round(qs.reduce((a, q) => a + (S.p[q.id] ? BOX_MASTERY[S.p[q.id].box] : 0), 0) / (qs.length || 1) * 100);
const scaled = share => Math.round(100 + 900 * share);   // estimate of AWS 100–1000 scale
function streak() { let n = 0; const d = new Date(); if (!S.days[today()]) d.setDate(d.getDate() - 1); while (S.days[d.toLocaleDateString("sv-SE")]) { n++; d.setDate(d.getDate() - 1); } return n; }

/* Weak-area picking: due & wrong first, then unseen, then lowest box; chapters with low mastery weigh more. */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }
function weakScore(q) {
  const p = S.p[q.id];
  if (!p) return 2 + Math.random();
  if (isDue(p)) return (p.last ? 3 : 5) - p.box * .3 + Math.random();
  return 1 - p.box * .2 + Math.random() * .5;
}
const pickWeak = (qs, n) => qs.slice().sort((a, b) => weakScore(b) - weakScore(a)).slice(0, n).map(q => q.id);
function pickExam(n) {
  // spread across chapters in proportion to the bank, random within each
  const ids = [];
  const chs = BANK.chapters.filter(c => c.count);
  chs.forEach(c => { const k = Math.round(n * c.count / ALL.length); ids.push(...shuffle(byCh(c.id)).slice(0, k).map(q => q.id)); });
  const rest = shuffle(ALL.filter(q => !ids.includes(q.id)).map(q => q.id));
  while (ids.length < n) ids.push(rest.pop());
  return shuffle(ids.slice(0, n));
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const L = "ABCDEF";
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
function stampSVG(c, label, sub, strength = 1) {
  return `<svg class="stamp" viewBox="0 0 120 120" style="opacity:${strength};transform:rotate(-8deg)" aria-hidden="true">
  <circle cx="60" cy="60" r="54" fill="none" stroke="${c}" stroke-width="4"/><circle cx="60" cy="60" r="46" fill="none" stroke="${c}" stroke-width="1.5"/>
  <path id="arc${label}" d="M22,60 a38,38 0 1,1 76,0" fill="none"/>
  <text font-family="Space Mono,monospace" font-weight="700" font-size="11" fill="${c}" letter-spacing="2"><textPath href="#arc${label}" startOffset="50%" text-anchor="middle">${esc(label)}</textPath></text>
  <text x="60" y="72" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="26" fill="${c}">${esc(sub)}</text></svg>`;
}
function ring(pct, color, size = 150, label = "") {
  const ticks = 49, on = Math.round(ticks * pct / 100); let s = "";
  for (let i = 0; i < ticks; i++) { const a = (i / ticks) * 2 * Math.PI - Math.PI / 2, r1 = size / 2 - 14, r2 = size / 2 - 4; s += `<line x1="${size / 2 + r1 * Math.cos(a)}" y1="${size / 2 + r1 * Math.sin(a)}" x2="${size / 2 + r2 * Math.cos(a)}" y2="${size / 2 + r2 * Math.sin(a)}" stroke="${i < on ? color : "var(--paper2)"}" stroke-width="3" stroke-linecap="round"/>`; }
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct}%">${s}<text x="50%" y="50%" dy="8" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="${size / 5}" fill="var(--text)">${label || pct + "%"}</text></svg>`;
}
const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8.5 16h7"/></svg>',
  practice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M15 7v10" stroke-dasharray="2 2"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9" stroke-dasharray="3 2"/><path d="m8 12 3 3 5-6"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>',
  x: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
};

/* ---------- Router ---------- */
let view = { name: "home" };
let session = null, timerId = null;
function go(name, arg) { view = { name, arg }; render(); window.scrollTo(0, 0); }
function renderTabs() {
  const hide = view.name === "quiz" || view.name === "result";
  $("#tabs").style.display = hide ? "none" : "";
  const due = dueIds().length;
  const t = [["home", "Passport"], ["practice", "Practice"], ["stats", "Stats"], ["more", "Data"]];
  $("#tabs").innerHTML = `<div class="in">${t.map(([k, l]) => `<button class="tab ${view.name === k || (k === "home" && view.name === "chapter") ? "on" : ""}" data-tab="${k}">${ICON[k]}${l}${k === "practice" && due ? `<span class="badge">${due > 99 ? "99+" : due}</span>` : ""}</button>`).join("")}</div>`;
}
function render() {
  if (view.name !== "quiz") clearInterval(timerId);
  const v = { home: Home, practice: Practice, stats: Stats, more: More, chapter: Chapter, quiz: Quiz, result: Result }[view.name];
  $("#app").innerHTML = v(view.arg);
  renderTabs();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tab],[data-go],[data-start],[data-act]");
  if (!b) return;
  if (b.dataset.tab) return go(b.dataset.tab);
  if (b.dataset.go) return go(b.dataset.go, b.dataset.arg);
  if (b.dataset.start) return start(b.dataset.start, b.dataset.arg);
  ACT[b.dataset.act]?.(b);
});

/* ---------- Home ---------- */
function nextChapter() {
  return BANK.chapters.filter(c => c.count).find(c => mastery(byCh(c.id)) < 80) || BANK.chapters[0];
}
function Home() {
  const goalDone = S.days[today()] || 0, due = dueIds().length, ready = started(ALL) ? scaled(expected()) : null;
  const nc = nextChapter(), ncq = byCh(nc.id), ncm = mastery(ncq);
  const visas = BANK.chapters.filter(c => c.count).map(c => {
    const qs = byCh(c.id), m = mastery(qs), st = started(qs);
    const stamp = m >= 80 ? stampSVG(c.color, "PASSED · CH " + CH[c.id].n, "✓") : st ? stampSVG(c.color, "IN PROGRESS", m + "%", .25 + m / 130) : `<div class="stamp empty">NOT<br>STAMPED</div>`;
    return `<button class="visa" data-go="chapter" data-arg="${c.id}"><div class="top"><span>VISA ${String(CH[c.id].n).padStart(2, "0")}</span><span>${c.count} Q</span></div>${stamp}<h3>${esc(c.title)}</h3><div class="meta">${st} of ${c.count} · ${m}%</div><div class="bar3"><i style="width:${m}%;background:${c.color}"></i></div></button>`;
  }).join("");
  return `<header class="cover"><div class="kicker">SAA-C03 · Study passport</div><h1>Cloud Passport</h1><p>Solutions Architect Associate, one stamp at a time.</p>
  <div class="chips"><div class="chip"><b>${streak()}</b><span>Day streak</span></div>
  <div class="chip"><b>${Math.min(goalDone, S.goal)}/${S.goal}</b><span>Today</span><div class="bar"><i style="width:${Math.min(100, goalDone / S.goal * 100)}%"></i></div></div>
  <div class="chip"><b>${ready ?? "–"}</b><span>Est. score</span></div></div></header>
  <section class="card next">${due ? `<div class="eyebrow">Due for review</div><h2>${due} question${due > 1 ? "s" : ""} to repeat</h2><p>Missed and fading questions come back here first. Clear these before new material.</p><button class="btn primary" data-start="review">Start review</button>`
    : `<div class="eyebrow">Next stamp · Ch ${CH[nc.id].n} of ${BANK.chapters.filter(c => c.count).length}</div><h2>${esc(nc.title)}</h2><p>${started(ncq) ? `${ncm}% mastered. Keep going until it reaches 80% to earn the stamp.` : "Read the 2-minute cheat sheet, then do a quick 10."}</p><div class="row"><button class="btn soft" data-go="chapter" data-arg="${nc.id}">Open</button><button class="btn primary" data-start="chapter" data-arg="${nc.id}">${started(ncq) ? "Continue" : "Start"}</button></div>`}</section>
  <div class="section"><h2>Visa pages</h2><span class="mono">${ALL.length} questions</span></div>
  <div class="visas">${visas}</div>`;
}

/* ---------- Chapter ---------- */
function Chapter(id) {
  const c = CH[id], qs = byCh(id), m = mastery(qs);
  return `<div class="page-head"><button class="btn ghost" style="width:auto;padding:0;justify-content:flex-start" data-tab="home">‹ Passport</button><div class="kicker" style="color:${c.color}">Chapter ${c.n} · ${c.count} questions</div><h1>${esc(c.title)}</h1><p>${started(qs)} answered · ${m}% mastered · ${qs.filter(q => isDue(S.p[q.id])).length} due</p></div>
  <div class="wrap" style="margin-top:14px"><div class="row"><button class="btn primary" data-start="chapter" data-arg="${id}">Quick 10</button><button class="btn soft" data-start="chaptertest" data-arg="${id}">Chapter test (${Math.min(20, c.count)})</button></div></div>
  ${c.lesson ? `<div class="section"><h2>Cheat sheet</h2><span class="mono">2–5 min</span></div><div class="wrap"><div class="card lesson">${c.lesson}</div></div>` : ""}`;
}

/* ---------- Practice ---------- */
function ticket({ color, kicker, title, desc, fields, n, start, arg, label = "START" }) {
  return `<button class="ticket" style="--tc:${color}" data-start="${start}" ${arg ? `data-arg="${arg}"` : ""}><div class="body"><div class="kicker">${kicker}</div><h3>${title}</h3><p>${desc}</p><div class="fields">${fields.map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join("")}</div></div><div class="stub"><b>${n}</b><span>${label}</span></div></button>`;
}
function Practice() {
  const due = dueIds().length, last = S.exams[0];
  const boxes = [0, 1, 2, 3, 4, 5].map(b => ALL.filter(q => S.p[q.id]?.box === b).length);
  const nextDue = ALL.map(q => S.p[q.id]).filter(p => p && !isDue(p)).sort((a, b) => a.due - b.due)[0];
  return `<div class="page-head"><div class="eyebrow">Practice</div><h1>Pick a ticket</h1><p>Practice shows the answer straight away. Exams hide it until you submit.</p></div>
  <div class="section"><h2>Smart repetition</h2><span class="mono">${due} due</span></div>
  <div class="wrap"><div class="card"><div class="boxes">${boxes.map((n, i) => `<div><b>${n}</b><span>BOX ${i}<br>${INTERVAL[i]}D</span></div>`).join("")}</div>
  <p class="note" style="margin:12px 0">A wrong answer drops a question to box 0 so it comes back today. Right answers move it up: 1, 3, 7, 14, then 30 days.${!due && nextDue ? ` Next due ${new Date(nextDue.due).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" })}.` : ""}</p>
  <button class="btn primary" data-start="${due ? "review" : "weak"}">${due ? `Review ${Math.min(due, 20)} due` : "Practice weak spots"}</button></div></div>
  <div class="section"><h2>Exams</h2></div>
  ${ticket({ color: "#5A1424", kicker: "Full mock · like the real thing", title: "Mock exam", desc: "65 questions across all chapters. Pass mark 720 (estimated scale).", fields: [["Questions", 65], ["Time", "130 min"], ["Best", S.exams.filter(e => e.n === 65).reduce((a, e) => Math.max(a, e.score), 0) || "–"]], n: 65, start: "exam", arg: "65" })}
  ${ticket({ color: "#2449A6", kicker: "Half mock", title: "Half exam", desc: "Same pace as the real exam, half the length.", fields: [["Questions", 30], ["Time", "60 min"], ["Last", last ? last.score : "–"]], n: 30, start: "exam", arg: "30" })}
  ${ticket({ color: "#0F6F7A", kicker: "Weak spots", title: "Quick 15", desc: "Picks the questions you miss most and the ones you have not seen.", fields: [["Questions", 15], ["Time", "none"], ["Mode", "practice"]], n: 15, start: "weak" })}
  ${ticket({ color: "#66399B", kicker: "Marathon", title: "Mixed 50", desc: "50 random questions from every chapter, answers shown as you go.", fields: [["Questions", 50], ["Time", "none"], ["Goal", "85%"]], n: 50, start: "mixed" })}`;
}

/* ---------- Session ---------- */
function makeItem(id) {
  const q = Q[id], order = q.fixed ? q.o.map((_, i) => i) : shuffle(q.o.map((_, i) => i));
  return { id, order, chosen: [], done: false, flag: false };
}
function start(kind, arg) {
  let ids, mode = "practice", title, secs = 0;
  if (kind === "review") { ids = shuffle(dueIds()).slice(0, 20); title = "Review"; }
  else if (kind === "weak") { ids = pickWeak(ALL, 15); title = "Weak spots"; }
  else if (kind === "mixed") { ids = shuffle(ALL).slice(0, 50).map(q => q.id); title = "Mixed 50"; }
  else if (kind === "chapter") { ids = pickWeak(byCh(arg), 10); title = CH[arg].title; }
  else if (kind === "chaptertest") { ids = shuffle(byCh(arg)).slice(0, 20).map(q => q.id); title = CH[arg].title + " test"; }
  else if (kind === "retry") { ids = session.items.filter(it => !isRight(it)).map(it => it.id); title = "Retry mistakes"; }
  else if (kind === "exam") { const n = +arg; ids = pickExam(n); mode = "exam"; secs = n * 120; title = n === 65 ? "Mock exam" : "Half exam"; }
  if (!ids.length) return toast("Nothing to practise here yet.");
  session = { kind, arg, mode, title, items: ids.map(makeItem), i: 0, end: secs ? now() + secs * 1000 : 0, startedAt: now() };
  go("quiz");
}
const isRight = it => { const a = Q[it.id].a; return it.chosen.length === a.length && a.every(x => it.chosen.includes(x)); };

/* ---------- Quiz ---------- */
function Quiz() {
  const s = session, it = s.items[s.i], q = Q[it.id], c = CH[q.c], need = q.a.length, exam = s.mode === "exam";
  const slots = s.items.map((x, k) => `<i class="${k === s.i ? "cur" : exam ? (x.chosen.length ? "done" : "") : x.done ? (isRight(x) ? "ok" : "no") : ""}"></i>`).join("");
  const opts = it.order.map((oi, k) => {
    let cls = "";
    if (!exam && it.done) cls = q.a.includes(oi) ? "right" : it.chosen.includes(oi) ? "wrong" : "dim";
    else if (it.chosen.includes(oi)) cls = "sel";
    return `<button class="opt ${cls}" data-act="pick" data-o="${oi}" ${!exam && it.done ? "disabled" : ""}><span class="l">${L[k]}</span><span class="t">${q.o[oi]}</span></button>`;
  }).join("");
  const right = it.done && isRight(it);
  const fb = !exam && it.done;
  const verdict = fb ? `<div class="verdict ${right ? "ok" : "no"}">${right ? "CORRECT" : "WRONG"}</div>` : "";
  const expl = fb ? `<div class="expl ${right ? "" : "bad"}"><h4 style="color:var(${right ? "--success" : "--danger"})">${right ? "Correct" : "Answer: " + q.a.map(a => L[it.order.indexOf(a)]).sort().join(", ")}</h4>${q.x}</div>` : "";
  let foot;
  if (exam) foot = `<button class="btn soft flag ${it.flag ? "on" : ""}" data-act="flag" style="flex:0 0 72px">${it.flag ? "Flagged" : "Flag"}</button><button class="btn soft" data-act="grid" style="flex:0 0 72px">All</button><button class="btn ${s.i === s.items.length - 1 ? "ink" : "primary"}" data-act="${s.i === s.items.length - 1 ? "grid" : "next"}">${s.i === s.items.length - 1 ? "Review & submit" : "Next"}</button>`;
  else if (!it.done) foot = need > 1 ? `<button class="btn primary" data-act="check" ${it.chosen.length !== need ? "disabled" : ""}>Check (${it.chosen.length}/${need})</button>` : `<button class="btn primary" disabled>Choose an answer</button>`;
  else foot = `<button class="btn primary" data-act="next">${s.i === s.items.length - 1 ? "See result" : "Next question"}</button>`;
  if (exam) tick();
  return `<div class="qhead"><div class="line"><button class="close" data-act="quit" aria-label="Quit">${ICON.x}</button><div class="mid"><div class="kicker">Question ${s.i + 1} of ${s.items.length}</div><div class="mono">${s.title === c.title ? "" : esc(s.title) + " · "}<span style="color:${c.color}">${esc(c.title)}</span></div></div>${exam ? `<div class="timer" id="timer"></div>` : ""}</div><div class="slots">${slots}</div></div>
  <div class="qbody">${verdict}${need > 1 ? `<div class="pick">Choose ${need}</div>` : ""}<div class="qtext">${q.q}</div><div class="opts">${opts}</div>${expl}</div>
  <div class="foot">${foot}</div>`;
}
function tick() {
  clearInterval(timerId);
  const upd = () => { const left = Math.max(0, Math.round((session.end - now()) / 1000)), el = $("#timer"); if (el) { el.textContent = fmtTime(left); el.classList.toggle("low", left < 600); } if (left <= 0) { clearInterval(timerId); toast("Time is up"); finish(); } };
  setTimeout(upd); timerId = setInterval(upd, 1000);
}
const ACT = {
  pick(b) {
    const s = session, it = s.items[s.i], q = Q[it.id], o = +b.dataset.o, need = q.a.length;
    if (it.done && s.mode !== "exam") return;
    if (need === 1) it.chosen = [o];
    else it.chosen = it.chosen.includes(o) ? it.chosen.filter(x => x !== o) : it.chosen.length < need ? [...it.chosen, o] : it.chosen;
    if (s.mode !== "exam" && need === 1) return ACT.check();
    render();
  },
  check() { const it = session.items[session.i]; it.done = true; record(it.id, isRight(it)); render(); },
  next() { if (session.i < session.items.length - 1) { session.i++; render(); window.scrollTo(0, 0); } else finish(); },
  flag() { const it = session.items[session.i]; it.flag = !it.flag; render(); },
  grid() {
    const s = session, left = s.items.filter(x => !x.chosen.length).length, fl = s.items.filter(x => x.flag).length;
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div class="sheet"><div class="kicker">Overview</div><h2 style="margin:4px 0 6px">${s.items.length - left} of ${s.items.length} answered</h2><p class="note">${left ? `${left} unanswered. ` : ""}${fl ? `${fl} flagged (gold dot). ` : ""}Tap a number to jump to it.</p>
    <div class="grid" style="margin:14px 0">${s.items.map((x, k) => `<button class="${x.chosen.length ? "ans" : ""} ${x.flag ? "flg" : ""}" data-act="jump" data-k="${k}">${k + 1}</button>`).join("")}</div>
    <div class="row"><button class="btn soft" data-act="closemodal">Keep going</button><button class="btn ink" data-act="submit">Submit exam</button></div></div>`;
    m.addEventListener("click", e => { if (e.target === m) m.remove(); });
    document.body.appendChild(m);
  },
  jump(b) { document.querySelector(".modal")?.remove(); session.i = +b.dataset.k; render(); window.scrollTo(0, 0); },
  closemodal() { document.querySelector(".modal")?.remove(); },
  submit() { document.querySelector(".modal")?.remove(); finish(); },
  quit() {
    if (session.mode === "exam" && !confirmQuit()) return;
    const answered = session.items.some(x => x.done);
    if (session.mode !== "exam" && answered) return finish();
    session = null; go("home");
  },
  review(b) { session.reviewOpen = +b.dataset.k === session.reviewOpen ? -1 : +b.dataset.k; render(); },
  export() {
    const blob = new Blob([JSON.stringify(S)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `cloud-passport-progress-${today()}.json`; a.click();
  },
  import() { $("#file").click(); },
  reset() { if (confirm("Erase all progress on this device?")) { S = fresh(); save(); render(); toast("Progress erased"); } },
  goal(b) { S.goal = +b.dataset.v; save(); render(); },
};
const confirmQuit = () => confirm("Leave the exam? It will not be scored.");
function finish() {
  clearInterval(timerId);
  const s = session;
  if (s.mode === "exam" && !s.scored) {
    const t = now();
    s.items.forEach(it => { it.done = true; record(it.id, isRight(it), t); });
    const right = s.items.filter(isRight).length, score = scaled(right / s.items.length);
    const per = {}; s.items.forEach(it => { const c = Q[it.id].c; per[c] ??= [0, 0]; per[c][1]++; if (isRight(it)) per[c][0]++; });
    S.exams.unshift({ at: t, n: s.items.length, right, score, mins: Math.round((t - s.startedAt) / 60000), per });
    S.exams = S.exams.slice(0, 30); save(); s.scored = true;
  }
  s.reviewOpen = -1;
  go("result");
}

/* ---------- Result ---------- */
function Result() {
  const s = session, done = s.items.filter(x => x.done), right = done.filter(isRight).length, pct = Math.round(right / (done.length || 1) * 100);
  const exam = s.mode === "exam", score = scaled(right / (s.items.length || 1)), pass = score >= 720;
  const per = {}; s.items.forEach(it => { const c = Q[it.id].c; per[c] ??= [0, 0]; per[c][1]++; if (isRight(it)) per[c][0]++; });
  const rows = Object.entries(per).sort((a, b) => a[1][0] / a[1][1] - b[1][0] / b[1][1]).map(([c, [r, n]]) => `<div class="srow"><div class="top"><span>${esc(CH[c].title)}</span><b>${r}/${n}</b></div><div class="bar3"><i style="width:${r / n * 100}%;background:${CH[c].color}"></i></div></div>`).join("");
  const list = s.items.map((it, k) => {
    const q = Q[it.id], ok = isRight(it), open = s.reviewOpen === k;
    return `<div class="it" style="display:block"><button data-act="review" data-k="${k}" style="display:flex;width:100%;gap:10px;text-align:left;align-items:flex-start"><span class="pill ${ok ? "ok" : "no"}">${k + 1}</span><span style="flex:1;font-size:14px">${q.q.replace(/<[^>]+>/g, "").slice(0, 110)}…</span></button>
    ${open ? `<div style="margin-top:10px">${q.q}<div class="opts">${it.order.map((oi, j) => `<div class="opt ${q.a.includes(oi) ? "right" : it.chosen.includes(oi) ? "wrong" : "dim"}" style="animation:none"><span class="l">${L[j]}</span><span class="t">${q.o[oi]}</span></div>`).join("")}</div><div class="expl ${ok ? "" : "bad"}"><h4>Explanation</h4>${q.x}</div></div>` : ""}</div>`;
  }).join("");
  const wrong = s.items.filter(x => x.done && !isRight(x)).length;
  return `<div class="page-head" style="text-align:center"><div class="eyebrow">${esc(s.title)} · result</div></div>
  <div class="wrap" style="text-align:center">${exam ? ring(Math.round((score - 100) / 9), pass ? "var(--success)" : "var(--danger)", 200, score) : ring(pct, pct >= 80 ? "var(--success)" : "var(--primary)", 180)}
  <p style="margin:8px 0 0"><span class="pill ${(exam ? pass : pct >= 80) ? "ok" : "no"}">${exam ? (pass ? "PASS · ≥ 720" : "BELOW 720") : pct >= 80 ? "STAMP-WORTHY" : "KEEP GOING"}</span></p>
  <p class="muted">${right} of ${exam ? s.items.length : done.length} right (${Math.round(right / ((exam ? s.items.length : done.length) || 1) * 100)}%)${exam ? ". Score is an estimate: AWS scales results, and 72% raw is a common target." : ""}</p></div>
  <div class="wrap"><div class="row" style="margin:14px 0">${wrong ? `<button class="btn soft" data-start="retry">Retry ${wrong} missed</button>` : ""}<button class="btn primary" data-tab="home">Done</button></div></div>
  <div class="section"><h2>By chapter</h2><span class="mono">weakest first</span></div><div class="wrap"><div class="card stat-rows">${rows}</div></div>
  <div class="section"><h2>Review answers</h2></div><div class="wrap"><div class="card list">${list}</div></div>`;
}

/* ---------- Stats ---------- */
function Stats() {
  const st = started(ALL), share = expected(), score = st ? scaled(share) : 0, done = ALL.filter(q => S.p[q.id]?.ever).length;
  const chs = BANK.chapters.filter(c => c.count).map(c => ({ c, m: mastery(byCh(c.id)), st: started(byCh(c.id)) })).sort((a, b) => a.m - b.m);
  const week = [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - 6 + i); const k = d.toLocaleDateString("sv-SE"); return { d: d.toLocaleDateString([], { weekday: "narrow" }), n: S.days[k] || 0 }; });
  const seen = ALL.reduce((a, q) => a + (S.p[q.id]?.seen || 0), 0), rightN = ALL.reduce((a, q) => a + (S.p[q.id]?.right || 0), 0);
  const mrz = `P<SAAC03<<CLOUD<PASSPORT<<<<${String(score).padStart(4, "0")}<<${String(done).padStart(3, "0")}<${String(ALL.length)}`.padEnd(44, "<").slice(0, 44) + `\nQ${String(seen).padStart(5, "0")}<<R${String(rightN).padStart(5, "0")}<<S${String(streak()).padStart(3, "0")}<<${today().replace(/-/g, "")}`.padEnd(45, "<");
  return `<div class="page-head"><div class="eyebrow">Data page</div><h1>How ready are you?</h1><p>Estimated from how well you know each question. Unseen questions count as a guess.</p></div>
  <div class="wrap" style="margin-top:14px"><div class="card" style="text-align:center">${ring(st ? Math.round((score - 100) / 9) : 0, score >= 720 ? "var(--success)" : "var(--primary)", 190, st ? score : "–")}
  <p style="margin:6px 0 0"><b>${st ? (score >= 720 ? "On track to pass (720)" : `${720 - score} points below the pass mark`) : "Answer some questions to get an estimate"}</b></p>
  <p class="note">${done} of ${ALL.length} questions answered correctly at least once · ${st} started</p>
  <div class="mrz" aria-hidden="true">${esc(mrz).replace("\n", "<br>")}</div></div></div>
  <div class="section"><h2>Last 7 days</h2><span class="mono">${week.reduce((a, w) => a + w.n, 0)} answers</span></div>
  <div class="wrap"><div class="card" style="display:flex;justify-content:space-between;text-align:center">${week.map(w => `<div><div style="width:30px;height:30px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;${w.n >= S.goal ? "background:var(--success);color:#fff" : w.n ? "background:var(--success-soft);color:var(--success)" : "border:1.5px dashed var(--border)"}">${w.n || ""}</div><span class="mono">${w.d}</span></div>`).join("")}</div></div>
  <div class="section"><h2>Weak areas</h2><span class="mono">mastery</span></div>
  <div class="wrap"><div class="card stat-rows">${chs.map(({ c, m, st }) => `<button class="srow" data-go="chapter" data-arg="${c.id}" style="text-align:left;width:100%"><div class="top"><span>${esc(c.title)}</span><b>${st ? m + "%" : "not started"}</b></div><div class="bar3"><i style="width:${m}%;background:${c.color}"></i></div></button>`).join("")}</div></div>
  <div class="section"><h2>Exam history</h2></div>
  <div class="wrap"><div class="card list">${S.exams.length ? S.exams.map(e => `<div class="it"><div><b>${e.n === 65 ? "Mock exam" : "Half exam"}</b><div class="mono">${new Date(e.at).toLocaleDateString()} · ${e.right}/${e.n} · ${e.mins} min</div></div><span class="pill ${e.score >= 720 ? "ok" : "no"}">${e.score}</span></div>`).join("") : `<p class="note" style="margin:0">No exams yet. Take a mock once most chapters are above 60%.</p>`}</div></div>`;
}

  <div class="wrap" style="margin-top:20px"><button class="btn ghost" data-act="reset" style="color:var(--danger)">Erase progress on this device</button></div>`;

document.addEventListener("change", e => {
  if (e.target.id !== "file" || !e.target.files[0]) return;
  e.target.files[0].text().then(t => { const d = JSON.parse(t); if (!d.p) throw 0; S = { ...fresh(), ...d }; save(); render(); toast("Progress imported"); }).catch(() => toast("That file is not a Cloud Passport backup"));
});
window.addEventListener("beforeunload", e => { if (session?.mode === "exam" && view.name === "quiz") e.preventDefault(); });
render();

</script>
